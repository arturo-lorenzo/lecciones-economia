book:
  subtitle: "Lecciones de economía, vol. 1"

format:
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    lang: es
    papersize: a4
    geometry: margin=2.5cm
    toc: true
    number-sections: false
    include-in-header: _proyecto/pdf-header.tex
    keep-tex: true
    fig-pos: 'H'   # cada figura donde la pone el texto, sin flotar
    filters:
      - _proyecto/pdf-figuras.lua
      - _proyecto/pdf-numeracion.lua
      - _proyecto/pdf-secciones.lua
      - _proyecto/tablas-ancho.lua
