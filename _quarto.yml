    - _proyecto/numeracion-figuras.py

lang: es
language:
  code-tools-source-code: "Código fuente"
google-scholar: true
author: "Arturo Lorenzo"
date: 2026-11-28
# En la web, la fecha de cada página solo con mes y año («noviembre de 2026»).
date-format: "MMMM [de] YYYY"
citation:
