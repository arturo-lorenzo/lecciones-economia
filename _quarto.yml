format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css: styles.css
    include-after-body:
      - _proyecto/graph-autosize.html
    filters:
      - _proyecto/tablas-ancho.lua
    toc: true
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    callout-appearance: simple
    smooth-scroll: true
    fontsize: "1.05rem"
    linestretch: 1.6
    mainfont: "Source Serif Pro, Georgia, serif"
    monofont: "JetBrains Mono, Fira Code, monospace"
    grid:
      sidebar-width: 450px
      body-width: 1100px
      margin-width: 250px
      gutter-width: 1.5em

crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "Ec."
  fig-prefix: "Figura"
  tbl-prefix: "Tabla"
  sec-prefix: "Sección"
