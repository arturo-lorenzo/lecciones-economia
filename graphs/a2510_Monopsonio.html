<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="368.8" y1="238.7" x2="368.8" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="124.0" y1="329.3" x2="368.8" y2="329.3" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="457.8" y1="296.4" x2="457.8" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="124.0" y1="296.4" x2="457.8" y2="296.4" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M124.0,80.0 L538.7,348.8" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,420.0 L538.7,266.4" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,420.0 L534.4,116.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
    <line x1="368.8" y1="329.3" x2="368.8" y2="238.7" stroke="#D85A30" stroke-width="4" stroke-opacity="0.85"/>
    <circle cx="368.8" cy="238.7" r="3.5" fill="#1D9E75"/>
    <circle cx="368.8" cy="329.3" r="5" fill="#000"/>
    <circle cx="457.8" cy="296.4" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>




const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'l', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'w', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 472.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'w_M', x: 112.0, y: 329.3, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'w_C', x: 112.0, y: 296.4, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l5', tex: 'l_M', x: 368.8, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l6', tex: 'l_C', x: 457.8, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l7', tex: '0', x: 376.8, y: 343.3, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l8', tex: '1', x: 457.8, y: 282.4, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l9', tex: '\\textit{mark-down}', x: 361.8, y: 320.0, color: '#D85A30', tr: 'translate(-100%,-50%)', small: true, bg: false},
  {id: 'l10', tex: 'w(l)', x: 544.7, y: 266.4, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l11', tex: '\\text{Gmg}_l(l)', x: 540.4, y: 116.0, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l12', tex: '\\text{VPmg}_l(l)', x: 544.7, y: 348.8, color: '#1D9E75', tr: 'translate(0,-50%)', small: false, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
