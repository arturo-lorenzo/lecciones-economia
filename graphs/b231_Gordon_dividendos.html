<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
    line-height: 1;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="112" y1="460" x2="552" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="112" y1="460" x2="112" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="v-hi"  fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="v-eq"  fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <path id="v-lo"  fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="108" y1="310" x2="112" y2="310" stroke="black" stroke-width="1"/>

  </svg>


  <div class="katex-label" id="lbl-b"></div>
  <div class="katex-label" id="lbl-v"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-hi"></div>
  <div class="katex-label" id="lbl-eq"></div>
  <div class="katex-label" id="lbl-lo"></div>
  <div class="katex-label" id="lbl-int"></div>

</div>

<script>






const Y0 = 10, rp = 0.10;
const V = (r, b) => (1 - b) * Y0 / (rp - r * b);

function toSvgX(b) { return 112 + b * 600;        }
function toSvgY(v) { return 460 - v * 1.5;   }

function genCurve(r, id) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const b = (i / 300) * 0.70;
    const sx = toSvgX(b);
    const sy = toSvgY(V(r, b));
    if (sy >= 70 && sy <= 452) pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(0.12, 'v-hi');
genCurve(0.10, 'v-eq');
genCurve(0.08, 'v-lo');


const VBW = 680, VBH = 500;
const bEnd = 0.70;
const labels = [
  {id: 'lbl-b',   tex: 'b',                     x: 558, y: 460, anchor: 'lm', size: 17},
  {id: 'lbl-v',   tex: 'P_0',                   x: 104, y: 58,  anchor: 'rt', size: 17},
  {id: 'lbl-o',   tex: 'O',                     x: 104, y: 466, anchor: 'rt', size: 16},
  {id: 'lbl-hi',  tex: '\\text{ROE} > k_p',     x: toSvgX(bEnd) + 8, y: toSvgY(V(0.12, bEnd)), anchor: 'lm', color: '#0F6E56', size: 16},
  {id: 'lbl-eq',  tex: '\\text{ROE} = k_p',     x: toSvgX(bEnd) + 8, y: toSvgY(V(0.10, bEnd)), anchor: 'lm', color: '#185FA5', size: 16},
  {id: 'lbl-lo',  tex: '\\text{ROE} < k_p',     x: toSvgX(bEnd) + 8, y: toSvgY(V(0.08, bEnd)), anchor: 'lm', color: '#534AB7', size: 16},
  {id: 'lbl-int', tex: '\\dfrac{\\text{BPA}_1}{k_p}',      x: 104, y: toSvgY(Y0 / rp), anchor: 'rm', color: 'black', size: 16}
];
const TX = {l: '0', c: '-50%', r: '-100%'}, TY = {t: '0', m: '-50%', b: '-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
});
</script>
</body>
</html>
