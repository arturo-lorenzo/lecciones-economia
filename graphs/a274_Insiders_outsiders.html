<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="138" y1="460" x2="592" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="138" y1="460" x2="138" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="d-l1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-l2" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-wr" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <path id="mrp-up" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round"/>
    <path id="mrp-dn" fill="none" stroke="#aaa" stroke-width="2.2" stroke-linecap="round"/>

    <path id="wi" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="ticks"></g>
    <g id="regions"></g>
  </svg>
</div>

<script>







const wCeil = 8, wbar = 3, L1 = 4.5, L2 = 9.5;
const h = 3.3, A = 7.44, v = 1.8;
const mrpd = L => A/(L - h) + v;


const VBW = 680, VBH = 580;
const sx = L => 138 + L*31.16;
const sy = w => 460 - w*40;
const $ = id => document.getElementById(id);
function setL(id, x1, y1, x2, y2) { const e = $(id); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); }
function pathPts(id, pts) { $(id).setAttribute('d', 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L')); }
function fpts(f, a_, b_, n = 160) { const p = []; for (let i = 0; i <= n; i++) { const L = a_ + (i/n)*(b_ - a_); p.push([sx(L), sy(f(L))]); } return p; }

const Ltop = h + A/(9.6 - v);
pathPts('mrp-up', fpts(mrpd, Ltop, L1));
const Lend = 13;
pathPts('mrp-dn', fpts(mrpd, L2, Lend));
pathPts('wi', [[sx(0), sy(wCeil)]].concat(fpts(mrpd, L1, L2)));

setL('d-l1', sx(L1), sy(wCeil), sx(L1), sy(0));
setL('d-l2', sx(L2), sy(wbar), sx(L2), sy(0));
setL('d-wr', sx(0), sy(wbar), sx(L2), sy(wbar));

const tg = $('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line'); t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2); t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
tick(134, sy(wbar), 138, sy(wbar)); tick(134, sy(wCeil), 138, sy(wCeil));
tick(sx(L1), 460, sx(L1), 464); tick(sx(L2), 460, sx(L2), 464);


const rg = $('regions');
const arrowY = 512;
function regionArrow(La, Lb) {
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', sx(La) + 6); l.setAttribute('y1', arrowY);
  l.setAttribute('x2', sx(Lb) - 6); l.setAttribute('y2', arrowY);
  l.setAttribute('stroke', '#555'); l.setAttribute('stroke-width', '1.2');
  l.setAttribute('marker-start', 'url(#arrow)'); l.setAttribute('marker-end', 'url(#arrow)');
  rg.appendChild(l);
}
regionArrow(0.1, L1); regionArrow(L1, L2); regionArrow(L2, 13.4);


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', T = '#555';
put('lbl-w', 'w', 128, 36, {ha: 'r', s: 17});
put('lbl-l', 'L_I', 596, 468, {s: 17});
put('lbl-o', 'O', 130, 468, {ha: 'r'});
put('lbl-wmax', 'w_O + d + c', 130, sy(wCeil), {ha: 'r', va: 'm'});
put('lbl-wr', '\\underline{w}', 130, sy(wbar), {ha: 'r', va: 'm'});
put('lbl-l1', 'L_1', sx(L1), 468, {ha: 'c'});
put('lbl-l2', 'L_2', sx(L2), 468, {ha: 'c'});
put('lbl-wi', 'w_I(L_I)', sx(L2) + 10, sy(wbar) - 8, {va: 'b', c: G});
put('lbl-mrp', '\\text{Pmg}_L + d', sx(Lend) + 6, sy(mrpd(Lend)), {va: 'm', c: '#888', s: 15});
put('lbl-a', '\\text{Caso A}', (sx(0.1) + sx(L1))/2, arrowY + 10, {ha: 'c', c: T, s: 15});
put('lbl-b', '\\text{Caso B}', (sx(L1) + sx(L2))/2, arrowY + 10, {ha: 'c', c: T, s: 15});
put('lbl-c', '\\text{Caso C}', (sx(L2) + sx(13.4))/2, arrowY + 10, {ha: 'c', c: T, s: 15});
</script>
</body>
</html>
