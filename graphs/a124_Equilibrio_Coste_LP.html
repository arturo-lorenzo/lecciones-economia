<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</div>

<script>






const W = 680, H = 960;
const ltc = x => 0.12*x*x*x - 1.2*x*x + 5*x;
const lac = x => 0.12*x*x - 1.2*x + 5;
const lmc = x => 0.36*x*x - 2.4*x + 5;
const XS = 5;
const BOTEND_CFG = [4.75, 4.3, 3.85], LMC0 = 0, LMCEND = 4.95, SACTOP = 4.35, TOPEND_CFG = [19, 31, 47];
const plants = [2.2, XS, 7.8].map(q => ({q, K: ltc(q)}));
const TH = 0.5, E = 1 / (1 - TH);
const stc = (P) => x => TH * P.K + (1 - TH) * Math.pow(ltc(x), E) / Math.pow(P.K, TH * E);
const sac = (P) => x => stc(P)(x) / x;
const smc = (P) => x => Math.pow(ltc(x), E - 1) * lmc(x) / Math.pow(P.K, TH * E);

const OX = 116, XR = 546, QMAX = 9.6;
const sx = q => OX + q * 37.9;
const TOP = {oy: 430, ytop: 35, k: 8.2, cmax: 47};
const BOT = {oy: 900, ytop: 505, k: 76, cmax: 5.1};
const syT = c => TOP.oy - c * TOP.k;
const syB = c => BOT.oy - c * BOT.k;

const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }

function curve(f, P, sy, q0, q1, color, width, extra) {
  const pts = []; let last = null;
  for (let i = 0; i <= 600; i++) {
    const q = q0 + (q1 - q0) * i / 600, v = f(q);
    if (v <= P.cmax && v >= 0) { const p = [sx(q), sy(v)]; pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); last = {q, v, x: p[0], y: p[1]}; }
    else if (pts.length && v > P.cmax && q > q0 + 0.5 && last && last.q < q) { if (f(q) > P.cmax && i > 0) {} }
  }
  el('path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round'}, extra || {}));
  return last;
}
function inv(f, y, a, b) { for (let i = 0; i < 80; i++) { const m = (a + b) / 2; if ((f(a) - y) * (f(m) - y) <= 0) b = m; else a = m; } return (a + b) / 2; }

function firstVisible(f, P, q0, q1) { for (let i = 0; i <= 2000; i++) { const q = q0 + (q1 - q0) * i / 2000; if (f(q) <= P.cmax) return q; } return q0; }
function lastVisible(f, P, q0, q1) { let r = q0; for (let i = 0; i <= 2000; i++) { const q = q0 + (q1 - q0) * i / 2000; if (f(q) <= P.cmax) r = q; else if (r > q0) break; } return r; }


[TOP, BOT].forEach(P => {
  el('line', {x1: OX, y1: P.oy, x2: XR, y2: P.oy, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  el('line', {x1: OX, y1: P.oy, x2: OX, y2: P.ytop, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
});

plants.forEach(P => {
  el('line', {x1: sx(P.q), y1: syT(ltc(P.q)), x2: sx(P.q), y2: TOP.oy, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '6 4'});
  el('line', {x1: sx(P.q), y1: syB(lac(P.q)), x2: sx(P.q), y2: BOT.oy, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '6 4'});
});



const TOPEND = TOPEND_CFG;
const endT = plants.map((P, i) => curve(stc(P), TOP, syT, 0, inv(stc(P), TOPEND[i], P.q, QMAX), '#378ADD', 2.2));
const endLTC = curve(ltc, TOP, syT, 0, QMAX, '#1D9E75', 2.2);
plants.forEach(P => el('circle', {cx: sx(P.q), cy: syT(ltc(P.q)), r: 4.5, fill: '#D85A30'}));


const BOTEND = BOTEND_CFG;

const startB = [];
const endB = plants.map((P, i) => {
  const q0 = inv(sac(P), BOTEND[i], 0.05, P.q), q1 = inv(sac(P), SACTOP, P.q, QMAX);
  startB.push({x: sx(q0), y: syB(BOTEND[i])});
  return curve(sac(P), BOT, syB, q0, q1, '#378ADD', 2.2);
});
const lacEnd = curve(lac, BOT, syB, 0, QMAX, '#1D9E75', 2.2);
const lmcEnd = curve(lmc, BOT, syB, LMC0, inv(lmc, LMCEND, XS, QMAX), '#0F6E56', 2.2, {'stroke-dasharray': '7 4'});
plants.forEach(P => el('circle', {cx: sx(P.q), cy: syB(lac(P.q)), r: 4.5, fill: '#D85A30'}));


const box = document.querySelector('.graph-container');
function lbl(tex, x, y, color, anchor, size, bg) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100).toFixed(2) + '%';
  d.style.top = (y / H * 100).toFixed(2) + '%';
  d.style.color = color || 'black';
  if (size) d.style.fontSize = size;
  const tx = {l: '0', r: '-100%', c: '-50%'}[anchor[0]], ty = {t: '0', m: '-50%', b: '-100%'}[anchor[1]];
  d.style.transform = `translate(${tx},${ty})`;
  if (bg) d.style.background = '#fff';
  box.appendChild(d);
  return d;
}
lbl('C', OX - 10, TOP.ytop, 'black', 'rm');
lbl('x', XR + 4, TOP.oy, 'black', 'lm');
lbl('C', OX - 10, BOT.ytop, 'black', 'rm');
lbl('x', XR + 4, BOT.oy, 'black', 'lm');
lbl('x^*', sx(XS), BOT.oy + 8, 'black', 'ct');

lbl('\\text{CT}_{\\text{LP}}(x)', endLTC.x + 6, endLTC.y, '#0F6E56', 'lm');
['0', '1', '2'].forEach((k, i) => {
  const e = endT[i];

  if (i < 2) lbl(`\\text{CT}_{\\text{CP},${k}}(x)`, e.x - 8, e.y, '#185FA5', 'rm', '15px');
  else lbl(`\\text{CT}_{\\text{CP},${k}}(x)`, e.x + 6, e.y, '#185FA5', 'lm', '15px');
});
['0', '1', '2'].forEach((k, i) => {
  const e = startB[i];
  lbl(`\\text{Cme}_{\\text{CP},${k}}(x)`, e.x + 2, e.y - 3, '#185FA5', 'lb', '15px');
});
lbl('\\text{Cme}_{\\text{LP}}(x)', lacEnd.x + 6, lacEnd.y, '#0F6E56', 'lm');
lbl('\\text{Cmg}_{\\text{LP}}(x)', lmcEnd.x + 6, lmcEnd.y, '#0F6E56', 'lm');
</script>
</body>
</html>
