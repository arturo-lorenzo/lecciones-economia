<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="105" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="105" y1="460" x2="105" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="l12" stroke="#378ADD" stroke-width="2.2"/>
    <line id="l15" stroke="#378ADD" stroke-width="2.2"/>
    <line id="l13" stroke="#378ADD" stroke-width="1.4"/>


    <line id="tang4" stroke="#888" stroke-width="1.4" stroke-dasharray="6 4"/>


    <path id="icLC" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>
    <path id="icP"  fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="ptLC" r="5" fill="#000"/>
    <circle id="pt4"  r="5" fill="#000"/>
    <circle id="ptUA" r="5" fill="#000"/>
    <circle id="pt1"  r="5" fill="#000"/>
  </svg>

</div>

<script>
const W = 680, H = 520;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }












const X1 = 10, sFT = 2, sUA = 1.4, sT = 0.5843;
const LC = {x: 5, y: 10}, UA = {x: 5, y: 7};
const P4 = {x: 20 / (2 + sT), y: 20 * sT / (2 + sT)};
const U2_LC = LC.x * LC.y, U2_P = UA.x * UA.y;
const sx = x => 105 + x * 37, sy = y => 460 - y * 19;
function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1); el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}
setLine('l12', sx(X1), sy(0), sx(0), sy(sFT * X1));
setLine('l15', sx(X1), sy(0), sx(0), sy(sUA * X1));
setLine('l13', sx(X1), sy(0), sx(0), sy(sT * X1));
const dx = 1.5;
setLine('tang4', sx(P4.x - dx), sy(P4.y + sT * dx), sx(P4.x + dx), sy(P4.y - sT * dx));
function genIC(u2, id, xMin, xMax) {
  const pts = [];
  for (let i = 0; i <= 240; i++) {
    const x = xMin + (i / 240) * (xMax - xMin);
    pts.push(sx(x).toFixed(1) + ',' + sy(u2 / x).toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genIC(U2_LC, 'icLC', 2.55, 11.8);
genIC(U2_P,  'icP',  1.8, 11.8);
[['ptLC', LC], ['pt4', P4], ['ptUA', UA], ['pt1', {x: X1, y: 0}]].forEach(([id, p]) => {
  const c = document.getElementById(id); c.setAttribute('cx', sx(p.x)); c.setAttribute('cy', sy(p.y));
});
const labels = [
  {id: 'lbl-x', tex: 'X', x: 560, y: 462, a: 'lt', s: '17px'},
  {id: 'lbl-y', tex: 'Y', x: 97,  y: 40,  a: 'rt', s: '17px'},
  {id: 'lbl-o', tex: 'O', x: 99,  y: 466, a: 'rt'},
  {id: 'lbl-1', tex: '1', x: sx(X1), y: 468, a: 'ct', c: '#000', s: '15px'},
  {id: 'lbl-2', tex: '2', x: 98, y: sy(sFT * X1), a: 'rm', c: '#185FA5', s: '15px'},
  {id: 'lbl-5', tex: '5', x: 98, y: sy(sUA * X1), a: 'rm', c: '#185FA5', s: '15px'},
  {id: 'lbl-3', tex: '3', x: 98, y: sy(sT * X1),  a: 'rm', c: '#185FA5', s: '15px'},
  {id: 'lbl-LC', tex: '\\text{LC}', x: sx(LC.x) + 9, y: sy(LC.y) - 5, a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-4',  tex: '4',          x: sx(P4.x) + 22, y: sy(P4.y) - 3, a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-UA', tex: '\\text{UA}', x: sx(UA.x) - 9, y: sy(UA.y) + 5, a: 'rt', c: '#000', s: '15px'},
  {id: 'lbl-ci',  tex: '\\text{CIS}_0',  x: sx(11.8) + 6, y: sy(U2_LC / 11.8), a: 'lm', c: '#534AB7'},
  {id: 'lbl-cip', tex: '\\text{CIS}_1', x: sx(11.8) + 6, y: sy(U2_P / 11.8),  a: 'lm', c: '#0F6E56'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
