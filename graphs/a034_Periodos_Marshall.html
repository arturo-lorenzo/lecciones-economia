<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="460" x2="570" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="460" x2="130" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>



    <line x1="341.2" y1="416" x2="341.2" y2="130" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="225.9" y1="416" x2="475.6" y2="130" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="138.4" y1="336.8" x2="548.2" y2="230.1" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="151.1" y1="165.2" x2="531.3" y2="402.8" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="193.4" y1="112.4" x2="544" y2="331.5" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 5"/>


    <line x1="194.4" y1="179.2" x2="218.2" y2="141" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="130" y1="284"   x2="341.2"   y2="284"   stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="130" y1="204.8" x2="341.2"   y2="204.8" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="130" y1="232.7" x2="385.9" y2="232.7" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="130" y1="260.7" x2="430.7" y2="260.7" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line x1="126" y1="284"   x2="130" y2="284"   stroke="black" stroke-width="1"/>
    <line x1="126" y1="204.8" x2="130" y2="204.8" stroke="black" stroke-width="1"/>
    <line x1="126" y1="232.7" x2="130" y2="232.7" stroke="black" stroke-width="1"/>
    <line x1="126" y1="260.7" x2="130" y2="260.7" stroke="black" stroke-width="1"/>
    <line x1="341.2" y1="460" x2="341.2" y2="464" stroke="black" stroke-width="1"/>


    <circle cx="341.2"   cy="284"   r="5"   fill="#000"/>
    <circle cx="341.2"   cy="204.8" r="4.5" fill="#534AB7"/>
    <circle cx="385.9" cy="232.7" r="4.5" fill="#534AB7"/>
    <circle cx="430.7" cy="260.7" r="4.5" fill="#534AB7"/>

  </svg>


  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-p"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-d0"></div>
  <div class="katex-label" id="lbl-d1"></div>
  <div class="katex-label" id="lbl-smp"></div>
  <div class="katex-label" id="lbl-scp"></div>
  <div class="katex-label" id="lbl-slp"></div>
  <div class="katex-label" id="lbl-pt0"></div>
  <div class="katex-label" id="lbl-p0"></div>
  <div class="katex-label" id="lbl-pmp"></div>
  <div class="katex-label" id="lbl-pcp"></div>
  <div class="katex-label" id="lbl-plp"></div>
  <div class="katex-label" id="lbl-x0"></div>
  <div class="katex-label" id="lbl-dD"></div>

</div>

<script>









const labels = [
  {id: 'lbl-x',   tex: 'x',              left: '84.5%',   top: '91%',  color: 'black'},
  {id: 'lbl-p',   tex: 'p',              left: '14.4%',   top: '7%',   color: 'black'},
  {id: 'lbl-o',   tex: 'O',               left: '16.4%',   top: '92%',  color: 'black'},
  {id: 'lbl-d0',  tex: 'D_0(x)',            left: '79.4%', top: '77.5%',  color: '#0F6E56'},
  {id: 'lbl-d1',  tex: 'D_1(x)',            left: '81.2%', top: '63.2%',  color: '#0F6E56'},
  {id: 'lbl-smp', tex: 'S_{\\text{MP}}(x)',         left: '48.0%', top: '19%',  color: '#534AB7'},
  {id: 'lbl-scp', tex: 'S_{\\text{CP}}(x)',         left: '70.9%', top: '23%',  color: '#534AB7'},
  {id: 'lbl-slp', tex: 'S_{\\text{LP}}(x)',         left: '81.9%',   top: '43%',  color: '#534AB7'},
  {id: 'lbl-pt0', tex: '0',               left: '51.9%',   top: '58%',  color: '#000'},
  {id: 'lbl-p0',  tex: 'p_0',            left: '17.6%', top: '54.8%', color: 'black', align: 'right'},
  {id: 'lbl-pmp', tex: 'p_{\\text{MP},1}',       left: '17.6%', top: '39%',  color: 'black', align: 'right'},
  {id: 'lbl-pcp', tex: 'p_{\\text{CP},1}',       left: '17.6%', top: '44.5%', color: 'black', align: 'right'},
  {id: 'lbl-plp', tex: 'p_{\\text{LP},1}',       left: '17.6%', top: '50.1%', color: 'black', align: 'right'},
  {id: 'lbl-x0',  tex: 'x_0',            left: '48.9%', top: '93%',  color: 'black'},
  {id: 'lbl-dD',  tex: '\\Delta D > 0',   left: '32.7%', top: '19%', color: '#0F6E56'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
<script>(function(){var N={"lbl-pt0": [-0.29, 1.18, 0]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
