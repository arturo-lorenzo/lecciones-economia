<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
<div class="graph-container">
  <svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line id="ax-x" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="ax-y" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="ciscA0" fill="none" stroke="#5DCAA5" stroke-width="1.4"/>
    <path id="ciscAm" fill="none" stroke="#5DCAA5" stroke-width="1.4"/>
    <path id="ciscAN" fill="none" stroke="#5DCAA5" stroke-width="1.4"/>
    <path id="ciscBN" fill="none" stroke="#8F88D8" stroke-width="1.4"/>


    <path id="conA0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="conB0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>
    <path id="conAm" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>
    <path id="conB1" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="2 4" stroke-linecap="round"/>
    <path id="conAN" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="2 4" stroke-linecap="round"/>


    <g id="esc" stroke="#D85A30" stroke-width="1.2" fill="none"></g>

    <g id="pts" fill="#000"></g>
  </svg>
  <div id="labels"></div>
</div>
<script>




const Xa = 19.5, Ya = 3.9, Xb = 3.9, Yb = 19.5;
const tm = 1.8030593;
const tN = Math.sqrt(5) - 1;
const ox = 80, oy = 540, k = 54;
function P(x, y) { return [ox + x * k, oy - y * k]; }
function set(id, a) { const e = document.getElementById(id); for (const q in a) e.setAttribute(q, a[q]); }
const XMAX = 9.6, YMAX = 8.9;
const conA = t => x => (1 + t) * x * Ya / (Xa - (2 + t) * x);
const conB = t => y => (1 + t) * y * Xb / (Yb - (2 + t) * y);
function curveX(id, f, x0, x1) {
  const pts = [];
  for (let i = 0; i <= 600; i++) { const x = x0 + (x1 - x0) * i / 600, y = f(x);
    if (!(y >= 0) || y > YMAX || x > XMAX) break; const [a, b] = P(x, y); pts.push(a.toFixed(1) + ',' + b.toFixed(1)); }
  set(id, {d: 'M' + pts.join(' L')}); return pts;
}
function curveY(id, g, y0, y1) {
  const pts = [];
  for (let i = 0; i <= 600; i++) { const y = y0 + (y1 - y0) * i / 600, x = g(y);
    if (!(x >= 0) || x > XMAX || y > YMAX) break; const [a, b] = P(x, y); pts.push(a.toFixed(1) + ',' + b.toFixed(1)); }
  set(id, {d: 'M' + pts.join(' L')}); return pts;
}
function bisect(f, a, b) { let fa = f(a); for (let i = 0; i < 200; i++) { const c = (a + b) / 2, fc = f(c); if ((fc > 0) === (fa > 0)) { a = c; fa = fc; } else b = c; } return (a + b) / 2; }

function inter(t, tau) { const g = conB(tau), f = conA(t);
  const y = bisect(Y => { const x = g(Y); return Y * (Xa - (2 + t) * x) - (1 + t) * x * Ya; }, 0.3, Yb / (2 + tau) - 0.05); return [g(y), y]; }
const UA = (x, y) => Math.log(y + Ya) + Math.log(Xa - x);
const ciscA = K => x => Math.exp(K) / (Xa - x) - Ya;
const ciscB = K => y => Math.exp(K) / (Yb - y) - Xb;
const UB = (x, y) => Math.log(x + Xb) + Math.log(Yb - y);

const E0 = inter(0, 0), Em = inter(tm, 0), E2 = inter(tm, tN), EN = inter(tN, tN);

const g0 = conB(0), KA0 = UA(...E0);
const ye = bisect(y => UA(g0(y), y) - KA0, 0.5, Em[1]);
const Ee = [g0(ye), ye];

set('ax-x', {x1: ox, y1: oy, x2: 640, y2: oy});
set('ax-y', {x1: ox, y1: oy, x2: ox, y2: 40});


curveX('conA0', conA(0), 0, XMAX);
curveX('conAm', conA(tm), 0, XMAX);
curveX('conAN', conA(tN), 0, XMAX);
curveY('conB0', conB(0), 0, YMAX);
curveY('conB1', conB(tN), 0, YMAX);



const KAm = UA(...Em), KAN = UA(...EN), KBN = UB(...EN);
const cA0x = 0.35, cAmx = 1.4;
const cA0e = 8.15;
curveX('ciscA0', ciscA(KA0), cA0x, cA0e);
curveX('ciscAm', ciscA(KAm), cAmx, 5.6);
const cANe = EN[0] + 1.2;
curveX('ciscAN', ciscA(KAN), EN[0] - 0.9, cANe);
curveY('ciscBN', ciscB(KBN), EN[1] - 1.3, EN[1] + 1.1);


const pg = document.getElementById('pts');
[E0, Em, Ee, E2, EN].forEach(([x, y]) => { const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  const [a, b] = P(x, y); c.setAttribute('cx', a); c.setAttribute('cy', b); c.setAttribute('r', 5); pg.appendChild(c); });


const eg = document.getElementById('esc');

function arr(A, B, gap, bow) { const [a1, b1] = P(...A), [a2, b2] = P(...B); const d = Math.hypot(a2 - a1, b2 - b1), ux = (a2 - a1) / d, uy = (b2 - b1) / d;
  const nx = -uy, ny = ux;
  const sx = a1 + ux * gap + nx * bow * 0.35, sy = b1 + uy * gap + ny * bow * 0.35;
  const ex = a2 - ux * gap + nx * bow * 0.35, ey = b2 - uy * gap + ny * bow * 0.35;
  const cx = (a1 + a2) / 2 + nx * bow, cy = (b1 + b2) / 2 + ny * bow;
  const l = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  l.setAttribute('d', `M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`);
  l.setAttribute('marker-end', 'url(#arrow)'); eg.appendChild(l); }
arr(E0, Em, 10, 0); arr(Em, E2, 9, -20); arr(E2, EN, 8, -12);

const VBW = 680, VBH = 600;
const pw = v => (v / VBW * 100).toFixed(1) + '%', ph = v => (v / VBH * 100).toFixed(1) + '%';
const X = x => P(x, 0)[0], Y = y => P(0, y)[1];
const topX = (f, x1) => { let x = 0; while (x < x1 && f(x) <= YMAX) x += 0.001; return x; };
const labels = [
  {tex:'X', left: 644, top: oy - 14, size:17},
  {tex:'Y', left: ox - 8, top: 36, size:17, align:'right'},
  {tex:'\\text{CON}^A_0', left: X(topX(conA(0), XMAX)) + 6, top: Y(YMAX) - 8, size:16, color:'#0F6E56'},
  {tex:'\\text{CON}^A_m', left: X(topX(conA(tm), XMAX)) - 6, top: Y(YMAX) - 8, size:16, color:'#0F6E56', align:'right'},
  {tex:'\\text{CON}^A_N', left: X(topX(conA(tN), XMAX)) + 6, top: Y(YMAX) - 8, size:16, color:'#0F6E56'},
  {tex:'\\text{CON}^B', left: X(XMAX) + 6, top: Y(bisect(y => g0(y) - XMAX, 0, 9.7)) - 12, size:16, color:'#534AB7'},
  {tex:'\\text{CON}^B_1', left: X(XMAX) + 6, top: Y(bisect(y => conB(tN)(y) - XMAX, 0, 6)) - 12, size:16, color:'#534AB7'},
  {tex:'\\text{CISC}^A_0', left: X(cA0e) + 4, top: Y(ciscA(KA0)(cA0e)) - 21, size:15, color:'#1D9E75'},
  {tex:'\\text{CISC}^A_m', left: X(cAmx) - 5, top: Y(ciscA(KAm)(cAmx)) - 12, size:15, color:'#1D9E75', align:'right'},
  {tex:'\\text{CISC}^A_N', left: X(cANe) + 2, top: Y(ciscA(KAN)(cANe)) - 30, size:14, color:'#1D9E75'},
  {tex:'\\text{CISC}^B_N', left: X(ciscB(KBN)(EN[1] - 1.3)) + 4, top: Y(EN[1] - 1.3) - 4, size:14, color:'#534AB7'},
  {tex:'0', left: X(E0[0]) + 10, top: Y(E0[1]) + 4, size:16, color:'#000'},
  {tex:"m = E'", left: X(Em[0]) - 10, top: Y(Em[1]) - 28, size:16, color:'#000', align:'right'},
  {tex:"e'", left: X(Ee[0]) + 6, top: Y(Ee[1]) + 2, size:16, color:'#000'},
  {tex:"E''", left: X(E2[0]) - 8, top: Y(E2[1]) - 30, size:16, color:'#000', align:'right'},
  {tex:'N', left: X(EN[0]) + 9, top: Y(EN[1]) - 4, size:16, color:'#000'}
];
const box = document.getElementById('labels');
labels.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'katex-label'; el.id = 'lbl-' + i;
  box.appendChild(el);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pw(l.left); el.style.top = ph(l.top);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.color = l.color || 'black';
  if (l.center) el.style.transform = 'translateX(-50%)';
  if (l.align === 'right') el.classList.add('right-of-axis');
  if (l.bg) { el.style.background = 'white'; el.style.padding = '0 2px'; }
});
</script>
</body>
</html>
