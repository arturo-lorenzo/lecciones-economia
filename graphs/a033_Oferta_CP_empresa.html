<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="460" x2="570" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="460" x2="130" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="cmg-low"  fill="none" stroke="#1D9E75" stroke-width="2.2" opacity="0.45" stroke-linecap="round"/>
    <path id="cmg-sup"  fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="130" y1="460" x2="130" y2="407.2" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="130" y1="407.2" x2="323.6" y2="407.2" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <path id="cme"      fill="none" stroke="#534AB7" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="cvme"     fill="none" stroke="#378ADD" stroke-width="2.2"   stroke-linecap="round"/>


    <circle id="pt-cierre" r="5" fill="#D85A30"/>
    <circle id="pt-bnulo"  r="5" fill="#D85A30"/>

  </svg>


  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-p"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-cmg"></div>
  <div class="katex-label" id="lbl-cme"></div>
  <div class="katex-label" id="lbl-cvme"></div>
  <div class="katex-label" id="lbl-oferta"></div>
  <div class="katex-label" id="lbl-cierre"></div>
  <div class="katex-label" id="lbl-bnulo"></div>

</div>

<script>









const F = 15;
const cvme = q => 4 - 1.2 * q + 0.15 * q * q;
const cmg  = q => 4 - 2.4 * q + 0.45 * q * q;
const cme  = q => F / q + cvme(q);

const Q_CIERRE = 4;

let qb = 5, best = 1e9;
for (let q = 4.5; q <= 7; q += 0.001) {
  const diff = Math.abs(cmg(q) - cme(q));
  if (diff < best) { best = diff; qb = q; }
}
const Q_BNULO = qb;

function toSvgX(q) { return 130 + q * 48.4; }
function toSvgY(p) { return 460 - p * 33; }

function genCurve(fn, id, qMin, qMax) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const q = qMin + (i / 300) * (qMax - qMin);
    const sx = toSvgX(q);
    const sy = toSvgY(fn(q));
    if (sx >= 130 && sx <= 556 && sy >= 76 && sy <= 450) {
      pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
    }
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}

genCurve(cmg,  'cmg-low', 0.4, Q_CIERRE);
genCurve(cmg,  'cmg-sup', Q_CIERRE, 8.7);
genCurve(cme,  'cme',     1.4, 8.7);
genCurve(cvme, 'cvme',    0.4, 8.7);


const sc = [toSvgX(Q_CIERRE), toSvgY(cvme(Q_CIERRE))];
const sb = [toSvgX(Q_BNULO),  toSvgY(cme(Q_BNULO))];
document.getElementById('pt-cierre').setAttribute('cx', sc[0]);
document.getElementById('pt-cierre').setAttribute('cy', sc[1]);
document.getElementById('pt-bnulo').setAttribute('cx', sb[0]);
document.getElementById('pt-bnulo').setAttribute('cy', sb[1]);


const VBW = 680, VBH = 500;
const labels = [
  {id: 'lbl-x',      tex: 'x',                              left: '84.5%', top: '91%', color: 'black'},
  {id: 'lbl-p',      tex: 'p',                              left: '14.4%', top: '7%',  color: 'black'},
  {id: 'lbl-o',      tex: 'O',                               left: '16.4%', top: '92%', color: 'black'},
  {id: 'lbl-cmg',    tex: '\\text{Cmg}(x)',                    left: '68.7%', top: '8%',  color: '#0F6E56'},
  {id: 'lbl-cme',    tex: '\\text{Cme}(x)',                    left: '81.9%', top: '42%', color: '#534AB7'},
  {id: 'lbl-cvme',   tex: '\\text{CVme}(x)',                   left: '81.9%', top: '54%', color: '#185FA5'},
  {id: 'lbl-oferta', tex: '\\text{Oferta CP}',              left: '54.2%', top: '34%', color: '#0F6E56'},
  {id: 'lbl-cierre', tex: '\\text{Cierre}',
   left: ((sc[0] + 12) / VBW * 100).toFixed(1) + '%',
   top:  ((sc[1] + 4)  / VBH * 100).toFixed(1) + '%',  color: '#888'},
  {id: 'lbl-bnulo',  tex: '\\text{Beneficio nulo}',
   left: ((sb[0] + 26) / VBW * 100).toFixed(1) + '%',
   top:  ((sb[1] + 10) / VBH * 100).toFixed(1) + '%',  color: '#888'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
<script>(function(){var N={"lbl-oferta": [-2.21, -0.59, 0], "lbl-bnulo": [-2.5, -1.47, 0]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
