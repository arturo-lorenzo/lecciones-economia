<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <path d="M124.0,440.0 L124.0,326.0 L364.0,212.0 Z" fill="#D85A30" fill-opacity="0.16" stroke="none"/>
    <path d="M364.0,212.0 L508.0,75.2 L508.0,143.6 Z" fill="#1D9E75" fill-opacity="0.14" stroke="none"/>
    <line x1="124" y1="440" x2="556" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="440" x2="124" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M124.0,326.0 L508.0,326.0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,326.0 L508.0,143.6" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,440.0 L508.0,75.2" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="364.0" y1="212.0" x2="364.0" y2="440.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="124.0" y1="212.0" x2="364.0" y2="212.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="464.0" y1="117.0" x2="464.0" y2="440.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="464.0" y1="117.0" x2="464.0" y2="164.5" stroke="#1D9E75" stroke-width="3"/>
    <circle cx="364.0" cy="212.0" r="5" fill="#000"/>
    <path d="M364.0,474 L364.0,480 L464.0,480 L464.0,474" fill="none" stroke="black" stroke-width="0.8"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
  <div class="katex-label" id="l13"></div>
  <div class="katex-label" id="l14"></div>
</div>
<script>



const W = 680, H = 520;
const labels = [
  {id: 'l0', tex: 'x', x: 566.0, y: 440.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: '\\text{€}', x: 124.0, y: 28.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 452.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: '\\text{CF}', x: 112.0, y: 326.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'p\\,x_{\\text{pm}}', x: 112.0, y: 212.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l5', tex: 'x_{\\text{pm}}', x: 364.0, y: 446.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l6', tex: 'x_0', x: 464.0, y: 446.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l7', tex: '\\text{IT}(x)', x: 514.0, y: 75.2, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l8', tex: '\\text{CT}(x)', x: 514.0, y: 143.6, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l9', tex: '\\text{CF}', x: 514.0, y: 326.0, color: '#534AB7', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l10', tex: '\\text{punto muerto}', x: 354.0, y: 200.0, color: 'black', tr: 'translate(-100%,-50%)', small: true, bg: false},
  {id: 'l11', tex: '\\text{BAIT}_0', x: 456.0, y: 144.8, color: '#1D9E75', tr: 'translate(-100%,-50%)', small: true, bg: false},
  {id: 'l12', tex: '\\text{pérdidas}', x: 182.0, y: 343.1, color: '#D85A30', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l13', tex: '\\text{beneficio}', x: 468.0, y: 77.2, color: '#1D9E75', tr: 'translate(-50%,-100%)', small: true, bg: false},
  {id: 'l14', tex: '\\text{margen de seguridad}', x: 414.0, y: 484.0, color: '#5a5a5a', tr: 'translate(-50%,0)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
