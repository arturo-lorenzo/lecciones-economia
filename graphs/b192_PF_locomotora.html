<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <g id="g"></g>
  </svg>
</div>
<script>
const VBW = 900, VBH = 420;


const K2 = 0.836, SW = VBW / 680;
let DX = -62.32, DY = -12.56;
const NS = 'http://www.w3.org/2000/svg', G = document.getElementById('g');
function el(tag, at) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); G.appendChild(e); return e; }

const SK = 0.88, SH = 20;
const fx = x => x <= 100 ? x + SH : (x >= 600 ? 100 + SH + 500 * SK + (x - 600) : 100 + SH + (x - 100) * SK);
function lineRaw(x1, y1, x2, y2, at) { return el('line', Object.assign({x1: (DX + K2 * x1).toFixed(1), y1: (DY + K2 * y1).toFixed(1), x2: (DX + K2 * x2).toFixed(1), y2: (DY + K2 * y2).toFixed(1)}, at)); }
function line(x1, y1, x2, y2, at) { return lineRaw(fx(x1), y1, fx(x2), y2, at); }
const AX = {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'};
const GUIDE = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'};
const TICK = {stroke: 'black', 'stroke-width': 1};


const K = 255 / 331.5;
const nrm = [331.5 / Math.hypot(255, 331.5), -255 / Math.hypot(255, 331.5)];
const labels = [];
function L(id, tex, x, y, anchor, color, size, bg) { labels.push({id, tex, x: DX + K2 * fx(x), y: DY + K2 * y, anchor, color, size, bg}); }



function shiftArrow(xa, yb, gapH, color, dir) {
  const Km = K * SK, nm = [1 / Math.hypot(1, Km), -Km / Math.hypot(1, Km)];
  const d = gapH * SK * nm[0];
  const s = dir > 0 ? 1 : -1, m = 4, xm = fx(xa);
  const x1 = xm + s * nm[0] * m, y1 = yb + s * nm[1] * m;
  const x2 = xm + s * nm[0] * (d - m), y2 = yb + s * nm[1] * (d - m);
  lineRaw(x1, y1, x2, y2, {stroke: color, 'stroke-width': 1.2, 'stroke-linecap': 'round', 'marker-end': 'url(#arrow)'});
  return [x2, y2];
}

function panel(oy, P) {
  const OX = 100, OY = 460 + oy;
  const Y = v => v + oy;

  line(OX, OY, 600, OY, AX); line(OX, OY, OX, 60 + oy, AX);

  P.pts.forEach(p => line(p[0], Y(p[1]), p[0], OY, GUIDE));

  line(OX, Y(265), 585, Y(265), {stroke: '#378ADD', 'stroke-width': 2.2});
  line(OX, Y(220), 585, Y(220), {stroke: '#378ADD', 'stroke-width': 2.2, 'stroke-dasharray': '8 4'});

  P.is.forEach(c => {
    const xt = c.x0, xb = c.x0 + K * (P.isBot - 109);
    line(xt, Y(109), xb, Y(P.isBot), {stroke: '#1D9E75', 'stroke-width': 2.2, 'stroke-dasharray': c.dash ? (c.dash === 2 ? '3 4' : '8 4') : null});
  });

  line(P.lm[0], Y(P.lm[1]), P.lm[2], Y(P.lm[3]), {stroke: '#534AB7', 'stroke-width': 2.2});

  line(160, Y(265 - 4), 160, Y(220 + 4), {stroke: '#378ADD', 'stroke-width': 1.2, 'stroke-linecap': 'round', 'marker-end': 'url(#arrow)'});

  P.pts.forEach(p => el('circle', {cx: DX + K2 * fx(p[0]), cy: DY + K2 * Y(p[1]), r: 5, fill: '#000'}));

  P.pts.forEach(p => line(p[0], OY, p[0], OY + 4, TICK));
  [265, 220].forEach(v => line(OX - 4, Y(v), OX, Y(v), TICK));
}



panel(0, {
  is: [{x0: 230}, {x0: 350, dash: 1}, {x0: 310.8, dash: 2}], isBot: 430,
  lm: [170, 440.5, 530, 89.5],
  pts: [[350, 265], [418.5, 198.2], [396.2, 220]]
});
{
  const yb = 385, xa = 230 + K * (yb - 109);
  shiftArrow(xa, yb, 120, '#1D9E75', 1);

  const yb2 = 302, xa2 = 350 + K * (yb2 - 109);
  shiftArrow(xa2, yb2, 39.2, '#1D9E75', -1);
}
L('tA', '\\text{País A (Alemania)}', 350, 30, 'ct', '#888', 15);
L('iA', 'i', 92, 58, 'rt', 'black', 17);
L('YA', 'Y', 606, 460, 'lm', 'black', 17);
L('OA', 'O', 92, 466, 'rt', 'black', 16);
L('bp0A', '\\text{BP}_0', 591, 265, 'lm', '#378ADD', 16);
L('bp1A', '\\text{BP}_1', 591, 220, 'lm', '#378ADD', 16);
L('is0A', '\\text{IS}_0', 230, 103, 'cb', '#1D9E75', 16);
L('is1A', '\\text{IS}_1', 310.8, 103, 'cb', '#1D9E75', 16);
L('is0pA', "\\text{IS}_{0'}", 350, 103, 'lb', '#1D9E75', 16);
L('lmA', '\\text{LM}', 535, 89.5, 'lm', '#534AB7', 16);
L('p0A', '0', 323, 256, 'rb', '#000', 16);
L('p0pA', "0'", 420, 187, 'cb', '#000', 16);
L('p1A', '1', 397, 212, 'cb', '#000', 16);
L('y0A', 'Y_0', 350, 467, 'ct', 'black', 16);
L('y1A', 'Y_1', 400, 467, 'rt', 'black', 16);
L('y0pA', "Y_{0'}", 412, 467, 'lt', 'black', 16);
L('ist0A', 'i_0', 92, 265, 'rm', 'black', 16);
L('ist1A', 'i_1', 92, 220, 'rm', 'black', 16);
L('dgA', '\\Delta G_0 > 0', 545, 345, 'lm', '#1D9E75', 14);
L('deA', '\\Delta E < 0', 512.0, 298, 'lm', '#1D9E75', 14);
L('diA', '\\Delta i^* > 0', 166, 242.5, 'lm', '#378ADD', 14);


const OB = 540;
DX = 379.68; DY = -464.00;
panel(OB, {
  is: [{x0: 230}, {x0: 275, dash: 1}, {x0: 325, dash: 2}], isBot: 430,
  lm: [150, 414, 580, 93.6],
  pts: [[350, 265], [378.6, 243.7], [410.4, 220]]
});
{
  const yb = 155, xa = 230 + K * (yb - 109);
  shiftArrow(xa, yb + OB, 45, '#1D9E75', 1);

  const yb2 = 345, xa2 = 275 + K * (yb2 - 109);
  shiftArrow(xa2, yb2 + OB, 50, '#1D9E75', 1);
}
L('tB', '\\text{País B (Polonia)}', 350, 570, 'ct', '#888', 15);
L('iB', 'i', 92, 598, 'rt', 'black', 17);
L('YB', 'Y', 606, 1000, 'lm', 'black', 17);
L('OBl', 'O', 92, 1006, 'rt', 'black', 16);
L('bp0B', '\\text{BP}_0', 591, 805, 'lm', '#378ADD', 16);
L('bp1B', '\\text{BP}_1', 591, 760, 'lm', '#378ADD', 16);
L('is0B', '\\text{IS}_0', 240, 643, 'rb', '#1D9E75', 16);
L('is0pB', "\\text{IS}_{0'}", 275, 643, 'cb', '#1D9E75', 16);
L('is1B', '\\text{IS}_1', 325, 643, 'cb', '#1D9E75', 16);
L('lmB', '\\text{LM}', 585, 633.6, 'lm', '#534AB7', 16);
L('p0B', '0', 323, 796, 'rb', '#000', 16);
L('p0pB', "0'", 392, 789, 'lm', '#000', 16);
L('p1B', '1', 410, 752, 'cb', '#000', 16);
L('y0B', 'Y_0', 356, 1007, 'rt', 'black', 16);
L('y0pB', "Y_{0'}", 378.6, 1007, 'ct', 'black', 16);
L('y1B', 'Y_1', 410.4, 1007, 'ct', 'black', 16);
L('ist0B', 'i_0', 92, 805, 'rm', 'black', 16);
L('ist1B', 'i_1', 92, 760, 'rm', 'black', 16);
L('dxB', '\\Delta X > 0', 366, 683, 'lm', '#1D9E75', 14);
L('deB', '\\Delta E > 0', 510, 870, 'lm', '#1D9E75', 14);
L('diB', '\\Delta i^* > 0', 166, 782.5, 'lm', '#378ADD', 14);


G.querySelectorAll('line, circle').forEach(e => {
  const w = e.getAttribute('stroke-width'); if (w) e.setAttribute('stroke-width', (w * SW).toFixed(2));
  const d = e.getAttribute('stroke-dasharray'); if (d && d !== 'null') e.setAttribute('stroke-dasharray', d.split(/[ ,]+/).map(v => (v * SW).toFixed(1)).join(' '));
  if (e.tagName === 'circle') e.setAttribute('r', (e.getAttribute('r') * SW).toFixed(2));
});

const FIN = {"y1B": [710.0, 377.9, "lt"], "p0pA": [272.3, 127.1], "p1A": [230, 160.7], "p0A": [221.9, 189], "p1B": [708.4, 151.4], "p0B": [638.1, 198.3], "p0pB": [706.6, 195.5, "cm", 1]};
labels.forEach(l => { if (FIN[l.id]) { l.x = FIN[l.id][0]; l.y = FIN[l.id][1]; l.anchor = FIN[l.id][2] || "cm"; if (FIN[l.id][3]) l.bg = true; } });
const TX = {l: '0', c: '-50%', r: '-100%'}, TY = {t: '0', m: '-50%', b: '-100%'};
const C = document.querySelector('.graph-container');
labels.forEach(l => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; C.appendChild(e);
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  e.style.top = (l.y / VBH * 100).toFixed(2) + '%';
  e.style.color = l.color || 'black';
  e.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  e.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</body>
</html>
