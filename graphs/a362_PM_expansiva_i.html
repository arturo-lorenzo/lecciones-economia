<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="60" y1="358" x2="320" y2="358" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="60" y1="358" x2="60"  y2="113" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="dLi0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dLi0p" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dLi1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>

    <line id="ms0" stroke="#534AB7" stroke-width="2.2"/>
    <line id="ms1" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="8 4"/>
    <line id="l0"  stroke="#185FA5" stroke-width="2.2"/>
    <line id="l1"  stroke="#185FA5" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line id="msArrow" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

    <circle id="ptL0" r="5" fill="#000"/>
    <circle id="ptL0p" r="5" fill="#000"/>
    <circle id="ptL1" r="5" fill="#000"/>


    <line x1="400" y1="358" x2="660" y2="358" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="358" x2="400" y2="113" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="dRi0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dRi0p" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dRi1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dRY0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dRY1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>

    <line id="is"  stroke="#378ADD" stroke-width="2.2"/>
    <line id="lm0" stroke="#1D9E75" stroke-width="2.2"/>
    <line id="lm1" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line id="lmArrow" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="eff01" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="eff12" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

    <g id="ticks"></g>

    <circle id="ptR0" r="5" fill="#000"/>
    <circle id="ptR0p" r="5" fill="#000"/>
    <circle id="ptR1" r="5" fill="#000"/>
  </svg>

<script>



const isA=8.6, isB=1.2, lmS=0.6, lm0c=0.5, lm1c=-1.3;
const Y0=(isA-lm0c)/(isB+lmS), i0=lmS*Y0+lm0c;
const i0p=lmS*Y0+lm1c;
const Y1=(isA-lm1c)/(isB+lmS), i1=lmS*Y1+lm1c;


const m0=1.5, m1=6.5, sl=(i0-i0p)/(m1-m0);
const c0=i0+sl*m0;
const c1=i1+sl*m1;

function lx(m){ return 60 + m*26; }
function rx(Y){ return 400 + Y*32.5; }

const OYp=358, KY=38.3, KX=32.5, YTOP=OYp-245;
function sy(i){ return OYp - i*KY; }
const VBW=680, VBH=460;

function seg(id,x1,y1,x2,y2){const e=document.getElementById(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);}
function pt(id,x,y){const e=document.getElementById(id);e.setAttribute('cx',x);e.setAttribute('cy',y);}


seg('ms0', lx(m0), sy(0), lx(m0), sy(5.6));
seg('ms1', lx(m1), sy(0), lx(m1), sy(5.6));
const l0e=7.6, l1e=9.4;
seg('l0', lx(0.3), sy(c0-sl*0.3), lx(l0e), sy(c0-sl*l0e));
seg('l1', lx(0.3), sy(c1-sl*0.3), lx(l1e), sy(c1-sl*l1e));
const arY=sy(5.0);
seg('msArrow', lx(m0)+7, arY, lx(m1)-7, arY);
seg('dLi0',  lx(0), sy(i0),  lx(m0), sy(i0));
seg('dLi0p', lx(0), sy(i0p), lx(m1), sy(i0p));
seg('dLi1',  lx(0), sy(i1),  lx(m1), sy(i1));
pt('ptL0', lx(m0), sy(i0));
pt('ptL0p', lx(m1), sy(i0p));
pt('ptL1', lx(m1), sy(i1));


const isY=i=>(isA-i)/isB;
seg('is',  rx(isY(6)), sy(6), rx(isY(0.4)), sy(0.4));
seg('lm0', rx(0.4), sy(lmS*0.4+lm0c), rx(6.8), sy(lmS*6.8+lm0c));
seg('lm1', rx(2.9), sy(lmS*2.9+lm1c), rx(6.2), sy(lmS*6.2+lm1c));

(function(){
  const s=lmS*KY/KX;
  const nx=s/Math.hypot(1,s), ny=1/Math.hypot(1,s);
  const Ya=5.2, xa=rx(Ya), ya=sy(lmS*Ya+lm0c);
  const d=(lm0c-lm1c)*KY*ny;
  seg('lmArrow', xa+nx*6, ya+ny*6, xa+nx*(d-7), ya+ny*(d-7));
  window.lmArr={x:xa+nx*d/2, y:ya+ny*d/2};
})();
seg('dRi0',  rx(0), sy(i0),  rx(Y0), sy(i0));
seg('dRi0p', rx(0), sy(i0p), rx(Y0), sy(i0p));
seg('dRi1',  rx(0), sy(i1),  rx(Y1), sy(i1));
seg('dRY0', rx(Y0), sy(i0p), rx(Y0), sy(0));
seg('dRY1', rx(Y1), sy(i1), rx(Y1), sy(0));

seg('eff01', rx(Y0)-12, sy(i0)+4, rx(Y0)-12, sy(i0p)-4);
(function(){const x0=rx(Y0),y0=sy(i0p),x1=rx(Y1),y1=sy(i1),L=Math.hypot(x1-x0,y1-y0),ux=(x1-x0)/L,uy=(y1-y0)/L;
  seg('eff12', x0+ux*8+uy*9, y0+uy*8-ux*9, x1-ux*8+uy*9, y1-uy*8-ux*9);})();
pt('ptR0', rx(Y0), sy(i0));
pt('ptR0p', rx(Y0), sy(i0p));
pt('ptR1', rx(Y1), sy(i1));


const ticksG=document.getElementById('ticks');
function tick(x1,y1,x2,y2){const t=document.createElementNS('http://www.w3.org/2000/svg','line');t.setAttribute('x1',x1);t.setAttribute('y1',y1);t.setAttribute('x2',x2);t.setAttribute('y2',y2);t.setAttribute('stroke','black');t.setAttribute('stroke-width','1');ticksG.appendChild(t);}
[i0,i0p,i1].forEach(i=>{tick(56,sy(i),60,sy(i));tick(396,sy(i),400,sy(i));});
tick(rx(Y0),OYp,rx(Y0),OYp+4); tick(rx(Y1),OYp,rx(Y1),OYp+4);
tick(lx(m0),OYp,lx(m0),OYp+4); tick(lx(m1),OYp,lx(m1),OYp+4);


const cont=document.querySelector('.graph-container');
function pX(x){ return (x/VBW*100).toFixed(2)+'%'; }
function pY(y){ return (y/VBH*100).toFixed(2)+'%'; }
const labels=[
  {id:'tL', tex:'\\text{Mercado de dinero}', x:110, y:YTOP-38, color:'#888', size:'15px'},
  {id:'tR', tex:'\\text{Modelo IS-LM}',      x:470, y:YTOP-38, color:'#888', size:'15px'},

  {id:'iL', tex:'i',   x:53,  y:YTOP-16, align:'right', size:'17px'},
  {id:'mL', tex:'M/P', x:322, y:OYp-10, size:'17px'},
  {id:'iR', tex:'i',   x:393, y:YTOP-16, align:'right', size:'17px'},
  {id:'yR', tex:'Y',   x:662, y:OYp-10, size:'17px'},

  {id:'ms0', tex:'M^s_0/P', x:lx(m0)+6, y:sy(5.6)-24, color:'#534AB7', size:'16px'},
  {id:'ms1', tex:'M^s_1/P', x:lx(m1)+6, y:sy(5.6)-24, color:'#534AB7', size:'16px'},
  {id:'dH',  tex:'\\Delta H > 0', x:(lx(m0)+lx(m1))/2, y:arY-24, color:'#534AB7', size:'14px', center:true},
  {id:'l0', tex:'L(Y_0)', x:lx(l0e)+3, y:sy(c0-sl*l0e)+5, color:'#185FA5', size:'16px'},
  {id:'l1', tex:'L(Y_1)', x:lx(l1e)+4, y:sy(c1-sl*l1e)-12, color:'#185FA5', size:'16px'},

  {id:'L0',  tex:'0',  x:lx(m0)-20, y:sy(i0)+2,  color:'#000', size:'16px'},
  {id:'L0p', tex:"0'", x:lx(m1)-26, y:sy(i0p)+2,  color:'#000', size:'16px'},
  {id:'L1',  tex:'1',  x:lx(m1)+8,  y:sy(i1)-24,  color:'#000', size:'16px'},

  {id:'iL0',  tex:'i_0',    x:53, y:sy(i0)-11,  align:'right', size:'15px'},
  {id:'iL1',  tex:'i_1',    x:53, y:sy(i1)-11,  align:'right', size:'15px'},
  {id:'iL0p', tex:"i_{0'}", x:53, y:sy(i0p)-11, align:'right', size:'15px'},

  {id:'is',  tex:'\\text{IS}',   x:rx(isY(0.4))+5, y:sy(0.4)-14, color:'#378ADD', size:'16px'},
  {id:'lm0', tex:'\\text{LM}_0', x:rx(6.8)+5, y:sy(lmS*6.8+lm0c)-12, color:'#1D9E75', size:'16px'},
  {id:'lm1', tex:'\\text{LM}_1', x:rx(6.2)+5, y:sy(lmS*6.2+lm1c)-8, color:'#1D9E75', size:'16px'},
  {id:'dH2', tex:'\\Delta M^s > 0', x:0, y:0, color:'#1D9E75', size:'14px', arrowTag:true},

  {id:'R0',  tex:'0',  x:rx(Y0)-30, y:sy(i0)-26,  color:'#000', size:'16px'},
  {id:'R0p', tex:"0'", x:rx(Y0)+8, y:sy(i0p)+4,  color:'#000', size:'16px'},
  {id:'R1',  tex:'1',  x:rx(Y1)+20, y:sy(i1)-5,   color:'#000', size:'16px'},

  {id:'iR0',  tex:'i_0',    x:393, y:sy(i0)-11,  align:'right', size:'15px'},
  {id:'iR1',  tex:'i_1',    x:393, y:sy(i1)-11,  align:'right', size:'15px'},
  {id:'iR0p', tex:"i_{0'}", x:393, y:sy(i0p)-11, align:'right', size:'15px'},
  {id:'Y0', tex:'Y_0', x:rx(Y0)-12, y:OYp+6, size:'15px'},
  {id:'Y1', tex:'Y_1', x:rx(Y1)-6,  y:OYp+6, size:'15px'},
];
labels.forEach(l=>{
  const e=document.createElement('div'); e.className='katex-label'; e.id='lbl-'+l.id; cont.appendChild(e);
  katex.render(l.tex,e,{throwOnError:false});
  e.style.color=l.color||'black'; if(l.size) e.style.fontSize=l.size;
  if(l.arrowTag){ e.style.left=pX(lmArr.x+10); e.style.top=pY(lmArr.y-16); }
  else { e.style.left=pX(l.x); e.style.top=pY(l.y); }
  if(l.align==='right') e.classList.add('right-of-axis');
  if(l.center) e.style.transform='translateX(-50%)';
});
</script>
</div>
</body>
</html>
