<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <g id="g"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 460;
const NS = 'http://www.w3.org/2000/svg', G = document.getElementById('g');
function el(tag, at) { const e = document.createElementNS(NS, tag); for (const k in at) if (at[k] !== null && at[k] !== undefined) e.setAttribute(k, at[k]); G.appendChild(e); return e; }
function ln(x1, y1, x2, y2, at) { return el('line', Object.assign({x1: (+x1).toFixed(1), y1: (+y1).toFixed(1), x2: (+x2).toFixed(1), y2: (+y2).toFixed(1)}, at)); }
function path(pts, at) { return el('path', Object.assign({d: 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L'), fill: 'none'}, at)); }
const AX = {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'};
const GUIDE = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'};
const TICK = {stroke: 'black', 'stroke-width': 1};
const labels = [];
function L(id, tex, x, y, anchor, color, size, bg) { labels.push({id, tex, x, y, anchor, color, size, bg}); }


const OX = 140, OY = 400, XE = OX + 390;
const TMAX = 30, TS = 8;
const X = T => OX + 4 + T * 11.5, Yp = r => OY - r * 55;
const seg = (T0, T1, r0, r1, at) => { const pts = []; for (let i = 0; i <= 60; i++) { const T = T0 + (T1 - T0) * i / 60; const u = (T - T0) / (T1 - T0); pts.push([X(T), Yp(r0 + (r1 - r0) * (1 - Math.pow(1 - u, 1.6)))]); } path(pts, at); };
const ini = {stroke: '#888', 'stroke-width': 2.2, 'stroke-dasharray': '7 4'}, fin = {stroke: '#378ADD', 'stroke-width': 2.2, 'stroke-linecap': 'round'};
const v = (T0, T1, r0, r1, T) => { const u = (T - T0) / (T1 - T0); return r0 + (r1 - r0) * (1 - Math.pow(1 - u, 1.6)); };
ln(OX, OY, XE, OY, AX); ln(OX, OY, OX, 40, AX);
ln(X(TS), OY, X(TS), 70, GUIDE);
seg(0.3, TS - 0.6, 2.0, 3.0, ini); seg(TS + 0.6, TMAX, 3.6, 5.3, ini);
seg(0.3, TS - 0.6, 5.5, 5.2, fin); seg(TS + 0.6, TMAX, 4.1, 3.3, fin);

const Tc = 3.6, Tl = 20;
ln(X(Tc), Yp(v(0.3, TS - 0.6, 2.0, 3.0, Tc)) - 5, X(Tc), Yp(v(0.3, TS - 0.6, 5.5, 5.2, Tc)) + 5, {stroke: '#D85A30', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
ln(X(Tl), Yp(v(TS + 0.6, TMAX, 3.6, 5.3, Tl)) + 5, X(Tl), Yp(v(TS + 0.6, TMAX, 4.1, 3.3, Tl)) - 5, {stroke: '#D85A30', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
L('ly', 'k', OX - 8, 38, 'rt', 'black', 17);
L('lx', 'T', XE + 6, OY, 'lm', 'black', 17);
L('lO', 'O', OX - 8, OY + 6, 'rt', 'black', 16);
L('ltc', '\\text{tramo corto}', X(TS / 2), OY + 8, 'ct', 'black', 14);
L('ltl', '\\text{tramo largo}', X((TS + TMAX) / 2), OY + 8, 'ct', 'black', 14);
L('lac', '\\text{ventas de bonos cortos}', OX + 8, Yp(5.5) - 12, 'lb', '#D85A30', 14, true);
L('lal', '\\text{compras de bonos largos}', X(Tl), Yp(v(TS + 0.6, TMAX, 4.1, 3.3, Tl)) + 26, 'ct', '#D85A30', 14);
L('lini', '\\text{normal}', X(TMAX) + 7, Yp(5.3), 'lm', '#888', 14);
L('lfin', '\\text{invertida}', X(TMAX) + 7, Yp(3.3), 'lm', '#378ADD', 14);

const TX = {l: '0', c: '-50%', r: '-100%'}, TY = {t: '0', m: '-50%', b: '-100%'};
const CONT = document.querySelector('.graph-container');
labels.forEach(l => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; CONT.appendChild(e);
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  e.style.top = (l.y / VBH * 100).toFixed(2) + '%';
  e.style.color = l.color || 'black';
  e.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  e.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</body>
</html>
