<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <line id="axx" y1="380" y2="380" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="axy" y1="478" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <path id="tr" fill="none" stroke="#888" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <path id="n" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round"/>
    <path id="gY" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <g id="gap"></g>
    <g id="dyn"></g>
    <g id="dots"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 500, NS = 'http://www.w3.org/2000/svg';



const yS = 2.2, NM = 3.0, W = 1.0, C = 0.45, D = 0.075;
const n = y => NM * Math.tanh((y - yS) / W);
const gY = y => C * (y - yS) + D * (y - yS) * (y - yS);

let yU; { let lo = yS + 1, hi = yS + 6; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; (gY(m) - n(m) < 0) ? lo = m : hi = m; } yU = (lo + hi) / 2; }

const yT = 7.7, tr = y => n(y) - 1.5 * (1 - Math.exp(-Math.pow((y - yT) / 1.1, 2)));
const OX = 118, XE = OX + 470;
const X = y => OX + y * 45.3;
const Y = r => 380 - r * 72;
function mk(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); document.getElementById(parent).appendChild(e); return e; }
function path(id, fn, y0, y1, rmax) {
  const p = []; for (let i = 0; i <= 400; i++) { const y = y0 + (y1 - y0) * i / 400; const r = fn(y); if (r <= rmax) p.push(X(y).toFixed(1) + ',' + Y(r).toFixed(1)); }
  document.getElementById(id).setAttribute('d', 'M' + p.join(' L'));
}
const Y0 = yS - 0.38, YMAX = 9.8, RMAX = 4.55;
path('n', n, Y0, YMAX, 9);
path('gY', gY, Y0, YMAX, RMAX);
path('tr', tr, yT, YMAX, 9);
const yEnd = (() => { let y = yS; while (gY(y) < RMAX) y += 0.001; return y; })();

mk('line', {x1: X(yU), y1: Y(n(yU)), x2: X(yU), y2: 380, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, 'guides');
mk('line', {x1: X(yU), y1: 380, x2: X(yU), y2: 384, stroke: 'black', 'stroke-width': 1}, 'guides');

mk('circle', {cx: X(yS), cy: Y(0), r: 5, fill: '#000', stroke: '#000', 'stroke-width': 1.6}, 'dots');
mk('circle', {cx: X(yU), cy: Y(n(yU)), r: 5, fill: '#fff', stroke: '#000', 'stroke-width': 1.6}, 'dots');

function setDyn(xa, xb, yy) {
  const k = Math.max(2, Math.round(Math.abs(xb - xa) / 45)), pts = [];
  for (let i = 0; i <= k; i++) pts.push((xa + (xb - xa) * i / k).toFixed(1) + ',' + yy);
  mk('polyline', {points: pts.join(' '), fill: 'none', stroke: '#5a5a5a', 'stroke-width': 1.2, 'stroke-dasharray': '5 4', 'marker-mid': 'url(#arrow)', 'marker-end': 'url(#arrow)'}, 'dyn');
}
setDyn(X(0.35), X(yS) - 18, 370);
setDyn(X(yU) - 18, X(yS) + 28, 370);
setDyn(X(yU) + 18, X(9.7), 370);

function argmax(y0, y1, f) { let yb = y0, vb = -1e9; for (let y = y0; y <= y1; y += 0.005) { const v = f(y); if (v > vb) { vb = v; yb = y; } } return yb; }
const yNeg = argmax(yS + 0.1, yU - 0.1, y => n(y) - gY(y));
const yPos = yEnd - 0.35;
function brace(y, r1, r2) {
  const x = X(y), y1 = Y(r1), y2 = Y(r2), A = {stroke: '#444', 'stroke-width': 1};
  mk('line', Object.assign({x1: x, y1: y1, x2: x, y2: y2}, A), 'gap');
  mk('line', Object.assign({x1: x - 4, y1: y1, x2: x + 4, y2: y1}, A), 'gap');
  mk('line', Object.assign({x1: x - 4, y1: y2, x2: x + 4, y2: y2}, A), 'gap');
  return [x, (y1 + y2) / 2];
}
const bNeg = brace(yNeg, n(yNeg), gY(yNeg)), bPos = brace(yPos, gY(yPos), n(yPos));

const cont = document.querySelector('.graph-container');
function put(tex, x, y, o = {}) {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / VBW * 100).toFixed(2) + '%'; e.style.top = (y / VBH * 100).toFixed(2) + '%';
  e.style.color = o.c || 'black'; if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const q = e.querySelector('.katex'); if (q) q.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', O = '#D85A30';
['axx', 'axy'].forEach(id => document.getElementById(id).setAttribute('x1', OX)); document.getElementById('axy').setAttribute('x2', OX); document.getElementById('axx').setAttribute('x2', XE);
put('\\text{tasas}', OX - 8, 44, {ha: 'r', s: 16});
put('y', XE + 8, 380, {va: 'm', s: 18});
put('n(y)', X(YMAX) + 6, Y(n(YMAX)), {va: 'm', c: O});
put('g_Y(y)', X(yEnd) + 6, Y(RMAX), {va: 'm', c: G});
put('0', X(yS) - 6, Y(0) - 16, {ha: 'r', va: 'b'});
put('U', X(yU) + 8, Y(n(yU)) + 6, {va: 't'});
put('y_S', X(yS) + 4, 388, {ha: 'l'});
put('y_U', X(yU), 390, {ha: 'c'});
put('g_y < 0', bNeg[0] + 7, bNeg[1], {va: 'm', s: 14, c: '#444'});
put('g_y > 0', bPos[0] + 7, bPos[1], {va: 'm', s: 14, c: '#444'});
put('\\text{transición demográfica}', X(YMAX) + 30, Y(tr(YMAX)) + 4, {ha: 'r', va: 't', s: 13, c: '#666'});
put('g_y = g_Y - n', XE - 20, 452, {ha: 'r', va: 'm', s: 15, c: '#444'});
</script>
</body>
</html>
