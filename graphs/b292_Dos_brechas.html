<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>

    <line id="axx" y1="450" y2="450" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="axy" y1="450" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <line id="fbar" stroke="#378ADD" stroke-width="2.2"/>

    <line id="s-lo" stroke="#1D9E75" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>
    <line id="m-lo" stroke="#D85A30" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>

    <line id="m-hi" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round"/>
    <line id="s-hi" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <g id="gap"></g>
    <g id="dots"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 520, NS = 'http://www.w3.org/2000/svg';




const v = 2.25, gs = 3.0 - 1.2 / 2.25;
const mu = 1.2, gm = 0.5;
const Fb = 3.0;
const FS = g => v * (g - gs), FM = g => mu * (g - gm);
const gc = (v * gs - mu * gm) / (v - mu);
const g0 = gm + Fb / mu;
const gA = gs + Fb / v;
const OX = 118, XE = OX + 440;
const X = g => OX + g * 69.1;
const Y = F => 450 - F * 50;
function setL(id, x1, y1, x2, y2) { const e = document.getElementById(id); e.setAttribute('x1', x1.toFixed(1)); e.setAttribute('y1', y1.toFixed(1)); e.setAttribute('x2', x2.toFixed(1)); e.setAttribute('y2', y2.toFixed(1)); }
function mk(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); document.getElementById(par).appendChild(e); return e; }
const gSend = gs + 6.8 / v, gMend = 5.4;
setL('s-lo', X(gs), Y(0), X(gc), Y(FS(gc)));
setL('s-hi', X(gc), Y(FS(gc)), X(gSend), Y(FS(gSend)));
setL('m-hi', X(gm), Y(0), X(gc), Y(FM(gc)));
setL('m-lo', X(gc), Y(FM(gc)), X(gMend), Y(FM(gMend)));
setL('fbar', X(0), Y(Fb), X(5.6), Y(Fb));

[g0, gA].forEach(g => {
  mk('line', {x1: X(g), y1: Y(Fb), x2: X(g), y2: 450, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, 'guides');
  mk('line', {x1: X(g), y1: 450, x2: X(g), y2: 454, stroke: 'black', 'stroke-width': 1}, 'guides');
});

{ const x = X(g0), y1 = Y(Fb), y2 = Y(FS(g0)), A = {stroke: '#444', 'stroke-width': 1.2};
  mk('line', Object.assign({x1: x, y1: y1, x2: x, y2: y2}, A), 'gap');
  mk('line', Object.assign({x1: x - 4, y1: y2, x2: x + 4, y2: y2}, A), 'gap'); }

mk('circle', {cx: X(g0), cy: Y(Fb), r: 5, fill: '#000'}, 'dots');
mk('circle', {cx: X(gA), cy: Y(Fb), r: 5, fill: '#000'}, 'dots');

const cont = document.querySelector('.graph-container');
function put(tex, x, y, o = {}) {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / VBW * 100).toFixed(2) + '%'; e.style.top = (y / VBH * 100).toFixed(2) + '%';
  e.style.color = o.c || 'black'; if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const q = e.querySelector('.katex'); if (q) q.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', O = '#D85A30', B = '#378ADD';
['axx', 'axy'].forEach(id => document.getElementById(id).setAttribute('x1', OX)); document.getElementById('axy').setAttribute('x2', OX); document.getElementById('axx').setAttribute('x2', XE);
put('F', OX - 10, 44, {ha: 'r', s: 18});
put('g_Y', XE + 8, 450, {va: 'm', s: 18});
put('I(g_Y) - S', X(gSend) + 6, Y(FS(gSend)), {va: 'm', c: G});
put('M(g_Y) - X', X(gMend) + 6, Y(FM(gMend)), {va: 'm', c: O});
put('\\bar{F}', X(5.6) + 6, Y(Fb), {va: 'm', c: B});
put('0', X(g0) - 4, Y(Fb) - 7, {ha: 'r', va: 'b'});
put('A', X(gA) + 7, Y(Fb) + 6, {va: 't'});
put('g_{Y,0}', X(g0), 460, {ha: 'c'});
put('g_{Y,A}', X(gA), 460, {ha: 'c'});
put('\\begin{array}{r}\\text{ahorro}\\\\ \\text{sobrante}\\end{array}', X(g0) - 8, Y(FS(g0)) - 16, {ha: 'r', va: 'm', s: 13, c: '#444'});
put('\\text{necesidad efectiva}', X(gc) - 10, Y(FS(gc)) - 10, {ha: 'r', va: 'b', s: 13, c: '#444'});
put('I,\\ S,\\ M,\\ X,\\ F\\text{: en proporción del PIB}', 340, 500, {ha: 'c', va: 'm', s: 14, c: '#444'});
</script>
</body>
</html>
