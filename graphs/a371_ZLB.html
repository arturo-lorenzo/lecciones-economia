<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
  .katex-label.centered { transform: translateX(-50%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <path id="gap" fill="rgba(29,158,117,0.15)" stroke="none"/>


    <line id="xaxis" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100" y1="480" x2="100" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="istarL" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="istarNeg" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
    <path id="istarR" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="izlb" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="pt1" r="4.5" fill="#D85A30"/>
    <circle id="pt2" r="4.5" fill="#D85A30"/>
  </svg>

  <div class="katex-label" id="lbl-i"></div>
  <div class="katex-label" id="lbl-t"></div>
  <div class="katex-label" id="lbl-0"></div>
  <div class="katex-label" id="lbl-istar"></div>
  <div class="katex-label" id="lbl-zlb"></div>
  <div class="katex-label" id="lbl-t1"></div>
  <div class="katex-label" id="lbl-t2"></div>
  <div class="katex-label" id="lbl-gap"></div>
</div>
<script>
const VBW = 680, VBH = 560;
const pct = (v, T) => (v / T * 100).toFixed(1) + '%';

const yZero = 300;
const toX = t => 100 + t * 50;
const toY = i => yZero - i * 36;


const m = 4, wL = 2, wR = 3.5, depth = 2;
const istar = t => depth * Math.pow((t - m) / (t < m ? wL : wR), 2) - depth;
const t1 = m - wL, t2 = m + wR;


document.getElementById('xaxis').setAttribute('x1', 100);
document.getElementById('xaxis').setAttribute('y1', yZero);
document.getElementById('xaxis').setAttribute('x2', 600);
document.getElementById('xaxis').setAttribute('y2', yZero);

function segment(tA, tB) {
  const pts = [];
  const N = 200;
  for (let k = 0; k <= N; k++) {
    const t = tA + (k / N) * (tB - tA);
    pts.push(toX(t).toFixed(1) + ',' + toY(istar(t)).toFixed(1));
  }
  return 'M' + pts.join(' L');
}

const tStart = 0.25, tEnd = 9.6;
document.getElementById('istarL').setAttribute('d', segment(tStart, t1));
document.getElementById('istarNeg').setAttribute('d', segment(t1, t2));
document.getElementById('istarR').setAttribute('d', segment(t2, tEnd));


const gapPts = [];
for (let k = 0; k <= 200; k++) {
  const t = t1 + (k / 200) * (t2 - t1);
  gapPts.push(toX(t).toFixed(1) + ',' + toY(istar(t)).toFixed(1));
}
document.getElementById('gap').setAttribute('d',
  'M' + toX(t1).toFixed(1) + ',' + yZero +
  ' L' + gapPts.join(' L') +
  ' L' + toX(t2).toFixed(1) + ',' + yZero + ' Z');


document.getElementById('izlb').setAttribute('x1', toX(t1));
document.getElementById('izlb').setAttribute('y1', yZero);
document.getElementById('izlb').setAttribute('x2', toX(t2));
document.getElementById('izlb').setAttribute('y2', yZero);

document.getElementById('pt1').setAttribute('cx', toX(t1));
document.getElementById('pt1').setAttribute('cy', yZero);
document.getElementById('pt2').setAttribute('cx', toX(t2));
document.getElementById('pt2').setAttribute('cy', yZero);

const labels = [
  {id:'lbl-i',     tex:'i',                         left:pct(92,VBW),  top:pct(44,VBH),  color:'black', align:'right', size:'17px'},
  {id:'lbl-t',     tex:'t',                         left:pct(606,VBW), top:pct(yZero-12,VBH), color:'black', size:'17px'},
  {id:'lbl-0',     tex:'0',                         left:pct(93,VBW),  top:pct(yZero-11,VBH), color:'black', align:'right', size:'15px'},
  {id:'lbl-istar', tex:'i^{T}(t)',                  left:pct(toX(tEnd)+8,VBW), top:pct(toY(istar(tEnd))-10,VBH), color:'#1D9E75', size:'16px'},
  {id:'lbl-zlb',   tex:'i=0\\;\\text{(ZLB)}',       left:pct((toX(t1)+toX(t2))/2,VBW), top:pct(yZero-34,VBH), color:'#378ADD', align:'center', size:'16px'},
  {id:'lbl-gap',   tex:'\\text{estímulo no aplicado}', left:pct(toX(4.4),VBW), top:pct(yZero+14,VBH), color:'#0F6E56', align:'center', size:'14px'},
  {id:'lbl-t1',    tex:'t_1',                       left:pct(toX(t1)-26,VBW), top:pct(yZero+8,VBH), color:'black', size:'15px'},
  {id:'lbl-t2',    tex:'t_2',                       left:pct(toX(t2)+8,VBW), top:pct(yZero+8,VBH), color:'black', size:'15px'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError:false});
  el.style.left = l.left; el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
  if (l.align === 'center') el.style.transform = 'translateX(-50%)';
  if (l.size) el.style.fontSize = l.size;
});
</script>
</body>
</html>
