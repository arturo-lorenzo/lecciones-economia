<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124.0" y1="172.3" x2="223.6" y2="172.3" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="124.0" y1="286.6" x2="346.9" y2="286.6" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="174.2" y1="286.6" x2="174.2" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="296.7" y1="286.6" x2="296.7" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="346.9" y1="286.6" x2="346.9" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M124.0,80.0 L503.2,431.5" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,403.0 L263.4,80.0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,172.3 L472.5,403.0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,172.3 L341.3,460.0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
    <path d="M124.0,441.0 L452.0,365.0" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="296.7" cy="401.0" r="3.5" fill="#D85A30"/>
    <circle cx="174.2" cy="286.6" r="3.5" fill="#1D9E75"/>
    <circle cx="346.9" cy="286.6" r="3.5" fill="#378ADD"/>
    <circle cx="296.7" cy="286.6" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>







const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'X', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'p', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 472.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'p^*', x: 112.0, y: 286.6, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'S_f(p^*)', x: 174.2, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l5', tex: 'x_D^*', x: 296.7, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l6', tex: 'D(p^*)', x: 346.9, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l7', tex: '0', x: 304.7, y: 274.6, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l8', tex: 'D(p)', x: 509.2, y: 431.5, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l9', tex: 'S_f(p)', x: 269.4, y: 80.0, color: '#1D9E75', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l10', tex: 'D_R(p)', x: 462.5, y: 417.0, color: '#534AB7', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l11', tex: '\\text{Img}_R(x_D)', x: 354.3, y: 447.0, color: '#534AB7', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l12', tex: '\\text{Cmg}_D(x_D)', x: 458.0, y: 361.0, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
