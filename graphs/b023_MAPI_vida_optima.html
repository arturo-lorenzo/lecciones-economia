<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="116" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="116" y1="460" x2="116" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="c-obs"   fill="none" stroke="#534AB7" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="c-cap"   fill="none" stroke="#378ADD" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="c-total" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="n-dash" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="n-tick" stroke="black" stroke-width="1"/>


    <circle id="pt-min" r="5" fill="#D85A30"/>

  </svg>


  <div class="katex-label" id="lbl-n"></div>
  <div class="katex-label" id="lbl-c"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-obs"></div>
  <div class="katex-label" id="lbl-cap"></div>
  <div class="katex-label" id="lbl-total"></div>
  <div class="katex-label" id="lbl-nstar"></div>
  <div class="katex-label" id="lbl-vida"></div>

</div>

<script>








const a = 1.2, b = 40;
const cObs   = n => a * n;
const cCap   = n => b / n;
const cTotal = n => cObs(n) + cCap(n);
const nStar  = Math.sqrt(b / a);

const NMAX = 10;
function toSvgX(n) { return 116 + n * 40; }
function toSvgY(c) { return 460 - c * 13; }

function genCurve(fn, id, nMin, nMax) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const n = nMin + (i / 300) * (nMax - nMin);
    const sx = toSvgX(n);
    const sy = toSvgY(fn(n));
    if (sx >= 116 && sx <= 517 && sy >= 70 && sy <= 460) {
      pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
    }
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(cObs,   'c-obs',   0, 10);
genCurve(cCap,   'c-cap',   1.3, 10);
genCurve(cTotal, 'c-total', 1.3, 10);


const sm = [toSvgX(nStar), toSvgY(cTotal(nStar))];
document.getElementById('pt-min').setAttribute('cx', sm[0]);
document.getElementById('pt-min').setAttribute('cy', sm[1]);
const nd = document.getElementById('n-dash');
nd.setAttribute('x1', sm[0]); nd.setAttribute('y1', sm[1]);
nd.setAttribute('x2', sm[0]); nd.setAttribute('y2', 460);
const nt = document.getElementById('n-tick');
nt.setAttribute('x1', sm[0]); nt.setAttribute('y1', 460);
nt.setAttribute('x2', sm[0]); nt.setAttribute('y2', 464);


const pct = (v, t) => (v / t * 100).toFixed(2) + '%';

const labels = [
  {id: 'lbl-n',     tex: 'n', x: 564, y: 460, ax: 0, ay: 0.5, color: 'black', size: 17},
  {id: 'lbl-c',     tex: '\\text{Coste anual}', x: 116, y: 48, ax: 0.5, ay: 1, color: 'black', size: 17},
  {id: 'lbl-o',     tex: 'O', x: 110, y: 466, ax: 1, ay: 0, color: 'black'},
  {id: 'lbl-obs',   tex: '\\text{Obsolescencia}', x: toSvgX(NMAX) + 6, y: toSvgY(cObs(NMAX)), ax: 0, ay: 0.5, color: '#534AB7'},
  {id: 'lbl-cap',   tex: '\\text{Capital}', x: toSvgX(NMAX) + 6, y: toSvgY(cCap(NMAX)), ax: 0, ay: 0.5, color: '#185FA5'},
  {id: 'lbl-total', tex: '\\text{Coste total}', x: toSvgX(NMAX) + 6, y: toSvgY(cTotal(NMAX)), ax: 0, ay: 0.5, color: '#0F6E56'},
  {id: 'lbl-nstar', tex: 'n^*', x: sm[0], y: 468, ax: 0.5, ay: 0, color: 'black'},
  {id: 'lbl-vida',  tex: '\\text{Vida óptima}', x: sm[0], y: sm[1] - 12, ax: 0.5, ay: 1, color: '#D85A30'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, 680);
  el.style.top = pct(l.y, 500);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.whiteSpace = 'nowrap';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
