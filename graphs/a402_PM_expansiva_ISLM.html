<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="130" y1="440" x2="560" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="440" x2="130" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="164.4" y1="110" x2="388" y2="390" stroke="#378ADD" stroke-width="2.2"/>

    <line x1="164.4" y1="370" x2="499.8" y2="110" stroke="#1D9E75" stroke-width="2.2"/>

    <line x1="250.4" y1="370.0" x2="538.5" y2="146.7" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line x1="424.3" y1="177.4" x2="448.0" y2="208.0" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>

    <line x1="292.6" y1="270.6" x2="292.6" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="292.6" y1="270.6" x2="130" y2="270.6" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="325.6" y1="311.8" x2="325.6" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="325.6" y1="311.8" x2="130" y2="311.8" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="292.6" y1="440" x2="292.6" y2="444" stroke="black" stroke-width="1"/>
    <line x1="325.6" y1="440" x2="325.6" y2="444" stroke="black" stroke-width="1"/>
    <line x1="126" y1="270.6" x2="130" y2="270.6" stroke="black" stroke-width="1"/>
    <line x1="126" y1="311.8" x2="130" y2="311.8" stroke="black" stroke-width="1"/>
    <circle cx="292.6" cy="270.6" r="5" fill="#000"/>
    <circle cx="325.6" cy="311.8" r="5" fill="#000"/>
  </svg>
</div>
<script>
const W=680,H=520;
const pct=(v,t)=>(v/t*100).toFixed(2)+'%';
const E0=[292.6,270.6], E1=[325.6,311.8];

const LBL=[
  ['lbl-i','i',122,52,'black',18,'r',false],
  ['lbl-Y','Y',566,442,'black',18,'l',false],
  ['lbl-IS','\\text{IS}',393.2,392,'#378ADD',16,'l',false],
  ['lbl-LM0','\\text{LM}_0',505.0,104,'#1D9E75',16,'l',false],
  ['lbl-LM1','\\text{LM}_1',543.7,142.7,'#1D9E75',16,'l',false],
  ['lbl-E0','0',E0[0],E0[1]-20,'#000',16,'c',false],
  ['lbl-E1','1',E1[0]+20,E1[1]+3,'#000',16,'l',false],
  ['lbl-O','O',122,458,'black',16,'r',false],
  ['lbl-i0','i_0',122,E0[1],'black',16,'r',false],
  ['lbl-i1','i_1',122,E1[1],'black',16,'r',false],
  ['lbl-Y0','Y_0',E0[0],458,'black',16,'c',false],
  ['lbl-Y1','Y_1',E1[0],458,'black',16,'c',false],
  ['lbl-dM','\\Delta M^s > 0',458,224,'#1D9E75',13,'l',false]
];
const c=document.querySelector('.graph-container');
LBL.forEach(([id,tex,x,y,color,size,anc,bg])=>{
  const e=document.createElement('div');e.className='katex-label';e.id=id;c.appendChild(e);
  katex.render(tex,e,{throwOnError:false});
  e.style.left=pct(x,W);e.style.top=pct(y,H);e.style.color=color;e.style.fontSize=size+'px';
  e.style.transform=(anc==='r'?'translate(-100%,-50%)':anc==='c'?'translate(-50%,-50%)':'translate(0,-50%)');
  if(bg){e.style.background='#fff';const k=e.querySelector('.katex');if(k)k.style.padding='0 2px';}
});
</script>
</body>
</html>
