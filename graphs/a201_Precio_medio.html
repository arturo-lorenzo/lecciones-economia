<script>
const VBW = 680, VBH = 560;
const pct = (v, T) => (v / T * 100).toFixed(1) + '%';
const labels = [

  {id:'L7', tex:"\\text{Cme}(x_1)", left:pct(118.0,VBW), top:pct(234.1,VBH), color:'black', align:'right', bg:false},

  {id:'L9', tex:"x_1", left:pct(203.8,VBW), top:pct(466.0,VBH), color:'black', align:'centered', bg:false},
  {id:'L10', tex:"x_2", left:pct(405.0,VBW), top:pct(466.0,VBH), color:'black', align:'centered', bg:false},
  {id:'L11', tex:"\\text{pérdida}", left:pct(164.4,VBW), top:pct(339.6,VBH), color:'#D85A30', align:'mid', bg:true},
  {id:'L12', tex:"\\text{beneficio}", left:pct(300.0,VBW), top:pct(173.5,VBH), color:'#1D9E75', align:'mid', bg:true},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError:false});
  el.style.left = l.left; el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
  if (l.align === 'center' || l.align === 'centered') el.classList.add('centered');
  if (l.align === 'vmid') el.classList.add('vmid');
  if (l.align === 'mid') el.classList.add('mid');
  if (l.bg) { el.style.background = '#fff'; el.style.padding = '1px 3px'; el.style.fontSize = '14px'; }
});
