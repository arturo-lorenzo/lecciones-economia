<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="zones"></g>

    <line x1="130" y1="420" x2="548" y2="420" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="420" x2="130" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <g id="curves"></g>
    <g id="points"></g>
  </svg>
</div>
<script>




const al = 0.3, A = 1, dl = 0.03, n = 0.04, kS = 14;
const r = k => al*A*Math.pow(k, al - 1) - dl;
const kOro = Math.pow(al*A/(n + dl), 1/(1 - al)), rS = r(kS);
const VBW = 680, VBH = 480, OX = 130, OY = 420, KMAX = 24;
const X = k => OX + k*(386/KMAX),
      Y = v => OY - v*(340/0.10);
const NS = 'http://www.w3.org/2000/svg';
function el(g, tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); document.getElementById(g).appendChild(e); return e; }
function line(g, x1, y1, x2, y2, att) { return el(g, 'line', Object.assign({x1, y1, x2, y2}, att)); }
const dash = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, tk = {stroke: 'black', 'stroke-width': 1};
const cR = '#378ADD', cN = '#1D9E75', cBad = '#C62828';
const L = []; function put(tex, x, y, o = {}) { L.push(Object.assign({tex, x, y}, o)); }


el('zones', 'rect', {x: OX, y: 60, width: X(kOro) - OX, height: OY - 60, fill: '#1D9E75', 'fill-opacity': 0.07});
el('zones', 'rect', {x: X(kOro), y: 60, width: X(KMAX) - X(kOro), height: OY - 60, fill: cBad, 'fill-opacity': 0.06});


line('guides', X(kOro), Y(n), X(kOro), OY, dash); line('guides', X(kOro), OY, X(kOro), OY + 4, tk);
line('guides', OX, Y(rS), X(kS), Y(rS), dash); line('guides', X(kS), Y(rS), X(kS), OY, dash);
line('guides', OX - 4, Y(rS), OX, Y(rS), tk); line('guides', X(kS), OY, X(kS), OY + 4, tk);
line('guides', OX - 4, Y(n), OX, Y(n), tk);


line('curves', OX, Y(n), X(KMAX), Y(n), {stroke: cN, 'stroke-width': 2.2});
const k0 = Math.pow((0.097 + dl)/(al*A), 1/(al - 1)), pts = [];
for (let i = 0; i <= 200; i++) { const k = k0 + (KMAX - k0)*i/200; pts.push(X(k).toFixed(1) + ',' + Y(r(k)).toFixed(1)); }
el('curves', 'path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: cR, 'stroke-width': 2.2, 'stroke-linecap': 'round'});


el('points', 'circle', {cx: X(kOro), cy: Y(n), r: 4.5, fill: '#D85A30'});
el('points', 'circle', {cx: X(kS), cy: Y(rS), r: 4.5, fill: cBad});


put('k', 554, OY, {va: 'm', s: 17});
put('r,\\, n', 122, 40, {ha: 'r', va: 't', s: 17});
put("f'(k) - \\delta", X(k0) + 10, Y(r(k0)), {c: cR, va: 'm'});
put('n = g_Y^*', X(KMAX) + 5, Y(n), {c: cN, va: 'm'});
put('n', OX - 8, Y(n), {ha: 'r', va: 'm', s: 15});
put('r^*', OX - 8, Y(rS), {ha: 'r', va: 'm', s: 15});
put('k_{\\text{oro}}', X(kOro), OY + 8, {ha: 'c', s: 15});
put('k^*', X(kS), OY + 8, {ha: 'c', s: 15});
put('\\text{Eficiencia dinámica}', (OX + X(kOro))/2, (Y(n) + Y(rS))/2 - 10, {ha: 'c', va: 'b', s: 14, c: '#1D7A5C'});
put('(r > n)', (OX + X(kOro))/2, (Y(n) + Y(rS))/2 - 6, {ha: 'c', va: 't', s: 14, c: '#1D7A5C'});
put('\\text{Ineficiencia dinámica}', (X(kOro) + X(KMAX))/2, 90, {ha: 'c', s: 14, c: cBad});
put('(r < n)', (X(kOro) + X(KMAX))/2, 110, {ha: 'c', s: 14, c: cBad});

const cont = document.querySelector('.graph-container');
L.forEach((l, i) => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x/VBW*100).toFixed(2) + '%'; e.style.top = (l.y/VBH*100).toFixed(2) + '%';
  e.style.color = l.c || 'black'; if (l.s) e.style.fontSize = l.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[l.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[l.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
});
</script>
</body>
</html>
