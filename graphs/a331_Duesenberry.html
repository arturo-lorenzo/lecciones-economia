<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <line x1="140.0" y1="440.0" x2="580.0" y2="440.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="140.0" y1="440.0" x2="140.0" y2="40.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M143.4,289.1 L375.9,224.5" fill="none" stroke="#D85A30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
    <line x1="140.0" y1="440.0" x2="512.3" y2="100.0" stroke="#378ADD" stroke-width="2.2"/>
    <line x1="140.0" y1="290.0" x2="529.2" y2="182.0" stroke="#1D9E75" stroke-width="2.2"/>
    <line x1="337.3" y1="249.6" x2="223.1" y2="281.3" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="375.9" y1="224.5" x2="375.9" y2="440.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="140.0" y1="224.5" x2="375.9" y2="224.5" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <circle cx="375.9" cy="224.5" r="5" fill="#000"/>
    <line x1="375.9" y1="440.0" x2="375.9" y2="444.0" stroke="black" stroke-width="1"/>
    <line x1="136.0" y1="224.5" x2="140.0" y2="224.5" stroke="black" stroke-width="1"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "C",
  "x": 132.0,
  "y": 38,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl1",
  "tex": "Y",
  "x": 586.0,
  "y": 440,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "C_{\\text{LP}}",
  "x": 518.3,
  "y": 100.0,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "C_{\\text{CP}}",
  "x": 535.2,
  "y": 182.0,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "0",
  "x": 367.9,
  "y": 216.5,
  "anchor": "rb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "Y_0",
  "x": 375.9,
  "y": 447,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "C(Y_0)",
  "x": 132.0,
  "y": 224.5,
  "anchor": "rm",
  "color": "black",
  "size": 16
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
