<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="100" y1="280" x2="620" y2="280" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100" y1="440" x2="100" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="bc-path" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="200" y1="280" x2="200" y2="160" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="200" y1="276" x2="200" y2="284" stroke="black" stroke-width="1"/>

  </svg>

  <div class="katex-label" id="lbl-t"></div>
  <div class="katex-label" id="lbl-bc"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-t0"></div>
  <div class="katex-label" id="lbl-dev"></div>
  <div class="katex-label" id="lbl-precio"></div>
  <div class="katex-label" id="lbl-vol"></div>

</div>

<script>







const AXIS = 280, TROUGH = 370, TOP = 190;
const t0 = 200, tTr = 290, tUp = 520, tEnd = 585;

function ease(a, b, u) { return a + (b - a) * (1 - Math.cos(Math.PI * u)) / 2; }

const pts = [];
for (let x = 100; x <= tEnd; x += 2) {
  let y;
  if (x <= t0) y = AXIS;
  else if (x <= tTr) y = ease(AXIS, TROUGH, (x - t0) / (tTr - t0));
  else if (x <= tUp) y = ease(TROUGH, TOP, (x - tTr) / (tUp - tTr));
  else y = TOP;
  pts.push(x.toFixed(1) + ',' + y.toFixed(1));
}
document.getElementById('bc-path').setAttribute('d', 'M' + pts.join(' L'));

const W = 680, H = 500;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
const labels = [
  {id: 'lbl-t',      tex: 't',                      x: 624, y: 280, a: 'lm', s: '17px'},
  {id: 'lbl-bc',     tex: '\\text{BC}',             x: 92,  y: 50,  a: 'rt', s: '17px'},
  {id: 'lbl-o',      tex: 'O',                      x: 94,  y: 286, a: 'rt'},
  {id: 'lbl-t0',     tex: 't_0',                    x: 200, y: 290, a: 'ct', s: '15px'},
  {id: 'lbl-dev',    tex: '\\text{Devaluación}',    x: 200, y: 155, a: 'cb', c: '#666', s: '15px'},
  {id: 'lbl-precio', tex: '\\text{Efecto precio}',  x: 290, y: 382, a: 'ct', c: '#666', s: '15px'},
  {id: 'lbl-vol',    tex: '\\text{Efecto volumen}', x: 428, y: 212, a: 'rb', c: '#666', s: '15px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
