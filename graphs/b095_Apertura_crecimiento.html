<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 480">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="122" y1="436" x2="557.6" y2="436" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="122" y1="436" x2="122" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="122" y1="196" x2="522.8" y2="196" stroke="#1D9E75" stroke-width="2.2"/>
    <line x1="122" y1="106"  x2="522.8" y2="106"  stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 5"/>


    <line x1="122" y1="316" x2="522.8" y2="316" stroke="#D85A30" stroke-width="2.2"/>


    <line x1="200" y1="186.4" x2="200" y2="115.6" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="330.8" y1="205.6" x2="330.8" y2="306.4" stroke="black" stroke-width="1.2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="444.8" y1="115.6" x2="444.8" y2="306.4" stroke="black" stroke-width="1.2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </svg>

</div>

<script>



const W = 680, H = 480;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
const labels = [
  {id: 'lbl-t',  tex: 'sA\\beta^{\\eta},\\; n + \\delta', x: 134, y: 42.4,  a: 'lm', s: '17px'},
  {id: 'lbl-k',  tex: 'k',   x: 562.4, y: 438.4, a: 'lt', s: '17px'},
  {id: 'lbl-o',  tex: 'O',   x: 114.8, y: 443.2, a: 'rt'},
  {id: 'lbl-s1', tex: 'sA\\beta_1^{\\eta}', x: 532.4, y: 106,  a: 'lm', c: '#0F6E56'},
  {id: 'lbl-s0', tex: 'sA\\beta_0^{\\eta}', x: 532.4, y: 196, a: 'lm', c: '#0F6E56'},
  {id: 'lbl-nd', tex: 'n + \\delta',        x: 532.4, y: 316, a: 'lm', c: '#D85A30'},
  {id: 'lbl-db', tex: '\\Delta\\beta > 0',  x: 209.6, y: 151.6, a: 'lm', c: '#0F6E56', s: '14px'},
  {id: 'lbl-g0', tex: 'g_{k,0}', x: 340.4, y: 256, a: 'lm', s: '15px'},
  {id: 'lbl-g1', tex: 'g_{k,1}', x: 454.4, y: 151.6, a: 'lm', s: '15px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
});
</script>
</body>
</html>
