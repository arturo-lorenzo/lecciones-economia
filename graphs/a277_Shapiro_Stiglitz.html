<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="136" y1="460" x2="573" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="136" y1="460" x2="136" y2="55"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="ls" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <line id="ld" stroke="#378ADD" stroke-width="2.2"/>


    <path id="nsc" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="d-wstar" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-lstar" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-wcp"   stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <g id="u-arrow"></g>


    <g id="ticks"></g>


    <circle id="pt-w" r="4" fill="#999"/>
    <circle id="pt0" r="5" fill="#000"/>
  </svg>

</div>

<script>







const eStar = 1.2, lamD = 1, lamR = 0.8, r = 0.4, N = 10;
const nsc = L => eStar + (eStar/lamD) * ((L/(N - L))*lamR + lamR + r);
const aD = 11, bD = 0.92;
const Ld = L => aD - bD * L;
const wCP = Ld(N);


let lo = 0.5, hi = N - 0.05;
for (let i = 0; i < 80; i++) { const m = (lo+hi)/2; if (nsc(m) < Ld(m)) lo = m; else hi = m; }
const Lstar = (lo + hi) / 2, wStar = nsc(Lstar);


const Lmax = 12, wmax = 11.5, VBH = 570, VBW = 680;
const nscEnd = N - 1.06;
const sx = L => 136 + L * 36;
const sy = w => 460 - w * 36;
const pctX = x => (x / VBW * 100).toFixed(1) + '%';
const pctY = y => (y / VBH * 100).toFixed(1) + '%';

function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}


document.getElementById('ls').setAttribute('d',
  'M' + sx(0.4).toFixed(1) + ',' + sy(eStar).toFixed(1) +
  ' L' + sx(N).toFixed(1) + ',' + sy(eStar).toFixed(1) +
  ' L' + sx(N).toFixed(1) + ',' + sy(11.0).toFixed(1));


setLine('ld', sx(0.35), sy(Ld(0.35)), sx(11.3), sy(Ld(11.3)));


(function() {
  const pts = [];
  const n = 260;
  const L2 = nscEnd;
  for (let i = 0; i <= n; i++) {
    const L = 0.3 + (i/n)*(L2 - 0.3);
    const w = nsc(L);
    if (w > wmax) break;
    pts.push(sx(L).toFixed(1) + ',' + sy(w).toFixed(1));
  }
  document.getElementById('nsc').setAttribute('d', 'M' + pts.join(' L'));
})();


setLine('d-wstar', sx(0), sy(wStar), sx(Lstar), sy(wStar));
setLine('d-lstar', sx(Lstar), sy(wStar), sx(Lstar), sy(0));
setLine('d-wcp',   sx(0), sy(wCP), sx(N), sy(wCP));


const uG = document.getElementById('u-arrow');
const uLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
const uY = 508;
uLine.setAttribute('x1', sx(Lstar) + 6); uLine.setAttribute('y1', uY);
uLine.setAttribute('x2', sx(N) - 6);     uLine.setAttribute('y2', uY);
uLine.setAttribute('stroke', '#555'); uLine.setAttribute('stroke-width', '1.2');
uLine.setAttribute('marker-start', 'url(#arrow)');
uLine.setAttribute('marker-end', 'url(#arrow)');
uG.appendChild(uLine);


const ticksG = document.getElementById('ticks');
function addTick(x1, y1, x2, y2) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1);
  t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
addTick(132, sy(wStar), 136, sy(wStar));
addTick(132, sy(wCP), 136, sy(wCP));
addTick(sx(Lstar), 460, sx(Lstar), 464);
addTick(sx(N), 460, sx(N), 464);


document.getElementById('pt0').setAttribute('cx', sx(Lstar));
document.getElementById('pt0').setAttribute('cy', sy(wStar));
document.getElementById('pt-w').setAttribute('cx', sx(N));
document.getElementById('pt-w').setAttribute('cy', sy(wCP));


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', P = '#534AB7', B = '#378ADD', O = '#D85A30', T = '#555';
put('lbl-w', 'w', 126, 36, {ha: 'r', s: 17});
put('lbl-l', 'L', 587, 468, {s: 17});
put('lbl-o', 'O', 128, 468, {ha: 'r'});
put('lbl-wstar', 'w^{*}', 128, sy(wStar), {ha: 'r', va: 'm'});
put('lbl-wcp', 'w_C', 128, sy(wCP), {ha: 'r', va: 'm'});
put('lbl-lstar', 'L^{*}', sx(Lstar), 468, {ha: 'c'});
put('lbl-n', 'N', sx(N), 468, {ha: 'c'});
put('lbl-nsc', '\\text{NSC}', sx(nscEnd) - 6, sy(nsc(nscEnd)), {ha: 'r', va: 'm', c: G});
put('lbl-ld', 'L^d(w)', sx(11.3) + 6, sy(Ld(11.3)), {va: 'm', c: B});
put('lbl-ls', 'L^s(w)', sx(N) + 8, sy(11.0), {va: 't', c: P});
put('lbl-p0', '0', sx(Lstar) + 17, sy(wStar) - 2, {va: 'm', c: '#000'});
put('lbl-u', '\\text{desempleo involuntario}', (sx(Lstar) + sx(N))/2, uY + 9, {ha: 'c', c: T, s: 15});
</script>
</body>
</html>
