<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  body{margin:0;display:flex;justify-content:center;background:#fff}
  .graph-container{position:relative;width:100%;max-width:680px;margin:0 auto}
  .graph-container svg{width:100%;height:auto;display:block}
  .katex-label{position:absolute;pointer-events:none;white-space:nowrap;line-height:1;font-size:16px}
</style>
</head>
<body>
<div class="graph-container">
<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<polygon points="110.0,165.0 240.1,165.0 240.1,234.4 110.0,234.4" fill="#1D9E75" opacity="0.13" stroke="none"/>
<polygon points="240.1,165.0 312.3,234.4 240.1,234.4" fill="#D85A30" opacity="0.16" stroke="none"/>
<polygon points="240.1,290.0 312.3,234.4 240.1,234.4" fill="#D85A30" opacity="0.16" stroke="none"/>
<line x1="110.0" y1="440.0" x2="110.0" y2="30.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="110.0" y1="440.0" x2="561.0" y2="440.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
<polyline fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linejoin="round" points="110.0,40.0 286.9,210.0 463.9,380.0"/>
<polyline fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linejoin="round" points="110.0,40.0 208.9,230.0 307.7,420.0" stroke-dasharray="7,4"/>
<polyline fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linejoin="round" points="110.0,390.0 292.1,250.0 474.3,110.0"/>
<line x1="110.0" y1="165.0" x2="240.1" y2="165.0" stroke="#000" stroke-width="0.9" stroke-dasharray="4,3"/>
<line x1="110.0" y1="234.4" x2="312.3" y2="234.4" stroke="#000" stroke-width="0.9" stroke-dasharray="4,3"/>
<line x1="240.1" y1="165.0" x2="240.1" y2="440.0" stroke="#000" stroke-width="0.9" stroke-dasharray="4,3"/>
<line x1="312.3" y1="234.4" x2="312.3" y2="440.0" stroke="#000" stroke-width="0.9" stroke-dasharray="4,3"/>
<line x1="237.1" y1="437.0" x2="243.1" y2="443.0" stroke="#000" stroke-width="1.1"/>
<line x1="309.3" y1="437.0" x2="315.3" y2="443.0" stroke="#000" stroke-width="1.1"/>
<circle cx="240.1" cy="165.0" r="5" fill="#000"/>
<circle cx="312.3" cy="234.4" r="5" fill="#000"/>
<circle cx="240.1" cy="290.0" r="3.5" fill="#D85A30"/>
</svg>
</div>
<script>


const W=680, H=480;
const LABELS=[["p", 100.0, 32, "r", null, 17, false], ["X", 564.0, 440, "l", null, 17, false], ["p_M", 104.0, 165, "r", null, 16, false], ["p_C", 104.0, 234.4, "r", null, 16, false], ["X_M", 240.1, 448, "t", null, 16, false], ["0", 247.0, 155, "l", "#000", 16, false], ["1", 323.4, 236, "l", "#000", 16, false], ["X_C", 312.3, 448, "t", null, 16, false], ["D(X)=\\text{Ime}(X)", 468.2, 376, "l", "#534AB7", 16, false], ["\\text{Img}(X)", 314.7, 416, "l", "#534AB7", 16, false], ["\\text{Cmg}(X)", 477.7, 110.0, "l", "#D85A30", 16, false], ["\\mathbf{C}", 139.1, 199.7, "c", "#1D9E75", 18, false], ["\\mathbf{A}", 254.0, 220.4, "c", "#D85A30", 17, false], ["\\mathbf{B}", 254.0, 248.4, "c", "#D85A30", 17, false]];
const cont=document.querySelector('.graph-container');
const T={l:'translate(0,-50%)',r:'translate(-100%,-50%)',t:'translate(-50%,0)',b:'translate(-50%,-100%)',c:'translate(-50%,-50%)'};
LABELS.forEach(([tex,x,y,a,col,fs,bg])=>{
  const d=document.createElement('div'); d.className='katex-label';
  d.style.left=(100*x/W)+'%'; d.style.top=(100*y/H)+'%'; d.style.transform=T[a];
  if(col) d.style.color=col; if(fs) d.style.fontSize=fs+'px';
  katex.render(tex,d,{throwOnError:false,displayMode:false});
  if(bg){d.style.background='#fff'; const k=d.querySelector('.katex'); if(k) k.style.padding='0 2px';}
  cont.appendChild(d);
});
</script>
</body>
</html>
