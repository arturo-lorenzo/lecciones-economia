<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</div>

<script>






const W = 680, H = 580;
const F = 3.6, c = 1, d = 0.4;
const cme1 = x => F / x + c + d * x;
const cme2 = x => cme1(x / 2);
const XE = Math.sqrt(F / d), X1 = Math.sqrt(2 * F / d);

const OX = 124, OY = 430, CMAX = 5.5, QMAX = 9.6, XR = OX + 430;
const sx = q => OX + q * 39.8;
const sy = v => OY - v * 68;

const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
function inv(f, y, lo, hi) { for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if ((f(lo) - y) * (f(m) - y) <= 0) hi = m; else lo = m; } return (lo + hi) / 2; }
function curve(f, q0, q1, color, width, extra) {
  const pts = [];
  for (let i = 0; i <= 500; i++) { const q = q0 + (q1 - q0) * i / 500; pts.push(sx(q).toFixed(1) + ',' + sy(f(q)).toFixed(1)); }
  el('path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round'}, extra || {}));
  return {x: sx(q1), y: sy(f(q1))};
}

el('line', {x1: OX, y1: OY, x2: XR, y2: OY, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
el('line', {x1: OX, y1: OY, x2: OX, y2: 40, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});


[[XE, cme1(XE)], [X1, cme1(X1)]].forEach(([q, v]) => el('line', {x1: sx(q), y1: sy(v), x2: sx(q), y2: OY, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '6 4'}));

const e1 = curve(cme1, inv(cme1, CMAX, 0.1, XE), QMAX, '#1D9E75', 2.2);
const e2 = curve(cme2, inv(cme2, CMAX, 0.1, 2 * XE), QMAX, '#534AB7', 2.2);


function bracket(q0, q1, y) {
  const x0 = sx(q0) + 2, x1 = sx(q1);
  el('path', {d: `M${x0},${y - 6} L${x0},${y} L${x1},${y} L${x1},${y - 6}`, fill: 'none', stroke: 'black', 'stroke-width': 1.1});
}
const B1 = OY + 46, B2 = OY + 96;
bracket(0, XE, B1);
bracket(0, X1, B2);

const box = document.querySelector('.graph-container');
function lbl(tex, x, y, color, anchor, size) {
  const dv = document.createElement('div');
  dv.className = 'katex-label';
  katex.render(tex, dv, {throwOnError: false});
  dv.style.left = (x / W * 100).toFixed(2) + '%';
  dv.style.top = (y / H * 100).toFixed(2) + '%';
  dv.style.color = color || 'black';
  if (size) dv.style.fontSize = size;
  const tx = {l: '0', r: '-100%', c: '-50%'}[anchor[0]], ty = {t: '0', m: '-50%', b: '-100%'}[anchor[1]];
  dv.style.transform = `translate(${tx},${ty})`;
  box.appendChild(dv);
  return dv;
}
lbl('\\text{Cme}', OX - 10, 42, 'black', 'rm');
lbl('x', XR + 4, OY, 'black', 'lm');
lbl('\\text{Cme}_{1}(x)', e1.x + 8, e1.y, '#0F6E56', 'lm');
lbl('\\text{Cme}_{1+2}(x)', e2.x + 8, e2.y, '#534AB7', 'lm');
lbl('x_{\\text{EME}}', sx(XE), OY + 6, 'black', 'ct');
lbl('\\bar{x}', sx(X1), OY + 6, 'black', 'ct');
lbl('\\text{Economías de escala}', (sx(0) + sx(XE)) / 2, B1 + 5, 'black', 'ct', '14px');
lbl('\\text{Subaditividad}', (sx(0) + sx(X1)) / 2, B2 + 5, 'black', 'ct', '14px');
</script>
</body>
</html>
