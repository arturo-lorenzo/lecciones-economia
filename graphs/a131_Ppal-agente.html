<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 450">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>

</div>

<script>






const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 450;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');

const X1 = 10, X2 = 6, p1 = 0.6, p2 = 0.4, ws = 3.5, m = p1 / p2;
const BX = 120, BY = 100, U = 44;
const BW = X1 * U, BH = X2 * U;
const sx = w1 => BX + w1 * U;
const sy = w2 => BY + BH - w2 * U;

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e);
  return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function dash(x1, y1, x2, y2) { line(x1, y1, x2, y2, '#888', 0.8, {'stroke-dasharray': '6 4'}); }
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = null) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%';
  d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color;
  if (size) d.style.fontSize = size;
  container.appendChild(d);
}


el('rect', {x: BX, y: BY, width: BW, height: BH, fill: 'none', stroke: 'black', 'stroke-width': 1.2});
line(BX, BY + BH + 40, BX + 100, BY + BH + 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(BX - 40, BY + BH, BX - 40, BY + BH - 100, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(BX + BW, BY - 40, BX + BW - 100, BY - 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(BX + BW + 40, BY, BX + BW + 40, BY + 100, 'black', 1.2, {'marker-end': 'url(#arrow)'});


line(sx(0), sy(0), sx(X2), sy(X2), '#1D9E75', 1.4, {'stroke-dasharray': '7 4'});
line(sx(X1 - X2), sy(0), sx(X1), sy(X2), '#534AB7', 1.4, {'stroke-dasharray': '7 4'});


const c0 = ws * (1 + m);
line(sx((c0 - X2) / m), sy(X2), sx(c0 / m), sy(0), '#534AB7', 1.4);


const K = Math.pow(ws, 1 / p2);
const ic = w1 => K * Math.pow(w1, -m);
const w1a = Math.pow(K / X2, 1 / m);
const pts = [];
for (let i = 0; i <= 300; i++) {
  const w1 = w1a + (i / 300) * (X1 - w1a);
  pts.push(sx(w1).toFixed(1) + ',' + sy(ic(w1)).toFixed(1));
}
el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: '#1D9E75', 'stroke-width': 2.2, 'stroke-linecap': 'round'});


const E0 = [sx(ws), sy(ws)];
dash(E0[0], E0[1], E0[0], BY + BH);
dash(E0[0], E0[1], BX, E0[1]);
el('circle', {cx: E0[0], cy: E0[1], r: 5, fill: '#000'});


lab('O_A', BX - 6, BY + BH + 6, 'black', 1, 0, '17px');
lab('O_P', BX + BW + 6, BY - 6, 'black', 0, 1, '17px');
lab('x_1', BX + BW, BY + BH + 6, 'black', 0.5, 0);
lab('x_2', BX - 8, BY, 'black', 1, 0.5);
lab('w_1', BX + 50, BY + BH + 46, 'black', 0.5, 0);
lab('w_2', BX - 46, BY + BH - 50, 'black', 1, 0.5);
lab('x_1 - w_1', BX + BW - 50, BY - 46, 'black', 0.5, 1);
lab('x_2 - w_2', BX + BW + 46, BY + 50, 'black', 0, 0.5);
lab('w^*', E0[0], BY + BH + 6, 'black', 0.5, 0);
lab('w^*', BX - 6, E0[1], 'black', 1, 0.5);
lab('0', E0[0] + 18, E0[1] + 1, '#000', 0, 0.5);
lab('\\underline{u}', sx(X1) - 8, sy(ic(X1)) - 10, '#0F6E56', 1, 1);
lab('\\pi^e_0', sx(c0 / m) + 8, sy(0) - 6, '#534AB7', 0, 1);
lab('\\text{L.C.}_A', sx(X2) + 8, sy(X2) + 6, '#0F6E56', 0, 0);
lab('\\text{L.C.}_P', sx(X1 - 2) - 8, sy(X2 - 2) - 4, '#534AB7', 1, 1);
</script>
</body>
</html>
