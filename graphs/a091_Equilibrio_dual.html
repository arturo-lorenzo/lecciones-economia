<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>



    <line x1="124" y1="185" x2="361.6" y2="460" stroke="#378ADD" stroke-width="1.4" opacity="0.55"/>

    <line x1="124" y1="130" x2="409.1" y2="460" stroke="#378ADD" stroke-width="2.2"/>

    <line x1="124" y1="75" x2="456.6" y2="460" stroke="#378ADD" stroke-width="1.4" opacity="0.55"/>


    <path id="ic-u0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="409.1" y1="295" x2="360.7" y2="336.8" stroke="#888" stroke-width="0.8"
          stroke-dasharray="6 4" marker-end="url(#arrow)"/>


    <line x1="266.6" y1="295" x2="266.6" y2="460" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="266.6" y1="295" x2="124" y2="295" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line x1="120" y1="295" x2="124" y2="295" stroke="black" stroke-width="1"/>
    <line x1="266.6" y1="460" x2="266.6" y2="464" stroke="black" stroke-width="1"/>


    <circle cx="266.6" cy="295" r="5" fill="#000"/>

  </svg>


  <div class="katex-label" id="lbl-x1"></div>
  <div class="katex-label" id="lbl-x2"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-u0"></div>
  <div class="katex-label" id="lbl-g1"></div>
  <div class="katex-label" id="lbl-g2"></div>
  <div class="katex-label" id="lbl-g3"></div>
  <div class="katex-label" id="lbl-pt0"></div>
  <div class="katex-label" id="lbl-x1h"></div>
  <div class="katex-label" id="lbl-x2h"></div>
  <div class="katex-label" id="lbl-gasto"></div>

</div>

<script>





function toSvgX(x) { return 124 + x * 47.52; }
function toSvgY(y) { return 460 - y * 55; }


const pts = [];
for (let i = 0; i <= 200; i++) {
  const x1 = 1.2 + (i / 200) * 7.8;
  const x2 = 9 / x1;
  const sx = toSvgX(x1);
  const sy = toSvgY(x2);
  if (sx >= 129 && sx <= 551 && sy >= 75 && sy <= 455) {
    pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
}
document.getElementById('ic-u0').setAttribute('d', 'M' + pts.join(' L'));


const labels = [
  {id: 'lbl-x1',    tex: 'x_1',                    left: '82.4%', top: '91%', color: 'black'},
  {id: 'lbl-x2',    tex: 'x_2',                    left: '14.2%', top: '7%',  color: 'black'},
  {id: 'lbl-o',     tex: 'O',                       left: '15.9%', top: '92%', color: 'black'},
  {id: 'lbl-u0',    tex: 'u_0',                    left: '80.7%', top: '76%', color: '#0F6E56'},
  {id: 'lbl-g1',    tex: '\\dfrac{G_1}{p_1}',       left: '53.2%', top: '92.4%', color: '#185FA5', center: true},
  {id: 'lbl-g2',    tex: '\\dfrac{G^*}{p_1}',       left: '60.2%', top: '92.4%', color: '#185FA5', center: true},
  {id: 'lbl-g3',    tex: '\\dfrac{G_2}{p_1}',       left: '67.1%', top: '92.4%', color: '#185FA5', center: true},
  {id: 'lbl-pt0',   tex: '0',                       left: '40.1%', top: '54%', color: '#000'},
  {id: 'lbl-x1h',   tex: 'x_1^h',                  left: '39.2%', top: '92.4%', color: 'black', center: true},
  {id: 'lbl-x2h',   tex: 'x_2^h',                  left: '16.9%', top: '57%', color: 'black', align: 'right'},
  {id: 'lbl-gasto', tex: '\\text{Menor gasto}',    left: '60.4%', top: '53.8%', color: '#888'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
  if (l.center) { el.style.transform = 'translateX(-50%)'; el.style.fontSize = '13px'; }
});
</script>
<script>(function(){var N={"lbl-u0": [-0.15, -0.59, 0]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
