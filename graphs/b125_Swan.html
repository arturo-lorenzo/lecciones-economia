<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">



  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="ei" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <path id="ee" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="p0" r="5" fill="#000"/>
  </svg>

</div>

<script>


const W = 680, H = 500;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
const X = A => 124 + 43.2 * A, Y = e => 460 - 100 * e;

const m = 0.45, b = 1, A0 = 5, e0 = 2;
const eEI = A => e0 - (1 - m) / b * (A - A0);
const eEE = A => e0 + m / b * (A - A0);
function draw(id, f, a1, a2) {
  let d = '';
  for (let i = 0; i <= 60; i++) {
    const A = a1 + (a2 - a1) * i / 60;
    d += (i ? 'L' : 'M') + X(A).toFixed(1) + ' ' + Y(f(A)).toFixed(1);
  }
  document.getElementById(id).setAttribute('d', d);
}
const EI = [1.6, 8.2], EE = [1.0, 9.2];
draw('ei', eEI, EI[0], EI[1]);
draw('ee', eEE, EE[0], EE[1]);
const p0 = document.getElementById('p0');
p0.setAttribute('cx', X(A0)); p0.setAttribute('cy', Y(e0));

const labels = [
  {id: 'lbl-a',  tex: 'A', x: 560, y: 462, a: 'lt', s: '17px'},
  {id: 'lbl-e',  tex: 'e', x: 116, y: 50,  a: 'rt', s: '17px'},
  {id: 'lbl-o',  tex: 'O', x: 118, y: 466, a: 'rt'},
  {id: 'lbl-ei', tex: '\\text{EI}', x: X(EI[1]) + 6, y: Y(eEI(EI[1])) + 2, a: 'lm', c: '#185FA5'},
  {id: 'lbl-ee', tex: '\\text{EE}', x: X(EE[1]) + 6, y: Y(eEE(EE[1])) - 2, a: 'lm', c: '#0F6E56'},
  {id: 'lbl-0',  tex: '0', x: X(A0), y: Y(e0) - 10, a: 'cb', c: '#000', s: '15px'},
  {id: 'lbl-z1', tex: '\\text{I: inflación y déficit}',      x: X(8.0), y: Y(1.95), a: 'cm', s: '14px'},
  {id: 'lbl-z2', tex: '\\text{II: inflación y superávit}',   x: X(5.0), y: Y(3.45), a: 'cm', s: '14px'},
  {id: 'lbl-z3', tex: '\\text{III: desempleo}', x: X(2.15), y: Y(2.12), a: 'cm', s: '14px'},
  {id: 'lbl-z3b', tex: '\\text{y superávit}',  x: X(2.15), y: Y(1.88), a: 'cm', s: '14px'},
  {id: 'lbl-z4', tex: '\\text{IV: desempleo y déficit}',     x: X(5.0), y: Y(0.55), a: 'cm', s: '14px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
