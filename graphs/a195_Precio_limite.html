<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 540">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>

</div>

<script>





const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 540;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');

const A = 17, c = 3, F = 6, d = 0.03, CI = 6;
const cme = x => c + F / x + d * x * x;
const dcme = x => -F / (x * x) + 2 * d * x;
function root(f, a, b) { for (let i = 0; i < 80; i++) { const m = (a + b) / 2; if (f(a) * f(m) <= 0) b = m; else a = m; } return (a + b) / 2; }
const xT = root(x => dcme(x) + 1, 0.5, 4);
const pL = cme(xT) + xT;
const xIL = A - pL;
const xEME = Math.cbrt(F / (2 * d));
const pC = cme(xEME);
const pM = (A + CI) / 2;
const p1 = 9.5;

const OX = 112, OY = 470, SX = 27.6, SY = 24;
const sx = x => OX + x * SX;
const sy = p => OY - p * SY;

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e);
  return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function curve(f, x0, x1, stroke, w, extra = {}) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const x = x0 + (x1 - x0) * i / 300; pts.push(sx(x).toFixed(1) + ',' + sy(f(x)).toFixed(1)); }
  return el('path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': 'round'}, extra));
}
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = null, bg = false) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%';
  d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color;
  if (size) d.style.fontSize = size;
  if (bg) { d.style.background = '#fff'; d.style.padding = '0 2px'; }
  container.appendChild(d);
}
const dash = {'stroke-dasharray': '5 3'};


line(OX, OY, OX + 480, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(OX, OY, OX, 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});


line(OX, sy(pL), sx(xIL), sy(pL), '#888', 0.8, dash);
line(sx(xIL), sy(pL), sx(xIL), OY, '#888', 0.8, dash);
line(OX, sy(pC), sx(xEME), sy(pC), '#888', 0.8, dash);
line(sx(xEME), sy(pC), sx(xEME), OY, '#888', 0.8, dash);
[sy(pM), sy(p1), sy(pL), sy(pC)].forEach(y => line(OX - 4, y, OX, y, 'black', 1));
[sx(xEME), sx(xIL)].forEach(x => line(x, OY, x, OY + 4, 'black', 1));


const xR1 = 5.3, xR = 6.0;
curve(x => p1 - x, 0, xR1, '#B4B2A9', 2.2, dash);
curve(x => A - x, 0, 15.5, '#534AB7', 2.2);
curve(x => pL - x, 0, xR, '#534AB7', 2.2, {'stroke-dasharray': '8 5'});
curve(cme, 0.75, 5.4, '#1D9E75', 2.2);


el('circle', {cx: sx(xT), cy: sy(cme(xT)), r: 5, fill: '#000'});
el('circle', {cx: sx(xIL), cy: sy(pL), r: 4.5, fill: '#D85A30'});


lab('p', OX - 8, 40, 'black', 1, 0.5, '17px');
lab('X,\\ x_E', OX + 486, OY, 'black', 0, 0.5, '17px');
lab('p_M', OX - 9, sy(pM), 'black', 1, 0.5);
lab('p_1', OX - 9, sy(p1), 'black', 1, 0.5);
lab('p_L', OX - 9, sy(pL), 'black', 1, 0.5);
lab('p_C', OX - 9, sy(pC), 'black', 1, 0.5);
lab('x_{\\text{EME}}', sx(xEME), OY + 8, 'black', 0.5, 0);
lab('x_I^L', sx(xIL), OY + 8, 'black', 0.5, 0);
lab('D(X)', sx(15.5) + 6, sy(A - 15.5), '#534AB7', 0, 0.5);
lab('D_R(x_E)', sx(xR) + 6, sy(pL - xR), '#534AB7', 0, 0.5);
lab("D_R'(x_E)", sx(xR1) + 6, sy(p1 - xR1), '#888', 0, 0.5);
lab('\\text{Cme}_E(x_E)', sx(0.75) + 8, sy(cme(0.75)), '#0F6E56', 0, 0.5);
lab('0', sx(xT) + 3, sy(cme(xT)) - 7, '#000', 0.5, 1);
lab('L', sx(xIL) + 7, sy(pL) - 6, '#D85A30', 0, 1);
</script>
</body>
</html>
