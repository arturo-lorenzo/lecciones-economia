<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr-up" viewBox="0 0 10 10" refX="5" refY="1"
              markerWidth="7" markerHeight="7" orient="0">
        <path d="M1 8L5 1L9 8" fill="none" stroke="black"
              stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>







    <line x1="375" y1="65" x2="210" y2="165" stroke="black" stroke-width="1.8"/>

    <line x1="405" y1="65" x2="570" y2="165" stroke="black" stroke-width="1.8"/>








    <line x1="196" y1="193" x2="120" y2="295" stroke="black" stroke-width="1.8"/>

    <line x1="224" y1="193" x2="300" y2="295" stroke="black" stroke-width="1.8"/>


    <line x1="556" y1="193" x2="480" y2="295" stroke="black" stroke-width="1.8"/>

    <line x1="584" y1="193" x2="700" y2="295" stroke="black" stroke-width="1.8"/>







    <line x1="107" y1="323" x2="55" y2="400" stroke="black" stroke-width="1.8"/>

    <line x1="133" y1="323" x2="185" y2="400" stroke="black" stroke-width="1.8"/>




    <line x1="467" y1="323" x2="415" y2="400" stroke="black" stroke-width="1.8"/>

    <line x1="493" y1="323" x2="545" y2="400" stroke="black" stroke-width="1.8"/>











    <line x1="405" y1="65"  x2="570" y2="165" stroke="#D85A30" stroke-width="2.52"/>
    <line x1="196" y1="193" x2="120" y2="295" stroke="#D85A30" stroke-width="2.52"/>
    <line x1="584" y1="193" x2="700" y2="295" stroke="#D85A30" stroke-width="2.52"/>
    <line x1="133" y1="323" x2="185" y2="400" stroke="#D85A30" stroke-width="2.52"/>
    <line x1="467" y1="323" x2="415" y2="400" stroke="#D85A30" stroke-width="2.52"/>


    <circle cx="390" cy="50" r="18" fill="#fff" stroke="black" stroke-width="2"/>
    <circle cx="210" cy="180" r="18" fill="#fff" stroke="black" stroke-width="2"/>
    <circle cx="570" cy="180" r="18" fill="#fff" stroke="black" stroke-width="2"/>
    <circle cx="120" cy="310" r="18" fill="#fff" stroke="black" stroke-width="2"/>
    <circle cx="480" cy="310" r="18" fill="#fff" stroke="black" stroke-width="2"/>
  </svg>



  <div class="katex-label" id="lbl-I0"></div>
  <div class="katex-label" id="lbl-E-L"></div>
  <div class="katex-label" id="lbl-E-R"></div>
  <div class="katex-label" id="lbl-I-LL"></div>
  <div class="katex-label" id="lbl-I-RL"></div>


  <div class="katex-label" id="lbl-PAS"></div>
  <div class="katex-label" id="lbl-ACT"></div>
  <div class="katex-label" id="lbl-ENTR-L"></div>
  <div class="katex-label" id="lbl-NOENTR-L"></div>
  <div class="katex-label" id="lbl-ENTR-R"></div>
  <div class="katex-label" id="lbl-NOENTR-R"></div>
  <div class="katex-label" id="lbl-LUCH-L"></div>
  <div class="katex-label" id="lbl-ACOM-L"></div>
  <div class="katex-label" id="lbl-LUC-R"></div>
  <div class="katex-label" id="lbl-ACOM-R"></div>


  <div class="katex-label" id="lbl-pay1"></div>
  <div class="katex-label" id="lbl-pay2"></div>
  <div class="katex-label" id="lbl-pay3"></div>
  <div class="katex-label" id="lbl-pay4"></div>
  <div class="katex-label" id="lbl-pay5"></div>
  <div class="katex-label" id="lbl-pay6"></div>
  <div class="katex-label" id="lbl-conv"></div>
  <div class="katex-label" id="lbl-sup"></div>

</div>

<script>
const W = 780, H = 520;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const labels = [

  {id:'lbl-I0',      tex:'J_I',              left: pct(390,W), top: pct(50,H), color:'black', size:'15px', node:true},
  {id:'lbl-E-L',     tex:'J_E',              left: pct(210,W), top: pct(180,H), color:'black', size:'15px', node:true},
  {id:'lbl-E-R',     tex:'J_E',              left: pct(570,W), top: pct(180,H), color:'black', size:'15px', node:true},
  {id:'lbl-I-LL',    tex:'J_I',              left: pct(120,W), top: pct(310,H), color:'black', size:'15px', node:true},
  {id:'lbl-I-RL',    tex:'J_I',              left: pct(480,W), top: pct(310,H), color:'black', size:'15px', node:true},


  {id:'lbl-PAS',     tex:'\\text{PAS}',    left: pct(238,W),  top: pct(74,H),   color:'black', size:'16px'},
  {id:'lbl-ACT',     tex:'\\text{ACT}',    left: pct(492,W),  top: pct(74,H),   color:'#D85A30', size:'16px'},
  {id:'lbl-ENTR-L',  tex:'\\text{E}',   left: pct(140,W),   top: pct(212,H),  color:'#D85A30', size:'16px'},
  {id:'lbl-NOENTR-L',tex:'\\text{NE}',left: pct(268,W),  top: pct(212,H),  color:'black', size:'16px'},
  {id:'lbl-ENTR-R',  tex:'\\text{E}',   left: pct(495,W),  top: pct(208,H),  color:'black', size:'16px'},
  {id:'lbl-NOENTR-R',tex:'\\text{NE}',left: pct(652,W),  top: pct(212,H),  color:'#D85A30', size:'16px'},
  {id:'lbl-LUCH-L',  tex:'\\text{L}',  left: pct(62,W),    top: pct(318,H),  color:'black', size:'15px'},
  {id:'lbl-ACOM-L',  tex:'\\text{A}',   left: pct(168,W),  top: pct(318,H),  color:'#D85A30', size:'16px'},
  {id:'lbl-LUC-R',   tex:'\\text{L}',  left: pct(422,W),  top: pct(318,H),  color:'#D85A30', size:'15px'},
  {id:'lbl-ACOM-R',  tex:'\\text{A}',   left: pct(528,W),  top: pct(318,H),  color:'black', size:'16px'},


  {id:'lbl-pay1',    tex:'\\pi^L, \\pi^L',                left: pct(25,W),   top: pct(410,H),  color:'black', size:'16px'},
  {id:'lbl-pay2',    tex:'\\pi^D, \\pi^D',                left: pct(158,W),  top: pct(410,H),  color:'black', size:'16px'},
  {id:'lbl-pay3',    tex:'0, \\pi^M',                     left: pct(278,W),  top: pct(305,H),  color:'black', size:'16px'},
  {id:'lbl-pay4',    tex:'\\pi^L, \\pi^L',                left: pct(385,W),  top: pct(410,H),  color:'black', size:'16px'},
  {id:'lbl-pay5',    tex:'\\pi^D, \\pi^D\\!-\\!C_0',      left: pct(510,W),  top: pct(410,H),  color:'black', size:'16px'},
  {id:'lbl-pay6',    tex:'0, \\pi^M\\!-\\!C_0',           left: pct(665,W),  top: pct(305,H),  color:'black', size:'16px'},
  {id:'lbl-conv',    tex:'(\\pi_E,\\, \\pi_I)', left: pct(20,W), top: pct(20,H), color:'#888', size:'16px'},
  {id:'lbl-sup',     tex:'\\text{Si } \\pi^D > \\pi^L > \\pi^D - C_0\\text{, } \\pi^L < 0 \\text{ y } \\pi^M - C_0 > \\pi^D\\text{, senda del ENPS: ACT} \\to \\text{NE}', left: pct(390,W), top: pct(470,H), color:'#D85A30', size:'15px', center:true}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.size) e.style.fontSize = l.size;
  if (l.center) e.style.transform = 'translateX(-50%)';
  if (l.node) { e.style.transform = 'translate(-50%,-50%)'; e.style.lineHeight = '1'; }
});
</script>
</body>
</html>
