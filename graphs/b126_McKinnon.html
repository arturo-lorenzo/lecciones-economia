<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">



  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="g0"  stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="g1"  stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="g0p" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="ms0"  stroke="#534AB7" stroke-width="2.2"/>
    <line id="ms0p" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="8 5"/>
    <line id="ms1"  stroke="#534AB7" stroke-width="2.2" stroke-dasharray="3 4"/>


    <path id="md" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round"/>


    <line id="aCI" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="aR"  stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>


    <g id="ticks"></g>


    <circle id="p0"  r="5" fill="#000"/>
    <circle id="p0p" r="5" fill="#000"/>
    <circle id="p1"  r="5" fill="#000"/>
  </svg>

</div>

<script>


const W = 680, H = 500;
const X = M => 124 + 38.88 * M, Y = r => 460 - 38 * r;
const rMd = M => 0.6 + 24 / (M + 0.8);
const M0 = 4.0, M0p = 7.5, M1 = 5.2;
const r0 = rMd(M0), r0p = rMd(M0p), r1 = rMd(M1);

function seg(id, x1, y1, x2, y2) { const e = document.getElementById(id);
  e.setAttribute('x1', x1.toFixed(1)); e.setAttribute('y1', y1.toFixed(1));
  e.setAttribute('x2', x2.toFixed(1)); e.setAttribute('y2', y2.toFixed(1)); }
function pt(id, x, y) { const e = document.getElementById(id); e.setAttribute('cx', x.toFixed(1)); e.setAttribute('cy', y.toFixed(1)); }


let d = '';
for (let M = 2.0; M <= 10.4001; M += 0.05) d += (d ? ' L' : 'M') + X(M).toFixed(1) + ' ' + Y(rMd(M)).toFixed(1);
document.getElementById('md').setAttribute('d', d);


const top0 = 140, top1 = 215;
seg('ms0',  X(M0),  460, X(M0),  top0);
seg('ms0p', X(M0p), 460, X(M0p), top0);
seg('ms1',  X(M1),  460, X(M1),  top1);


const yCI = 170, yR = 240;
seg('aCI', X(M0) + 6,  yCI, X(M0p) - 6, yCI);
seg('aR',  X(M0p) - 6, yR,  X(M1) + 6,  yR);


seg('g0',  124, Y(r0),  X(M0),  Y(r0));
seg('g1',  124, Y(r1),  X(M1),  Y(r1));
seg('g0p', 124, Y(r0p), X(M0p), Y(r0p));


pt('p0',  X(M0),  Y(r0));
pt('p0p', X(M0p), Y(r0p));
pt('p1',  X(M1),  Y(r1));


const tg = document.getElementById('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
[r0, r1, r0p].forEach(r => tick(120, Y(r), 124, Y(r)));

const labels = [
  {id: 'lbl-m',   tex: 'M', x: 560, y: 462, a: 'lt', s: '17px'},
  {id: 'lbl-r',   tex: 'r', x: 116, y: 50,  a: 'rt', s: '17px'},
  {id: 'lbl-o',   tex: 'O', x: 118, y: 466, a: 'rt'},
  {id: 'lbl-md',  tex: 'M^d = \\omega_M(r, r^*)\\,W', x: X(2.0) - 12, y: Y(rMd(2.0)) - 9, a: 'lb', c: '#185FA5'},
  {id: 'lbl-ms0',  tex: 'M^s_0',    x: X(M0),  y: top0 - 5, a: 'cb', c: '#534AB7'},
  {id: 'lbl-ms0p', tex: "M^s_{0'}", x: X(M0p), y: top0 - 5, a: 'cb', c: '#534AB7'},
  {id: 'lbl-ms1',  tex: 'M^s_1',    x: X(M1),  y: top1 - 5, a: 'cb', c: '#534AB7'},
  {id: 'lbl-aci', tex: '\\Delta \\text{CI} > 0', x: (X(M0) + X(M0p)) / 2, y: yCI - 6, a: 'cb', c: '#534AB7', s: '14px'},
  {id: 'lbl-ar',  tex: '\\Delta R < 0', x: (X(M1) + X(M0p)) / 2, y: yR - 6, a: 'cb', c: '#534AB7', s: '14px'},
  {id: 'lbl-p0',  tex: '0',  x: X(M0) + 8,  y: Y(r0) - 7,  a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-p1',  tex: '1',  x: X(M1) + 8,  y: Y(r1) - 7,  a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-p0p', tex: "0'", x: X(M0p) + 8, y: Y(r0p) - 7, a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-M0',  tex: 'M_0',    x: X(M0),  y: 467, a: 'ct', s: '15px'},
  {id: 'lbl-M1',  tex: 'M_1',    x: X(M1),  y: 467, a: 'ct', s: '15px'},
  {id: 'lbl-M0p', tex: "M_{0'}", x: X(M0p), y: 467, a: 'ct', s: '15px'},
  {id: 'lbl-r0',  tex: 'r_0',    x: 116, y: Y(r0),  a: 'rm', s: '15px'},
  {id: 'lbl-r1',  tex: 'r_1',    x: 116, y: Y(r1),  a: 'rm', s: '15px'},
  {id: 'lbl-r0p', tex: "r_{0'}", x: 116, y: Y(r0p), a: 'rm', s: '15px'}
];
const cont = document.querySelector('.graph-container');
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
labels.forEach(l => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e);
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
});
</script>
</body>
</html>
