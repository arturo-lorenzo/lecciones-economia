<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="128" y1="460" x2="582" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="128" y1="460" x2="128" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="d-wm" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-lm" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-w1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-l0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="ns" stroke="#444" stroke-width="2.2"/>

    <line id="ci0" stroke="#1D9E75" stroke-width="2.2"/>

    <line id="ld" stroke="#378ADD" stroke-width="2.2"/>

    <line id="pizero" stroke="#534AB7" stroke-width="1.4"/>
    <path id="iso0" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linecap="round"/>
    <path id="iso1" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linecap="round"/>

    <path id="ci1" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>

    <path id="cc" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round"/>

    <g id="ticks"></g>
    <circle id="pt0" r="5" fill="#000"/>
    <circle id="ptm" r="5" fill="#000"/>
    <circle id="pt1" r="5" fill="#000"/>
  </svg>
</div>

<script>










const a = 8, b = 0.5, wbar = 3, Ns = 12.5;
const CC = w => (a - w + (w*w*w/(wbar*wbar) - w)/2) / b;
const LCP = CC(wbar);
let lo = wbar, hi = 6;
for (let i = 0; i < 60; i++) { const m = (lo+hi)/2; if (CC(m) < Ns) lo = m; else hi = m; }
const wN = (lo+hi)/2;
const L1 = Ns, w1 = a - (b/2)*Ns;
const wm = 4, Lm = CC(wm);
const pi0 = LCP*(a - (b/2)*LCP - wbar);
const pim = Lm*(a - (b/2)*Lm - wm);
const cm  = Lm*(1/(wbar*wbar) - 1/(wm*wm))/2;
const iso = (L, p) => a - (b/2)*L - p/L;
const ic  = L => 1/Math.sqrt(1/(wbar*wbar) - 2*cm/Math.min(L, Ns));


const VBW = 680, VBH = 520;
const sx = L => 128 + L*24.84;
const sy = w => 460 - w*68;
const $ = id => document.getElementById(id);
function setL(id, x1, y1, x2, y2) { const e = $(id); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); }
function path(id, f, L1_, L2_, n = 240) {
  const p = [];
  for (let i = 0; i <= n; i++) { const L = L1_ + (i/n)*(L2_ - L1_); p.push(sx(L).toFixed(1) + ',' + sy(f(L)).toFixed(1)); }
  $(id).setAttribute('d', 'M' + p.join(' L'));
}

const wTop = 5.95;
setL('ld', sx((a - wTop)/b), sy(wTop), sx(15), sy(a - b*15));
setL('pizero', sx(8.6), sy(a - (b/2)*8.6), sx(15.2), sy(a - (b/2)*15.2));
setL('ci0', sx(0), sy(wbar), sx(17.2), sy(wbar));
path('iso0', L => iso(L, pi0), 5.2, 15.6);
path('iso1', L => iso(L, pim), 3.6, 16.2);
const icTop = 2*cm/(1/(wbar*wbar) - 1/(wTop*wTop));
path('ci1', ic, icTop, 17.2);
(function () {
  const p = [];
  for (let i = 0; i <= 160; i++) { const w = wbar + (i/160)*(wN - wbar); p.push(sx(CC(w)).toFixed(1) + ',' + sy(w).toFixed(1)); }
  p.push(sx(Ns).toFixed(1) + ',' + sy(w1).toFixed(1));
  $('cc').setAttribute('d', 'M' + p.join(' L'));
})();

setL('d-wm', sx(0), sy(wm), sx(Lm), sy(wm));
setL('d-lm', sx(Lm), sy(wm), sx(Lm), sy(0));
setL('d-w1', sx(0), sy(w1), sx(L1), sy(w1));
setL('ns', sx(Ns), sy(0), sx(Ns), sy(wTop));
setL('d-l0', sx(LCP), sy(wbar), sx(LCP), sy(0));

const tg = $('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line'); t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2); t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
[wbar, wm, w1].forEach(w => tick(124, sy(w), 128, sy(w)));
[LCP, Lm, L1].forEach(L => tick(sx(L), 460, sx(L), 464));

function pt(id, L, w) { $(id).setAttribute('cx', sx(L)); $(id).setAttribute('cy', sy(w)); }
pt('pt0', LCP, wbar); pt('ptm', Lm, wm); pt('pt1', L1, w1);


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', B = '#378ADD', P = '#534AB7', O = '#D85A30', T = '#888';

put('lbl-w', 'w', 118, 36, {ha: 'r', s: 17});
put('lbl-l', 'L', 586, 468, {s: 17});
put('lbl-o', 'O', 120, 468, {ha: 'r', s: 16});

put('lbl-wbar', '\\underline{w}', 120, sy(wbar), {ha: 'r', va: 'm'});
put('lbl-wm', 'w^{*}', 120, sy(wm), {ha: 'r', va: 'm'});
put('lbl-w1', 'w_1', 120, sy(w1), {ha: 'r', va: 'm'});
put('lbl-lcp', 'L_C', sx(LCP), 468, {ha: 'c'});
put('lbl-lm', 'L^{*}', sx(Lm) + 2, 468, {ha: 'c'});
put('lbl-l1', 'L_1', sx(L1), 468, {ha: 'c'});
put('lbl-ns', 'N^s', sx(Ns), sy(wTop) - 3, {ha: 'c', va: 'b', c: '#444'});

put('lbl-ld', 'L^d(w)', sx(15) + 6, sy(a - b*15), {va: 'm', c: B});
put('lbl-pizero', '\\pi = 0', sx(15.2) + 6, sy(a - (b/2)*15.2), {va: 'm', c: P});
put('lbl-pi0', '\\pi_0', sx(5.2) - 5, sy(iso(5.2, pi0)), {ha: 'r', va: 'm', c: P});
put('lbl-pi1', '\\pi_1', sx(3.6) - 5, sy(iso(3.6, pim)), {ha: 'r', va: 'm', c: P});
put('lbl-ci0', '\\text{CI}_0', sx(17.2) + 6, sy(wbar), {va: 'm', c: G});
put('lbl-ci1', '\\text{CI}_1', sx(icTop) + 9, sy(wTop), {va: 't', c: G});
put('lbl-cc', '\\text{CC}', sx(CC(3.62)) - 7, sy(3.62), {ha: 'r', va: 'm', c: O});

put('lbl-p0', '0', sx(LCP) + 9, sy(wbar) - 4, {va: 'b', c: '#000'});
put('lbl-g0', '(\\gamma = 0)', sx(LCP) - 6, sy(2.72), {ha: 'r', c: T, s: 14});
put('lbl-p1', '1', sx(L1) + 4, sy(w1) - 8, {va: 'b', c: '#000'});
put('lbl-g1', '(\\gamma = 1)', sx(L1) + 18, sy(w1) - 8, {va: 'b', c: T, s: 14});
put('lbl-gm', '(\\gamma \\in (0,1))', 482, 204, {va: 't', c: T, s: 13});
</script>
</body>
</html>
