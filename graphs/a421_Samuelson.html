<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="92" y1="480" x2="576" y2="480" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="92" y1="480" x2="92" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="92" y1="140" x2="528" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>


    <line x1="250" y1="480" x2="250" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="6 4"/>


    <path id="curve-inv" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <path id="curve-hump" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="250" y1="480" x2="250" y2="484" stroke="black" stroke-width="1"/>

    <line x1="88" y1="140" x2="92" y2="140" stroke="black" stroke-width="1"/>
  </svg>

</div>

<script>
const OX=92, OY=480;

function toSvgX(v){return OX+v*158;}
function toSvgY(c){return OY-c*340;}


function genCurve(fn, vMin, vMax, id){
  const pts=[];
  for(let i=0;i<=400;i++){
    const v=vMin+(i/400)*(vMax-vMin);
    const c=fn(v);
    const sx=toSvgX(v), sy=toSvgY(c);
    if(sy>=45&&sy<=OY+5&&sx>=OX&&sx<=OX+3.0*158) pts.push(sx.toFixed(1)+','+sy.toFixed(1));
  }
  document.getElementById(id).setAttribute('d','M'+pts.join(' L'));
}

genCurve(v=>1/v, 1.0, 2.7, 'curve-inv');
genCurve(v=>4*v/Math.pow(1+v,2), 0.02, 2.7, 'curve-hump');






const VBW=680, VBH=560;


function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const Bl = '#378ADD';
put('lbl-c', 'c', 84, 44, {ha: 'r', s: 18});
put('lbl-v', 'v', 584, 480, {va: 'm', s: 18});
put('lbl-1c', '1', 84, 140, {ha: 'r', va: 'm', s: 15});
put('lbl-1v', '1', 250, 488, {ha: 'c', s: 15});
put('lbl-hump', 'c = \\dfrac{4v}{(1+v)^2}', toSvgX(2.7) + 6, toSvgY(4*2.7/Math.pow(3.7, 2)), {va: 'm', c: Bl, s: 15});
put('lbl-inv', 'c = \\dfrac{1}{v}\\;\\;(\\text{C})', toSvgX(2.7) + 6, toSvgY(1/2.7), {va: 'm', c: Bl, s: 15});
put('lbl-A', '\\text{A}', toSvgX(0.2), toSvgY(0.8), {ha: 'c', va: 'm', s: 17});
put('lbl-B', '\\text{B}', toSvgX(2.4), toSvgY(0.905), {ha: 'c', va: 'm', s: 17});
put('lbl-E', '\\text{E}', toSvgX(2.2), toSvgY(0.66), {ha: 'c', va: 'm', s: 17});
put('lbl-D1', '\\text{D}', toSvgX(0.62), toSvgY(0.45), {ha: 'c', va: 'm', s: 17});
put('lbl-D2', '\\text{D}', toSvgX(1.6), toSvgY(0.3), {ha: 'c', va: 'm', s: 17});
</script>
</body>
</html>
