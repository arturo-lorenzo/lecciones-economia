<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="105" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="105" y1="460" x2="105" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <g id="rays"></g>


    <path id="con-b"  fill="none" stroke="#534AB7" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="con-a"  fill="none" stroke="#1D9E75" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="con-a1" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="8 5"/>
    <path id="con-a2" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 4"/>



    <circle id="e0" r="5" fill="#000"/>
    <circle id="e1" r="5" fill="#000"/>
    <circle id="e2" r="5" fill="#000"/>
  </svg>

</div>

<script>










const W = 680, H = 500;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
const sx = X => 105 + X * 36.5, sy = Y => 460 - Y * 40;
const b = 3.057, g = 0.4;
const conB = X => b * Math.pow(X, g);
const cs = [0.20, 0.12, 0.075];

function genCurve(fn, id, x0, x1) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const X = x0 + (i / 300) * (x1 - x0);
    pts.push(sx(X).toFixed(1) + ',' + sy(fn(X)).toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(conB, 'con-b', 0, 12);

const yEnd = 8.6;
['con-a', 'con-a1', 'con-a2'].forEach((id, i) => genCurve(X => cs[i] * X * X, id, 0, Math.sqrt(yEnd / cs[i])));


const E = cs.map(c => { const X = Math.pow(b / c, 1 / (2 - g)); return {X, Y: c * X * X}; });
const raysG = document.getElementById('rays');
const rayEnd = [];
E.forEach((e, i) => {
  const s = e.Y / e.X;
  let Xe = 9.8 / s; if (Xe > 12) Xe = 12;
  rayEnd.push({x: sx(Xe), y: sy(s * Xe)});
  const ray = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ray.setAttribute('x1', 105); ray.setAttribute('y1', 460);
  ray.setAttribute('x2', sx(Xe)); ray.setAttribute('y2', sy(s * Xe));
  ray.setAttribute('stroke', '#888'); ray.setAttribute('stroke-width', '0.9');
  ray.setAttribute('stroke-dasharray', '6 4');
  raysG.appendChild(ray);
  const c = document.getElementById('e' + i);
  c.setAttribute('cx', sx(e.X)); c.setAttribute('cy', sy(e.Y));
});

const tops = cs.map(c => ({x: sx(Math.sqrt(yEnd / c)), y: sy(yEnd)}));
const labels = [
  {id: 'lbl-x',     tex: 'X', x: 560, y: 462, a: 'lt', s: '17px'},
  {id: 'lbl-y',     tex: 'Y', x: 97,  y: 46,  a: 'rt', s: '17px'},
  {id: 'lbl-o',     tex: 'O', x: 99,  y: 466, a: 'rt', s: '16px'},
  {id: 'lbl-cona',  tex: '\\text{CON}^A_0', x: tops[0].x - 4, y: tops[0].y - 4, a: 'rb', c: '#0F6E56'},
  {id: 'lbl-cona1', tex: '\\text{CON}^A_1', x: tops[1].x - 4, y: tops[1].y - 4, a: 'rb', c: '#0F6E56', bg: 1},
  {id: 'lbl-cona2', tex: '\\text{CON}^A_2', x: tops[2].x - 4, y: tops[2].y - 4, a: 'rb', c: '#0F6E56', bg: 1},
  {id: 'lbl-conb',  tex: '\\text{CON}^B', x: sx(12) + 6, y: sy(conB(12)), a: 'lm', c: '#534AB7'},
  {id: 'lbl-rri0',  tex: '\\text{RRI}_0', x: rayEnd[0].x, y: rayEnd[0].y - 4, a: 'cb', c: '#555'},
  {id: 'lbl-rri1',  tex: '\\text{RRI}_1', x: rayEnd[1].x, y: rayEnd[1].y - 4, a: 'cb', c: '#555'},
  {id: 'lbl-rri2',  tex: '\\text{RRI}_2', x: rayEnd[2].x + 6, y: rayEnd[2].y - 2, a: 'lb', c: '#555'},
  {id: 'lbl-p0',    tex: '0', x: sx(E[0].X) + 6, y: sy(E[0].Y) + 3, a: 'lt', c: '#000', s: '15px'},
  {id: 'lbl-p1',    tex: '1', x: sx(E[1].X) + 9, y: sy(E[1].Y) + 5, a: 'lt', c: '#000', s: '15px'},
  {id: 'lbl-p2',    tex: '2', x: sx(E[2].X) + 9, y: sy(E[2].Y) + 5, a: 'lt', c: '#000', s: '15px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
