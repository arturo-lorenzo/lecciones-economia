<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="135.0" y1="440.0" x2="555.0" y2="440.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="135.0" y1="440.0" x2="135.0" y2="50.0"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="310.0" y1="70.0" x2="310.0" y2="430.0" stroke="#D85A30" stroke-width="2.2"/>



    <line x1="170.0" y1="376.0" x2="467.5" y2="172.0" stroke="#1D9E75" stroke-width="2.2"/>



    <line x1="170.0" y1="306.0" x2="467.5" y2="102.0" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>



    <line x1="170.0" y1="168.0" x2="467.5" y2="406.0" stroke="#378ADD" stroke-width="2.2"/>



    <line x1="205.0" y1="126.0" x2="520.0" y2="378.0" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4"/>



    <line x1="426.3" y1="366.6" x2="453.3" y2="333.6" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="385.1" y1="220.0" x2="360.3" y2="184.0" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>


    <circle cx="310.0" cy="280.0" r="5" fill="#000"/>


    <circle cx="357.2" cy="248.0" r="5" fill="#000"/>


    <circle cx="310.0" cy="210.0" r="5" fill="#000"/>


    <line x1="310.0" y1="280.0" x2="135.0" y2="280.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="357.2" y1="248.0" x2="357.2" y2="440.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="357.2" y1="248.0" x2="135.0" y2="248.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="310.0" y1="210.0" x2="135.0" y2="210.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="310.0" y1="440.0" x2="310.0" y2="444.0" stroke="black" stroke-width="1"/>
    <line x1="357.2" y1="440.0" x2="357.2" y2="444.0" stroke="black" stroke-width="1"/>
    <line x1="131.5" y1="280.0" x2="135.0" y2="280.0" stroke="black" stroke-width="1"/>
    <line x1="131.5" y1="248.0" x2="135.0" y2="248.0" stroke="black" stroke-width="1"/>
    <line x1="131.5" y1="210.0" x2="135.0" y2="210.0" stroke="black" stroke-width="1"/>

  </svg>


  <div class="katex-label" id="lbl-P"></div>
  <div class="katex-label" id="lbl-Y"></div>
  <div class="katex-label" id="lbl-OALP"></div>
  <div class="katex-label" id="lbl-OACP0"></div>
  <div class="katex-label" id="lbl-OACP1"></div>
  <div class="katex-label" id="lbl-DA0"></div>
  <div class="katex-label" id="lbl-DA1"></div>
  <div class="katex-label" id="lbl-E0"></div>
  <div class="katex-label" id="lbl-E1"></div>
  <div class="katex-label" id="lbl-E2"></div>
  <div class="katex-label" id="lbl-P0"></div>
  <div class="katex-label" id="lbl-P1"></div>
  <div class="katex-label" id="lbl-P2"></div>
  <div class="katex-label" id="lbl-Ybar"></div>
  <div class="katex-label" id="lbl-Y1"></div>
  <div class="katex-label" id="lbl-dM"></div>
  <div class="katex-label" id="lbl-dPe"></div>

</div>

<script>
const W = 680, H = 520;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const labels = [
  {id:'lbl-P',     tex:'P',              left: pct(128.0,W),  top: pct(45.0,H),   color:'black', align:'right'},
  {id:'lbl-Y',     tex:'Y',              left: pct(557.0,W),  top: pct(440.0,H),  color:'black'},
  {id:'lbl-OALP',  tex:'\\text{OA}_{\\text{LP}}',        left: pct(318.0,W),  top: pct(55.0,H),   color:'#D85A30', size:'14px'},
  {id:'lbl-OACP0', tex:'\\text{OA}_{\\text{CP},0}',      left: pct(475.5,W),  top: pct(155.0,H),  color:'#1D9E75', size:'13px'},
  {id:'lbl-OACP1', tex:'\\text{OA}_{\\text{CP},1}',      left: pct(474.5,W),  top: pct(82.0,H),   color:'#1D9E75', size:'13px'},
  {id:'lbl-DA0',   tex:'\\text{DA}_0',           left: pct(475.5,W),  top: pct(392.0,H),  color:'#378ADD'},
  {id:'lbl-DA1',   tex:'\\text{DA}_1',           left: pct(528.0,W),  top: pct(365.0,H),  color:'#378ADD'},
  {id:'lbl-E0',    tex:'0',              left: pct(276.0,W),  top: pct(266.5,H),  color:'#000'},
  {id:'lbl-E1',    tex:"0'",              left: pct(373.5,W),  top: pct(236.5,H),  color:'#000'},
  {id:'lbl-E2',    tex:'1',              left: pct(276.0,W),  top: pct(198.5,H),  color:'#000'},
  {id:'lbl-P0',    tex:'P_0',            left: pct(128.5,W),  top: pct(268.0,H),  color:'black', align:'right'},
  {id:'lbl-P1',    tex:"P_{0'}",            left: pct(128.5,W),  top: pct(236.0,H),  color:'black', align:'right'},
  {id:'lbl-P2',    tex:'P_1',            left: pct(128.5,W),  top: pct(198.0,H),  color:'black', align:'right'},
  {id:'lbl-Ybar',  tex:'\\bar{Y}',       left: pct(300.0,W),  top: pct(448.0,H),  color:'black'},
  {id:'lbl-Y1',    tex:"Y_{0'}",            left: pct(348.2,W),  top: pct(448.0,H),  color:'black'},
  {id:'lbl-dM', tex:'\\Delta M^s > 0', left: pct(524.0,W), top: pct(320.0,H), color:'#378ADD', size:'14px', center:true},
  {id:'lbl-dPe', tex:'\\Delta P^e > 0', left: pct(380.0,W), top: pct(163.0,H), color:'#1D9E75', size:'13px'}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.size) e.style.fontSize = l.size;
  if (l.center) e.style.transform = 'translateX(-50%)';
  if (l.align === 'right') e.classList.add('right-of-axis');
  if (l.size) e.style.fontSize = l.size;
});
</script>
<script>(function(){var N={"lbl-E2": [0, 0, 1], "lbl-E0": [0, 0, 1], "lbl-E1": [0, 0, 1]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
