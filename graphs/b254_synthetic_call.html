<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <g id="guides"></g>
    <line x1="146" y1="220" x2="541" y2="220" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="146" y1="400" x2="146" y2="36" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="curves"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 420, NS = 'http://www.w3.org/2000/svg';
const OY = 220, SC = 32;

const K = 5.0, p = 1.2;
const CURVES = [
  {f: s => s - K, kinks: [], col: '#D85A30', lab: '\\pi_L^{\\text{acción}}(S_T)'},
  {f: s => Math.max(K - s, 0) - p, kinks: [K], col: '#1D9E75', lab: '\\pi_L^{\\text{put}}(S_T)'},
  {f: s => Math.max(s - K, 0) - p, kinks: [K], col: '#378ADD', dash: true, lc: '#185FA5', lab: '\\pi_L^{\\text{call sint.}}(S_T)'}
];
const STRIKES = [[K, 'K = S_0', {dx: -2, ha: 'r', va: 'b', dy: -22}]];
const GUIDES = [];
const VTICKS = [[K - p, 'K - p'], [-p, '-p'], [-K, '-K']];

const OX = 146, XE = OX + 395;
const X = s => OX + s * 37.35;
const Y = v => OY - v * SC;
const SEND = 9.3;
function mk(tag, at, par) { const e = document.createElementNS(NS, tag); for (const q in at) e.setAttribute(q, at[q]); document.getElementById(par).appendChild(e); return e; }

function draw(c) {
  const xs = [0, ...c.kinks, SEND];
  const pts = xs.map(s => X(s).toFixed(1) + ',' + Y(c.f(s)).toFixed(1));
  const at = {points: pts.join(' '), fill: 'none', stroke: c.col, 'stroke-width': 2.2, 'stroke-linejoin': 'round'};
  if (c.dash) at['stroke-dasharray'] = '8 4';
  mk('polyline', at, 'curves');
}
CURVES.forEach(draw);
STRIKES.forEach(([s]) => mk('line', {x1: X(s), y1: OY, x2: X(s), y2: OY + 4, stroke: 'black', 'stroke-width': 1}, 'guides'));
GUIDES.forEach(([s, v]) => {
  mk('line', {x1: OX, y1: Y(v), x2: X(s), y2: Y(v), stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, 'guides');
});
VTICKS.forEach(([v]) => mk('line', {x1: OX - 4, y1: Y(v), x2: OX, y2: Y(v), stroke: 'black', 'stroke-width': 1}, 'guides'));
const cont = document.querySelector('.graph-container');
function put(tex, x, y, o = {}) {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / VBW * 100).toFixed(2) + '%'; e.style.top = (y / VBH * 100).toFixed(2) + '%';
  e.style.color = o.c || 'black'; if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const q = e.querySelector('.katex'); if (q) q.style.padding = '0 2px'; }
  cont.appendChild(e);
}
put('\\text{Beneficio},\\ \\pi', OX + 8, 36, {va: 't'});
put('S_T', XE + 8, OY, {va: 'm', s: 18});
STRIKES.forEach(([s, tex, o]) => put(tex, X(s) + (o && o.dx || 0), OY + 8 + (o && o.dy || 0), Object.assign({ha: 'c', va: 't'}, o || {})));
VTICKS.forEach(([v, tex]) => put(tex, OX - 8, Y(v), {ha: 'r', va: 'm'}));
CURVES.forEach(c => put(c.lab, X(SEND) + 6, Y(c.f(SEND)) + (c.dy || 0), {va: 'm', c: c.lc || c.col}));
</script>
</body>
</html>
