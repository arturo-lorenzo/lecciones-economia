<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 728 560">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>

</div>

<script>









const SVGNS = 'http://www.w3.org/2000/svg';
const W = 728, H = 560;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');

const X1 = 10, X2 = 6, p1 = 0.6, p2 = 0.4, m = p1 / p2, U = 20;
const BW = X1 * U, BH = X2 * U;
const GRN = '#1D9E75', GRN_T = '#0F6E56', PUR = '#534AB7', RED = '#D85A30';

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e);
  return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = null) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%';
  d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color;
  d.style.fontSize = size || '15px';
  container.appendChild(d);
}
function path(pts, stroke) {
  el('path', {d: 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L'), fill: 'none',
              stroke, 'stroke-width': 2.36, 'stroke-linecap': 'round'});
}



function panel(BX, BY, title, P, agente, principal, o) {
  const sx = w1 => BX + w1 * U, sy = w2 => BY + BH - w2 * U;
  lab(title, BX - 40, BY - 72, '#444', 0, 0, '13px');


  el('rect', {x: BX, y: BY, width: BW, height: BH, fill: 'none', stroke: 'black', 'stroke-width': 1.2});
  line(BX, BY + BH + 34, BX + 50, BY + BH + 34, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  line(BX - 40, BY + BH, BX - 40, BY + BH - 50, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  line(BX + BW, BY - 26, BX + BW - 50, BY - 26, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  line(BX + BW + 36, BY, BX + BW + 36, BY + 50, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  lab('w_1', BX + 25, BY + BH + 40, 'black', 0.5, 0);
  lab('w_2', BX - 46, BY + BH - 25, 'black', 1, 0.5);
  lab('x_1 - w_1', BX + BW - 25, BY - 32, 'black', 0.5, 1, '14px');
  lab('x_2 - w_2', BX + BW + 36, BY + 56, 'black', 0.5, 0, '14px');
  lab('O_A', BX - 6, BY + BH + 6, 'black', 1, 0, '16px');
  lab('O_P', BX + BW + 6, BY - 6, 'black', 0, 1, '16px');
  lab('x_1', BX + BW, BY + BH + 6, 'black', 0.5, 0);
  lab('x_2', BX - 8, BY, 'black', 1, 0.5);


  line(sx(0), sy(0), sx(X2), sy(X2), GRN, 1.4, {'stroke-dasharray': '6 4'});
  line(sx(X1 - X2), sy(0), sx(X1), sy(X2), PUR, 1.4, {'stroke-dasharray': '6 4'});
  lab('\\text{L.C.}_A', sx(X2) - 4, sy(X2) - 4, GRN_T, 0.5, 1, '14px');
  lab('\\text{L.C.}_P', sx(X1 - 1) - 6, sy(X2 - 1), PUR, 1, 0.5, '14px');


  const A = [];
  if (agente === 'neutral') {
    const c = P.w2 + m * P.w1;
    const a0 = Math.max(0, (c - X2) / m), a1 = Math.min(X1, c / m);
    A.push([sx(a0), sy(c - m * a0)], [sx(a1), sy(c - m * a1)]);
  } else {
    const K = Math.pow(P.w1, m) * P.w2;
    const a0 = Math.pow(K / X2, 1 / m);
    for (let i = 0; i <= 300; i++) { const w1 = a0 + (i / 300) * (X1 - a0); A.push([sx(w1), sy(K * Math.pow(w1, -m))]); }
  }
  path(A, GRN);


  const y1P = X1 - P.w1, y2P = X2 - P.w2, Pp = [];
  if (principal === 'neutral') {
    const c = y2P + m * y1P;
    const b0 = Math.max(0, (c - X2) / m), b1 = Math.min(X1, c / m);
    Pp.push([sx(X1 - b0), sy(X2 - (c - m * b0))], [sx(X1 - b1), sy(X2 - (c - m * b1))]);
  } else {
    const K = Math.pow(y1P, m) * y2P;
    const b0 = Math.pow(K / X2, 1 / m);
    for (let i = 0; i <= 300; i++) { const y1 = b0 + (i / 300) * (X1 - b0); Pp.push([sx(X1 - y1), sy(X2 - K * Math.pow(y1, -m))]); }
  }
  path(Pp, PUR);


  const E = [sx(P.w1), sy(P.w2)];
  line(E[0], E[1], E[0], BY + BH, '#888', 0.8, {'stroke-dasharray': '5 3'});
  line(E[0], E[1], BX, E[1], '#888', 0.8, {'stroke-dasharray': '5 3'});
  el('circle', {cx: E[0], cy: E[1], r: 5, fill: '#000'});
  lab('0', E[0] + o.p0[0], E[1] + o.p0[1], '#000', o.p0[2], o.p0[3]);
  lab(o.v1, E[0], BY + BH + 6, 'black', 0.5, 0, '14px');
  lab(o.v2, BX - 5, E[1], 'black', 1, 0.5, '14px');


  const ea = o.endA === 'first' ? A[0] : A[A.length - 1];
  const ep = o.endP === 'first' ? Pp[0] : Pp[Pp.length - 1];
  lab('\\underline{u}', ea[0] + o.la[0], ea[1] + o.la[1], GRN_T, o.la[2], o.la[3], '14px');
  lab('\\pi^e_0', ep[0] + o.lp[0], ep[1] + o.lp[1], PUR, o.lp[2], o.lp[3], '14px');
}

panel(75, 92, '\\text{(a) Caso 1: principal neutral, agente averso}', {w1: 3.5, w2: 3.5}, 'averso', 'neutral',
  {p0: [10, 2, 0, 0.5], v1: 'w^*', v2: 'w^*', endA: 'last', la: [-2, -4, 1, 1], endP: 'last', lp: [4, -2, 0, 1]});
panel(410, 92, '\\text{(b) Caso 2: principal averso, agente neutral}', {w1: 7, w2: 3}, 'neutral', 'averso',
  {p0: [8, 0, 0, 0.5], v1: 'w_1^*', v2: 'w_2^*', endA: 'last', la: [4, -4, 0, 1], endP: 'last', lp: [4, 4, 0, 0]});
panel(240, 362, '\\text{(c) Caso 3: ambos aversos}', {w1: 4.5, w2: 2.7}, 'averso', 'averso',
  {p0: [6, -6, 0, 1], v1: 'w_1^*', v2: 'w_2^*', endA: 'last', la: [-2, -4, 1, 1], endP: 'last', lp: [4, 4, 0, 0]});
</script>
</body>
</html>
