<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="298.0" y1="382.0" x2="298.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="356.0" y1="408.0" x2="356.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M124.0,148.0 L269.0,408.0" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
    <path d="M269.0,148.0 L443.0,460.0" fill="none" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
    <path d="M298.0,460.0 L269.0,408.0 L269.0,148.0 L225.5,70.0" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,304.0 L472.0,460.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="240.0" cy="356.0" r="4" fill="#fff" stroke="#378ADD" stroke-width="1.8"/>
    <circle cx="433.3" cy="442.7" r="4" fill="#fff" stroke="#378ADD" stroke-width="1.8"/>
    <circle cx="356.0" cy="408.0" r="3.5" fill="#378ADD"/>
    <circle cx="269.0" cy="369.0" r="5" fill="#000"/>
    <circle cx="298.0" cy="382.0" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
  <div class="katex-label" id="l13"></div>
</div>
<script>






const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'x_I', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'x_E', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 472.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'k', x: 269.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l4', tex: 'k_M', x: 300.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l5', tex: 'k_D', x: 356.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l6', tex: '\\varphi_E(x_I)', x: 476.0, y: 444.0, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l7', tex: '\\varphi_I(x_E)', x: 217.5, y: 70.0, color: '#D85A30', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l8', tex: '\\varphi_I^{\\,c+r}', x: 196.0, y: 252.0, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l9', tex: '\\varphi_I^{\\,c}', x: 368.0, y: 304.0, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l10', tex: 'T', x: 240.0, y: 347.0, color: '#378ADD', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l11', tex: 'V', x: 442.3, y: 429.7, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l12', tex: 'S', x: 306.0, y: 370.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l13', tex: '\\pi_E = 0', x: 362.0, y: 394.0, color: '#378ADD', tr: 'translate(0,-50%)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
