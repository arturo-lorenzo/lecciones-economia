<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="graph-container">



  <svg viewBox="0 0 680 280">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="90" y1="170" x2="620" y2="170" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="130" y1="166" x2="130" y2="174" stroke="black" stroke-width="1"/>
    <line x1="225" y1="166" x2="225" y2="174" stroke="black" stroke-width="1"/>
    <line x1="320" y1="166" x2="320" y2="174" stroke="black" stroke-width="1"/>
    <line x1="415" y1="166" x2="415" y2="174" stroke="black" stroke-width="1"/>
    <line x1="560" y1="166" x2="560" y2="174" stroke="black" stroke-width="1"/>


    <line x1="130" y1="170" x2="130" y2="232" stroke="#D85A30" stroke-width="2.2" marker-end="url(#arrow)"/>


    <line x1="225" y1="170" x2="225" y2="112" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="320" y1="170" x2="320" y2="100" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="415" y1="170" x2="415" y2="106" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="170" x2="560" y2="118" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>


    <circle cx="470" cy="140" r="1.6" fill="#888"/>
    <circle cx="487" cy="140" r="1.6" fill="#888"/>
    <circle cx="504" cy="140" r="1.6" fill="#888"/>

  </svg>


  <div class="katex-label" id="lbl-t"></div>
  <div class="katex-label" id="lbl-t0"></div>
  <div class="katex-label" id="lbl-t1"></div>
  <div class="katex-label" id="lbl-t2"></div>
  <div class="katex-label" id="lbl-t3"></div>
  <div class="katex-label" id="lbl-tT"></div>
  <div class="katex-label" id="lbl-a0"></div>
  <div class="katex-label" id="lbl-q1"></div>
  <div class="katex-label" id="lbl-q2"></div>
  <div class="katex-label" id="lbl-q3"></div>
  <div class="katex-label" id="lbl-qT"></div>
  <div class="katex-label" id="lbl-def"></div>

</div>

<script>
const W = 680, H = 280;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }

const labels = [
  {id: 'lbl-t',   tex: 't',  x: 628, y: 170, ax: 0,   ay: 0.5, color: 'black', size: 17},

  {id: 'lbl-t0',  tex: '0',  x: 122, y: 180, ax: 1,   ay: 0, color: 'black'},
  {id: 'lbl-t1',  tex: '1',  x: 225, y: 180, ax: 0.5, ay: 0, color: 'black'},
  {id: 'lbl-t2',  tex: '2',  x: 320, y: 180, ax: 0.5, ay: 0, color: 'black'},
  {id: 'lbl-t3',  tex: '3',  x: 415, y: 180, ax: 0.5, ay: 0, color: 'black'},
  {id: 'lbl-tT',  tex: 'T',  x: 560, y: 180, ax: 0.5, ay: 0, color: 'black'},

  {id: 'lbl-a0',  tex: '-A_0', x: 130, y: 240, ax: 0.5, ay: 0, color: '#D85A30'},
  {id: 'lbl-q1',  tex: 'Q_1',  x: 225, y: 106, ax: 0.5, ay: 1, color: '#0F6E56'},
  {id: 'lbl-q2',  tex: 'Q_2',  x: 320, y: 94,  ax: 0.5, ay: 1, color: '#0F6E56'},
  {id: 'lbl-q3',  tex: 'Q_3',  x: 415, y: 100, ax: 0.5, ay: 1, color: '#0F6E56'},
  {id: 'lbl-qT',  tex: 'Q_T',  x: 560, y: 112, ax: 0.5, ay: 1, color: '#0F6E56'},

  {id: 'lbl-def', tex: 'Q_t = C_t - P_t', x: 40, y: 30, ax: 0, ay: 0.5, color: '#888'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, W);
  el.style.top = pct(l.y, H);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  el.style.whiteSpace = 'nowrap';
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
