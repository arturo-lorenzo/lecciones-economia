<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; line-height: 1.2; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="440" x2="566" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="440" x2="124" y2="50" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M124.0,440.0 L124.0,260.0 L304.0,260.0 Z" fill="#D85A30" fill-opacity="0.16" stroke="none"/>
    <line x1="124.0" y1="260.0" x2="304.0" y2="260.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="304.0" y1="260.0" x2="304.0" y2="440.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M124.0,440.0 L524.0,40.0" fill="none" stroke="#5a5a5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,440.0 L304.0,260.0 L524.0,260.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,440.0 L304.0,440.0 L524.0,220.0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="500.0" y1="255.0" x2="500.0" y2="83.0" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <line x1="484.0" y1="80.0" x2="484.0" y2="440.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M124.0,480.0 L124.0,486.0 L301.0,486.0 L301.0,480.0" fill="none" stroke="#D85A30" stroke-width="1"/>
    <path d="M307.0,480.0 L307.0,486.0 L524.0,486.0 L524.0,480.0" fill="none" stroke="#888" stroke-width="1"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>




const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'E_T', x: 506.0, y: 170.0, color: '#1D9E75', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'A_T', x: 576.0, y: 440.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l2', tex: '\\text{Pagos en } T', x: 134.0, y: 52.0, color: 'black', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l3', tex: 'O', x: 112.0, y: 452.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'F_T', x: 304.0, y: 446.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l5', tex: 'F_T', x: 116.0, y: 260.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l6', tex: 'A_T^1', x: 484.0, y: 446.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l7', tex: 'A_T = E_T + p_T', x: 520.0, y: 30.0, color: '#5a5a5a', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l8', tex: 'p_T = \\min(A_T,\\, F_T)', x: 402.0, y: 246.0, color: '#378ADD', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l9', tex: 'E_T = \\max(A_T - F_T,\\, 0)', x: 380.0, y: 376.0, color: '#1D9E75', tr: 'translate(0,-50%)', small: false, bg: true},
  {id: 'l10', tex: '\\max(F_T - A_T,\\, 0)', x: 134.0, y: 282.0, color: '#D85A30', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l11', tex: '\\text{impago}', x: 214.0, y: 486.0, color: '#D85A30', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l12', tex: '\\text{sin impago}', x: 414.0, y: 486.0, color: '#888', tr: 'translate(-50%,0)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
