<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="161" y1="440" x2="591" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="161" y1="440" x2="161" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="d0h" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="d0v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="d0ph" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="d1v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="t0h" stroke="black" stroke-width="1"/>
    <line id="t0v" stroke="black" stroke-width="1"/>
    <line id="t0ph" stroke="black" stroke-width="1"/>
    <line id="t1v" stroke="black" stroke-width="1"/>


    <line x1="161" y1="440" x2="501" y2="80" stroke="#378ADD" stroke-width="2.2"/>
    <line x1="161" y1="440" x2="561" y2="235.8" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4"/>



    <path id="rot" fill="none" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

    <circle id="pt0" r="5" fill="#000"/>
    <circle id="pt0p" r="5" fill="#000"/>
    <circle id="pt1" r="5" fill="#000"/>
  </svg>
</div>

<script>
const OX=161,OY=440,W=680,H=520;
const s0=360/340, s1=245/480;
const e0x=OX+0.38*340, e0y=OY-s0*(e0x-OX);
const e0py=OY-s1*(e0x-OX);
const e1x=OX+(OY-e0y)/s1;

const el=id=>document.getElementById(id);
function setL(id,x1,y1,x2,y2){const e=el(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);}
function pt(id,x,y){el(id).setAttribute('cx',x);el(id).setAttribute('cy',y);}
pt('pt0',e0x,e0y); pt('pt0p',e0x,e0py); pt('pt1',e1x,e0y);

setL('d0h',OX,e0y,e1x,e0y);
setL('d0v',e0x,e0y,e0x,OY);
setL('d0ph',OX,e0py,e0x,e0py);
setL('d1v',e1x,e0y,e1x,OY);
setL('t0h',OX-4,e0y,OX,e0y);
setL('t0ph',OX-4,e0py,OX,e0py);
setL('t0v',e0x,OY,e0x,OY+4);
setL('t1v',e1x,OY,e1x,OY+4);

function arc(r,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push((OX+r*Math.cos(a)).toFixed(1)+','+(OY-r*Math.sin(a)).toFixed(1));}return 'M'+p.join(' L');}
const A0=Math.atan(s0), A1=Math.atan(s1);

const R=335, gap=0.035;
el('rot').setAttribute('d',arc(R,A0-gap,A1+gap,40));
const am=(A0+A1)/2, rotX=OX+R*Math.cos(am), rotY=OY-R*Math.sin(am);

function pct(v,t){return(v/t*100).toFixed(2)+'%';}
const cont=document.querySelector('.graph-container');
const labels=[
  {id:'title', tex:'\\text{Multiplicador inestable}', x:340,y:6, size:'15px', center:true},
  {id:'M',    tex:'M^s',   x:OX-7, y:28, align:'right', size:'17px'},
  {id:'H0',   tex:'H', x:595,y:440, size:'17px'},
  {id:'line', tex:'M^s = m_0 \\cdot H', x:491,y:58, color:'#378ADD', size:'16px', align:'right'},
  {id:'line2',tex:'M^s = m_1 \\cdot H', x:OX+398,y:OY-s1*400-30, color:'#378ADD', size:'16px', align:'right'},
  {id:'pt0',  tex:'0',  x:e0x-24,y:e0y-28, color:'#000', size:'16px'},
  {id:'pt0p', tex:"0'", x:e0x+8, y:e0py+2, color:'#000', size:'16px'},
  {id:'pt1',  tex:'1',  x:e1x+8, y:e0y+4, color:'#000', size:'16px'},
  {id:'H00',  tex:'H_0', x:e0x-10,y:448, size:'15px'},
  {id:'H01',  tex:'H_1', x:e1x-10,y:448, size:'15px'},
  {id:'M0',   tex:'M^s_1 = M^s_0', x:OX-7,y:e0y-13, align:'right', size:'15px'},
  {id:'M0p',  tex:"M^s_{0'}", x:OX-7,y:e0py-13, align:'right', size:'15px'},
];
labels.forEach(l=>{const e=document.createElement('div');e.className='katex-label';e.id='lbl-'+l.id;cont.appendChild(e);
  katex.render(l.tex,e,{throwOnError:false});e.style.left=pct(l.x,W);e.style.top=pct(l.y,H);e.style.color=l.color||'black';
  if(l.size)e.style.fontSize=l.size;if(l.align==='right')e.classList.add('right-of-axis');if(l.center)e.style.transform='translateX(-50%)';});
</script>
</body>
</html>
