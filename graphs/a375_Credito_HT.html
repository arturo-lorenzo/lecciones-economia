<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="120" y1="440" x2="560" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="440" x2="120" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <g id="curves"></g>
    <g id="arrows"></g>
    <g id="points"></g>
  </svg>
</div>
<script>


const k0 = 1.5, k1 = 2.0, PN0 = 70, PN1 = 95, PNmax = 128, Imax = 226;
const P0 = [PN0, k0*PN0], P0p = [PN0, k1*PN0], P1 = [PN1, k1*PN1];

const VBW = 680, VBH = 480, OX = 120, sx = 3.1, sy = 1.65;
const X = v => OX + v*sx, Y = v => 440 - v*sy;
const NS = 'http://www.w3.org/2000/svg';
function el(g, tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); document.getElementById(g).appendChild(e); return e; }
function line(g, x1, y1, x2, y2, att) { return el(g, 'line', Object.assign({x1, y1, x2, y2}, att)); }
const dash = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, tk = {stroke: 'black', 'stroke-width': 1};
const cK = '#378ADD', cF = '#1D9E75', grey = '#888', cPt = 'black';
const L = []; function put(tex, x, y, o = {}) { L.push(Object.assign({tex, x, y}, o)); }
const end = k => Math.min(PNmax, Imax/k);


[P0, P0p, P1].forEach(p => { line('guides', X(0), Y(p[1]), X(p[0]), Y(p[1]), dash); line('guides', OX - 4, Y(p[1]), OX, Y(p[1]), tk); });
line('guides', X(PN0), Y(0), X(PN0), Y(P0p[1]), dash); line('guides', X(PN0), 440, X(PN0), 444, tk);
line('guides', X(PN1), Y(0), X(PN1), Y(P1[1]), dash); line('guides', X(PN1), 440, X(PN1), 444, tk);


line('curves', X(0), Y(0), X(end(1)), Y(end(1)), {stroke: grey, 'stroke-width': 1.4, 'stroke-dasharray': '7 4'});
line('curves', X(0), Y(0), X(end(k0)), Y(k0*end(k0)), {stroke: cK, 'stroke-width': 2.2});
line('curves', X(0), Y(0), X(end(k1)), Y(k1*end(k1)), {stroke: cK, 'stroke-width': 2.2, 'stroke-dasharray': '8 4'});


const xf = X(PN0) + 10;
line('arrows', xf, Y(PN0) - 3, xf, Y(k0*PN0) + 7, {stroke: cF, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)', 'marker-start': 'url(#arrow)'});
put('I_0 - \\text{PN}_0', xf + 6, Y(k0*PN0) + 12, {c: cF, s: 14, va: 't', bg: 1});


const R = 450, ang = k => Math.atan2(k*sy, sx), a0 = ang(k0), a1 = ang(k1), da = 0.012;
const pa = a => [X(0) + R*Math.cos(a), Y(0) - R*Math.sin(a)];
const A = pa(a0 + da), B = pa(a1 - da);
el('arrows', 'path', {d: `M${A[0]},${A[1]} A${R},${R} 0 0 0 ${B[0]},${B[1]}`, fill: 'none', stroke: cK, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
const M = pa((a0 + a1)/2);
put('\\Delta r < 0', A[0] + 8, A[1] + 8, {c: cK, s: 14, va: 't'});


function path(Pa, Pb, off, t0 = 9) {
  const x0 = X(Pa[0]), y0 = Y(Pa[1]), x1 = X(Pb[0]), y1 = Y(Pb[1]), l = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0)/l, uy = (y1 - y0)/l;
  const px = uy*off, py = -ux*off;
  line('arrows', x0 + ux*t0 + px, y0 + uy*t0 + py, x1 - ux*9 + px, y1 - uy*9 + py, {stroke: '#5a5a5a', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
}
path(P0, P0p, 10); path(P0p, P1, 10);


[P0, P0p, P1].forEach(p => el('points', 'circle', {cx: X(p[0]), cy: Y(p[1]), r: 5, fill: '#000'}));


put('\\text{PN}', 564, 440, {va: 'm', s: 17});
put('I', OX - 8, 38, {ha: 'r', s: 17});
put('I = \\text{PN}', X(end(1)) + 6, Y(end(1)), {c: grey, va: 'm'});
put('I = k(r_0)\\,\\text{PN}', X(end(k0)) + 6, Y(k0*end(k0)), {c: cK, va: 'm'});
put('I = k(r_1)\\,\\text{PN}', X(end(k1)) + 6, Y(k1*end(k1)), {c: cK, va: 'm'});
put('0', X(P0[0]) - 8, Y(P0[1]) + 17, {c: cPt, ha: 'r', va: 't'});
put("0'", X(P0p[0]) - 9, Y(P0p[1]) - 3, {c: cPt, ha: 'r', va: 'b'});
put('1', X(P1[0]) - 9, Y(P1[1]) - 3, {c: cPt, ha: 'r', va: 'b'});
put('I_0', OX - 8, Y(P0[1]), {ha: 'r', va: 'm', s: 15});
put("I_{0'}", OX - 8, Y(P0p[1]), {ha: 'r', va: 'm', s: 15});
put('I_1', OX - 8, Y(P1[1]), {ha: 'r', va: 'm', s: 15});
put('\\text{PN}_0', X(PN0), 448, {ha: 'c', s: 15});
put('\\text{PN}_1', X(PN1), 448, {ha: 'c', s: 15});

const cont = document.querySelector('.graph-container');
L.forEach((l, i) => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x/VBW*100).toFixed(2) + '%'; e.style.top = (l.y/VBH*100).toFixed(2) + '%';
  e.style.color = l.c || 'black'; if (l.s) e.style.fontSize = l.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[l.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[l.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
});
</script>
</body>
</html>
