<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M124.0,460.0 L508.0,76.0" fill="none" stroke="#5a5a5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,380.0 L508.0,149.6" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="324.0" y1="260.0" x2="324.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="324.0" y1="260.0" x2="124.0" y2="260.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="404.0" y1="180.0" x2="404.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="464.0" y1="120.0" x2="464.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="404.0" y1="180.0" x2="404.0" y2="212.0" stroke="#D85A30" stroke-width="3"/>
    <line x1="400.0" y1="446.0" x2="332.0" y2="446.0" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <circle cx="324.0" cy="260.0" r="5" fill="#000"/>
    <path d="M158.0,460 A34,34 0 0,0 148.0,436.0" fill="none" stroke="#999" stroke-width="0.8"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>



const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'Y', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: '\\text{DA}', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 472.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: '45^\\circ', x: 166.0, y: 446.0, color: '#5a5a5a', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l4', tex: '\\text{DA} = Y', x: 514.0, y: 76.0, color: '#5a5a5a', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l5', tex: '\\text{DA}', x: 514.0, y: 149.6, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l6', tex: 'A_0 - vr', x: 112.0, y: 380.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l7', tex: 'Y^*', x: 112.0, y: 260.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l8', tex: 'Y^*', x: 324.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l9', tex: 'Y_1', x: 404.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l10', tex: 'Y_{\\text{PE}}', x: 464.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l11', tex: '0', x: 314.0, y: 248.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l12', tex: '\\Delta\\,\\text{existencias}', x: 412.0, y: 228.0, color: '#D85A30', tr: 'translate(0,-50%)', small: true, bg: true},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
