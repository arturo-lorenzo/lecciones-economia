<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container > svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="116" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="116" y1="460" x2="116" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="c-alm"   fill="none" stroke="#534AB7" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="c-em"    fill="none" stroke="#378ADD" stroke-width="2.2"   stroke-linecap="round"/>
    <path id="c-total" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="q-dash" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="q-tick" stroke="black" stroke-width="1"/>


    <circle id="pt-min" r="5" fill="#D85A30"/>

  </svg>


  <div class="katex-label" id="lbl-q"></div>
  <div class="katex-label" id="lbl-c"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-alm"></div>
  <div class="katex-label" id="lbl-em"></div>
  <div class="katex-label" id="lbl-total"></div>
  <div class="katex-label" id="lbl-qstar"></div>

</div>

<script>









const KD = 400, g = 0.5;
const cEm    = q => KD / q;
const cAlm   = q => g * q / 2;
const cTotal = q => cEm(q) + cAlm(q);
const qStar  = Math.sqrt(2 * KD / g);

const QMAX = 75;
function toSvgX(q) { return 116 + q * 5.2; }
function toSvgY(c) { return 460 - c * 7.2; }

function genCurve(fn, id, qMin, qMax) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const q = qMin + (i / 300) * (qMax - qMin);
    const sx = toSvgX(q);
    const sy = toSvgY(fn(q));
    if (sx >= 116 && sx <= 507 && sy >= 70 && sy <= 460) {
      pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
    }
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(cAlm,   'c-alm',   0, QMAX);
genCurve(cEm,    'c-em',    6, QMAX);
genCurve(cTotal, 'c-total', 6, QMAX);


const sm = [toSvgX(qStar), toSvgY(cTotal(qStar))];
document.getElementById('pt-min').setAttribute('cx', sm[0]);
document.getElementById('pt-min').setAttribute('cy', sm[1]);
const qd = document.getElementById('q-dash');
qd.setAttribute('x1', sm[0]); qd.setAttribute('y1', sm[1]);
qd.setAttribute('x2', sm[0]); qd.setAttribute('y2', 460);
const qt = document.getElementById('q-tick');
qt.setAttribute('x1', sm[0]); qt.setAttribute('y1', 460);
qt.setAttribute('x2', sm[0]); qt.setAttribute('y2', 464);


const pct = (v, t) => (v / t * 100).toFixed(2) + '%';

const labels = [
  {id: 'lbl-q',     tex: 'x', x: 564, y: 460, ax: 0, ay: 0.5, color: 'black', size: 17},
  {id: 'lbl-c',     tex: '\\text{Coste}', x: 116, y: 48, ax: 0.5, ay: 1, color: 'black', size: 17},
  {id: 'lbl-o',     tex: 'O', x: 110, y: 466, ax: 1, ay: 0, color: 'black'},
  {id: 'lbl-alm',   tex: '\\text{Almacenamiento}', x: toSvgX(QMAX) + 6, y: toSvgY(cAlm(QMAX)), ax: 0, ay: 0.5, color: '#534AB7'},
  {id: 'lbl-em',    tex: '\\text{Emisión}', x: toSvgX(QMAX) + 6, y: toSvgY(cEm(QMAX)), ax: 0, ay: 0.5, color: '#185FA5'},
  {id: 'lbl-total', tex: '\\text{Coste total}', x: toSvgX(QMAX) + 6, y: toSvgY(cTotal(QMAX)), ax: 0, ay: 0.5, color: '#0F6E56'},
  {id: 'lbl-qstar', tex: 'x^* = \\sqrt{2KD/h}', x: sm[0], y: 468, ax: 0.5, ay: 0, color: 'black'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, 680);
  el.style.top = pct(l.y, 500);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.whiteSpace = 'nowrap';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
