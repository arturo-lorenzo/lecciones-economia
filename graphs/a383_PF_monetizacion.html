<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="barrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="125.0" y1="440" x2="555.0" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="125.0" y1="440" x2="125.0" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="159.4" y1="110.0" x2="383.0" y2="390.0" stroke="#378ADD" stroke-width="2.2"/>
    <line x1="254.0" y1="110.0" x2="477.6" y2="390.0" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line x1="159.4" y1="370.0" x2="494.8" y2="110.0" stroke="#1D9E75" stroke-width="2.2"/>
    <line x1="254.0" y1="370.0" x2="546.4" y2="143.3" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line x1="227.5" y1="185.7" x2="275.1" y2="147.6" stroke="#378ADD" stroke-width="1.2" marker-end="url(#barrow)"/>
    <line x1="447.8" y1="153.9" x2="475.4" y2="189.4" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>

    <line x1="287.6" y1="270.6" x2="287.6" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="382.2" y1="270.6" x2="382.2" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="125.0" y1="270.6" x2="382.2" y2="270.6" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="287.6" y1="440" x2="287.6" y2="444" stroke="black" stroke-width="1"/>
    <line x1="382.2" y1="440" x2="382.2" y2="444" stroke="black" stroke-width="1"/>
    <line x1="121.6" y1="270.6" x2="125.0" y2="270.6" stroke="black" stroke-width="1"/>
    <circle cx="287.6" cy="270.6" r="5" fill="#000"/>
    <circle cx="382.2" cy="270.6" r="5" fill="#000"/>
  </svg>
</div>
<script>
const W=680,H=520;
const pct=(v,t)=>(v/t*100).toFixed(2)+'%';

const E0=[287.6,270.6], E1=[382.2,270.6];

const LBL=[
  ['lbl-title','\\text{Vía monetización}',340,22,'black',16,'c',false],
  ['lbl-r','i',118.1,52,'black',18,'r',false],
  ['lbl-Y','Y',560.2,442,'black',18,'l',false],
  ['lbl-IS0','\\text{IS}_0',388.2,392,'#378ADD',16,'l',false],
  ['lbl-IS1','\\text{IS}_1',482.8,392,'#378ADD',16,'l',false],
  ['lbl-LM0','\\text{LM}_0',500.0,104,'#1D9E75',16,'l',false],
  ['lbl-LM1','\\text{LM}_1',551.6,139.3,'#1D9E75',16,'l',false],
  ['lbl-E0','0',E0[0],E0[1]-20,'#000',16,'c',false],
  ['lbl-E1','1',E1[0],E1[1]-20,'#000',16,'c',false],
  ['lbl-r0','i_0 = i_1',118.1,E0[1],'black',16,'r',false],
  ['lbl-Y0','Y_0',E0[0],458,'black',16,'c',false],
  ['lbl-Y1','Y_1',E1[0],458,'black',16,'c',false],
  ['lbl-dG','\\Delta G_0 > 0',314,163,'#378ADD',14,'l',false],
  ['lbl-dM','\\Delta M^s > 0',500,198,'#1D9E75',14,'l',false]
];
const c=document.querySelector('.graph-container');
LBL.forEach(([id,tex,x,y,color,size,anc,bg])=>{
  const e=document.createElement('div');e.className='katex-label';e.id=id;c.appendChild(e);
  katex.render(tex,e,{throwOnError:false});
  e.style.left=pct(x,W);e.style.top=pct(y,H);e.style.color=color;e.style.fontSize=size+'px';
  e.style.transform=(anc==='r'?'translate(-100%,-50%)':anc==='c'?'translate(-50%,-50%)':'translate(0,-50%)');
  if(bg){e.style.background='#fff';const k=e.querySelector('.katex');if(k)k.style.padding='0 2px';}
});
</script>
</body>
</html>
