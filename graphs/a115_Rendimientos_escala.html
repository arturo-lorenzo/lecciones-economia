<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</div>
<script>








const W = 680, H = 330;
const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
const box = document.querySelector('.graph-container');
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
const labels = [];

const PANELS = [
  {h: 1.5, title: '\\text{(a) Rendimientos crecientes}', sub: '\\overline{OA} > \\overline{AB} > \\overline{BC}', hTex: 'h = 1{,}5'},
  {h: 1,   title: '\\text{(b) Rendimientos constantes}', sub: '\\overline{OA} = \\overline{AB} = \\overline{BC}', hTex: 'h = 1'},
  {h: 0.6, title: '\\text{(c) Rendimientos decrecientes}', sub: '\\overline{OA} < \\overline{AB} < \\overline{BC}', hTex: 'h = 0{,}6'}
];
const AX = 180, AY = 170, OY = 254, GAP = 218, OX0 = 32;

PANELS.forEach((P, i) => {
  const ox = OX0 + i * GAP;
  const cuts = [1, 2, 3].map(c => Math.pow(c, 1 / P.h));
  const U = cuts[2] / 0.70;
  const k = AX / U;
  const sx = l => ox + l * k, sy = q => OY - q * k;

  el('line', {x1: ox, y1: OY, x2: ox + AX + 6, y2: OY, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  el('line', {x1: ox, y1: OY, x2: ox, y2: OY - AY - 6, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});

  const re = 0.86 * U;
  el('line', {x1: ox, y1: OY, x2: sx(re), y2: sy(re), stroke: '#888', 'stroke-width': 1, 'stroke-dasharray': '5 3'});

  cuts.forEach((m, j) => {
    const s = Math.max(0.36, m / (0.9 * U));
    const l0 = m * s, l1 = m / s, pts = [];
    for (let t = 0; t <= 200; t++) { const l = l0 * Math.pow(l1 / l0, t / 200); pts.push(sx(l).toFixed(1) + ',' + sy(m * m / l).toFixed(1)); }
    el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: '#1D9E75', 'stroke-width': 2.2, 'stroke-linecap': 'round'});
    labels.push({tex: ['x_0', '2x_0', '3x_0'][j], x: sx(l1) + 3, y: sy(m * m / l1) - 2, color: '#0F6E56', ax: 0, ay: 1, size: '14px'});
  });

  cuts.forEach((m, j) => {
    el('circle', {cx: sx(m), cy: sy(m), r: 3.8, fill: '#D85A30'});
    labels.push({tex: 'ABC'[j], x: sx(m) - 8, y: sy(m), color: '#D85A30', ax: 1, ay: 0.5, size: '13px'});
  });

  labels.push({tex: P.title, x: ox - 10, y: 16, color: '#444', ax: 0, ay: 0, size: '14px'});
  labels.push({tex: P.hTex, x: sx(re) + 4, y: sy(re) - 2, color: '#444', ax: 0, ay: 0.5, size: '14px'});
  labels.push({tex: 'L', x: ox + AX + 10, y: OY, color: 'black', ax: 0, ay: 0.5});
  labels.push({tex: 'K', x: ox, y: OY - AY - 10, color: 'black', ax: 0.5, ay: 1});
  labels.push({tex: 'O', x: ox - 4, y: OY + 3, color: 'black', ax: 1, ay: 0});
  labels.push({tex: P.sub, x: ox + AX / 2, y: OY + 30, color: '#D85A30', ax: 0.5, ay: 0, size: '14px'});
});

labels.forEach(l => {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(l.tex, d, {throwOnError: false});
  d.style.left = (l.x / W * 100).toFixed(2) + '%';
  d.style.top = (l.y / H * 100).toFixed(2) + '%';
  d.style.transform = `translate(${-(l.ax || 0) * 100}%, ${-(l.ay || 0) * 100}%)`;
  d.style.color = l.color || 'black';
  if (l.size) d.style.fontSize = l.size;
  if (l.bg) d.style.background = '#fff';
  box.appendChild(d);
});
</script>
</body>
</html>
