<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 400">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="62" y1="330" x2="320" y2="330" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="62" y1="330" x2="62" y2="74" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M62.0,92.5 L206.4,330.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62.0,105.0 L147.5,330.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>
    <line x1="176.0" y1="280.0" x2="176.0" y2="330.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="176.0" y1="280.0" x2="62.0" y2="280.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="100.0" y1="205.0" x2="100.0" y2="330.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="100.0" y1="205.0" x2="62.0" y2="205.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <circle cx="176.0" cy="280.0" r="5" fill="#000"/>
    <circle cx="100.0" cy="205.0" r="5" fill="#000"/>
    <line x1="384" y1="330" x2="642" y2="330" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="384" y1="330" x2="384" y2="74" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M384.0,92.5 L528.4,330.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M384.0,180.0 L612.0,330.0" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>
    <line x1="498.0" y1="280.0" x2="498.0" y2="330.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="498.0" y1="280.0" x2="384.0" y2="280.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="422.0" y1="205.0" x2="422.0" y2="330.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="422.0" y1="205.0" x2="384.0" y2="205.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <circle cx="498.0" cy="280.0" r="5" fill="#000"/>
    <circle cx="422.0" cy="205.0" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
  <div class="katex-label" id="l13"></div>
  <div class="katex-label" id="l14"></div>
  <div class="katex-label" id="l15"></div>
</div>
<script>




const W = 680, H = 400;
const labels = [
  {id: 'l0', tex: '\\mathbf{x}^0', x: 169.0, y: 293.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l1', tex: '\\mathbf{x}^1', x: 93.0, y: 218.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l2', tex: 'x_1', x: 326.0, y: 330.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'x_2', x: 62.0, y: 64.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l4', tex: 'O', x: 51.0, y: 342.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l5', tex: '\\text{RP}_0', x: 209.4, y: 316.0, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l6', tex: '\\text{RP}_1', x: 144.5, y: 316.0, color: '#378ADD', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l7', tex: '\\text{(a) se cumple el ADPR}', x: 187.0, y: 374.0, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l8', tex: '\\mathbf{x}^0', x: 491.0, y: 293.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l9', tex: '\\mathbf{x}^1', x: 415.0, y: 218.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l10', tex: 'x_1', x: 648.0, y: 330.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l11', tex: 'x_2', x: 384.0, y: 64.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l12', tex: 'O', x: 373.0, y: 342.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l13', tex: '\\text{RP}_0', x: 531.4, y: 316.0, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l14', tex: '\\text{RP}_1', x: 566.4, y: 286.0, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l15', tex: '\\text{(b) se viola el ADPR}', x: 509.0, y: 374.0, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: false, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
