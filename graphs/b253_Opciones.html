<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <line id="axx" y1="438" y2="438" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="axy" y1="438" y2="35.5" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path id="vi" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linejoin="miter"/>
    <path id="call" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <g id="tv"></g>
    <line id="tick" stroke="black" stroke-width="1"/>
    <g id="br"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 540, NS = 'http://www.w3.org/2000/svg';
const S = 1.17;
const OX = 121, XE = OX + S * 375;
const OY = 438, XK = OX + S * 130, XEND = OX + S * 355, k = S * 110;

const vi = x => Math.max(x - XK, 0);
const call = x => (Math.sqrt((x - XK) * (x - XK) + k * k) + (x - XK)) / 2;
const $ = id => document.getElementById(id);
function mk(tag, at, par) { const e = document.createElementNS(NS, tag); for (const q in at) e.setAttribute(q, at[q]); $(par).appendChild(e); return e; }
['x1', 'x2'].forEach(a => { $('axy').setAttribute(a, OX); }); $('axx').setAttribute('x1', OX); $('axx').setAttribute('x2', XE);
$('vi').setAttribute('d', `M${OX},${OY} L${XK},${OY} L${XEND},${OY - (XEND - XK)}`);
{ const p = []; for (let x = OX + S * 6; x <= XEND + 0.01; x += 2) p.push(x.toFixed(1) + ',' + (OY - call(x)).toFixed(1)); $('call').setAttribute('d', 'M' + p.join(' L')); }
[XK - S * 90, XK - S * 45, XK, XK + S * 75, XK + S * 150].forEach(x => mk('line', {x1: x, y1: OY - call(x) + 3, x2: x, y2: OY - vi(x) - 3, stroke: '#534AB7', 'stroke-width': 1.2, 'stroke-dasharray': '4 3'}, 'tv'));
const t = $('tick'); t.setAttribute('x1', XK); t.setAttribute('y1', OY); t.setAttribute('x2', XK); t.setAttribute('y2', OY + 4);

function br(a, b) { mk('line', {x1: a, y1: OY + 40, x2: b, y2: OY + 40, stroke: '#444', 'stroke-width': 0.8}, 'br'); [a, b].forEach(x => mk('line', {x1: x, y1: OY + 35, x2: x, y2: OY + 45, stroke: '#444', 'stroke-width': 0.8}, 'br')); }
br(OX + S * 10, XK - 12); br(XK + 12, XEND + S * 10);
mk('line', {x1: XK, y1: OY + 28, x2: XK, y2: OY + 68, stroke: '#444', 'stroke-width': 0.8, 'stroke-dasharray': '3 2'}, 'br');
const cont = document.querySelector('.graph-container');
function put(tex, x, y, o = {}) {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / VBW * 100).toFixed(2) + '%'; e.style.top = (y / VBH * 100).toFixed(2) + '%';
  e.style.color = o.c || 'black'; if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const q = e.querySelector('.katex'); if (q) q.style.padding = '0 2px'; }
  cont.appendChild(e);
}
put('c_t', OX - 10, OY - S * 344 + 4, {ha: 'r', s: 18});
put('S_t', XE + 8, OY, {va: 'm', s: 18});
put('K', XK - 8, OY + 6, {ha: 'r', va: 't'});
put('c_t(S_t)', XEND - 6, OY - call(XEND) - 6, {ha: 'r', va: 'b', c: '#185FA5'});
put('\\text{VI}_t = \\max(S_t - K,\\,0)', XK + S * 120, OY - S * 100, {va: 't', c: '#0F6E56', s: 15});
put('\\text{VT}_t', XK - 6, OY - call(XK) / 2 + 2, {ha: 'r', va: 'm', c: '#534AB7'});
put('\\textit{out of the money}', (OX + S * 10 + XK - 12) / 2, OY + 52, {ha: 'c', va: 't', s: 14});
put('\\textit{at the money}', XK, OY + 72, {ha: 'c', va: 't', s: 14});
put('\\textit{in the money}', (XK + 12 + XEND + S * 10) / 2, OY + 52, {ha: 'c', va: 't', s: 14});
</script>
</body>
</html>
