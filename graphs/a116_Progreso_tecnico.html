<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</div>
<script>




const W = 680, H = 300;
const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
const box = document.querySelector('.graph-container');
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
const labels = [];
const A0 = 1, A1 = 1.6;
const AX = 172, AY = 164, OY = 250, GAP = 212, OX0 = 34;
const DARKG = '#0F6E56';

function axes(ox, xl, yl, title) {
  el('line', {x1: ox, y1: OY, x2: ox + AX + 6, y2: OY, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  el('line', {x1: ox, y1: OY, x2: ox, y2: OY - AY - 6, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  labels.push({tex: xl, x: ox + AX + 10, y: OY, ax: 0, ay: 0.5});
  labels.push({tex: yl, x: ox, y: OY - AY - 10, ax: 0.5, ay: 1});
  labels.push({tex: 'O', x: ox - 4, y: OY + 3, ax: 1, ay: 0});
  labels.push({tex: title, x: ox - 12, y: 14, color: '#444', ax: 0, ay: 0, size: '14px'});
}

function plot(f, l0, l1, sx, sy, color, dashed) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const l = l0 + (l1 - l0) * i / 300; pts.push(sx(l).toFixed(1) + ',' + sy(f(l)).toFixed(1)); }
  const a = {d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linecap': 'round'};
  if (dashed) a['stroke-dasharray'] = '7 4';
  el('path', a);
  return [sx(l1), sy(f(l1))];
}

function shiftArrow(f0, f1, ls, sx, sy, sense, color) {
  const p0 = [sx(ls), sy(f0(ls))];
  const dx = sx(ls + 1e-3) - sx(ls), dy = sy(f0(ls + 1e-3)) - sy(f0(ls));
  const n0 = Math.hypot(dx, dy); let nx = -dy / n0, ny = dx / n0;
  if (sense * ny > 0) { nx = -nx; ny = -ny; }

  const inv = (px) => (px - sx(0)) / (sx(1) - sx(0));
  const g = t => { const X = p0[0] + t * nx, Y = p0[1] + t * ny; return Y - sy(f1(inv(X))); };
  let a = 0, b = 200;
  for (let i = 0; i < 80; i++) { const m = (a + b) / 2; if (g(a) * g(m) <= 0) b = m; else a = m; }
  const T = (a + b) / 2, s = 5, e = T - 5;
  el('line', {x1: p0[0] + s * nx, y1: p0[1] + s * ny, x2: p0[0] + e * nx, y2: p0[1] + e * ny, stroke: color, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  return [p0[0] + (T / 2) * nx, p0[1] + (T / 2) * ny, nx, ny];
}


{
  const ox = OX0, U = 10, V = 0.75;
  const sx = l => ox + l * AX / U, sy = q => OY - q * AY / V;
  axes(ox, 'L', '\\text{Pmg}_L', '\\text{(a) Productividad marginal}');
  const pmg = A => l => A / (2 * Math.sqrt(l));
  const lt = A => Math.pow(A / (2 * 0.92 * V), 2);
  const e0 = plot(pmg(A0), lt(A0), 5.6, sx, sy, '#534AB7', false);
  const e1 = plot(pmg(A1), lt(A1), 5.6, sx, sy, '#534AB7', true);
  labels.push({tex: '\\text{Pmg}_L(L; A_0)', x: e0[0] + 5, y: e0[1] + 2, color: '#534AB7', ax: 0, ay: 0.5, size: '13px'});
  labels.push({tex: '\\text{Pmg}_L(L; A_1)', x: e1[0] + 5, y: e1[1] - 2, color: '#534AB7', ax: 0, ay: 0.5, size: '13px'});
  shiftArrow(pmg(A0), pmg(A1), 4.2, sx, sy, 1, '#534AB7');
  labels.push({tex: '\\Delta A > 0', x: sx(4.2), y: sy(pmg(A0)(4.2)) + 10, color: '#534AB7', ax: 0.5, ay: 0, size: '13px'});
}


{
  const ox = OX0 + GAP, U = 10, V = 5.2;
  const sx = l => ox + l * AX / U, sy = q => OY - q * AY / V;
  axes(ox, 'L', 'x', '\\text{(b) Función de producción}');
  const f = A => l => A * Math.sqrt(l);
  const e0 = plot(f(A0), 0, 6.2, sx, sy, '#1D9E75', false);
  const e1 = plot(f(A1), 0, 6.2, sx, sy, '#1D9E75', true);
  labels.push({tex: 'A_0 f(\\bar{K}, L)', x: e0[0] + 5, y: e0[1], color: DARKG, ax: 0, ay: 0.5, size: '13px'});
  labels.push({tex: 'A_1 f(\\bar{K}, L)', x: e1[0] + 5, y: e1[1], color: DARKG, ax: 0, ay: 0.5, size: '13px'});
  const m = shiftArrow(f(A0), f(A1), 3.6, sx, sy, 1, DARKG);
  labels.push({tex: '\\Delta A > 0', x: sx(3.6) + 6, y: sy(f(A0)(3.6)) + 8, color: DARKG, ax: 0, ay: 0, size: '13px'});
}


{
  const ox = OX0 + 2 * GAP, U = 10;
  const sx = l => ox + l * AX / U, sy = q => OY - q * AY / U * (AX / AY);
  axes(ox, 'L', 'K', '\\text{(c) Isocuantas}');
  const X0 = 5;
  const iso = A => l => Math.pow(X0 / A, 2) / l;
  const m0 = X0 / A0, m1 = X0 / A1;
  const e0 = plot(iso(A0), m0 * 0.6, m0 / 0.6, sx, sy, '#1D9E75', false);
  const e1 = plot(iso(A1), m1 * 0.45, m1 / 0.45, sx, sy, '#1D9E75', true);
  labels.push({tex: 'x_0\\,(A_0)', x: e0[0] + 4, y: e0[1], color: DARKG, ax: 0, ay: 0.5, size: '13px'});
  labels.push({tex: 'x_0\\,(A_1)', x: e1[0] + 4, y: e1[1], color: DARKG, ax: 0, ay: 0.5, size: '13px'});

  const d = 5 / Math.SQRT2;
  el('line', {x1: sx(m0) - d, y1: sy(m0) + d, x2: sx(m1) + d, y2: sy(m1) - d, stroke: DARKG, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  labels.push({tex: '\\Delta A > 0', x: (sx(m0) + sx(m1)) / 2 + 8, y: (sy(m0) + sy(m1)) / 2 + 14, color: DARKG, ax: 0, ay: 0, size: '13px'});
}

labels.forEach(l => {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(l.tex, d, {throwOnError: false});
  d.style.left = (l.x / W * 100).toFixed(2) + '%';
  d.style.top = (l.y / H * 100).toFixed(2) + '%';
  d.style.transform = `translate(${-(l.ax || 0) * 100}%, ${-(l.ay || 0) * 100}%)`;
  d.style.color = l.color || 'black';
  if (l.size) d.style.fontSize = l.size;
  if (l.bg) d.style.background = '#fff';
  box.appendChild(d);
});
</script>
</body>
</html>
