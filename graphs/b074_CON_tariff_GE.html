<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line id="ax-x" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="ax-y" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="dash-v0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-h0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-v1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-h1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="ray0" stroke="#888" stroke-width="1.4"/>
    <line id="ray1" stroke="#555" stroke-width="1.4"/>


    <path id="ciscA0" fill="none" stroke="#5DCAA5" stroke-width="1.4"/>
    <path id="ciscB0" fill="none" stroke="#8F88D8" stroke-width="1.4"/>
    <path id="ciscA1" fill="none" stroke="#5DCAA5" stroke-width="1.4"/>
    <path id="ciscB1" fill="none" stroke="#8F88D8" stroke-width="1.4"/>


    <path id="conB" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>

    <path id="con0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="con1" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>


    <line id="shift" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <circle id="pt-0" r="5" fill="#000"/>
    <circle id="pt-1" r="5" fill="#000"/>
    <line id="tick-x0" stroke="black" stroke-width="1"/>
    <line id="tick-y0" stroke="black" stroke-width="1"/>
    <line id="tick-x1" stroke="black" stroke-width="1"/>
    <line id="tick-y1" stroke="black" stroke-width="1"/>
  </svg>
  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-y"></div>
  <div class="katex-label" id="lbl-con0"></div>
  <div class="katex-label" id="lbl-con1"></div>
  <div class="katex-label" id="lbl-conB"></div>
  <div class="katex-label" id="lbl-ray0"></div>
  <div class="katex-label" id="lbl-ray1"></div>
  <div class="katex-label" id="lbl-shift"></div>
  <div class="katex-label" id="lbl-ciscA0"></div>
  <div class="katex-label" id="lbl-ciscB0"></div>
  <div class="katex-label" id="lbl-ciscA1"></div>
  <div class="katex-label" id="lbl-ciscB1"></div>
  <div class="katex-label" id="lbl-0"></div>
  <div class="katex-label" id="lbl-1"></div>
  <div class="katex-label" id="lbl-x0"></div>
  <div class="katex-label" id="lbl-y0"></div>
  <div class="katex-label" id="lbl-x1"></div>
  <div class="katex-label" id="lbl-y1"></div>
</div>
<script>

const ox = 80, oy = 530, k = 60;
function P(x, y) { return [ox + x * k, oy - y * k]; }
function set(id, a) { const e = document.getElementById(id); for (const q in a) e.setAttribute(q, a[q]); }
function path(id, f, x0, x1, ymax) {
  const pts = [];
  for (let i = 0; i <= 400; i++) {
    const x = x0 + (x1 - x0) * i / 400, y = f(x);
    if (y < 0 || y > ymax) continue;
    const [sx, sy] = P(x, y); pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
  set(id, {d: 'M' + pts.join(' L')});
}
set('ax-x', {x1: ox, y1: oy, x2: 640, y2: oy});
set('ax-y', {x1: ox, y1: oy, x2: ox, y2: 40});


const X0 = 6.4, Y0 = 4.8;
const a0 = Y0 / (X0 * X0), b = Y0 * Y0 / X0;
const conB = x => Math.sqrt(b * x);

const X1 = 0.65 * X0, Y1 = conB(X1);
const a1 = Y1 / (X1 * X1);
const con0 = x => a0 * x * x, con1 = x => a1 * x * x;
const s0 = Y0 / X0, s1 = Y1 / X1;

path('con0', con0, 0, 9, 7.9);
path('con1', con1, 0, 9, 7.9);
path('conB', conB, 0, 8.6, 7.9);




const al = a0 / 2, be = 1 / (2 * b);
const uA0 = Y0 - al * X0 * X0, uA1 = Y1 - al * X1 * X1;
const vB0 = X0 - be * Y0 * Y0, vB1 = X1 - be * Y1 * Y1;
const ciscA = u => x => u + al * x * x;
function pathY(id, v, y0, y1, xmax) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const y = y0 + (y1 - y0) * i / 300, x = v + be * y * y; if (x > xmax) break;
    const [sx, sy] = P(x, y); pts.push(sx.toFixed(1) + ',' + sy.toFixed(1)); }
  set(id, {d: 'M' + pts.join(' L')});
}
const cA = 1.25;
path('ciscA0', ciscA(uA0), cA, 7.2, 7.9);
path('ciscA1', ciscA(uA1), cA, 5.2, 7.9);
pathY('ciscB0', vB0, 0.45, 5.3, 9.4);
const cB1 = 6.3;
pathY('ciscB1', vB1, 1.3, cB1, 9.4);

const r0e = 7.6, r1e = 5.7;
set('ray0', {x1: ox, y1: oy, x2: P(r0e, s0 * r0e)[0], y2: P(r0e, s0 * r0e)[1]});
set('ray1', {x1: ox, y1: oy, x2: P(r1e, s1 * r1e)[0], y2: P(r1e, s1 * r1e)[1]});

const [e0x, e0y] = P(X0, Y0), [e1x, e1y] = P(X1, Y1);
set('pt-0', {cx: e0x, cy: e0y}); set('pt-1', {cx: e1x, cy: e1y});
set('dash-v0', {x1: e0x, y1: e0y, x2: e0x, y2: oy}); set('dash-h0', {x1: ox, y1: e0y, x2: e0x, y2: e0y});
set('dash-v1', {x1: e1x, y1: e1y, x2: e1x, y2: oy}); set('dash-h1', {x1: ox, y1: e1y, x2: e1x, y2: e1y});
set('tick-x0', {x1: e0x, x2: e0x, y1: oy, y2: oy + 4}); set('tick-x1', {x1: e1x, x2: e1x, y1: oy, y2: oy + 4});
set('tick-y0', {x1: ox - 4, x2: ox, y1: e0y, y2: e0y}); set('tick-y1', {x1: ox - 4, x2: ox, y1: e1y, y2: e1y});


const ya = 6.3;
const xa = Math.sqrt(ya / a0);
const sl = 2 * a0 * xa;
let nx = -sl, ny = 1; const nn = Math.hypot(nx, ny); nx /= nn; ny /= nn;
let lam = 0; for (; lam < 5; lam += 0.002) { const x = xa + lam * nx, y = ya + lam * ny; if (y >= con1(x)) break; }
const gap = 0.13;
const [sa, sb] = P(xa + gap * nx, ya + gap * ny), [ta, tb] = P(xa + (lam - gap) * nx, ya + (lam - gap) * ny);
set('shift', {x1: sa, y1: sb, x2: ta, y2: tb});

const VBW = 680, VBH = 600;
const pw = v => (v / VBW * 100).toFixed(1) + '%', ph = v => (v / VBH * 100).toFixed(1) + '%';
[
  {id:'lbl-x',     tex:'X',  left: 644, top: oy - 14, size:17},
  {id:'lbl-y',     tex:'Y',  left: ox - 8, top: 36, size:17, align:'right'},
  {id:'lbl-con0',  tex:'\\text{CON}^A_0', left: P(Math.sqrt(7.9/a0), 0)[0] + 6, top: 34, size:16, color:'#0F6E56'},
  {id:'lbl-con1',  tex:'\\text{CON}^A_1', left: P(Math.sqrt(7.9/a1), 0)[0] - 8, top: 34, size:16, color:'#0F6E56', align:'right'},
  {id:'lbl-conB',  tex:'\\text{CON}^B', left: P(8.6, 0)[0] + 6, top: P(0, conB(8.6))[1] - 12, size:16, color:'#534AB7'},
  {id:'lbl-ray0',  tex:'\\text{RRI}_0^*', left: P(r0e, 0)[0] + 6, top: P(0, s0 * r0e)[1] - 14, size:16, color:'#555'},
  {id:'lbl-ray1',  tex:'\\text{RRI}_1^*', left: P(r1e, 0)[0] - 7, top: P(0, s1 * r1e)[1] - 28, size:16, color:'#555', center:true},
  {id:'lbl-shift', tex:'t > 0', left: (sa + ta) / 2 - 14, top: Math.min(sb, tb) - 26, size:14, color:'#1D9E75'},
  {id:'lbl-ciscA0', tex:'\\text{CISC}^A_0', left: P(cA, 0)[0] - 5, top: P(0, ciscA(uA0)(cA))[1] - 9, size:15, color:'#1D9E75', align:'right'},
  {id:'lbl-ciscA1', tex:'\\text{CISC}^A_1', left: P(cA, 0)[0] - 5, top: P(0, ciscA(uA1)(cA))[1] - 17, size:15, color:'#1D9E75', align:'right'},
  {id:'lbl-ciscB0', tex:'\\text{CISC}^B_0', left: P(vB0 + be * 0.45 * 0.45, 0)[0] + 6, top: P(0, 0.45)[1] - 14, size:15, color:'#534AB7', bg:true},
  {id:'lbl-ciscB1', tex:'\\text{CISC}^B_1', left: P(vB1 + be * cB1 * cB1, 0)[0] + 5, top: P(0, cB1)[1] - 14, size:15, color:'#534AB7'},
  {id:'lbl-0',     tex:'0', left: e0x + 8, top: e0y + 4,  size:16, color:'#000'},
  {id:'lbl-1',     tex:'1', left: e1x - 18, top: e1y - 26, size:16, color:'#000'},
  {id:'lbl-x0',    tex:'X_0', left: e0x, top: oy + 6, size:15, center:true},
  {id:'lbl-x1',    tex:'X_1', left: e1x, top: oy + 6, size:15, center:true},
  {id:'lbl-y0',    tex:'Y_0', left: ox - 7, top: e0y - 12, size:15, align:'right'},
  {id:'lbl-y1',    tex:'Y_1', left: ox - 7, top: e1y - 12, size:15, align:'right'}
].forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pw(l.left); el.style.top = ph(l.top);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.color = l.color || 'black';
  if (l.center) el.style.transform = 'translateX(-50%)';
  if (l.align === 'right') el.classList.add('right-of-axis');
  if (l.bg) { el.style.background = 'white'; el.style.padding = '0 2px'; }
});
</script>
</body>
</html>
