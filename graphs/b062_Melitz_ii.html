<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line id="ax-x" x1="90" x2="585" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="ax-y" x1="90" x2="90" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="pi-0" stroke="#378ADD" stroke-width="2.2"/>

    <line id="pi-1" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4"/>

    <line id="pi-x" stroke="#D85A30" stroke-width="2.2"/>


    <path id="rot" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="tick-c0" x1="86" x2="90" stroke="black" stroke-width="1"/>
    <line id="tick-c0x" x1="86" x2="90" stroke="black" stroke-width="1"/>


    <circle id="pt-0" r="5" fill="black"/>
    <circle id="pt-1" r="5" fill="black"/>
    <circle id="pt-x" r="5" fill="black"/>
  </svg>

  <div class="katex-label" id="lbl-pi"></div>
  <div class="katex-label" id="lbl-phi"></div>
  <div class="katex-label" id="lbl-pi0"></div>
  <div class="katex-label" id="lbl-pi1"></div>
  <div class="katex-label" id="lbl-pix"></div>
  <div class="katex-label" id="lbl-c0"></div>
  <div class="katex-label" id="lbl-c0x"></div>
  <div class="katex-label" id="lbl-phi0"></div>
  <div class="katex-label" id="lbl-phi1"></div>
  <div class="katex-label" id="lbl-phix"></div>
  <div class="katex-label" id="lbl-rot"></div>
</div>

<script>

const ox = 90, pw = 485;
const axY = 330, ky = 36;
function X(phi) { return ox + phi / 10 * pw; }
function Y(pi)  { return axY - pi * ky; }

const c0 = 2.0, c0x = 3.5;
const B0 = 1.2;
const B1 = 0.7;
const Bx = 0.45;
const phi0 = c0 / B0, phi1 = c0 / B1, phix = c0x / Bx;

function set(id, a) { const e = document.getElementById(id); for (const k in a) e.setAttribute(k, a[k]); }
function seg(id, B, c, end) { set(id, {x1: X(0), y1: Y(-c), x2: X(end), y2: Y(B * end - c)}); }
set('ax-x', {y1: axY, y2: axY});
set('ax-y', {y1: Y(-c0x) + 45});
const e0 = 7.6, e1 = 9.4, ex = 9.6;
seg('pi-0', B0, c0, e0); seg('pi-1', B1, c0, e1); seg('pi-x', Bx, c0x, ex);
set('tick-c0',  {y1: Y(-c0),  y2: Y(-c0)});
set('tick-c0x', {y1: Y(-c0x), y2: Y(-c0x)});
set('pt-0', {cx: X(phi0), cy: axY});
set('pt-1', {cx: X(phi1), cy: axY});
set('pt-x', {cx: X(phix), cy: axY});


const Px = X(0), Py = Y(-c0), R = 400;
function ang(B) { return Math.atan2(-(B * ky), pw / 10); }
const a0 = ang(B0), a1 = ang(B1), gap = 0.035;
const s0 = a0 + gap, s1 = a1 - gap;
const [sx, sy] = [Px + R * Math.cos(s0), Py + R * Math.sin(s0)];
const [tx, ty] = [Px + R * Math.cos(s1), Py + R * Math.sin(s1)];
set('rot', {d: `M${sx.toFixed(1)} ${sy.toFixed(1)} A${R} ${R} 0 0 1 ${tx.toFixed(1)} ${ty.toFixed(1)}`});
const am = (a0 + a1) / 2;
const rotLab = [Px + (R + 8) * Math.cos(am), Py + (R + 8) * Math.sin(am)];

const VBW = 680, VBH = 560;
function pctW(v) { return (v / VBW * 100).toFixed(1) + '%'; }
function pctH(v) { return (v / VBH * 100).toFixed(1) + '%'; }

[
  {id:'lbl-pi',   tex:'\\pi',                 left: ox - 8,        top: 38,               size:17, align:'right'},
  {id:'lbl-phi',  tex:'\\psi^{\\sigma-1}', left: 591,           top: axY - 14,         size:17},
  {id:'lbl-pi0',  tex:'\\pi_0(\\psi)',     left: X(e0) + 6,     top: Y(B0*e0-c0) - 14, size:16, color:'#378ADD'},
  {id:'lbl-pi1',  tex:'\\pi_1(\\psi)',     left: X(e1) + 6,     top: Y(B1*e1-c0) - 14, size:16, color:'#378ADD'},
  {id:'lbl-pix',  tex:'\\pi_X(\\psi)',     left: X(ex) - 20,    top: Y(Bx*ex-c0x) - 34, size:16, color:'#D85A30'},
  {id:'lbl-c0',   tex:'-c_0',                 left: ox - 7,        top: Y(-c0) - 13,      size:15, align:'right'},
  {id:'lbl-c0x',  tex:'-c_{0X}',              left: ox - 7,        top: Y(-c0x) - 13,     size:15, align:'right'},
  {id:'lbl-phi0', tex:'\\bar{\\psi}_0^{\\,\\sigma-1}', left: X(phi0) - 8, top: axY - 34, size:15, align:'right'},
  {id:'lbl-phi1', tex:'\\bar{\\psi}_1^{\\,\\sigma-1}', left: X(phi1) + 8, top: axY + 6,  size:15},
  {id:'lbl-phix', tex:'\\bar{\\psi}_X^{\\,\\sigma-1}', left: X(phix) + 8, top: axY + 6,  size:15},
  {id:'lbl-rot',  tex:'B_1 < B_0',       left: rotLab[0],     top: rotLab[1] - 12,   size:14, color:'#1D9E75'}
].forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pctW(l.left); el.style.top = pctH(l.top);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.color = l.color || 'black';
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
</body>
</html>
