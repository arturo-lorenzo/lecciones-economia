<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="460" x2="570" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="460" x2="130" y2="55"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="ls" stroke="#534AB7" stroke-width="2.2"/>
    <line id="ld" stroke="#1D9E75" stroke-width="2.2"/>


    <line id="de-line" stroke="#378ADD" stroke-width="2.2"/>


    <g id="du-arrow"></g>


    <line id="d-w0"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-wcp" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-lcp" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-ls0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <g id="ticks"></g>


    <circle id="pt-w" r="4" fill="#999"/>
    <circle id="pt0" r="5" fill="#000"/>
    <circle id="pts" r="3.5" fill="white" stroke="#888" stroke-width="1.4"/>
  </svg>

</div>

<script>







const aS = 0.5, bS = 0.6;
const aD = 11,  bD = 0.8;
const wCP = (aD - aS) * bS / (bS + bD) + aS;
const LCP = (aD - aS) / (bS + bD);
const Lbar = 4.5;
const w0 = aD - bD * Lbar;
const Ls0 = (w0 - aS) / bS;


const Lmax = 14, wmax = 10, VBH = 520, VBW = 680;
const sx = L => 130 + L * (427.06 / Lmax);
const sy = w => 460 - w * (390 / wmax);
const pctX = x => (x / VBW * 100).toFixed(1) + '%';
const pctY = y => (y / VBH * 100).toFixed(1) + '%';

function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}

setLine('ls', sx(0.8),  sy(aS + bS*0.8),  sx(13.5), sy(aS + bS*13.5));
setLine('ld', sx(1.25), sy(aD - bD*1.25), sx(13),   sy(aD - bD*13));
setLine('de-line', sx(Lbar), sy(0), sx(Lbar), sy(9.3));


setLine('d-w0',  sx(0), sy(w0), sx(Ls0), sy(w0));
setLine('d-wcp', sx(0), sy(wCP), sx(LCP), sy(wCP));
setLine('d-lcp', sx(LCP), sy(wCP), sx(LCP), sy(0));
setLine('d-ls0', sx(Ls0), sy(w0), sx(Ls0), sy(0));


const duG = document.getElementById('du-arrow');
const duLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
const duY = sy(w0) - 12;
duLine.setAttribute('x1', sx(Lbar) + 6); duLine.setAttribute('y1', duY);
duLine.setAttribute('x2', sx(Ls0) - 6);  duLine.setAttribute('y2', duY);
duLine.setAttribute('stroke', '#555'); duLine.setAttribute('stroke-width', '1.2');
duLine.setAttribute('marker-start', 'url(#arrow)');
duLine.setAttribute('marker-end', 'url(#arrow)');
duG.appendChild(duLine);


const ticksG = document.getElementById('ticks');
function addTick(x1, y1, x2, y2) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1);
  t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
addTick(126, sy(w0), 130, sy(w0));
addTick(126, sy(wCP), 130, sy(wCP));
addTick(sx(Lbar), 460, sx(Lbar), 464);
addTick(sx(LCP), 460, sx(LCP), 464);
addTick(sx(Ls0), 460, sx(Ls0), 464);


document.getElementById('pt0').setAttribute('cx', sx(Lbar));
document.getElementById('pt0').setAttribute('cy', sy(w0));
document.getElementById('pt-w').setAttribute('cx', sx(LCP));
document.getElementById('pt-w').setAttribute('cy', sy(wCP));
document.getElementById('pts').setAttribute('cx', sx(Ls0));
document.getElementById('pts').setAttribute('cy', sy(w0));


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', P = '#534AB7', B = '#378ADD', O = '#D85A30', T = '#555';
put('lbl-w', 'w/P', 122, 36, {ha: 'r', s: 17});
put('lbl-l', 'L', 584, 468, {s: 17});
put('lbl-o', 'O', 122, 468, {ha: 'r'});
put('lbl-w0', '(w/P)_0', 122, sy(w0), {ha: 'r', va: 'm'});
put('lbl-wcp', '(w/P)_C', 122, sy(wCP), {ha: 'r', va: 'm'});
put('lbl-lbar', '\\bar{L}', sx(Lbar), 468, {ha: 'c'});
put('lbl-lcp', 'L_C', sx(LCP), 468, {ha: 'c'});
put('lbl-ls0', 'L_0^s', sx(Ls0), 468, {ha: 'c'});
put('lbl-ls', 'L^s(w/P)', sx(13.5) + 6, sy(aS + bS*13.5), {va: 'm', c: P});
put('lbl-ld', 'L^d(w/P)', sx(13) + 6, sy(aD - bD*13), {va: 'm', c: G});
put('lbl-de', '\\text{demanda efectiva}', sx(Lbar) + 8, sy(9.3), {va: 't', c: B});
put('lbl-p0', '0', sx(Lbar) - 8, sy(w0) + 6, {ha: 'r', va: 't', c: '#000'});
put('lbl-du', '\\text{desempleo involuntario}', (sx(Lbar) + sx(Ls0))/2, duY - 6, {ha: 'c', va: 'b', c: T, s: 15});
</script>
</body>
</html>
