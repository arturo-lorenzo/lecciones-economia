<script>
const LABELS = [{"t": "p_2", "x": 16.471, "y": 5.862, "a": "-100%,-50%", "c": "#000", "s": 17, "bg": false}, {"t": "p_1", "x": 90.882, "y": 82.759, "a": "0,-50%", "c": "#000", "s": 17, "bg": false}, {"t": "45^\\circ", "x": 25.147, "y": 79.655, "a": "0,-50%", "c": "#888", "s": 13, "bg": false}, {"t": "p_1 = p_2", "x": 75.294, "y": 15.172, "a": "0,-100%", "c": "#888", "s": 14, "bg": false}, {"t": "p_2^*", "x": 16.618, "y": 41.379, "a": "-100%,-50%", "c": "#000", "s": null, "bg": false}, {"t": "p_1^*", "x": 52.941, "y": 84.138, "a": "-50%,0", "c": "#000", "s": null, "bg": false}, {"t": "0", "x": 54.118, "y": 42.069, "a": "0,0", "c": "#000", "s": null, "bg": false}, {"t": "c", "x": 24.706, "y": 84.138, "a": "-50%,0", "c": "#000", "s": null, "bg": false}, {"t": "c", "x": 16.471, "y": 74.483, "a": "-100%,-50%", "c": "#000", "s": null, "bg": false}, {"t": "\\varphi_1(p_2)", "x": 65.588, "y": 14.483, "a": "0,-50%", "c": "#378ADD", "s": null, "bg": false}, {"t": "\\varphi_2(p_1)", "x": 77.353, "y": 27.586, "a": "0,-50%", "c": "#1D9E75", "s": null, "bg": false}];

LABELS.forEach((L, i) => {

  if (L.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }

});
