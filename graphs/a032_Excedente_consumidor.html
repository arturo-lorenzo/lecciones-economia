<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="460" x2="570" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="460" x2="130" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="ec-area" fill="#378ADD" opacity="0.12"/>


    <path id="d-curve" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="p-line" stroke="#378ADD" stroke-width="2.2"/>


    <line id="x-dash" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <g id="ticks"></g>


    <circle id="pt0" r="5" fill="#000"/>

  </svg>


  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-p"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-d"></div>
  <div class="katex-label" id="lbl-ec"></div>
  <div class="katex-label" id="lbl-pt0"></div>
  <div class="katex-label" id="lbl-p0"></div>
  <div class="katex-label" id="lbl-x0"></div>

</div>

<script>







const P0 = 3.2;
const dem = x => 7.2 * Math.exp(-0.13 * x);
const X0 = Math.log(7.2 / P0) / 0.13;

function toSvgX(x) { return 130 + x * 42.24; }
function toSvgY(p) { return 460 - p * 48; }


const pts = [];
for (let i = 0; i <= 200; i++) {
  const x = (i / 200) * 10;
  const sx = toSvgX(x);
  const sy = toSvgY(dem(x));
  if (sx >= 130 && sx <= 556 && sy >= 70 && sy <= 450) {
    pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
}
document.getElementById('d-curve').setAttribute('d', 'M' + pts.join(' L'));


let d = 'M' + toSvgX(0) + ',' + toSvgY(P0).toFixed(1) +
        ' L' + toSvgX(0) + ',' + toSvgY(dem(0)).toFixed(1);
for (let i = 1; i <= 80; i++) {
  const x = (i / 80) * X0;
  d += ' L' + toSvgX(x).toFixed(1) + ',' + toSvgY(dem(x)).toFixed(1);
}
d += ' Z';
document.getElementById('ec-area').setAttribute('d', d);


const pl = document.getElementById('p-line');
pl.setAttribute('x1', toSvgX(0));   pl.setAttribute('y1', toSvgY(P0));
pl.setAttribute('x2', toSvgX(9));   pl.setAttribute('y2', toSvgY(P0));


const s0 = [toSvgX(X0), toSvgY(P0)];
document.getElementById('pt0').setAttribute('cx', s0[0]);
document.getElementById('pt0').setAttribute('cy', s0[1]);
const xd = document.getElementById('x-dash');
xd.setAttribute('x1', s0[0]); xd.setAttribute('y1', s0[1]);
xd.setAttribute('x2', s0[0]); xd.setAttribute('y2', 460);


const ticksG = document.getElementById('ticks');
function addTick(x1, y1, x2, y2) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1);
  t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
addTick(126, s0[1], 130, s0[1]);
addTick(s0[0], 460, s0[0], 464);


const labels = [
  {id: 'lbl-x',   tex: 'x',                 left: '84.5%',   top: '91%', color: 'black'},
  {id: 'lbl-p',   tex: 'p',                 left: '14.4%',   top: '7%',  color: 'black'},
  {id: 'lbl-o',   tex: 'O',                  left: '16.4%',   top: '92%', color: 'black'},
  {id: 'lbl-d',   tex: 'D(x)',            left: '80.1%',   top: '77%', color: '#0F6E56'},
  {id: 'lbl-ec',  tex: '\\text{EC}',        left: '28.2%',   top: '49%', color: '#185FA5'},
  {id: 'lbl-pt0', tex: '0',                  left: '59.0%',   top: '55%', color: '#000'},
  {id: 'lbl-p0',  tex: 'p_0',               left: '17.6%', top: '59%', color: 'black', align: 'right'},
  {id: 'lbl-x0',  tex: 'x_0',               left: '56.3%',   top: '93%', color: 'black'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
</body>
</html>
