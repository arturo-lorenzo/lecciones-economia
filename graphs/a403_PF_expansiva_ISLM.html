<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="120" y1="460" x2="560" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="460" x2="120" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="340" y1="265" x2="340" y2="460" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="375.2" y1="226" x2="375.2" y2="460" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="401.6" y1="265" x2="401.6" y2="460" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="120" y1="265" x2="401.6" y2="265" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="120" y1="226" x2="375.2" y2="226" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>

    <line x1="340" y1="460" x2="340" y2="464" stroke="black" stroke-width="1"/>
    <line x1="375.2" y1="460" x2="375.2" y2="464" stroke="black" stroke-width="1"/>
    <line x1="401.6" y1="460" x2="401.6" y2="464" stroke="black" stroke-width="1"/>
    <line x1="116" y1="265" x2="120" y2="265" stroke="black" stroke-width="1"/>
    <line x1="116" y1="226" x2="120" y2="226" stroke="black" stroke-width="1"/>

    <line x1="234.4" y1="109" x2="458.8" y2="440.5" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="296" y1="109" x2="520.4" y2="440.5" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>

    <line x1="181.6" y1="440.5" x2="498.4" y2="89.5" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>

    <line id="shift" stroke="#378ADD" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow)"/>

    <line x1="399.8" y1="492" x2="378.7" y2="492" stroke="#D85A30" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="340" cy="265" r="5" fill="#000"/>
    <circle cx="375.2" cy="226" r="5" fill="#000"/>
    <circle cx="401.6" cy="265" r="5" fill="#000"/>
  </svg>
</div>
<script>
const VBW = 680, VBH = 560;

const d = Math.hypot(224.4, 331.5), n = [331.5/d, -224.4/d];
const gap = 61.6*n[0];
const by = 395, bx = 234.4 + (by - 109)/331.5*224.4;
const s = document.getElementById('shift');
const x1 = bx + n[0]*7, y1 = by + n[1]*7, x2 = bx + n[0]*(gap - 7), y2 = by + n[1]*(gap - 7);
s.setAttribute('x1', x1); s.setAttribute('y1', y1); s.setAttribute('x2', x2); s.setAttribute('y2', y2);

function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const O = '#D85A30', B = '#378ADD', G = '#1D9E75';
put('lbl-i', 'i', 112, 58, {ha: 'r', s: 18});
put('lbl-Y', 'Y', 568, 460, {va: 'm', s: 18});
put('lbl-O', 'O', 112, 466, {ha: 'r'});
put('lbl-IS0', '\\text{IS}_0', 462.3, 440, {va: 'm', c: B});
put('lbl-IS1', '\\text{IS}_1', 523.9, 440, {va: 'm', c: B});
put('lbl-LM', '\\text{LM}', 503.7, 86, {va: 'm', c: G});
put('lbl-0', '0', 340, 254, {ha: 'c', va: 'b', c: '#000'});
put('lbl-1', '1', 375.2, 214, {ha: 'c', va: 'b', c: '#000'});
put('lbl-0p', "0'", 408.6, 258, {va: 'm', c: '#000'});
put('lbl-i0', 'i_0', 112, 265, {ha: 'r', va: 'm', s: 15});
put('lbl-i1', 'i_1', 112, 226, {ha: 'r', va: 'm', s: 15});
put('lbl-Y0', 'Y_0', 340, 468, {ha: 'c', s: 15});
put('lbl-Y1', 'Y_1', 375.2, 468, {ha: 'c', s: 15});
put('lbl-Y0p', "Y_{0'}", 402.5, 468, {ha: 'c', s: 15});
put('lbl-dG', '\\Delta G_0 > 0', 486, y2, {va: 'm', c: B, s: 14});
put('lbl-exp', '\\text{expulsión}', 389.3, 500, {ha: 'c', c: O, s: 14});
</script>
</body>
</html>
