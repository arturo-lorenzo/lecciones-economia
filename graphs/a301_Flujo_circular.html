<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <rect x="40" y="200" width="150" height="100" rx="6" fill="#fff" stroke="black" stroke-width="1.4"/>
    <rect x="490" y="200" width="150" height="100" rx="6" fill="#fff" stroke="black" stroke-width="1.4"/>
    <path d="M115,200 C115,60 565,60 565,196" fill="none" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M565,300 C565,440 115,440 115,304" fill="none" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M490,225 L194,225" fill="none" stroke="#378ADD" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M190,275 L486,275" fill="none" stroke="#378ADD" stroke-width="2.2" marker-end="url(#arrow)"/>
    <circle cx="340.0" cy="225.0" r="5" fill="#D85A30"/>
    <circle cx="340.0" cy="275.0" r="5" fill="#D85A30"/>
    <circle cx="565.0" cy="300.0" r="5" fill="#D85A30"/>
    <line x1="150.0" y1="472.0" x2="185.0" y2="472.0" stroke="#1D9E75" stroke-width="2.2"/>
    <line x1="390.0" y1="472.0" x2="425.0" y2="472.0" stroke="#378ADD" stroke-width="2.2"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
  <div class="katex-label" id="lbl7"></div>
  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
<script>
const VBW = 680, VBH = 500;

const labels = [
 {
  "id": "lbl0",
  "tex": "\\text{corriente real}",
  "x": 193,
  "y": 472,
  "anchor": "lm",
  "color": "#0F6E56",
  "size": 15
 },
 {
  "id": "lbl1",
  "tex": "\\text{corriente monetaria}",
  "x": 433,
  "y": 472,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 15
 },
 {
  "id": "lbl2",
  "tex": "\\textbf{Hogares}",
  "x": 115,
  "y": 250,
  "anchor": "cm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "\\textbf{Empresas}",
  "x": 565,
  "y": 250,
  "anchor": "cm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "\\text{factores productivos (trabajo, capital)}",
  "x": 340,
  "y": 88,
  "anchor": "cb",
  "color": "#0F6E56",
  "size": 15
 },
 {
  "id": "lbl5",
  "tex": "\\text{bienes y servicios}",
  "x": 340,
  "y": 414,
  "anchor": "ct",
  "color": "#0F6E56",
  "size": 15
 },
 {
  "id": "lbl6",
  "tex": "\\text{rentas: salarios, beneficios, intereses}",
  "x": 340,
  "y": 214,
  "anchor": "cb",
  "color": "#378ADD",
  "size": 15
 },
 {
  "id": "lbl7",
  "tex": "\\text{gasto en bienes y servicios}",
  "x": 340,
  "y": 284,
  "anchor": "ct",
  "color": "#378ADD",
  "size": 15
 },
 {
  "id": "lbl8",
  "tex": "\\text{(2) Renta}",
  "x": 340,
  "y": 235,
  "anchor": "ct",
  "color": "#D85A30",
  "size": 15
 },
 {
  "id": "lbl9",
  "tex": "\\text{(3) Gasto}",
  "x": 340,
  "y": 309,
  "anchor": "ct",
  "color": "#D85A30",
  "size": 15
 },
 {
  "id": "lbl10",
  "tex": "\\text{(1) Producción}",
  "x": 553,
  "y": 310,
  "anchor": "rt",
  "color": "#D85A30",
  "size": 15
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
