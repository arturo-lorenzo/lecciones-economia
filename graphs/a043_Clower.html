<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-left" viewBox="0 0 10 10" refX="2" refY="5"
              markerWidth="5" markerHeight="5" orient="0">
        <path d="M8 1L2 5L8 9" fill="none" stroke="black"
              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <clipPath id="plotArea">
        <rect x="125" y="80" width="470" height="430"/>
      </clipPath>
    </defs>


    <line x1="125" y1="510" x2="595" y2="510" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="125" y1="510" x2="125" y2="80"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="prod-fn" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" clip-path="url(#plotArea)"/>


    <line id="wage-line" stroke="black" stroke-width="1.5" clip-path="url(#plotArea)"/>


    <path id="ic-u" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" clip-path="url(#plotArea)"/>


    <path id="ic-up" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" clip-path="url(#plotArea)"/>


    <circle id="pt-A" r="5" fill="#000"/>

    <circle id="pt-Ap" r="5" fill="#000"/>


    <line id="dash-YD" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-YS" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="dash-LD" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-LS" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="tick-YD" stroke="black" stroke-width="1"/>
    <line id="tick-YS" stroke="black" stroke-width="1"/>

    <line id="tick-LD" stroke="black" stroke-width="1"/>
    <line id="tick-LS" stroke="black" stroke-width="1"/>


    <line id="brace-y1" stroke="black" stroke-width="1"/>
    <line id="brace-y2" stroke="black" stroke-width="1"/>
    <line id="brace-y3" stroke="black" stroke-width="1"/>
    <line id="brace-y4" stroke="black" stroke-width="1"/>


    <line id="brace-x1" stroke="black" stroke-width="1"/>
    <line id="brace-x2" stroke="black" stroke-width="1"/>
    <line id="brace-x3" stroke="black" stroke-width="1"/>
    <line id="brace-x4" stroke="black" stroke-width="1"/>



  </svg>


  <div class="katex-label" id="lbl-yci"></div>
  <div class="katex-label" id="lbl-L"></div>
  <div class="katex-label" id="lbl-fL"></div>
  <div class="katex-label" id="lbl-A"></div>
  <div class="katex-label" id="lbl-Ap"></div>
  <div class="katex-label" id="lbl-u"></div>
  <div class="katex-label" id="lbl-up"></div>
  <div class="katex-label" id="lbl-w"></div>
  <div class="katex-label" id="lbl-YD"></div>
  <div class="katex-label" id="lbl-YS"></div>
  <div class="katex-label" id="lbl-LD"></div>
  <div class="katex-label" id="lbl-LS"></div>
  <div class="katex-label" id="lbl-exD"></div>
  <div class="katex-label" id="lbl-exL"></div>

</div>

<script>


const OX = 125, OY = 510, XEND = 595, YTOP = 80;



const A_f = 4.2, alpha_f = 0.4;
function fL(L) { return A_f * Math.pow(L, alpha_f); }
function fL_prime(L) { return A_f * alpha_f * Math.pow(L, alpha_f - 1); }


function toSvgX(L) { return OX + L * 63.27; }
function toSvgY(Y) { return OY - Y * 40; }
function fromSvgX(sx) { return (sx - OX) / 63.27; }




const Ld = 2.4;
const Yap = fL(Ld);
const sxAp = toSvgX(Ld), syAp = toSvgY(Yap);



const Ls = 5.8;
const Ya = Yap + fL_prime(Ld) * (Ls - Ld);
const sxA = toSvgX(Ls), syA = toSvgY(Ya);


const pts = [];
for (let i = 1; i <= 300; i++) {
  const L = (i / 300) * 7.5;
  const Y = fL(L);
  const sx = toSvgX(L), sy = toSvgY(Y);
  if (sy >= YTOP + 5 && sx <= XEND - 5) pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
}
document.getElementById('prod-fn').setAttribute('d', 'M' + toSvgX(0) + ',' + OY + ' L' + pts.join(' L'));


const wSlope = fL_prime(Ld);
const wLine = (L) => Yap + wSlope * (L - Ld);
const wL1 = 1.0, wL2 = 6.75;
const wX1 = toSvgX(wL1), wY1 = toSvgY(wLine(wL1));
const wX2 = toSvgX(wL2), wY2 = toSvgY(wLine(wL2));
const el = (id) => document.getElementById(id);
function setL(id, x1, y1, x2, y2) {
  const e = el(id);
  e.setAttribute('x1', x1); e.setAttribute('y1', y1);
  e.setAttribute('x2', x2); e.setAttribute('y2', y2);
}
setL('wage-line', wX1, wY1, wX2, wY2);






const L0 = 1.6;
const kU = wSlope / (2 * (Ls - L0)), spreadU = 1 / kU;
const Uu = Ya - kU * (Ls - L0) ** 2;
const Uup = Yap - kU * (Ld - L0) ** 2;
const icY = (U, L) => U + kU * (L - L0) ** 2;
function genIC(Lc, Yc, spread, Lmin, Lmax, n) {
  const icPts = [];
  for (let i = 0; i <= n; i++) {
    const L = Lmin + (i / n) * (Lmax - Lmin);
    const dL = L - Lc;
    const Y = Yc + (dL * dL) / spread;
    const sx = toSvgX(L), sy = toSvgY(Y);
    if (sy >= YTOP + 5 && sy <= OY && sx >= OX && sx <= XEND - 5) {
      icPts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
    }
  }
  return 'M' + icPts.join(' L');
}


el('ic-u').setAttribute('d', genIC(L0, Uu, spreadU, 3.4, 7.5, 200));

el('ic-up').setAttribute('d', genIC(L0, Uup, spreadU, L0, 6.65, 200));


el('pt-A').setAttribute('cx', sxA);
el('pt-A').setAttribute('cy', syA);
el('pt-Ap').setAttribute('cx', sxAp);
el('pt-Ap').setAttribute('cy', syAp);



setL('dash-YD', OX, syA, sxA, syA);

setL('dash-YS', OX, syAp, sxAp, syAp);

setL('dash-LD', sxAp, syAp, sxAp, OY);

setL('dash-LS', sxA, syA, sxA, OY);


setL('tick-YD', OX - 4, syA, OX, syA);
setL('tick-YS', OX - 4, syAp, OX, syAp);
setL('tick-LD', sxAp, OY, sxAp, OY + 4);
setL('tick-LS', sxA, OY, sxA, OY + 4);


const bx = OX - 45;
setL('brace-y1', bx, syA, bx + 5, syA);
setL('brace-y2', bx, syA, bx, syAp);
setL('brace-y3', bx, syAp, bx + 5, syAp);

setL('brace-y4', bx, (syA + syAp) / 2, bx - 5, (syA + syAp) / 2);


const by = OY + 34;
setL('brace-x1', sxAp, by - 5, sxAp, by);
setL('brace-x2', sxAp, by, sxA, by);
setL('brace-x3', sxA, by - 5, sxA, by);
setL('brace-x4', (sxAp + sxA) / 2, by, (sxAp + sxA) / 2, by + 5);





const W = 680, H = 900;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const LuLab = 6.9, LupLab = 6.65;
const labels = [
  {id:'lbl-yci',  tex:'Y, C',        left: pct(OX - 8, W), top: pct(YTOP - 10, H),      color:'black', align:'right'},
  {id:'lbl-L',    tex:'L',            left: pct(XEND + 2, W), top: pct(OY, H),     color:'black'},
  {id:'lbl-fL',   tex:'f(L)',         left: pct(toSvgX(7.357) + 5, W), top: pct(toSvgY(fL(7.357)) - 9, H), color:'#378ADD'},
  {id:'lbl-A',    tex:'0',            left: pct(sxA - 18, W), top: pct(syA - 30, H), color:'#000'},
  {id:'lbl-Ap',   tex:'1',            left: pct(sxAp - 18, W), top: pct(syAp - 30, H), color:'#000'},
  {id:'lbl-u',    tex:'u',            left: pct(toSvgX(LuLab) + 6, W), top: pct(toSvgY(icY(Uu, LuLab)) - 10, H), color:'black'},
  {id:'lbl-up',   tex:"u'",           left: pct(toSvgX(LupLab) + 5, W), top: pct(toSvgY(icY(Uup, LupLab)) - 2, H), color:'black'},
  {id:'lbl-w',    tex:'w/P',          left: pct(wX1 - 6, W), top: pct(wY1 - 12, H), color:'black', align:'right'},
  {id:'lbl-YD',   tex:'Y^d',          left: pct(OX - 6, W), top: pct(syA - 12, H), color:'black', align:'right'},
  {id:'lbl-YS',   tex:'Y^s',          left: pct(OX - 6, W), top: pct(syAp - 12, H), color:'black', align:'right'},
  {id:'lbl-LD',   tex:'L^d',          left: pct(sxAp - 9, W), top: pct(OY + 5, H), color:'black'},
  {id:'lbl-LS',   tex:'L^s',          left: pct(sxA - 9, W), top: pct(OY + 5, H), color:'black'},
  {id:'lbl-exD',  tex:'\\begin{array}{r}\\text{Exceso}\\\\[-2pt]\\text{bienes}\\end{array}', left: pct(bx - 4, W), top: pct((syA + syAp) / 2 - 15, H), color:'black', size:'10.5px', align:'right'},
  {id:'lbl-exL',  tex:'\\text{Exceso oferta } L\\text{ (desempleo)}', left: pct((sxAp + sxA) / 2, W), top: pct(by + 7, H), color:'black', size:'11px', center:true}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.align === 'right') e.classList.add('right-of-axis');
  if (l.size) e.style.fontSize = l.size;
  if (l.center) e.style.transform = 'translateX(-50%)';
});





const NS = 'http://www.w3.org/2000/svg', svg = document.querySelector('svg');
function mk(tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); svg.appendChild(e); return e; }
const OY2 = 840, SW2 = 160, toY2 = w => OY2 - w * SW2;
const w0 = wSlope, Lsup = w => L0 + w / (2 * kU), Ldem = w => Math.pow(w / (A_f * alpha_f), 1 / (alpha_f - 1));
let lo = 0.2, hi = w0; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (Ldem(m) > Lsup(m)) lo = m; else hi = m; }
const wW = (lo + hi) / 2, LW = Lsup(wW);
mk('line', {x1: OX, y1: OY2, x2: XEND, y2: OY2, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
mk('line', {x1: OX, y1: OY2, x2: OX, y2: OY2 - 245, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
function poly(fn, a, b, n) { const q = []; for (let i = 0; i <= n; i++) { const L = a + (b - a) * i / n; q.push(toSvgX(L).toFixed(1) + ',' + toY2(fn(L)).toFixed(1)); } return 'M' + q.join(' L'); }
mk('path', {d: poly(L => fL_prime(L), 1.32, 7.2, 200), fill: 'none', stroke: '#378ADD', 'stroke-width': 2.2, 'stroke-linecap': 'round'});
mk('path', {d: poly(L => 2 * kU * (L - L0), L0, 6.95, 100), fill: 'none', stroke: 'black', 'stroke-width': 2.2, 'stroke-linecap': 'round'});
const G2 = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'};
mk('line', Object.assign({x1: OX, y1: toY2(w0), x2: toSvgX(Ls), y2: toY2(w0)}, G2));
mk('line', Object.assign({x1: OX, y1: toY2(wW), x2: toSvgX(LW), y2: toY2(wW)}, G2));
for (const [L, w] of [[Ld, w0], [Ls, w0], [LW, wW]]) {
  mk('line', Object.assign({x1: toSvgX(L), y1: toY2(w), x2: toSvgX(L), y2: OY2}, G2));
  mk('line', {x1: toSvgX(L), y1: OY2, x2: toSvgX(L), y2: OY2 + 4, stroke: 'black', 'stroke-width': 1});
}
for (const L of [Ld, Ls]) mk('line', {x1: toSvgX(L), y1: OY + 62, x2: toSvgX(L), y2: toY2(w0), stroke: '#bbb', 'stroke-width': 0.8, 'stroke-dasharray': '2 3'});
mk('line', {x1: OX - 4, y1: toY2(w0), x2: OX, y2: toY2(w0), stroke: 'black', 'stroke-width': 1});
mk('line', {x1: OX - 4, y1: toY2(wW), x2: OX, y2: toY2(wW), stroke: 'black', 'stroke-width': 1});
mk('line', {x1: toSvgX(Ld) + 7, y1: toY2(w0) - 14, x2: toSvgX(Ls) - 7, y2: toY2(w0) - 14, stroke: '#555', 'stroke-width': 1.2, 'marker-start': 'url(#arrow)', 'marker-end': 'url(#arrow)'});
mk('circle', {cx: toSvgX(Ld), cy: toY2(w0), r: 5, fill: '#000'});
mk('circle', {cx: toSvgX(Ls), cy: toY2(w0), r: 5, fill: '#000'});
mk('circle', {cx: toSvgX(LW), cy: toY2(wW), r: 4, fill: '#fff', stroke: '#000', 'stroke-width': 1.4});
const cont2 = document.querySelector('.graph-container');
[['w/P', OX - 8, OY2 - 245, 'black', 'r', 'm'],
 ['L', XEND + 4, OY2, 'black', 'l', 'm'],
 ['L^d', toSvgX(7.2) + 6, toY2(fL_prime(7.2)), '#378ADD', 'l', 'm'],
 ['L^s', toSvgX(6.95) + 6, toY2(2 * kU * (6.95 - L0)), 'black', 'l', 'm'],
 ['w/P', OX - 8, toY2(w0), 'black', 'r', 'm', '15px'],
 ['(w/P)_{\\text{W}}', OX - 8, toY2(wW), 'black', 'r', 'm', '14px'],
 ['1', toSvgX(Ld) - 8, toY2(w0) + 6, 'black', 'r', 't'],
 ['0', toSvgX(Ls) + 8, toY2(w0) + 6, 'black', 'l', 't'],
 ['\\text{W}', toSvgX(LW) + 8, toY2(wW) + 4, 'black', 'l', 't'],
 ['\\text{paro}', (toSvgX(Ld) + toSvgX(Ls)) / 2, toY2(w0) - 18, '#555', 'c', 'b', '12px'],
 ['L^d', toSvgX(Ld), OY2 + 6, 'black', 'c', 't'],
 ['L^s', toSvgX(Ls), OY2 + 6, 'black', 'c', 't'],
 ['L_{\\text{W}}', toSvgX(LW), OY2 + 6, 'black', 'c', 't']].forEach(([tex, x, y, c, ha, va, size]) => {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / W * 100) + '%'; e.style.top = (y / H * 100) + '%'; e.style.color = c;
  if (size) e.style.fontSize = size;
  e.style.transform = `translate(${ha === 'r' ? '-100%' : ha === 'c' ? '-50%' : '0'}, ${va === 'm' ? '-50%' : va === 'b' ? '-100%' : '0'})`;
  cont2.appendChild(e);
});
</script>
</body>
</html>
