<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 540">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>

</div>

<script>







const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 540;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');

const M0 = 380, L = 220, p1 = 0.6, p2 = 0.4, rho = p2;
const OX = 105, OY = 460, S = 0.9;
const sx = x => OX + x * S;
const sy = y => OY - y * S;

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e);
  return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function dash(x1, y1, x2, y2) { line(x1, y1, x2, y2, '#888', 0.8, {'stroke-dasharray': '6 4'}); }
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = null) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%';
  d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color;
  if (size) d.style.fontSize = size;
  container.appendChild(d);
}


line(OX, OY, 567, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(OX, OY, OX, 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});


const CMAX = 410;
line(sx(0), sy(0), sx(CMAX), sy(CMAX), '#1D9E75', 1.4);
el('path', {d: `M ${OX + 40},${OY} A 40,40 0 0,0 ${(OX + 40 * Math.SQRT1_2).toFixed(1)},${(OY - 40 * Math.SQRT1_2).toFixed(1)}`,
            fill: 'none', stroke: 'black', 'stroke-width': 0.8});


const x2line = x1 => M0 / rho - L - (1 - rho) / rho * x1;
const x1top = (M0 / rho - L - 380) * rho / (1 - rho);
const x1bot = (M0 / rho - L) * rho / (1 - rho);
line(sx(x1top), sy(380), sx(x1bot), sy(0), '#D85A30', 2.2);


const C = M0 - rho * L;
const ic = x1 => Math.pow(C, 1 / p2) * Math.pow(x1, -p1 / p2);
const pts = [];
const x1a = C * Math.pow(C / 430, p2 / p1);
for (let i = 0; i <= 300; i++) {
  const x1 = x1a + (i / 300) * (470 - x1a);
  pts.push(sx(x1).toFixed(1) + ',' + sy(ic(x1)).toFixed(1));
}
el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: '#378ADD', 'stroke-width': 2.2, 'stroke-linecap': 'round'});


const E0 = [sx(M0), sy(M0 - L)], E1 = [sx(C), sy(C)];
dash(E0[0], E0[1], E0[0], OY); dash(E0[0], E0[1], OX, E0[1]);
dash(E1[0], E1[1], E1[0], OY); dash(E1[0], E1[1], OX, E1[1]);
[E0[0], E1[0]].forEach(x => line(x, OY, x, OY + 4, 'black', 1));
[E0[1], E1[1]].forEach(y => line(OX - 4, y, OX, y, 'black', 1));


el('circle', {cx: E0[0], cy: E0[1], r: 5, fill: '#000'});
el('circle', {cx: E1[0], cy: E1[1], r: 5, fill: '#000'});


lab('x_1', 569, OY + 4, 'black', 0, 0);
lab('x_2', OX, 34, 'black', 0.5, 1);
lab('O', OX - 6, OY + 4, 'black', 1, 0);
lab('M_0', E0[0], OY + 8, 'black', 0.5, 0);
lab('M_0 - \\gamma L', E1[0], OY + 8, 'black', 0.5, 0);
lab('M_0 - L', OX - 8, E0[1], 'black', 1, 0.5);
lab('M_0 - \\gamma L', OX - 8, E1[1], 'black', 1, 0.5);
lab('0', E0[0] - 8, E0[1] + 5, '#000', 1, 0);
lab('1', E1[0] + 22, E1[1] + 2, '#000', 0, 0.5);
lab('45^\\circ', OX + 46, OY - 17, 'black', 0, 0.5, '14px');
lab('\\text{L.C.}', sx(CMAX) + 4, sy(CMAX) - 2, '#0F6E56', 0, 0.5);
lab('\\text{R.A.}', sx(x1top) - 8, sy(380), '#D85A30', 1, 0.5);

{ const vx = sx(x1bot), vy = OY, r = 34, k = Math.hypot(1, (1 - rho) / rho);
  const ex = vx - r / k, ey = vy - r * ((1 - rho) / rho) / k;
  el('path', {d: `M ${vx - r},${vy} A ${r},${r} 0 0,1 ${ex.toFixed(1)},${ey.toFixed(1)}`, fill: 'none', stroke: '#888', 'stroke-width': 0.9}); }
lab('-\\dfrac{1-\\gamma}{\\gamma}', sx(x1bot) + 14, OY - 26, '#D85A30', 0, 0.5, '14px');
lab('u^e', sx(470) + 6, sy(ic(470)), '#185FA5', 0, 0.5);
</script>
</body>
</html>
