<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="135" y1="410" x2="545" y2="410" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="135" y1="410" x2="135" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path id="seig-curve" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <line id="dash-h" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <circle id="pt-peak" r="5" fill="#000"/>
  </svg>
</div>
<script>
const W=680,H=480,OX=135,OY=410;
const U=110;
const XMAX=3.5;
const PEAK=110;

function sig(u){return u*Math.exp(-u);}
const K=(OY-PEAK)/sig(1);
function sx(u){return OX+u*U;}
function sy(u){return OY-K*sig(u);}
const NS='http://www.w3.org/2000/svg';
const el=id=>document.getElementById(id);
function setL(e,x1,y1,x2,y2){if(typeof e==='string')e=el(e);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);return e;}
function mk(tag,a,parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(parent||document.querySelector('svg')).appendChild(e);return e;}
const pts=[];for(let i=0;i<=300;i++){const u=i/300*XMAX;pts.push(sx(u).toFixed(1)+','+sy(u).toFixed(1));}
el('seig-curve').setAttribute('d','M'+pts.join(' L'));
el('pt-peak').setAttribute('cx',sx(1));el('pt-peak').setAttribute('cy',sy(1));
setL('dash-h',OX,sy(1),sx(1),sy(1));
setL('dash-v',sx(1),sy(1),sx(1),OY);
mk('line',{x1:sx(1),y1:OY,x2:sx(1),y2:OY+4,stroke:'black','stroke-width':1});
mk('line',{x1:OX-4,y1:sy(1),x2:OX,y2:sy(1),stroke:'black','stroke-width':1});

function pct(v,t){return(v/t*100).toFixed(2)+'%';}

const LBL=[
  ['lbl-sig','\\sigma',OX-8,46,'black',18,'r',false],
  ['lbl-gM','g_M',553,412,'black',18,'l',false],
  ['lbl-gMstar','g_M^* = \\dfrac{1}{a}',sx(1),OY+26,'black',16,'c',false],
  ['lbl-sigstar','\\sigma^*',OX-8,sy(1),'black',16,'r',false],
  ['lbl-curve','\\sigma(g_M)',sx(XMAX)+8,sy(XMAX)-14,'#378ADD',16,'l',false],
  ['lbl-0','O',OX-8,OY+12,'black',16,'r',false]
];
const c=document.querySelector('.graph-container');
LBL.forEach(([id,tex,x,y,color,size,anc,bg])=>{
  const e=document.createElement('div');e.className='katex-label';e.id=id;c.appendChild(e);
  katex.render(tex,e,{throwOnError:false});
  e.style.left=pct(x,W);e.style.top=pct(y,H);e.style.color=color;e.style.fontSize=size+'px';
  e.style.transform=(anc==='r'?'translate(-100%,-50%)':anc==='c'?'translate(-50%,-50%)':'translate(0,-50%)');
  if(bg){e.style.background='#fff';const k=e.querySelector('.katex');if(k)k.style.padding='0 2px';}
});
</script>
</body>
</html>
