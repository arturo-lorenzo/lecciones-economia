<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="120" y1="460" x2="560" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="460" x2="120" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <g id="curves"></g>
    <g id="arrows"></g>
    <g id="points"></g>
  </svg>
</div>
<script>







const ybar = 40, P0 = 35, P1 = 55, PeLo = 45, PeHi = 65;
const da = (y, c) => c - y, oa = (y, pe) => pe + (y - ybar);
const cut = pe => { const y = (95 - pe + ybar)/2; return [y, da(y, 95)]; };
const A0 = [ybar, P0], A1 = [ybar, P1], Ap = cut(PeLo), App = cut(PeHi);
const VBW = 680, VBH = 500;

const OX = 120, SX = 5.5;
const X = y => OX + y*SX, Y = p => 460 - p*5;
const NS = 'http://www.w3.org/2000/svg';
function el(g, tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); document.getElementById(g).appendChild(e); return e; }
function line(g, x1, y1, x2, y2, att) { return el(g, 'line', Object.assign({x1, y1, x2, y2}, att)); }
const dash = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, tk = {stroke: 'black', 'stroke-width': 1};
const cD = '#378ADD', cO = '#1D9E75', cPt = '#D85A30', grey = '#888';
const L = []; function put(tex, x, y, o = {}) { L.push(Object.assign({tex, x, y}, o)); }


line('guides', X(0), Y(P0), X(ybar), Y(P0), dash); line('guides', OX - 4, Y(P0), OX, Y(P0), tk);
line('guides', X(0), Y(P1), X(ybar), Y(P1), dash); line('guides', OX - 4, Y(P1), OX, Y(P1), tk);
[Ap, App].forEach(p => { line('guides', X(p[0]), Y(p[1]), X(p[0]), Y(0), dash); line('guides', X(p[0]), 460, X(p[0]), 464, tk); });
line('guides', X(ybar), 460, X(ybar), 464, tk);


line('curves', X(ybar), Y(0), X(ybar), Y(76), {stroke: cPt, 'stroke-width': 2.2});
line('curves', X(6), Y(da(6, 75)), X(70), Y(da(70, 75)), {stroke: cD, 'stroke-width': 2.2});
line('curves', X(25), Y(da(25, 95)), X(78), Y(da(78, 95)), {stroke: cD, 'stroke-width': 2.2, 'stroke-dasharray': '8 4'});
const yEnd = 52;
const oaLine = (pe, a, att) => line('curves', X(a), Y(oa(a, pe)), X(yEnd), Y(oa(yEnd, pe)), att);
oaLine(P0,   12, {stroke: cO, 'stroke-width': 2.2});
oaLine(PeLo,  4, {stroke: cO, 'stroke-width': 2.2, 'stroke-dasharray': '3 3'});
oaLine(P1,    2, {stroke: cO, 'stroke-width': 2.2, 'stroke-dasharray': '8 4'});
oaLine(PeHi,  2, {stroke: cO, 'stroke-width': 2.2, 'stroke-dasharray': '3 3'});


(function () {
  const sl = 5/SX, n = Math.hypot(1, sl), nx = sl/n, ny = -1/n, d = 20*5/n, xa = X(56), ya = Y(da(56, 75));
  line('arrows', xa + nx*6, ya + ny*6, xa + nx*(d - 7), ya + ny*(d - 7), {stroke: cD, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  const my = ya + ny*d/2, yv = 95 - (460 - my)/5;
  put('\\Delta M^s > 0', X(yv) + 24, my, {c: cD, s: 14, va: 'm'});
})();

line('arrows', X(ybar) - 9, Y(P0 + 2.5), X(ybar) - 9, Y(P1 - 2.5), {stroke: grey, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});


[A0, A1, Ap, App].forEach(p => el('points', 'circle', {cx: X(p[0]), cy: Y(p[1]), r: 5, fill: '#000'}));


put('Y', 564, 460, {va: 'm', s: 17});
put('P', OX - 8, 58, {ha: 'r', s: 17});
put('\\text{OA}_{\\text{LP}}', X(ybar) + 6, Y(76), {c: cPt, va: 'm'});
put('\\text{DA}_0', X(70) + 5, Y(da(70, 75)), {c: cD, va: 'm'});
put('\\text{DA}_1', X(78) + 5, Y(da(78, 95)), {c: cD, va: 'm'});
put('\\text{OA}_{\\text{CP},0}', X(yEnd) + 5, Y(oa(yEnd, P0)), {c: cO, va: 'm'});
put('\\text{OA}_{\\text{CP}}(P^e < P_1)', X(yEnd) + 5, Y(oa(yEnd, PeLo)), {c: cO, va: 'm'});
put('\\text{OA}_{\\text{CP},1}', X(yEnd) + 5, Y(oa(yEnd, P1)), {c: cO, va: 'm'});
put('\\text{OA}_{\\text{CP}}(P^e > P_1)', X(yEnd) + 5, Y(oa(yEnd, PeHi)), {c: cO, va: 'm'});
put('0', X(A0[0]) + 5, Y(A0[1]) - 12, {c: '#000', va: 'b'});
put('1', X(A1[0]) + 5, Y(A1[1]) - 17, {c: '#000', va: 'b'});
put("0'", X(Ap[0]), Y(Ap[1]) - 10, {c: '#000', ha: 'c', va: 'b'});
put("0''", X(App[0]), Y(App[1]) - 10, {c: '#000', ha: 'c', va: 'b'});
put('P_0', OX - 8, Y(P0), {ha: 'r', va: 'm', s: 15});
put('P_1', OX - 8, Y(P1), {ha: 'r', va: 'm', s: 15});
put('\\bar{Y}', X(ybar), 468, {ha: 'c', s: 15});
put("Y_{0'}", X(Ap[0]), 468, {ha: 'c', s: 15});
put("Y_{0''}", X(App[0]), 468, {ha: 'c', s: 15});
put("\\text{creíble: } 0 \\to 1", OX + 12, 64, {c: grey, s: 14});
put("\\text{no creíble: } 0' \\text{ o } 0''", OX + 12, 86, {c: grey, s: 14});

const cont = document.querySelector('.graph-container');
L.forEach((l, i) => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x/VBW*100).toFixed(2) + '%'; e.style.top = (l.y/VBH*100).toFixed(2) + '%';
  e.style.color = l.c || 'black'; if (l.s) e.style.fontSize = l.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[l.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[l.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
});
</script>
</body>
</html>
