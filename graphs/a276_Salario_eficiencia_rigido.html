<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="133" y1="460" x2="587" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="133" y1="460" x2="133" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="d-wcp" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-l1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-l0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-ls" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="ls" stroke="#534AB7" stroke-width="2.2"/>
    <line id="ld0" stroke="#1D9E75" stroke-width="2.2"/>
    <line id="ld1" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="7 5"/>

    <line id="wstar-line" stroke="#378ADD" stroke-width="1.4"/>


    <line id="shift-arrow" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="u-arrow" stroke="#555" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <g id="ticks"></g>
    <circle id="pt0" r="5" fill="#000"/>
    <circle id="pt1" r="5" fill="#000"/>
  </svg>
</div>

<script>





const aS = 0.5, bS = 0.6;
const aD = 11,  bD = 0.8;
const shift = 1.6;
const wStar = 6.5;
const LCP = (aD - aS)/(bS + bD), wCP = aS + bS*LCP;
const L0 = (aD - wStar)/bD;
const L1 = (aD - shift - wStar)/bD;
const Lsup = (wStar - aS)/bS;
const d0 = L => aD - bD*L, d1 = L => aD - shift - bD*L, s = L => aS + bS*L;


const VBW = 680, VBH = 570;
const kx = 30.9, ky = 39;
const sx = L => 133 + L*kx;
const sy = w => 460 - w*ky;
const $ = id => document.getElementById(id);
function setL(id, x1, y1, x2, y2) { const e = $(id); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); }

setL('ls', sx(0.8), sy(s(0.8)), sx(13.5), sy(s(13.5)));
setL('ld0', sx(1.25), sy(d0(1.25)), sx(13), sy(d0(13)));
setL('ld1', sx(0.3), sy(d1(0.3)), sx(11), sy(d1(11)));
setL('wstar-line', sx(0), sy(wStar), sx(Lsup), sy(wStar));


const ux = kx, uy = bD*ky;
const un = Math.hypot(ux, uy);
const nx = -uy/un, ny = ux/un;
const dist = shift*ky*ux/un;
const La = 11.3;
const ax0 = sx(La), ay0 = sy(d0(La));
setL('shift-arrow', ax0 + nx*6, ay0 + ny*6, ax0 + nx*(dist - 6), ay0 + ny*(dist - 6));

setL('d-wcp', sx(0), sy(wCP), sx(LCP), sy(wCP));
setL('d-l1', sx(L1), sy(wStar), sx(L1), sy(0));
setL('d-l0', sx(L0), sy(wStar), sx(L0), sy(0));
setL('d-ls', sx(Lsup), sy(wStar), sx(Lsup), sy(0));
const uY = 508;
setL('u-arrow', sx(L0) + 6, uY, sx(Lsup) - 6, uY);

const tg = $('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line'); t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2); t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
tick(129, sy(wStar), 133, sy(wStar)); tick(129, sy(wCP), 133, sy(wCP));
[L1, L0, Lsup].forEach(L => tick(sx(L), 460, sx(L), 464));

$('pt0').setAttribute('cx', sx(L0)); $('pt0').setAttribute('cy', sy(wStar));
$('pt1').setAttribute('cx', sx(L1)); $('pt1').setAttribute('cy', sy(wStar));


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', P = '#534AB7', B = '#378ADD', O = '#D85A30', T = '#555';
put('lbl-w', 'w', 123, 36, {ha: 'r', s: 17});
put('lbl-l', 'L', 591, 468, {s: 17});
put('lbl-o', 'O', 125, 468, {ha: 'r'});
put('lbl-wstar', 'w^{*}', 125, sy(wStar), {ha: 'r', va: 'm'});
put('lbl-wcp', 'w_C', 125, sy(wCP), {ha: 'r', va: 'm'});
put('lbl-l1', 'L_1', sx(L1), 468, {ha: 'c'});
put('lbl-l0', 'L_0', sx(L0), 468, {ha: 'c'});
put('lbl-lsq', 'L^s(w^{*})', sx(Lsup), 468, {ha: 'c'});
put('lbl-ls', 'L^s(w)', sx(13.5) + 6, sy(s(13.5)), {va: 'm', c: P});
put('lbl-ld0', 'L^d_0(w)', sx(13) + 6, sy(d0(13)), {va: 'm', c: G});
put('lbl-ld1', 'L^d_1(w)', sx(11) + 6, sy(d1(11)), {va: 'm', c: G});
put('lbl-p0', '0', sx(L0) + 8, sy(wStar) - 5, {va: 'b', c: '#000'});
put('lbl-p1', '1', sx(L1) + 8, sy(wStar) - 5, {va: 'b', c: '#000'});
put('lbl-shift', '\\Delta A < 0', ax0 + 6, ay0 - 4, {va: 'b', c: G, s: 14});
put('lbl-u', '\\text{desempleo involuntario}', (sx(L0) + sx(Lsup))/2, uY + 9, {ha: 'c', c: T, s: 15});
</script>
</body>
</html>
