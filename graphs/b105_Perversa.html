<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 560">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="110" y1="460" x2="550" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="460" x2="110" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="demand"   stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>
    <line id="demandUA" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <path id="cmeA" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="cmeB" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="dCB0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dCA0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dPA"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dPB"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <circle id="ptB0" r="5" fill="#000"/>
    <circle id="ptA0" r="5" fill="#000"/>
    <circle id="pt1"  r="5" fill="#000"/>
    <circle id="ptH"  r="5" fill="white" stroke="#000" stroke-width="2"/>

  </svg>


  <div class="katex-label" id="lbl-q"></div>
  <div class="katex-label" id="lbl-p"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-cmeA"></div>
  <div class="katex-label" id="lbl-cmeB"></div>
  <div class="katex-label" id="lbl-d"></div>
  <div class="katex-label" id="lbl-dua"></div>
  <div class="katex-label" id="lbl-cB0"></div>
  <div class="katex-label" id="lbl-cA0"></div>
  <div class="katex-label" id="lbl-pUAA"></div>
  <div class="katex-label" id="lbl-pUAB"></div>
  <div class="katex-label" id="lbl-0A"></div>
  <div class="katex-label" id="lbl-0B"></div>
  <div class="katex-label" id="lbl-1"></div>

</div>

<script>











const W = 680, H = 560;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }
const D = q => 18 - 0.75 * q, DUA = q => 18 - 0.375 * q;
const cmeA = q => 3.5 + 90 / (q + 3), cmeB = q => 2.5 + 90 / (q + 3);
function root(f, a, b) { for (let i = 0; i < 80; i++) { const m = (a + b) / 2; (f(a) * f(m) <= 0) ? b = m : a = m; } return (a + b) / 2; }
const qB0 = root(q => D(q) - cmeB(q), 1, 8), qA0 = root(q => D(q) - cmeA(q), 7, 16);
const q1 = root(q => DUA(q) - cmeA(q), 20, 38), qH = root(q => DUA(q) - cmeB(q), 20, 38);
const B0 = {q: qB0, p: D(qB0)}, A0 = {q: qA0, p: D(qA0)}, P1 = {q: q1, p: DUA(q1)}, PH = {q: qH, p: DUA(qH)};

const toSvgX = q => 110 + q * 11.3, toSvgY = p => 460 - p * (400 / 19);
function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1); el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}
setLine('demand',   toSvgX(0), toSvgY(D(0)),   toSvgX(19),   toSvgY(D(19)));
setLine('demandUA', toSvgX(0), toSvgY(DUA(0)), toSvgX(38),   toSvgY(DUA(38)));
function genCurve(fn, id, qMin, qMax) {
  const pts = [];
  for (let i = 0; i <= 240; i++) {
    const q = qMin + (i / 240) * (qMax - qMin);
    pts.push(toSvgX(q).toFixed(1) + ',' + toSvgY(fn(q)).toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(cmeA, 'cmeA', 90 / 14.8 - 3, 38);
genCurve(cmeB, 'cmeB', 90 / 15.8 - 3, 38);
setLine('dCB0', toSvgX(0), toSvgY(B0.p), toSvgX(B0.q), toSvgY(B0.p));
setLine('dCA0', toSvgX(0), toSvgY(A0.p), toSvgX(A0.q), toSvgY(A0.p));
setLine('dPA', toSvgX(0), toSvgY(P1.p), toSvgX(P1.q), toSvgY(P1.p));
setLine('dPB', toSvgX(0), toSvgY(PH.p), toSvgX(PH.q), toSvgY(PH.p));
function setPt(id, pt) { const el = document.getElementById(id); el.setAttribute('cx', toSvgX(pt.q)); el.setAttribute('cy', toSvgY(pt.p)); }
setPt('ptB0', B0); setPt('ptA0', A0); setPt('pt1', P1); setPt('ptH', PH);

const labels = [
  {id: 'lbl-q', tex: 'y', x: 554, y: 462, a: 'lt', s: '17px'},
  {id: 'lbl-p', tex: 'p', x: 102,  y: 50,  a: 'rt', s: '17px'},
  {id: 'lbl-o', tex: 'O', x: 104,  y: 466, a: 'rt'},
  {id: 'lbl-cmeA', tex: '\\text{Cme}^A(y)', x: toSvgX(38) + 5, y: toSvgY(cmeA(38)) - 3, a: 'lb', c: '#0F6E56'},
  {id: 'lbl-cmeB', tex: '\\text{Cme}^B(y)', x: toSvgX(38) + 5, y: toSvgY(cmeB(38)) + 3, a: 'lt', c: '#0F6E56'},
  {id: 'lbl-d',    tex: 'D^A(y) = D^B(y)',  x: toSvgX(19) + 4, y: toSvgY(D(19)) + 2, a: 'lt', c: '#534AB7'},
  {id: 'lbl-dua',  tex: 'D^{\\text{UA}}(y)',        x: toSvgX(38) + 4, y: toSvgY(DUA(38)) + 10, a: 'lt', c: '#534AB7'},
  {id: 'lbl-cB0',  tex: 'c^B_0',    x: 103, y: toSvgY(B0.p), a: 'rm', s: '15px'},
  {id: 'lbl-cA0',  tex: 'c^A_0',    x: 103, y: toSvgY(A0.p), a: 'rm', s: '15px'},
  {id: 'lbl-pUAA', tex: 'p^A_{\\text{UA}}', x: 103, y: toSvgY(P1.p) - 3, a: 'rm', s: '15px'},
  {id: 'lbl-pUAB', tex: 'p^B_{\\text{UA}}', x: 103, y: toSvgY(PH.p) + 3, a: 'rm', s: '15px'},
  {id: 'lbl-0B', tex: '0^B', x: toSvgX(B0.q) - 8, y: toSvgY(B0.p) + 6, a: 'rt', c: '#000', s: '15px'},
  {id: 'lbl-0A', tex: '0^A', x: toSvgX(A0.q) + 9, y: toSvgY(A0.p) - 4, a: 'lb', c: '#000', s: '15px'},
  {id: 'lbl-1',  tex: '1',   x: toSvgX(P1.q),     y: toSvgY(P1.p) - 10, a: 'cb', c: '#000', s: '15px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
