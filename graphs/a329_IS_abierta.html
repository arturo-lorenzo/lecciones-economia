<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <line x1="103.5" y1="460.0" x2="543.5" y2="460.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="103.5" y1="460.0" x2="103.5" y2="60.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="293.6" y1="232.0" x2="293.6" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="293.6" y1="460.0" x2="293.6" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="103.5" y1="232.0" x2="293.6" y2="232.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="99.5" y1="232.0" x2="103.5" y2="232.0" stroke="black" stroke-width="1"/>
    <line x1="462.5" y1="308.0" x2="462.5" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="462.5" y1="460.0" x2="462.5" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="103.5" y1="308.0" x2="462.5" y2="308.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="99.5" y1="308.0" x2="103.5" y2="308.0" stroke="black" stroke-width="1"/>
    <line x1="364.0" y1="308.0" x2="364.0" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="364.0" y1="460.0" x2="364.0" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="128.8" y1="157.9" x2="500.6" y2="325.1" stroke="#888" stroke-width="2.2" stroke-dasharray="8 4"/>
    <line x1="166.9" y1="95.2" x2="449.9" y2="400.7" stroke="#1D9E75" stroke-width="2.2"/>
    <circle cx="293.6" cy="232.0" r="5" fill="#000"/>
    <circle cx="364.0" cy="308.0" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
  <div class="katex-label" id="lbl7"></div>
  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
  <div class="katex-label" id="lbl11"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "r",
  "x": 95.5,
  "y": 58,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl1",
  "tex": "Y",
  "x": 549.5,
  "y": 460,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "O",
  "x": 95.5,
  "y": 466,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "\\text{IS (cerrada)}",
  "x": 506.6,
  "y": 325.1,
  "anchor": "lm",
  "color": "#666",
  "size": 15
 },
 {
  "id": "lbl4",
  "tex": "\\text{IS}",
  "x": 455.9,
  "y": 400.7,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "0",
  "x": 303.6,
  "y": 226.0,
  "anchor": "lb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "1",
  "x": 354.0,
  "y": 314.0,
  "anchor": "rt",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl7",
  "tex": "r_0",
  "x": 95.5,
  "y": 232.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl8",
  "tex": "r_1",
  "x": 95.5,
  "y": 308.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl9",
  "tex": "Y_0",
  "x": 293.6,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl10",
  "tex": "Y_1",
  "x": 364.0,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl11",
  "tex": "Y_1^{\\text{c}}",
  "x": 462.5,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
