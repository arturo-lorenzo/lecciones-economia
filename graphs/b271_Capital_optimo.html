<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 480">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
  </svg>
</div>

<script>

const NS = 'http://www.w3.org/2000/svg';
const svg = document.querySelector('.graph-container svg');
const cont = document.querySelector('.graph-container');
const VBW = 680, VBH = +svg.getAttribute('viewBox').split(' ')[3];
const pctX = x => (x / VBW * 100).toFixed(2) + '%';
const pctY = y => (y / VBH * 100).toFixed(2) + '%';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
function line(id, x1, y1, x2, y2, stroke, w, extra) {
  return el('line', Object.assign({id, x1, y1, x2, y2, stroke, 'stroke-width': w}, extra || {}));
}
function guide(id, x1, y1, x2, y2) { return line(id, x1, y1, x2, y2, '#888', 0.8, {'stroke-dasharray': '6 4'}); }
function path(id, pts, stroke, w, extra) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
  return el('path', Object.assign({id, d, fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': 'round'}, extra || {}));
}
function dot(id, x, y, fill, r) { return el('circle', {id, cx: x, cy: y, r: r || 5, fill}); }
function tickX(x) { line('', x, OY, x, OY + 4, 'black', 1); }
function tickY(y) { line('', OX - 4, y, OX, y, 'black', 1); }
function label(id, tex, x, y, color, size, opt) {
  opt = opt || {};
  const d = document.createElement('div');
  d.className = 'katex-label'; d.id = id; cont.appendChild(d);
  katex.render(tex, d, {throwOnError: false});
  d.style.left = pctX(x); d.style.top = pctY(y);
  d.style.color = color || 'black'; d.style.fontSize = (size || 16) + 'px';
  d.style.whiteSpace = 'nowrap';
  if (opt.right) d.classList.add('right-of-axis');
  if (opt.center) d.style.transform = 'translateX(-50%)';
  if (opt.bg) { d.style.background = '#fff'; const k = d.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  return d;
}
function axes() {
  line('axis-x', OX, OY, XEND, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  line('axis-y', OX, OY, OX, YEND, 'black', 1.2, {'marker-end': 'url(#arrow)'});
}







const OX = 125, OY = 420, XEND = OX + 418, YEND = 40;
const UK = 19;
const b = 0.2, m = 1.6, K0 = 8, K1 = 8 + Math.log(m) / b;
const sx = k => OX + k * UK, sy = v => OY - v * 110;
const B0 = k => Math.exp(-b * (k - K0)), B1 = k => m * B0(k);
axes();
function curve(f, kmin, kmax) { const p = []; for (let i = 0; i <= 300; i++) { const k = kmin + (kmax - kmin) * i / 300; p.push([sx(k), sy(f(k))]); } return p; }
const k0min = K0 - Math.log(3.1) / b, k1min = K0 + (Math.log(m) - Math.log(2.6)) / b;
const p0 = curve(B0, k0min, 19.5), p1 = curve(B1, k1min, 19.5);
guide('g-0v', sx(K0), sy(1), sx(K0), OY);
guide('g-1v', sx(K1), sy(1), sx(K1), OY);
tickX(sx(K0)); tickX(sx(K1)); tickY(sy(1));
line('cmg', OX, sy(1), sx(19.5), sy(1), '#378ADD', 2.2);
path('bmg0', p0, '#1D9E75', 2.2);
path('bmg1', p1, '#1D9E75', 2.2, {'stroke-dasharray': '7 5'});

(function () {
  const k = 6.6, x = sx(k), y = sy(B0(k));
  const dk = 0.01, dx = sx(k + dk) - x, dy = sy(B0(k + dk)) - y, n = Math.hypot(dx, dy);
  let nx = dy / n, ny = -dx / n; if (ny > 0) { nx = -nx; ny = -ny; }

  let t = 0; for (; t < 300; t += 0.5) { const X = x + nx * t, Y = y + ny * t; const kk = (X - OX) / UK; if (Y <= sy(B1(kk))) break; }
  const a = 7, e = t - 8;
  line('arr', x + nx * a, y + ny * a, x + nx * e, y + ny * e, '#1D9E75', 1.2, {'marker-end': 'url(#arrow)'});
  window.ARR = [x + nx * (t / 2), y + ny * (t / 2)];
})();
dot('p0', sx(K0), sy(1), '#000');
dot('p1', sx(K1), sy(1), '#000');


label('l-y', '\\text{Bmg},\\ \\text{Cmg}', OX + 10, YEND - 12, 'black', 17);
label('l-x', '\\text{RC}', XEND + 4, OY - 12, 'black', 17);
label('l-O', 'O', OX - 20, OY + 4, 'black', 17);
label('l-c', 'c', OX - 8, sy(1) - 12, 'black', 16, {right: true});
label('l-k0', '\\text{RC}_0^*', sx(K0) - 21, OY + 6, 'black', 16);
label('l-k1', '\\text{RC}_1^*', sx(K1) - 15, OY + 6, 'black', 16);
label('l-cmg', '\\text{Cmg}(\\text{RC}) = c', sx(19.5) - 118, sy(1) - 34, '#378ADD', 16);
label('l-bmg0', '\\text{Bmg}_0(\\text{RC})', p0[0][0] + 12, p0[0][1] - 16, '#1D9E75', 16);
label('l-bmg1', '\\text{Bmg}_1(\\text{RC})', p1[0][0] + 12, p1[0][1] - 10, '#1D9E75', 16);
label('l-arr', '\\Delta C_{\\text{cr}} > 0', sx(6.6) - 100, sy(B0(6.6)) - 30, '#1D9E75', 16);
label('l-p0', '0', sx(K0) - 22, sy(1) + 2, '#000');
label('l-p1', '1', sx(K1) + 7, sy(1) - 27, '#000');

</script>
</body>
</html>
