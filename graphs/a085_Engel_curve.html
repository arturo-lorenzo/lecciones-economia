<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="engel-curve" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round"/>


    <path id="brace-normal" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
    <path id="brace-inferior" fill="none" stroke="#534AB7" stroke-width="1.5"/>


    <line id="vertex-tick" stroke="#D85A30" stroke-width="1.2"/>


    <line id="dash-b1-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-b1-v" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="dash-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="dash-b3-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-b3-v" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <circle id="pt-b1" r="4" fill="#1D9E75"/>
    <circle id="pt-turn" r="4" fill="#D85A30"/>
    <circle id="pt-b3" r="4" fill="#1D9E75"/>


    <g id="ticks"></g>

  </svg>


  <div class="katex-label" id="lbl-xi"></div>
  <div class="katex-label" id="lbl-m"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-engel"></div>
  <div class="katex-label" id="lbl-m1"></div>
  <div class="katex-label" id="lbl-m2"></div>
  <div class="katex-label" id="lbl-m3"></div>
  <div class="katex-label" id="lbl-x1"></div>
  <div class="katex-label" id="lbl-x2"></div>
  <div class="katex-label" id="lbl-x3"></div>
  <div class="katex-label" id="lbl-normal"></div>
  <div class="katex-label" id="lbl-inferior"></div>
  <div class="katex-label" id="lbl-zero"></div>

</div>

<script>

function toSvgX(x) { return 124 + x * 51.84; }
function toSvgY(y) { return 460 - y * 54; }



const A_ = 2.907, B_ = 3.8, M_TOP = 7.3;
const xOfM = M => A_ * M * Math.exp(-0.5 * (M / B_) * (M / B_));
const pts = [];
const steps = 300;
for (let i = 0; i <= steps; i++) {
  const m = (i / steps) * M_TOP;
  pts.push(toSvgX(xOfM(m)).toFixed(1) + ',' + toSvgY(m).toFixed(1));
}
document.getElementById('engel-curve').setAttribute('d', 'M' + pts.join(' L'));


const m_b1 = 1.3,  q_b1 = xOfM(m_b1);
const m_turn = B_, q_turn = xOfM(m_turn);
const m_b3 = 6.4,  q_b3 = xOfM(m_b3);
const mCenter = B_;


document.getElementById('pt-b1').setAttribute('cx', toSvgX(q_b1));
document.getElementById('pt-b1').setAttribute('cy', toSvgY(m_b1));
document.getElementById('pt-turn').setAttribute('cx', toSvgX(q_turn));
document.getElementById('pt-turn').setAttribute('cy', toSvgY(m_turn));
document.getElementById('pt-b3').setAttribute('cx', toSvgX(q_b3));
document.getElementById('pt-b3').setAttribute('cy', toSvgY(m_b3));


document.getElementById('dash-b1-h').setAttribute('x1', toSvgX(0));
document.getElementById('dash-b1-h').setAttribute('y1', toSvgY(m_b1));
document.getElementById('dash-b1-h').setAttribute('x2', toSvgX(q_b1));
document.getElementById('dash-b1-h').setAttribute('y2', toSvgY(m_b1));
document.getElementById('dash-b1-v').setAttribute('x1', toSvgX(q_b1));
document.getElementById('dash-b1-v').setAttribute('y1', toSvgY(m_b1));
document.getElementById('dash-b1-v').setAttribute('x2', toSvgX(q_b1));
document.getElementById('dash-b1-v').setAttribute('y2', toSvgY(0));

document.getElementById('dash-h').setAttribute('x1', toSvgX(0));
document.getElementById('dash-h').setAttribute('y1', toSvgY(m_turn));
document.getElementById('dash-h').setAttribute('x2', toSvgX(q_turn));
document.getElementById('dash-h').setAttribute('y2', toSvgY(m_turn));
document.getElementById('dash-v').setAttribute('x1', toSvgX(q_turn));
document.getElementById('dash-v').setAttribute('y1', toSvgY(m_turn));
document.getElementById('dash-v').setAttribute('x2', toSvgX(q_turn));
document.getElementById('dash-v').setAttribute('y2', toSvgY(0));

document.getElementById('dash-b3-h').setAttribute('x1', toSvgX(0));
document.getElementById('dash-b3-h').setAttribute('y1', toSvgY(m_b3));
document.getElementById('dash-b3-h').setAttribute('x2', toSvgX(q_b3));
document.getElementById('dash-b3-h').setAttribute('y2', toSvgY(m_b3));
document.getElementById('dash-b3-v').setAttribute('x1', toSvgX(q_b3));
document.getElementById('dash-b3-v').setAttribute('y1', toSvgY(m_b3));
document.getElementById('dash-b3-v').setAttribute('x2', toSvgX(q_b3));
document.getElementById('dash-b3-v').setAttribute('y2', toSvgY(0));


const ticksG = document.getElementById('ticks');
function addHTick(y) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', 120); t.setAttribute('x2', 124);
  t.setAttribute('y1', toSvgY(y)); t.setAttribute('y2', toSvgY(y));
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
function addVTick(x) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', toSvgX(x)); t.setAttribute('x2', toSvgX(x));
  t.setAttribute('y1', 460); t.setAttribute('y2', 464);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}

addHTick(m_b1);
addHTick(m_turn);
addHTick(m_b3);
addVTick(q_b1);
addVTick(q_turn);
addVTick(q_b3);


const mBottom = 0.15;
const mTop = M_TOP;

const braceX = toSvgX(q_turn) + 16;
const braceTip = 14;

function curlyBraceRight(x, y1, y2, tipOffset) {

  const top = Math.min(y1, y2), bot = Math.max(y1, y2);
  const mid = (top + bot) / 2, h = tipOffset / 2;
  const r = Math.min(10, (bot - top) / 4);
  const xm = x + h;
  return `M${x},${top} Q${xm},${top} ${xm},${top + r} ` +
         `L${xm},${mid - r} Q${xm},${mid} ${x + tipOffset},${mid} ` +
         `Q${xm},${mid} ${xm},${mid + r} ` +
         `L${xm},${bot - r} Q${xm},${bot} ${x},${bot}`;
}

const normalY1 = toSvgY(mBottom);
const normalY2 = toSvgY(m_turn);
document.getElementById('brace-normal').setAttribute('d',
  curlyBraceRight(braceX, normalY1, normalY2, braceTip));

const inferiorY1 = toSvgY(m_turn);
const inferiorY2 = toSvgY(mTop);
document.getElementById('brace-inferior').setAttribute('d',
  curlyBraceRight(braceX, inferiorY1, inferiorY2, braceTip));


const vtick = document.getElementById('vertex-tick');
vtick.setAttribute('x1', toSvgX(q_turn) + 6);
vtick.setAttribute('y1', toSvgY(m_turn));
vtick.setAttribute('x2', braceX);
vtick.setAttribute('y2', toSvgY(m_turn));


function toPctX(q) { return ((toSvgX(q)) / 680 * 100).toFixed(1) + '%'; }
function toPctY(m) { return ((toSvgY(m)) / 500 * 100).toFixed(1) + '%'; }

const normalMidM = (mBottom + m_turn) / 2;
const inferiorMidM = (m_turn + mTop) / 2;

const labelXpct = ((braceX + braceTip + 8) / 680 * 100).toFixed(1) + '%';

const labels = [
  {id: 'lbl-xi',       tex: 'x_i',                          left: '82.4%',          top: '91%',  color: 'black'},
  {id: 'lbl-m',        tex: 'M',                             left: '14.2%',          top: '7%',   color: 'black'},
  {id: 'lbl-o',        tex: 'O',                             left: '15.9%',          top: '92%',  color: 'black'},
  {id: 'lbl-engel',    tex: '\\text{Curva de Engel}',        left: (parseFloat(toPctX(xOfM(M_TOP))) + 1.5) + '%', top: '9.5%',   color: '#D85A30'},
  {id: 'lbl-m1',       tex: 'M_0',                           left: '16.9%',        top: (parseFloat(toPctY(m_b1)) - 2) + '%',   color: 'black', align: 'right'},
  {id: 'lbl-m2',       tex: 'M_1',                           left: '16.9%',        top: (parseFloat(toPctY(m_turn)) - 2) + '%', color: 'black', align: 'right'},
  {id: 'lbl-m3',       tex: 'M_2',                           left: '16.9%',        top: (parseFloat(toPctY(m_b3)) - 2) + '%',   color: 'black', align: 'right'},
  {id: 'lbl-x3',       tex: 'x_i^2',                      left: (parseFloat(toPctX(q_b3)) - 2) + '%',  top: '93%',  color: 'black'},
  {id: 'lbl-x1',       tex: 'x_i^0',                      left: (parseFloat(toPctX(q_b1)) - 2) + '%',  top: '93%',  color: 'black'},
  {id: 'lbl-x2',       tex: 'x_i^1',                      left: (parseFloat(toPctX(q_turn)) - 2) + '%', top: '93%',  color: 'black'},
  {id: 'lbl-normal',   tex: '\\varepsilon_{iM} > 0',         left: labelXpct,      top: (parseFloat(toPctY(normalMidM)) - 2) + '%',  color: '#1D9E75'},
  {id: 'lbl-inferior', tex: '\\varepsilon_{iM} < 0',         left: labelXpct,      top: (parseFloat(toPctY(inferiorMidM)) - 2) + '%', color: '#534AB7'},
  {id: 'lbl-zero',     tex: '\\varepsilon_{iM} = 0',         left: labelXpct,      top: (parseFloat(toPctY(m_turn)) - 2) + '%',       color: '#D85A30'}
];

labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
</body>
</html>
