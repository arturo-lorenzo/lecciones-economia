<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="60" y1="335" x2="320" y2="335" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="60" y1="335" x2="60"  y2="95"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="400" y1="335" x2="660" y2="335" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="335" x2="400" y2="95"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <g id="curves"></g>
    <g id="arrows"></g>
    <g id="points"></g>
  </svg>
</div>
<script>







const VBW = 680, VBH = 420, OY = 335;


const KY = 0.75, my = y => OY - (380 - y)*KY;
const sc = P => Object.assign({}, P, {y0: my(P.y0), m: P.m*KY, b: P.b*KY, yTop: my(P.yTop), yBot: my(P.yBot), tagY: my(P.tagY)},
  P.yTop1 ? {yTop1: my(P.yTop1)} : {}, P.yBot1 ? {yBot1: my(P.yBot1)} : {});
const NS = 'http://www.w3.org/2000/svg';
function el(g, tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); document.getElementById(g).appendChild(e); return e; }
function line(g, x1, y1, x2, y2, att) { return el(g, 'line', Object.assign({x1, y1, x2, y2}, att)); }
const dash = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, tk = {stroke: 'black', 'stroke-width': 1};
const cIS = '#378ADD', cLM = '#1D9E75', cPt = '#000000';
const L = [];
function put(tex, x, y, o = {}) { L.push(Object.assign({tex, x, y}, o)); }

function panel(P) {
  const {ox, x0, y0, m, b, H} = P;
  const lm = x => y0 - m*(x - x0), is0 = x => y0 + b*(x - x0), is1 = x => y0 + b*(x - x0 - H);
  const x0p = x0 + H;
  const x1 = x0 + b*H/(m + b), y1 = lm(x1);

  [y0, y1].forEach(y => line('guides', ox - 4, y, ox, y, tk));
  line('guides', ox, y0, x0p, y0, dash); line('guides', ox, y1, x1, y1, dash);
  [x0, x1, x0p].forEach(x => { line('guides', x, x === x1 ? y1 : y0, x, OY, dash); line('guides', x, OY, x, OY + 4, tk); });

  const yA = P.yTop, yB = P.yBot, xIS = (y, s) => x0 + s + (y - y0)/b;

  const yA1 = P.yTop1 || yA, yB1 = P.yBot1 || yB;
  line('curves', xIS(yA, 0), yA, xIS(yB, 0), yB, {stroke: cIS, 'stroke-width': 2.2});
  line('curves', xIS(yA1, H), yA1, xIS(yB1, H), yB1, {stroke: cIS, 'stroke-width': 2.2, 'stroke-dasharray': '8 4'});
  line('curves', P.lmA, lm(P.lmA), P.lmB, lm(P.lmB), {stroke: cLM, 'stroke-width': 2.2});

  const n = Math.hypot(1, b), nx = b/n, ny = -1/n, d = H*b/n, xa = P.arX, ya = is0(xa);
  line('arrows', xa + nx*7, ya + ny*7, xa + nx*(d - 7), ya + ny*(d - 7), {stroke: cIS, 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  put('\\Delta G_0 > 0', P.tagX, P.tagY, {c: cIS, s: 14, va: 'm', ha: P.tagHa || 'l', bg: P.tagBg});

  line('arrows', x0 + 7, y0 + 9, x0p - 7, y0 + 9, {stroke: '#888', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  const Ls = Math.hypot(x1 - x0p, y1 - y0), ux = (x1 - x0p)/Ls, uy = (y1 - y0)/Ls, off = P.off;
  if (Ls > 22) line('arrows', x0p + ux*7 - uy*off, y0 + uy*7 + ux*off, x1 - ux*7 - uy*off, y1 - uy*7 + ux*off, {stroke: '#888', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});

  [[x0, y0], [x0p, y0], [x1, y1]].forEach(([x, y]) => el('points', 'circle', {cx: x, cy: y, r: 5, fill: '#000'}));

  put('\\text{IS}_0', xIS(yB, 0) + P.isLab[0], yB + P.isLab[1], {c: cIS, va: 'm', ha: P.isLab[2] || 'l'});
  put('\\text{IS}_1', xIS(yB1, H) + 5, yB1, {c: cIS, va: 'm'});
  put('\\text{LM}', P.lmB + 5, lm(P.lmB) - P.lmUp, {c: cLM, va: P.lmVa});
  put('0', x0 + P.p0[0], y0 + P.p0[1], {c: cPt, ha: P.p0[2] || 'l', va: 'm'});
  put("0'", x0p + P.p0p[0], y0 + P.p0p[1], {c: cPt, ha: P.p0p[2] || 'l', va: 'm'});
  put('1', x1 + P.p1[0], y1 + P.p1[1], {c: cPt, ha: P.p1[2] || 'l', va: 'm'});

  put('i_0', ox - 7, y0, {ha: 'r', va: 'm', s: 15});
  put('i_1', ox - 7, y1, {ha: 'r', va: 'm', s: 15});
  put('Y_0', x0 + (P.ySep ? 2 : 0), OY + 7, {ha: P.ySep ? 'r' : 'c', s: 15});
  put('Y_1', x1 + (P.ySep ? -2 : (P.y1Sep ? 2 : 0)), OY + 7, {ha: P.ySep ? 'l' : (P.y1Sep ? 'r' : 'c'), s: 15});
  put("Y_{0'}", x0p - (P.y1Sep ? 2 : 0), OY + 7, {ha: P.y1Sep ? 'l' : 'c', s: 15});

  put('i', ox - 8, 93, {ha: 'r', s: 17});
  put('Y', ox + 263, OY, {va: 'm', s: 17});
  put(P.title, ox + 130, 50, {ha: 'c', s: 15, c: '#444'});
}

panel(sc({ox: 60, x0: 130, y0: 215, m: 0.4, b: 2.2, H: 100,
       yTop: 95, yBot: 345, lmA: 70, lmB: 290, arX: 165,
       tagX: 272, tagY: 296, off: 8, lmUp: 0, lmVa: 'm', isLab: [-6, 0, 'r'],
       p0: [-15, -11, 'r'], p0p: [15, 11], p1: [-16, -11, 'r'], y1Sep: true,
       title: '\\text{a) Keynesiana } (v \\text{ bajo}, \\; h \\text{ alto})'}));
panel(sc({ox: 400, x0: 455, y0: 230, m: 2.4, b: 0.5, H: 110,
       yTop: 207.5, yBot: 272.5, yTop1: 167.5, yBot1: 272.5, lmA: 412, lmB: 515, arX: 420,
       tagX: 445, tagY: 145, tagHa: 'c', off: -9, lmUp: 2, lmVa: 'b', isLab: [5, 6],
       p0: [-14, 12, 'r'], p0p: [6, -14], p1: [10, -10],
       ySep: true,
       title: '\\text{b) Neoclásica } (v \\text{ alto}, \\; h \\approx 0)'}));

const cont = document.querySelector('.graph-container');
L.forEach((l, i) => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x/VBW*100).toFixed(2) + '%'; e.style.top = (l.y/VBH*100).toFixed(2) + '%';
  e.style.color = l.c || 'black'; if (l.s) e.style.fontSize = l.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[l.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[l.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
});
</script>
</body>
</html>
