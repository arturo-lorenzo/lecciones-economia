<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>





    <line x1="190" y1="310" x2="490" y2="310" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="190" y1="310" x2="190" y2="30"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="190" y1="310" x2="460" y2="40" stroke="black" stroke-width="1.5" stroke-dasharray="10 6"/>




    <line x1="190" y1="235" x2="455" y2="165.7" stroke="#378ADD" stroke-width="2.2"/>


    <line x1="190" y1="200" x2="455" y2="130.7" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 5"/>










    <circle cx="292" cy="208" r="5" fill="#000"/>






    <circle cx="339" cy="161" r="5" fill="#000"/>


    <line x1="292" y1="208" x2="292" y2="310" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="339" y1="161" x2="339" y2="310" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="292" y1="310" x2="292" y2="314" stroke="black" stroke-width="1"/>
    <line x1="339" y1="310" x2="339" y2="314" stroke="black" stroke-width="1"/>





    <line x1="190" y1="650" x2="490" y2="650" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="190" y1="650" x2="190" y2="370" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="240" y1="425" x2="420" y2="616" stroke="#378ADD" stroke-width="2.2"/>



    <circle cx="292" cy="480" r="5" fill="#000"/>



    <circle cx="339" cy="530" r="5" fill="#000"/>


    <line x1="292" y1="320" x2="292" y2="650" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="339" y1="320" x2="339" y2="650" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="190" y1="480" x2="292" y2="480" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="190" y1="530" x2="339" y2="530" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="186" y1="480" x2="190" y2="480" stroke="black" stroke-width="1"/>
    <line x1="186" y1="530" x2="190" y2="530" stroke="black" stroke-width="1"/>
    <line x1="292" y1="650" x2="292" y2="654" stroke="black" stroke-width="1"/>
    <line x1="339" y1="650" x2="339" y2="654" stroke="black" stroke-width="1"/>

  </svg>



  <div class="katex-label" id="lbl-DA-axis"></div>
  <div class="katex-label" id="lbl-Y-up"></div>
  <div class="katex-label" id="lbl-45"></div>
  <div class="katex-label" id="lbl-DA0"></div>
  <div class="katex-label" id="lbl-DA1"></div>
  <div class="katex-label" id="lbl-E0-up"></div>
  <div class="katex-label" id="lbl-E1-up"></div>
  <div class="katex-label" id="lbl-Y0-up"></div>
  <div class="katex-label" id="lbl-Y1-up"></div>


  <div class="katex-label" id="lbl-r-axis"></div>
  <div class="katex-label" id="lbl-Y-lo"></div>
  <div class="katex-label" id="lbl-IS"></div>
  <div class="katex-label" id="lbl-E0-lo"></div>
  <div class="katex-label" id="lbl-E1-lo"></div>
  <div class="katex-label" id="lbl-r0"></div>
  <div class="katex-label" id="lbl-r1"></div>
  <div class="katex-label" id="lbl-Y0-lo"></div>
  <div class="katex-label" id="lbl-Y1-lo"></div>

</div>

<script>
const W = 680, H = 700;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const labels = [

  {id:'lbl-DA-axis', tex:'\\text{DA}',                        left: pct(183,W),  top: pct(25,H),   color:'black', align:'right'},
  {id:'lbl-Y-up',    tex:'Y',                          left: pct(492,W),  top: pct(310,H),  color:'black'},
  {id:'lbl-45',      tex:'45°',                        left: pct(242,W),  top: pct(262,H),  color:'#888', size:'13px'},
  {id:'lbl-DA0',     tex:'\\text{DA}(i_0)',                          left: pct(465,W),  top: pct(154,H),  color:'#378ADD'},
  {id:'lbl-DA1',     tex:'\\text{DA}(i_1)',                          left: pct(465,W),  top: pct(119,H),   color:'#378ADD'},
  {id:'lbl-E0-up',   tex:'0',                          left: pct(275,W),  top: pct(185,H),  color:'#000'},
  {id:'lbl-E1-up',   tex:'1',                          left: pct(325,W),  top: pct(135,H),  color:'#000'},
  {id:'lbl-Y0-up',   tex:'Y_0',                        left: pct(284,W),  top: pct(318,H),  color:'black'},
  {id:'lbl-Y1-up',   tex:'Y_1',                        left: pct(331,W),  top: pct(318,H),  color:'black'},


  {id:'lbl-r-axis',  tex:'i',                          left: pct(183,W),  top: pct(370,H),  color:'black', align:'right'},
  {id:'lbl-Y-lo',    tex:'Y',                          left: pct(492,W),  top: pct(650,H),  color:'black'},
  {id:'lbl-IS',      tex:'\\text{IS}',                         left: pct(425,W),  top: pct(600,H),  color:'#378ADD'},
  {id:'lbl-E0-lo',   tex:'0',                          left: pct(300,W),  top: pct(462,H),  color:'#000'},
  {id:'lbl-E1-lo',   tex:'1',                          left: pct(347,W),  top: pct(512,H),  color:'#000'},
  {id:'lbl-r0',      tex:'i_0',                        left: pct(183,W),  top: pct(470,H),  color:'black', align:'right'},
  {id:'lbl-r1',      tex:'i_1',                        left: pct(183,W),  top: pct(522,H),  color:'black', align:'right'},
  {id:'lbl-Y0-lo',   tex:'Y_0',                        left: pct(284,W),  top: pct(656,H),  color:'black'},
  {id:'lbl-Y1-lo',   tex:'Y_1',                        left: pct(331,W),  top: pct(656,H),  color:'black'}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.align === 'right') e.classList.add('right-of-axis');
  if (l.size) e.style.fontSize = l.size;
});
</script>
<script>(function(){var N={"lbl-E0-up": [-2.06, 0, 0], "lbl-E1-up": [-0.15, -0.59, 0], "lbl-E0-lo": [0.15, -0.29, 0], "lbl-E1-lo": [0.15, -0.29, 0], "lbl-Y0-up": [0, 0, 1], "lbl-Y1-up": [0, 0, 1]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
