<!DOCTYPE html>
<html lang="es">
<head>

<style>

</style>
</head>
<body>
<div class="graph-container">

    </defs>
    <line x1="107.0" y1="460.0" x2="547.0" y2="460.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="107.0" y1="460.0" x2="107.0" y2="60.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="168.6" y1="440.5" x2="485.4" y2="89.5" stroke="#534AB7" stroke-width="2.2"/>

    <line x1="377.9" y1="197.8" x2="352.3" y2="174.8" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="409.4" y1="398.5" x2="375.1" y2="421.8" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="327.0" y1="265.0" x2="327.0" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="327.0" y1="460.0" x2="327.0" y2="464.0" stroke="black" stroke-width="1"/>
    <circle cx="327.0" cy="265.0" r="5" fill="#000"/>
    <line x1="298.8" y1="223.2" x2="298.8" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="298.8" y1="460.0" x2="298.8" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="107.0" y1="223.2" x2="298.8" y2="223.2" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="103.0" y1="223.2" x2="107.0" y2="223.2" stroke="black" stroke-width="1"/>
    <circle cx="298.8" cy="223.2" r="5" fill="#000"/>
    <line x1="261.0" y1="265.0" x2="261.0" y2="460.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="261.0" y1="460.0" x2="261.0" y2="464.0" stroke="black" stroke-width="1"/>
    <circle cx="261.0" cy="265.0" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
  <div class="katex-label" id="lbl7"></div>
  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
  <div class="katex-label" id="lbl11"></div>
  <div class="katex-label" id="lbl12"></div>
  <div class="katex-label" id="lbl13"></div>
  <div class="katex-label" id="lbl14"></div>
  <div class="katex-label" id="lbl15"></div>
  <div class="katex-label" id="lbl16"></div>
  <div class="katex-label" id="lbl17"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "i",
  "x": 99.0,
  "y": 58,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl1",
  "tex": "Y",
  "x": 553.0,
  "y": 460,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "O",
  "x": 99.0,
  "y": 466,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "\\text{BP}\\;(i = i^*)",
  "x": 503.9,
  "y": 265.0,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "i^*",
  "x": 99.0,
  "y": 265.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "\\text{IS}_0",
  "x": 450.2,
  "y": 440.5,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "\\text{IS}_1",
  "x": 384.2,
  "y": 440.5,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl7",
  "tex": "\\text{LM}_0",
  "x": 489.8,
  "y": 89.5,
  "anchor": "lm",
  "color": "#534AB7",
  "size": 16
 },
 {
  "id": "lbl8",
  "tex": "\\text{LM}_1",
  "x": 382.7,
  "y": 135,
  "anchor": "lm",
  "color": "#534AB7",
  "size": 16
 },
 {
  "id": "lbl9",
  "tex": "\\Delta M^d > 0",
  "x": 415.9,
  "y": 186.3,
  "anchor": "lm",
  "color": "#534AB7",
  "size": 14
 },
 {
  "id": "lbl10",
  "tex": "\\Delta E < 0",
  "x": 440.8,
  "y": 410.1,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 14
 },
 {
  "id": "lbl11",
  "tex": "0",
  "x": 327.0,
  "y": 251.0,
  "anchor": "cb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl12",
  "tex": "0'",
  "x": 286.4,
  "y": 223.2,
  "anchor": "rm",
  "color": "#000",
  "size": 16,
  "bg": true
 },
 {
  "id": "lbl13",
  "tex": "1",
  "x": 261.0,
  "y": 251.0,
  "anchor": "cb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl14",
  "tex": "Y_0",
  "x": 327.0,
  "y": 467,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl15",
  "tex": "Y_{0'}",
  "x": 298.8,
  "y": 467,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl16",
  "tex": "Y_1",
  "x": 261.0,
  "y": 467,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl17",
  "tex": "i_{0'}",
  "x": 99.0,
  "y": 223.2,
  "anchor": "rm",
  "color": "black",
  "size": 16
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
