<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 400">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="62" y1="345" x2="300" y2="345" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="62" y1="345" x2="62" y2="83" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M62.0,345.0 L62.0,309.0 L271.0,149.4" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70.8,136.7 L273.2,313.3" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="172.0" y1="225.0" x2="172.0" y2="345.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="172.0" y1="225.0" x2="62.0" y2="225.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="58.0" y1="225.0" x2="62.0" y2="225.0" stroke="black" stroke-width="1"/>
    <line x1="172.0" y1="345.0" x2="172.0" y2="349.0" stroke="black" stroke-width="1"/>
    <circle cx="172.0" cy="225.0" r="5" fill="#000"/>
    <line x1="400" y1="345" x2="638" y2="345" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="345" x2="400" y2="83" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M400.0,345.0 L400.0,225.0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M532.0,225.0 L611.2,164.5" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M408.8,136.7 L611.2,313.3" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="532.0" y1="225.0" x2="532.0" y2="345.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="532.0" y1="225.0" x2="400.0" y2="225.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="396.0" y1="225.0" x2="400.0" y2="225.0" stroke="black" stroke-width="1"/>
    <line x1="532.0" y1="345.0" x2="532.0" y2="349.0" stroke="black" stroke-width="1"/>
    <circle cx="532.0" cy="225.0" r="3.5" fill="#1D9E75"/>
    <circle cx="400.0" cy="225.0" r="3.5" fill="#1D9E75"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
  <div class="katex-label" id="l13"></div>
  <div class="katex-label" id="l14"></div>
  <div class="katex-label" id="l15"></div>
</div>
<script>



const W = 680, H = 400;
const labels = [
  {id: 'l0', tex: 'X', x: 308.0, y: 345.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'p_x', x: 54.0, y: 89.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 53.0, y: 355.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: '\\text{(a) Curvas continuas: existe equilibrio}', x: 177.0, y: 42.0, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l4', tex: 'X^*', x: 172.0, y: 353.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l5', tex: 'p_x^*', x: 54.0, y: 225.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l6', tex: 'S_x', x: 276.0, y: 145.4, color: '#0F6E56', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l7', tex: 'D_x', x: 278.2, y: 315.3, color: '#3C3489', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l8', tex: 'X', x: 646.0, y: 345.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l9', tex: 'p_x', x: 392.0, y: 89.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l10', tex: 'O', x: 391.0, y: 355.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l11', tex: '\\text{(b) Oferta con un salto: puede no existir}', x: 515.0, y: 42.0, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l12', tex: '\\hat{X}', x: 532.0, y: 353.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l13', tex: '\\hat{p}_x', x: 392.0, y: 225.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l14', tex: 'S_x', x: 616.2, y: 160.5, color: '#0F6E56', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l15', tex: 'D_x', x: 616.2, y: 315.3, color: '#3C3489', tr: 'translate(0,-50%)', small: false, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
