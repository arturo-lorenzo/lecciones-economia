<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>
</div>
<script>



const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 500;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');
const OX = 118, OY = 450, S = 34;
const sx = a => OX + a * S, sy = b => OY - b * S;
const U0 = 16;
const ic = a => U0 / a;
const rms = a => ic(a) / a;
function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e); return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = '16px') {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%'; d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color; d.style.fontSize = size;
  container.appendChild(d);
}
function curve(f, a0, a1, color) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const a = a0 + (a1 - a0) * i / 300; pts.push(sx(a).toFixed(1) + ',' + sy(f(a)).toFixed(1)); }
  el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linecap': 'round'});
}

function tangent(a, len) {
  const b = ic(a), m = rms(a);
  const n = Math.hypot(1, m), ux = 1 / n, uy = m / n;
  line(sx(a) - len * ux, sy(b) - len * uy, sx(a) + len * ux, sy(b) + len * uy, '#D85A30', 1.4, {opacity: 0.9});
}


line(OX, OY, 561, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(OX, OY, OX, 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});

const aA = 2, aB = 8;
const mA = ic(aA) / aA, mB = ic(aB) / aB;

const endA = 11.6 / mA, endB = 11.0;
line(OX, OY, sx(endA), sy(mA * endA), '#888', 1, {'stroke-dasharray': '5 3'});
line(OX, OY, sx(endB), sy(mB * endB), '#888', 1, {'stroke-dasharray': '5 3'});


const R = 110, a1 = Math.atan2(-mA, 1), a3 = Math.atan2(-mB, 1);
el('path', {d: `M${(OX + R * Math.cos(a3)).toFixed(1)},${(OY + R * Math.sin(a3)).toFixed(1)} A${R},${R} 0 0,0 ${(OX + R * Math.cos(a1)).toFixed(1)},${(OY + R * Math.sin(a1)).toFixed(1)}`,
  fill: 'none', stroke: '#534AB7', 'stroke-width': 1});


curve(ic, 16 / 11.6, 12.0, '#1D9E75');


tangent(aA, 50); tangent(aB, 50);
[aA, aB].forEach(a => el('circle', {cx: sx(a), cy: sy(ic(a)), r: 4.5, fill: '#D85A30'}));


lab('x_1', 565, OY, 'black', 0, 0.5, '17px');
lab('x_2', OX, 34, 'black', 0.5, 1, '17px');
lab('O', OX - 6, OY + 4, 'black', 1, 0);
lab('u_0', sx(12.0) + 6, sy(ic(12.0)), '#0F6E56', 0, 0.5);
lab('(x_2/x_1)^A', sx(endA) + 6, sy(mA * endA), '#5a5a5a', 0, 0.5, '15px');
lab('(x_2/x_1)^B', sx(endB) + 6, sy(mB * endB), '#5a5a5a', 0, 0.5, '15px');
lab('A', sx(aA) + 10, sy(ic(aA)) + 4, 'black', 0, 0);
lab('B', sx(aB) + 4, sy(ic(aB)) - 10, 'black', 0, 1);
lab('\\text{RMS}_{21}^A', sx(aA) + 18, sy(ic(aA)) - 30, '#D85A30', 0, 0.5, '15px');
lab('\\text{RMS}_{21}^B', sx(aB) + 12, sy(ic(aB)) + 22, '#D85A30', 0, 0, '15px');
lab('\\Delta(x_2/x_1)', OX + 96, OY - 76, '#534AB7', 0, 0.5, '15px');


lab('\\sigma_{21} = \\dfrac{\\%\\,\\Delta(x_2/x_1)}{\\%\\,\\Delta\\,\\text{RMS}_{21}}', 561, 100, 'black', 1, 0.5, '17px');
</script>
</body>
</html>
