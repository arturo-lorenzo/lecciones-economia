<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line id="ax-x" x1="115" x2="555" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="ax-y" x1="115" x2="115" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="g-I" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="pi-D" stroke="#378ADD" stroke-width="2.2"/>
    <line id="pi-X" stroke="#D85A30" stroke-width="2.2"/>
    <line id="pi-I" stroke="#534AB7" stroke-width="2.2"/>


    <line id="tick-c0"  x1="111" x2="115" stroke="black" stroke-width="1"/>
    <line id="tick-c0X" x1="111" x2="115" stroke="black" stroke-width="1"/>
    <line id="tick-c0I" x1="111" x2="115" stroke="black" stroke-width="1"/>


    <circle id="pt-D" r="5" fill="black"/>
    <circle id="pt-X" r="5" fill="black"/>
    <circle id="pt-XI" r="5" fill="black"/>
    <circle id="pt-I" r="3" fill="black"/>


    <g id="regions" stroke="#888" stroke-width="1" fill="none"></g>
  </svg>

  <div class="katex-label" id="lbl-pi"></div>
  <div class="katex-label" id="lbl-phi"></div>
  <div class="katex-label" id="lbl-piD"></div>
  <div class="katex-label" id="lbl-piX"></div>
  <div class="katex-label" id="lbl-piI"></div>
  <div class="katex-label" id="lbl-c0"></div>
  <div class="katex-label" id="lbl-c0X"></div>
  <div class="katex-label" id="lbl-c0I"></div>
  <div class="katex-label" id="lbl-phiD"></div>
  <div class="katex-label" id="lbl-phiX"></div>
  <div class="katex-label" id="lbl-phiI"></div>
  <div class="katex-label" id="lbl-rD"></div>
  <div class="katex-label" id="lbl-rX"></div>
  <div class="katex-label" id="lbl-rI"></div>
</div>

<script>

const ox = 115, pw = 430;
const axY = 250, ky = 29;
function X(phi) { return ox + phi / 10 * pw; }
function Y(pi)  { return axY - pi * ky; }


const B = 1.2, BX = 0.6;
const c0 = 1.5, c0X = 2.5, c0I = 6.0;
const phiD = c0 / B;
const phiX = c0X / BX;
const phiI = (c0I - c0X) / (B - BX);
const piXI = BX * phiI - c0X;

function set(id, a) { const e = document.getElementById(id); for (const k in a) e.setAttribute(k, a[k]); }
function seg(id, b, c, end) { set(id, {x1: X(0), y1: Y(-c), x2: X(end), y2: Y(b * end - c)}); }
set('ax-x', {y1: axY, y2: axY});
set('ax-y', {y1: Y(-c0I) + 25});
const eD = 7.2, eX = 9.6, eI = 9.6;
seg('pi-D', B, c0, eD); seg('pi-X', BX, c0X, eX); seg('pi-I', B, c0I, eI);
set('tick-c0',  {y1: Y(-c0),  y2: Y(-c0)});
set('tick-c0X', {y1: Y(-c0X), y2: Y(-c0X)});
set('tick-c0I', {y1: Y(-c0I), y2: Y(-c0I)});
set('pt-D', {cx: X(phiD), cy: axY});
set('pt-X', {cx: X(phiX), cy: axY});
set('pt-XI', {cx: X(phiI), cy: Y(piXI)});
set('pt-I', {cx: X(phiI), cy: axY});
set('g-I', {x1: X(phiI), y1: Y(piXI), x2: X(phiI), y2: axY});


const yb = Y(-c0I) + 50;
const reg = document.getElementById('regions');
const xs = [X(phiD), X(phiX), X(phiI), X(10)];
let d = '';
for (let i = 0; i < 3; i++) {
  const a = xs[i] + 3, b = xs[i + 1] - 3;
  d += `M${a} ${yb - 6} L${a} ${yb} L${b} ${yb} L${b} ${yb - 6} `;
}
const pth = document.createElementNS('http://www.w3.org/2000/svg', 'path');
pth.setAttribute('d', d); reg.appendChild(pth);

const VBW = 680, VBH = 560;
function pctW(v) { return (v / VBW * 100).toFixed(1) + '%'; }
function pctH(v) { return (v / VBH * 100).toFixed(1) + '%'; }
const mid = i => (xs[i] + xs[i + 1]) / 2;

[
  {id:'lbl-pi',   tex:'\\pi',                 left: ox - 8,        top: 38,               size:17, align:'right'},
  {id:'lbl-phi',  tex:'\\psi^{\\sigma-1}', left: 561,           top: axY - 14,         size:17},
  {id:'lbl-piD',  tex:'\\pi_1(\\psi)',     left: X(eD) + 6,     top: Y(B*eD-c0) - 14,  size:16, color:'#378ADD'},
  {id:'lbl-piX',  tex:'\\pi_X(\\psi)',     left: X(eX) - 20,    top: Y(BX*eX-c0X) + 12, size:16, color:'#D85A30'},
  {id:'lbl-piI',  tex:'\\pi_I(\\psi)',     left: X(eI) - 30,    top: Y(B*eI-c0I) - 36, size:16, color:'#534AB7'},
  {id:'lbl-c0',   tex:'-c_0',                 left: ox - 7,        top: Y(-c0) - 13,      size:15, align:'right'},
  {id:'lbl-c0X',  tex:'-c_{0X}',              left: ox - 7,        top: Y(-c0X) - 13,     size:15, align:'right'},
  {id:'lbl-c0I',  tex:'-c_{0I}',              left: ox - 7,        top: Y(-c0I) - 13,     size:15, align:'right'},
  {id:'lbl-phiD', tex:'\\bar{\\psi}_1^{\\,\\sigma-1}', left: X(phiD) - 6, top: axY - 34, size:15, align:'right'},
  {id:'lbl-phiX', tex:'\\bar{\\psi}_X^{\\,\\sigma-1}', left: X(phiX) - 6, top: axY - 34, size:15, align:'right'},
  {id:'lbl-phiI', tex:'\\bar{\\psi}_I^{\\,\\sigma-1}', left: X(phiI) + 6, top: axY + 6,  size:15},
  {id:'lbl-rD',   tex:'\\begin{gathered}\\text{solo mercado}\\\\[-3pt]\\text{interior}\\end{gathered}', left: mid(0), top: yb + 6, size:14, color:'#555', center:true},
  {id:'lbl-rX',   tex:'\\text{exportan}',              left: mid(1), top: yb + 6, size:14, color:'#555', center:true},
  {id:'lbl-rI',   tex:'\\text{IED}',                   left: mid(2), top: yb + 6, size:14, color:'#555', center:true}
].forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pctW(l.left); el.style.top = pctH(l.top);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.color = l.color || 'black';
  if (l.center) el.style.transform = 'translateX(-50%)';
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
</body>
</html>
