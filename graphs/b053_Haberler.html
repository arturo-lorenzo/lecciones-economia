<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container > svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="95" y1="500" x2="595" y2="500" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="95" y1="500" x2="95"  y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="haberler" fill="#D85A30" fill-opacity="0.12" stroke="none"/>


    <path id="ppf" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="pline0" stroke="#378ADD" stroke-width="1.4" stroke-dasharray="8 4"/>


    <line id="pline1" stroke="#D85A30" stroke-width="2.2"/>


    <path id="ic0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <path id="ic1" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>


    <line id="dash-v0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-h0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="dash-vp" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-hp" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="dash-vc" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-hc" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <circle id="pt-0" r="5" fill="#000"/>
    <circle id="pt-prod" r="5" fill="#000"/>
    <circle id="pt-cons" r="5" fill="#000"/>


    <line id="tick-x0" y1="500" y2="504" stroke="black" stroke-width="1"/>
    <line id="tick-y0" x1="91" x2="95" stroke="black" stroke-width="1"/>
  </svg>

  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-y"></div>
  <div class="katex-label" id="lbl-ppf"></div>
  <div class="katex-label" id="lbl-ic0"></div>
  <div class="katex-label" id="lbl-ic1"></div>
  <div class="katex-label" id="lbl-eq0"></div>
  <div class="katex-label" id="lbl-prod"></div>
  <div class="katex-label" id="lbl-cons"></div>
  <div class="katex-label" id="lbl-p0"></div>
  <div class="katex-label" id="lbl-p1"></div>
  <div class="katex-label" id="lbl-x0"></div>
  <div class="katex-label" id="lbl-y0"></div>
  <div class="katex-label" id="lbl-x1"></div>
  <div class="katex-label" id="lbl-y1"></div>
  <div class="katex-label" id="lbl-x2"></div>
  <div class="katex-label" id="lbl-y2"></div>
  <div class="katex-label" id="lbl-pa"></div>
  <div class="katex-label" id="lbl-pw"></div>
</div>

<script>
const oxS = 95, oy = 500, pw = 481.5, ph = 440;
function toSvg(x, y) { return [oxS + (x / 10) * pw, oy - (y / 10) * ph]; }


const Xa = 9, Ya = 8;
function ppfY(x) {
  if (x < 0 || x > Xa) return NaN;
  return Ya * Math.sqrt(1 - (x / Xa) * (x / Xa));
}
function ppfSlope(x) {
  return -Ya * (x / (Xa * Xa)) / Math.sqrt(1 - (x / Xa) * (x / Xa));
}

const ppfPts = [];
for (let i = 0; i <= 300; i++) {
  const x = (i / 300) * Xa;
  const y = ppfY(x);
  if (!isNaN(y)) { const [sx, sy] = toSvg(x, y); ppfPts.push(sx.toFixed(1) + ',' + sy.toFixed(1)); }
}
document.getElementById('ppf').setAttribute('d', 'M' + ppfPts.join(' L'));




const X0 = 4.5;
const Y0 = ppfY(X0);
const slope0 = ppfSlope(X0);

const [eq0Sx, eq0Sy] = toSvg(X0, Y0);
document.getElementById('pt-0').setAttribute('cx', eq0Sx);
document.getElementById('pt-0').setAttribute('cy', eq0Sy);


function pLine0(x) { return Y0 + slope0 * (x - X0); }
const p0Xmin = 0.5, p0Xmax = 8;
const [p0Sx1, p0Sy1] = toSvg(p0Xmin, pLine0(p0Xmin));
const [p0Sx2, p0Sy2] = toSvg(p0Xmax, pLine0(p0Xmax));
document.getElementById('pline0').setAttribute('x1', p0Sx1); document.getElementById('pline0').setAttribute('y1', p0Sy1);
document.getElementById('pline0').setAttribute('x2', p0Sx2); document.getElementById('pline0').setAttribute('y2', p0Sy2);


const IC_XMAX = 9.3;
const mrsRatio0 = Math.abs(slope0) * X0 / Y0;
const alpha0 = mrsRatio0 / (1 + mrsRatio0);
const u0 = Math.pow(X0, alpha0) * Math.pow(Y0, 1 - alpha0);

const ic0Pts = [];
for (let i = 0; i <= 300; i++) {
  const x = 0.5 + (i / 300) * (IC_XMAX - 0.5);
  const y = Math.pow(u0 / Math.pow(x, alpha0), 1 / (1 - alpha0));
  if (y > 0.3 && y < 9.5) {
    const [sx, sy] = toSvg(x, y);
    if (sx >= oxS + 2 && sx <= oxS + pw - 2 && sy >= 45 && sy <= oy - 2)
      ic0Pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
}
document.getElementById('ic0').setAttribute('d', 'M' + ic0Pts.join(' L'));






const Xprod = 7.0;
const Yprod = ppfY(Xprod);
const slope1 = ppfSlope(Xprod);

const [prodSx, prodSy] = toSvg(Xprod, Yprod);
document.getElementById('pt-prod').setAttribute('cx', prodSx);
document.getElementById('pt-prod').setAttribute('cy', prodSy);


function pLine1(x) { return Yprod + slope1 * (x - Xprod); }

let p1Xmin = -2.5, p1Xmax = 9.5;
if (pLine1(p1Xmin) > 10.5) p1Xmin = Xprod - (10.5 - Yprod) / Math.abs(slope1);
if (pLine1(p1Xmax) < 0) p1Xmax = Xprod + Yprod / Math.abs(slope1);
const p1YatMin = pLine1(Math.max(-0.5, p1Xmin));
const p1YatMax = pLine1(Math.min(9.5, p1Xmax));
const [p1Sx1, p1Sy1] = toSvg(Math.max(-0.5, p1Xmin), Math.min(10.5, p1YatMin));
const [p1Sx2, p1Sy2] = toSvg(Math.min(9.5, p1Xmax), Math.max(0, p1YatMax));
document.getElementById('pline1').setAttribute('x1', p1Sx1); document.getElementById('pline1').setAttribute('y1', p1Sy1);
document.getElementById('pline1').setAttribute('x2', p1Sx2); document.getElementById('pline1').setAttribute('y2', p1Sy2);





const Bintercept = Yprod - slope1 * Xprod;
const Xcons = alpha0 * Bintercept / Math.abs(slope1);
const Ycons = (1 - alpha0) * Bintercept;

const [consSx, consSy] = toSvg(Xcons, Ycons);
document.getElementById('pt-cons').setAttribute('cx', consSx);
document.getElementById('pt-cons').setAttribute('cy', consSy);


const u1 = Math.pow(Xcons, alpha0) * Math.pow(Ycons, 1 - alpha0);
const ic1Pts = [];
for (let i = 0; i <= 300; i++) {
  const x = 0.5 + (i / 300) * (IC_XMAX - 0.5);
  const y = Math.pow(u1 / Math.pow(x, alpha0), 1 / (1 - alpha0));
  if (y > 0.3 && y < 10.2) {
    const [sx, sy] = toSvg(x, y);
    if (sx >= oxS + 2 && sx <= oxS + pw - 2 && sy >= 45 && sy <= oy - 2)
      ic1Pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
}
document.getElementById('ic1').setAttribute('d', 'M' + ic1Pts.join(' L'));







const [blSx, blSy] = toSvg(Xcons, Yprod);
document.getElementById('haberler').setAttribute('d',
  `M${consSx},${consSy} L${blSx},${blSy} L${prodSx},${prodSy} Z`);




document.getElementById('dash-v0').setAttribute('x1', eq0Sx); document.getElementById('dash-v0').setAttribute('y1', eq0Sy);
document.getElementById('dash-v0').setAttribute('x2', eq0Sx); document.getElementById('dash-v0').setAttribute('y2', oy);
document.getElementById('dash-h0').setAttribute('x1', oxS); document.getElementById('dash-h0').setAttribute('y1', eq0Sy);
document.getElementById('dash-h0').setAttribute('x2', eq0Sx); document.getElementById('dash-h0').setAttribute('y2', eq0Sy);

document.getElementById('dash-vp').setAttribute('x1', prodSx); document.getElementById('dash-vp').setAttribute('y1', prodSy);
document.getElementById('dash-vp').setAttribute('x2', prodSx); document.getElementById('dash-vp').setAttribute('y2', oy);
document.getElementById('dash-hp').setAttribute('x1', oxS); document.getElementById('dash-hp').setAttribute('y1', prodSy);
document.getElementById('dash-hp').setAttribute('x2', prodSx); document.getElementById('dash-hp').setAttribute('y2', prodSy);

document.getElementById('dash-vc').setAttribute('x1', consSx); document.getElementById('dash-vc').setAttribute('y1', consSy);
document.getElementById('dash-vc').setAttribute('x2', consSx); document.getElementById('dash-vc').setAttribute('y2', oy);
document.getElementById('dash-hc').setAttribute('x1', oxS); document.getElementById('dash-hc').setAttribute('y1', consSy);
document.getElementById('dash-hc').setAttribute('x2', consSx); document.getElementById('dash-hc').setAttribute('y2', consSy);


document.getElementById('tick-x0').setAttribute('x1', eq0Sx); document.getElementById('tick-x0').setAttribute('x2', eq0Sx);
document.getElementById('tick-y0').setAttribute('y1', eq0Sy); document.getElementById('tick-y0').setAttribute('y2', eq0Sy);


const VBW = 680, VBH = 600;
const pct = (v, T) => (v / T * 100).toFixed(2) + '%';
const icY = (u, x) => Math.pow(u / Math.pow(x, alpha0), 1 / (1 - alpha0));
const ic0End = toSvg(IC_XMAX, icY(u0, IC_XMAX)), ic1End = toSvg(IC_XMAX, icY(u1, IC_XMAX));
const labels = [
  {id:'lbl-x',    tex:'X', x: 601, y: oy, ax: 0, ay: 0.5, color:'black', size: 17},
  {id:'lbl-y',    tex:'Y', x: oxS, y: 34, ax: 0.5, ay: 1, color:'black', size: 17},
  {id:'lbl-ppf',  tex:'\\text{FPP}', x: toSvg(Xa, 0)[0] + 8, y: oy - 22, ax: 0, ay: 0.5, color:'#0F6E56'},
  {id:'lbl-ic0',  tex:'\\text{CIS}_0', x: ic0End[0] + 6, y: ic0End[1], ax: 0, ay: 0.5, color:'#534AB7'},
  {id:'lbl-ic1',  tex:'\\text{CIS}_1', x: ic1End[0] + 6, y: ic1End[1], ax: 0, ay: 0.5, color:'#534AB7'},
  {id:'lbl-pa',   tex:'\\dfrac{p_X^{\\text{aut}}}{p_Y^{\\text{aut}}}', x: p0Sx2 + 4, y: p0Sy2 + 2, ax: 0, ay: 0, color:'#185FA5', size: 15},
  {id:'lbl-pw',   tex:'\\dfrac{p_X^*}{p_Y^*}', x: p1Sx2 + 6, y: p1Sy2, ax: 0, ay: 0.5, color:'#D85A30', size: 15},
  {id:'lbl-eq0',  tex:'P^0 = C^0', x: eq0Sx - 6, y: eq0Sy + 6, ax: 1, ay: 0, color:'#000'},
  {id:'lbl-prod', tex:'P^1', x: prodSx - 6, y: prodSy + 6, ax: 1, ay: 0, color:'#000'},
  {id:'lbl-cons', tex:'C^1', x: consSx + 8, y: consSy - 6, ax: 0, ay: 1, color:'#000'},
  {id:'lbl-x0',   tex:'X_0', x: eq0Sx, y: oy + 8, ax: 0.5, ay: 0, color:'black'},
  {id:'lbl-y0',   tex:'Y_0', x: oxS - 8, y: eq0Sy, ax: 1, ay: 0.5, color:'black'},
  {id:'lbl-x1',   tex:'X_1^P', x: prodSx, y: oy + 8, ax: 0.5, ay: 0, color:'black'},
  {id:'lbl-y1',   tex:'Y_1^P', x: oxS - 8, y: prodSy, ax: 1, ay: 0.5, color:'black'},
  {id:'lbl-x2',   tex:'X_1^C', x: consSx, y: oy + 8, ax: 0.5, ay: 0, color:'black'},
  {id:'lbl-y2',   tex:'Y_1^C', x: oxS - 8, y: consSy, ax: 1, ay: 0.5, color:'black'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, VBW); el.style.top = pct(l.y, VBH);
  if (l.size) el.style.fontSize = l.size + 'px';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  el.style.color = l.color;
});
</script>
</body>
</html>
