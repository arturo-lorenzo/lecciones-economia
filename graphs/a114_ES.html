<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>
</div>
<script>



const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 560;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');
const OX = 130, OY = 500, S = 38;
const sx = l => OX + l * S, sy = k => OY - k * S;
const X0 = 4;
const iso = (rho) => (l) => {
  const a = 2 * Math.pow(X0, rho) - Math.pow(l, rho);
  return a > 0 ? Math.pow(a, 1 / rho) : NaN;
};
const kA = iso(-1), kB = iso(2 / 3);
const rhoA = -1, rhoB = 2 / 3;
const RAYS = [3, 1, 1 / 3];
function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e); return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = '16px') {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%'; d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color; d.style.fontSize = size;
  container.appendChild(d);
}
function curve(f, l0, l1, color) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const l = l0 + (l1 - l0) * i / 300; pts.push(sx(l).toFixed(1) + ',' + sy(f(l)).toFixed(1)); }
  el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linecap': 'round'});
}

const cut = (rho, m) => { const l = X0 * Math.pow(0.5 * Math.pow(m, rho) + 0.5, -1 / rho); return [l, m * l]; };


line(OX, OY, 640, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(OX, OY, OX, 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});


const rayEnd = [[3.7, 11.1], [10, 10], [11.8, 11.8 / 3]];
RAYS.forEach((m, i) => line(OX, OY, sx(rayEnd[i][0]), sy(rayEnd[i][1]), '#888', 1, {'stroke-dasharray': '5 3'}));


const R = 120, a1 = Math.atan2(-3, 1), a3 = Math.atan2(-1 / 3, 1);
el('path', {d: `M${(OX + R * Math.cos(a3)).toFixed(1)},${(OY + R * Math.sin(a3)).toFixed(1)} A${R},${R} 0 0,0 ${(OX + R * Math.cos(a1)).toFixed(1)},${(OY + R * Math.sin(a1)).toFixed(1)}`,
  fill: 'none', stroke: '#534AB7', 'stroke-width': 1});


curve(kA, 2.45, 11, '#1D9E75');
curve(kB, 1.0, 8.6, '#378ADD');


function tangent(rho, m, len) {
  const [l, k] = cut(rho, m);
  const slope = Math.pow(m, 1 - rho);
  const n = Math.hypot(1, slope), ux = 1 / n, uy = slope / n;
  line(sx(l) - len * ux, sy(k) - len * uy, sx(l) + len * ux, sy(k) + len * uy, '#D85A30', 1.4, {opacity: 0.9});
  return [sx(l), sy(k)];
}
const tA1 = tangent(rhoA, 3, 46), tA3 = tangent(rhoA, 1 / 3, 46);
const tB1 = tangent(rhoB, 3, 46), tB3 = tangent(rhoB, 1 / 3, 46);


[rhoA, rhoB].forEach(rho => RAYS.forEach(m => { const [l, k] = cut(rho, m); el('circle', {cx: sx(l), cy: sy(k), r: 4.2, fill: '#D85A30'}); }));


lab('L', 644, OY, 'black', 0, 0.5);
lab('K', OX, 34, 'black', 0.5, 1);
lab('O', OX - 6, OY + 4, 'black', 1, 0);
lab('(K/L)_1', sx(3.7) + 4, sy(11.1) - 2, '#888', 0, 1, '15px');
lab('(K/L)_2', sx(10) + 6, sy(10) - 2, '#888', 0, 0.5, '15px');
lab('(K/L)_3', sx(11.8) + 6, sy(11.8 / 3), '#888', 0, 0.5, '15px');
lab('x_0^A', sx(11) + 6, sy(kA(11)), '#0F6E56', 0, 0.5);
lab('x_0^B', sx(8.6) + 6, sy(kB(8.6)), '#185FA5', 0, 0.5);
lab('\\text{RMST}_1^A', tA1[0] + 12, tA1[1] - 4, '#D85A30', 0, 0.5, '14px');
lab('\\text{RMST}_1^B', tB1[0] - 14, tB1[1] + 14, '#D85A30', 1, 0.5, '14px');
lab('\\text{RMST}_3^A', tA3[0], tA3[1] - 20, '#D85A30', 0.5, 1, '14px');
lab('\\text{RMST}_3^B', tB3[0] - 8, tB3[1] + 20, '#D85A30', 0.5, 0, '14px');
lab('\\Delta(K/L)', OX + 110, OY - 96, '#534AB7', 0, 0.5, '14px');
</script>
</body>
</html>
