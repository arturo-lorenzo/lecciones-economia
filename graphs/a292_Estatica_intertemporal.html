<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 590">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
  </svg>
</div>

<script>

const NS = 'http://www.w3.org/2000/svg';
const svg = document.querySelector('.graph-container svg');
const cont = document.querySelector('.graph-container');
const VBW = 680, VBH = +svg.getAttribute('viewBox').split(' ')[3];
const pctX = x => (x / VBW * 100).toFixed(2) + '%';
const pctY = y => (y / VBH * 100).toFixed(2) + '%';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e); return e;
}
function line(id, x1, y1, x2, y2, stroke, w, extra) {
  return el('line', Object.assign({id, x1, y1, x2, y2, stroke, 'stroke-width': w}, extra || {}));
}
function guide(id, x1, y1, x2, y2) { return line(id, x1, y1, x2, y2, '#888', 0.8, {'stroke-dasharray': '6 4'}); }
function path(id, pts, stroke, w, extra) {
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
  return el('path', Object.assign({id, d, fill: 'none', stroke, 'stroke-width': w, 'stroke-linecap': 'round'}, extra || {}));
}
function dot(id, x, y, fill, r) { return el('circle', {id, cx: x, cy: y, r: r || 5, fill}); }
function tickX(x) { line('', x, OY, x, OY + 4, 'black', 1); }
function tickY(y) { line('', OX - 4, y, OX, y, 'black', 1); }
function label(id, tex, x, y, color, size, opt) {
  opt = opt || {};
  const d = document.createElement('div');
  d.className = 'katex-label'; d.id = id; cont.appendChild(d);
  katex.render(tex, d, {throwOnError: false});
  d.style.left = pctX(x); d.style.top = pctY(y);
  d.style.color = color || 'black'; d.style.fontSize = (size || 16) + 'px';
  d.style.whiteSpace = 'nowrap';
  if (opt.right) d.classList.add('right-of-axis');
  if (opt.center) d.style.transform = 'translateX(-50%)';
  if (opt.bg) { d.style.background = '#fff'; const k = d.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  return d;
}
function axes() {
  line('axis-x', OX, OY, XEND, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
  line('axis-y', OX, OY, OX, YEND, 'black', 1.2, {'marker-end': 'url(#arrow)'});
}







const a = 0.5, rho = 0.2, yt = 1.0, yt1 = 0.3, r0 = 0.05, r1 = 1.2;
const R0 = 1 + r0, R1 = 1 + r1;
const W0 = yt + yt1 / R0, W1 = yt + yt1 / R1;
const U = (x, y) => Math.pow(a * Math.pow(x, rho) + (1 - a) * Math.pow(y, rho), 1 / rho);
const kR = R => Math.pow(R * (1 - a) / a, 1 / (1 - rho));
const opt = (R, W) => { const k = kR(R), x = W / (1 + k / R); return [x, k * x]; };
const E0 = opt(R0, W0), E1 = opt(R1, W1);
const u0 = U(E0[0], E0[1]), u1 = U(E1[0], E1[1]);
const kc = kR(R1), tc = u0 / U(1, kc), Ec = [tc, kc * tc];
const Wc = Ec[0] + Ec[1] / R1;
const ic = (u, x) => Math.pow((Math.pow(u, rho) - a * Math.pow(x, rho)) / (1 - a), 1 / rho);


const OX = 124, OY = 470, XEND = 586, YEND = 42;
const SX = 417.6 / W0, SY = 400 / (R1 * W1);
const sx = x => OX + x * SX, sy = y => OY - y * SY;
axes();


guide('g-yt',  sx(yt), sy(yt1), sx(yt), OY);
guide('g-yt1', sx(yt), sy(yt1), OX, sy(yt1));
guide('g-0v',  sx(E0[0]), sy(E0[1]), sx(E0[0]), OY);
guide('g-0h',  sx(E0[0]), sy(E0[1]), OX, sy(E0[1]));
guide('g-pv',  sx(Ec[0]), sy(Ec[1]), sx(Ec[0]), OY);
guide('g-1v',  sx(E1[0]), sy(E1[1]), sx(E1[0]), OY);
guide('g-1h',  sx(E1[0]), sy(E1[1]), OX, sy(E1[1]));
[yt, E0[0], Ec[0], E1[0], W0, W1].forEach(v => tickX(sx(v)));
[yt1, E0[1], E1[1]].forEach(v => tickY(sy(v)));


line('rp0', sx(0), sy(R0 * W0), sx(W0), sy(0), '#378ADD', 2.2);
line('rp1', sx(0), sy(R1 * W1), sx(W1), sy(0), '#378ADD', 2.2, {'stroke-dasharray': '8 4'});
const xcA = 0.34, xcB = Wc;
line('rpc', sx(xcA), sy(R1 * (Wc - xcA)), sx(xcB), sy(0), '#1D9E75', 2.2, {'stroke-dasharray': '6 4'});


function icPts(u, x0, x1, cap) { const p = []; for (let i = 0; i <= 300; i++) { const x = x0 + (x1 - x0) * i / 300; const y = ic(u, x); if (y <= cap && y >= 0) p.push([sx(x), sy(y)]); } return p; }
const xEnd = 1.18;
path('u0', icPts(u0, 0.12, xEnd, 1.3), '#534AB7', 2.2);
path('u1', icPts(u1, 0.12, xEnd, 1.9), '#534AB7', 2.2);


const xa = 0.06;
const ax = sx(xa), ay = sy(R0 * (W0 - xa));
const m0 = -R0 * SY / SX;
let nx = m0 * -1, ny = -1;
{ const sl = R0 * SY / SX; const n = Math.hypot(1, sl); nx = sl / n; ny = -1 / n; }

const b1y = sy(R1 * W1), s1 = R1 * SY / SX;
const tHit = (b1y + s1 * (ax - OX) - ay) / (ny - s1 * nx);
line('arr-r', ax + nx * 6, ay + ny * 6, ax + nx * (tHit - 7), ay + ny * (tHit - 7), '#378ADD', 1.2, {'marker-end': 'url(#arrow)'});


const rows = [[E0[0], Ec[0], '\\text{ES}', 512], [Ec[0], E1[0], '\\text{ERT}', 536], [E0[0], E1[0], '\\text{ET}', 560]];
rows.forEach((r, i) => {
  const xA = sx(r[0]), xB = sx(r[1]);
  line('eff' + i, xA, r[3], xB + (xB > xA ? -1 : 1), r[3], '#555', 1.2, {'marker-end': 'url(#arrow)'});
});


dot('pE', sx(yt), sy(yt1), 'black', 4);
dot('p0', sx(E0[0]), sy(E0[1]), '#000');
dot('pp', sx(Ec[0]), sy(Ec[1]), '#000');
dot('p1', sx(E1[0]), sy(E1[1]), '#000');


label('l-cy', 'c_{t+1}', OX - 8, 34, 'black', 17, {right: true});
label('l-cx', 'c_t', XEND + 2, OY - 2, 'black', 17);
label('l-O', 'O', OX - 20, OY + 4, 'black', 17);
label('l-yt',  'y_t', sx(yt) - 7, OY + 6);
label('l-W1',  'W_1', sx(W1) - 12, OY + 6, '#185FA5');
label('l-W0',  'W_0', sx(W0) - 10, OY + 6, '#185FA5');
label('l-x0',  'c_t^0', sx(E0[0]) - 9, OY + 6);
label('l-xp',  "c_t^{0'}", sx(Ec[0]) - 11, OY + 6);
label('l-x1',  'c_t^1', sx(E1[0]) - 9, OY + 6);
label('l-yt1', 'y_{t+1}', OX - 8, sy(yt1) - 11, 'black', 16, {right: true});
label('l-y0',  'c_{t+1}^0', OX - 8, sy(E0[1]) - 12, 'black', 16, {right: true});
label('l-y1',  'c_{t+1}^1', OX - 8, sy(E1[1]) - 12, 'black', 16, {right: true});
label('l-rp0', '\\text{RP}_0', sx(W0) + 4, OY - 30, '#378ADD');
label('l-rp1', '\\text{RP}_1', sx(0.02) + 12, sy(R1 * W1) - 12, '#378ADD');
label('l-rpc', '\\text{RP}_c', sx(Wc) + 4, OY - 30, '#1D9E75');
label('l-u0', 'u_0', sx(xEnd) + 4, sy(ic(u0, xEnd)) - 10, '#534AB7');
label('l-u1', 'u_1', sx(xEnd) + 4, sy(ic(u1, xEnd)) - 12, '#534AB7');
label('l-p0', '0', sx(E0[0]) + 7, sy(E0[1]) - 25, '#000');
label('l-pp', "0'", sx(Ec[0]) + 7, sy(Ec[1]) - 25, '#000');
label('l-p1', '1', sx(E1[0]) + 7, sy(E1[1]) - 25, '#000');
label('l-dr', '\\Delta r > 0', ax + nx * tHit / 2 + 10, ay + ny * tHit / 2 - 10, '#378ADD', 14);
rows.forEach((r, i) => label('l-eff' + i, r[2], Math.max(sx(r[0]), sx(r[1])) + 8, r[3] - 10, '#555', 15));

</script>
</body>
</html>
