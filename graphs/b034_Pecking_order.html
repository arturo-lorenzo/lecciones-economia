<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="graph-container">



  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="110" y1="460" x2="550" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="460" x2="110" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="110" y1="320" x2="247.5" y2="320" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="247.5" y1="320" x2="247.5" y2="236" stroke="#888" stroke-width="0.9" stroke-dasharray="5 4"/>

    <line x1="247.5" y1="236" x2="412.5" y2="236" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>

    <line x1="412.5" y1="236" x2="412.5" y2="124" stroke="#888" stroke-width="0.9" stroke-dasharray="5 4"/>

    <line x1="412.5" y1="124" x2="550" y2="124" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <line x1="174.2" y1="410" x2="495" y2="257" stroke="#888" stroke-width="1.2"
          stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  </svg>


  <div class="katex-label" id="lbl-f"></div>
  <div class="katex-label" id="lbl-c"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-auto"></div>
  <div class="katex-label" id="lbl-deuda"></div>
  <div class="katex-label" id="lbl-acc"></div>
  <div class="katex-label" id="lbl-asim"></div>

</div>

<script>
const pct = (v, t) => (v / t * 100).toFixed(2) + '%';

const labels = [
  {id: 'lbl-f',     tex: '\\text{Fondos captados}', x: 556, y: 470, ax: 1, ay: 0, color: 'black', size: 17},
  {id: 'lbl-c',     tex: '\\text{Coste marginal}', x: 110, y: 48, ax: 0.5, ay: 1, color: 'black', size: 17},
  {id: 'lbl-o',     tex: 'O', x: 104, y: 466, ax: 1, ay: 0, color: 'black'},
  {id: 'lbl-auto',  tex: '\\text{Autofinanciación}', x: 178.75, y: 312, ax: 0.5, ay: 1, color: '#0F6E56', size: 14},
  {id: 'lbl-deuda', tex: '\\text{Deuda}', x: 330, y: 228, ax: 0.5, ay: 1, color: '#185FA5'},
  {id: 'lbl-acc',   tex: '\\text{Nuevas acciones}', x: 481.25, y: 116, ax: 0.5, ay: 1, color: '#534AB7'},
  {id: 'lbl-asim',  tex: '\\text{Asimetría de información}', x: 313.5, y: 356, ax: 0, ay: 0, color: '#888', size: 15}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, 680);
  el.style.top = pct(l.y, 500);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.whiteSpace = 'nowrap';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
