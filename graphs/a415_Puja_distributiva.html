<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <path id="gap" fill="#D85A30" fill-opacity="0.10" stroke="none"/>


    <line x1="125" y1="460" x2="587" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="125" y1="460" x2="125" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="d-u0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-u1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-w1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <path id="srn" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>

    <line id="srp0" stroke="#534AB7" stroke-width="2.2"/>
    <line id="srp1" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="8 4"/>
    <line id="shift" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>

    <g id="ticks"></g>
    <circle id="pt0" r="5" fill="#000"/>
    <circle id="pt1" r="5" fill="#000"/>
  </svg>
</div>

<script>





const srn = u => 2 + 9*Math.exp(-0.25*u);
const w0 = 5, w1 = 4;
const uOf = w => -4*Math.log((w - 2)/9);
const ub0 = uOf(w0), ub1 = uOf(w1);


const VBW = 680, VBH = 520;
const kx = 42*462/520, ky = 38;
const sx = u => 125 + u*kx;
const sy = w => 460 - w*ky;
const $ = id => document.getElementById(id);
function setL(id, x1, y1, x2, y2) { const e = $(id); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); }

const uA = 0.5, uB = 11.2;
(function () {
  const p = [];
  for (let i = 0; i <= 240; i++) { const u = uA + (i/240)*(uB - uA); p.push(sx(u).toFixed(1) + ',' + sy(srn(u)).toFixed(1)); }
  $('srn').setAttribute('d', 'M' + p.join(' L'));
  const g = [];
  for (let i = 0; i <= 120; i++) { const u = uA + (i/120)*(ub0 - uA); g.push(sx(u).toFixed(1) + ',' + sy(srn(u)).toFixed(1)); }
  $('gap').setAttribute('d', 'M' + g.join(' L') + ` L${sx(uA).toFixed(1)},${sy(w0).toFixed(1)} Z`);
})();
setL('srp0', sx(0), sy(w0), sx(11.6), sy(w0));
setL('srp1', sx(0), sy(w1), sx(11.6), sy(w1));
const uS = 9.6;
setL('shift', sx(uS), sy(w0) + 6, sx(uS), sy(w1) - 6);
setL('d-u0', sx(ub0), sy(w0), sx(ub0), sy(0));
setL('d-u1', sx(ub1), sy(w1), sx(ub1), sy(0));

const tg = $('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line'); t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2); t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
tick(121, sy(w0), 125, sy(w0)); tick(121, sy(w1), 125, sy(w1));
tick(sx(ub0), 460, sx(ub0), 464); tick(sx(ub1), 460, sx(ub1), 464);

function pt(id, u, w) { $(id).setAttribute('cx', sx(u)); $(id).setAttribute('cy', sy(w)); }
pt('pt0', ub0, w0); pt('pt1', ub1, w1);


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', P = '#534AB7', T = '#555';
put('lbl-w', 'w/P', 117, 36, {ha: 'r', s: 17});
put('lbl-u', 'u', 591, 468, {s: 17});
put('lbl-o', 'O', 117, 468, {ha: 'r'});
put('lbl-w0', '\\dfrac{A_L}{1+\\mu_0}', 117, sy(w0) - 6, {ha: 'r', va: 'b', s: 15});
put('lbl-w1', '\\dfrac{A_L}{1+\\mu_1}', 117, sy(w1) + 6, {ha: 'r', va: 't', s: 15});
put('lbl-ub0', '\\bar{u}_0', sx(ub0), 468, {ha: 'c'});
put('lbl-ub1', '\\bar{u}_1', sx(ub1), 468, {ha: 'c'});
put('lbl-srn', '\\text{SRN}', sx(uA) + 10, sy(srn(uA)), {va: 'm', c: G});
put('lbl-srp0', '\\text{SRP}_0', sx(11.6) + 6, sy(w0), {va: 'm', c: P});
put('lbl-srp1', '\\text{SRP}_1', sx(11.6) + 6, sy(w1), {va: 'm', c: P});
put('lbl-shift', '\\Delta \\mu > 0', sx(uS) + 8, (sy(w0) + sy(w1))/2, {va: 'm', c: P, s: 14});
put('lbl-gap', '\\Delta \\pi > 0', sx(2.1), sy(5.75), {ha: 'c', va: 'm', c: T, s: 14});
put('lbl-p0', '0', sx(ub0) + 7, sy(w0) - 5, {va: 'b'});
put('lbl-p1', '1', sx(ub1) + 7, sy(w1) - 5, {va: 'b'});
</script>
</body>
</html>
