<script>

  {id: 'l3', tex: 'T^*', x: 313.7, y: 431.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l4', tex: '\\text{Costes}', x: 514.0, y: 337.6, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l5', tex: '\\text{Beneficios}', x: 514.0, y: 169.6, color: '#1D9E75', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l6', tex: '\\text{no conviene la unión}', x: 218.9, y: 471.0, color: '#5a5a5a', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l7', tex: '\\text{conviene la unión}', x: 410.9, y: 471.0, color: '#5a5a5a', tr: 'translate(-50%,0)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
