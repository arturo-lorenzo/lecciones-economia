<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="80" y1="380" x2="640" y2="380" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="80" y1="380" x2="80" y2="30" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="ceil"  stroke="#D85A30" stroke-width="1.4" stroke-dasharray="6 3"/>
    <line id="trend" stroke="#888" stroke-width="2.2" stroke-dasharray="8 4"/>
    <line id="floor" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="6 3"/>

    <path id="cycle" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
<script>
const VBW = 680, VBH = 420;
const $ = id => document.getElementById(id);

const x0 = 80, x1 = 560, slope = -190/540;
const trendY = x => 318 + slope*(x - x0);
const ceilY  = x => trendY(x) - 80;
const floorY = x => trendY(x) + 45;
function setL(id, xa, ya, xb, yb) { const e = $(id); e.setAttribute('x1', xa); e.setAttribute('y1', ya); e.setAttribute('x2', xb); e.setAttribute('y2', yb); }
setL('ceil', x0, ceilY(x0), x1, ceilY(x1));
setL('trend', x0, trendY(x0), x1, trendY(x1));
setL('floor', x0, floorY(x0), x1, floorY(x1));





const soft = 3;
const smin = (a, b) => -soft*Math.log(Math.exp(-a/soft) + Math.exp(-b/soft));
const smax = (a, b) => -smin(-a, -b);
const period = 212, xs = 100, xe = 540;
const pts = [];
for (let i = 0; i <= 600; i++) {
  const x = xs + (i/600)*(xe - xs);
  const amp = Math.min(100, 22*Math.exp((x - xs)/70));
  let y = trendY(x) - amp*Math.sin((x - xs)/period*2*Math.PI);
  y = smax(y, ceilY(x));
  y = smin(y, floorY(x));
  pts.push(x.toFixed(1) + ',' + y.toFixed(1));
}
$('cycle').setAttribute('d', 'M' + pts.join(' L'));
const yEnd = +pts[pts.length - 1].split(',')[1];

function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
put('lbl-Y', '\\ln Y', 72, 36, {ha: 'r', s: 18});
put('lbl-t', 't', 646, 380, {va: 'm', s: 18});
put('lbl-ceil', '\\ln \\bar{Y}_t', x1 + 6, ceilY(x1), {va: 'm', c: '#D85A30', s: 15});
put('lbl-trend', '\\ln Y^{*}_t', x1 + 6, trendY(x1), {va: 'm', c: '#888', s: 15});
put('lbl-floor', '\\ln \\underline{Y}_t', x1 + 6, floorY(x1), {va: 'm', c: '#D85A30', s: 15});
put('lbl-Yt', '\\ln Y_t', xe + 6, yEnd, {va: 'm', c: '#378ADD', s: 15});
</script>
</body>
</html>
