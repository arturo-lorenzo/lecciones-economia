<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="440" x2="550" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="440" x2="130" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="163.6" y1="110" x2="382" y2="390" stroke="#378ADD" stroke-width="2.2"/>


    <line x1="163.6" y1="370" x2="491.2" y2="110" stroke="#1D9E75" stroke-width="2.2"/>


    <line x1="247.6" y1="370" x2="533.2" y2="140" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4"/>


    <line x1="403.2" y1="188.8" x2="425.4" y2="216.6" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>





    <circle cx="288.8" cy="271" r="5" fill="#000"/>











    <circle cx="320.7" cy="311" r="5" fill="#000"/>


    <line x1="288.8" y1="271" x2="288.8" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="288.8" y1="271" x2="130" y2="271" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="320.7" y1="311" x2="320.7" y2="440" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="320.7" y1="311" x2="130" y2="311" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="288.8" y1="440" x2="288.8" y2="444" stroke="black" stroke-width="1"/>
    <line x1="320.7" y1="440" x2="320.7" y2="444" stroke="black" stroke-width="1"/>
    <line x1="126" y1="271" x2="130" y2="271" stroke="black" stroke-width="1"/>
    <line x1="126" y1="311" x2="130" y2="311" stroke="black" stroke-width="1"/>

  </svg>


  <div class="katex-label" id="lbl-r"></div>
  <div class="katex-label" id="lbl-Y"></div>
  <div class="katex-label" id="lbl-IS"></div>
  <div class="katex-label" id="lbl-LM0"></div>
  <div class="katex-label" id="lbl-LM1"></div>
  <div class="katex-label" id="lbl-E0"></div>
  <div class="katex-label" id="lbl-E1"></div>
  <div class="katex-label" id="lbl-dM"></div>
  <div class="katex-label" id="lbl-r0"></div>
  <div class="katex-label" id="lbl-r1"></div>
  <div class="katex-label" id="lbl-Y0"></div>
  <div class="katex-label" id="lbl-Y1"></div>

</div>

<script>
const W = 680, H = 520;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const labels = [
  {id:'lbl-r',   tex:'i',       left: pct(123,W),   top: pct(45,H),   color:'black', align:'right'},
  {id:'lbl-Y',   tex:'Y',       left: pct(552,W),  top: pct(440,H),  color:'black'},
  {id:'lbl-IS',  tex:'\\text{IS}',      left: pct(386.2,W),  top: pct(375,H),  color:'#378ADD'},
  {id:'lbl-LM0', tex:'\\text{LM}_0',    left: pct(497.9,W),  top: pct(90,H),   color:'#1D9E75'},
  {id:'lbl-LM1', tex:'\\text{LM}_1',    left: pct(539.9,W),  top: pct(120,H),  color:'#1D9E75'},
  {id:'lbl-E0',  tex:'0',       left: pct(281.2,W),  top: pct(248,H),  color:'#000'},
  {id:'lbl-E1',  tex:'1',       left: pct(327.4,W),  top: pct(296,H),  color:'#000'},
  {id:'lbl-r0',  tex:'i_0',     left: pct(123,W),   top: pct(258,H),  color:'black', align:'right'},
  {id:'lbl-r1',  tex:'i_1',     left: pct(123,W),   top: pct(298,H),  color:'black', align:'right'},
  {id:'lbl-Y0',  tex:'Y_0',     left: pct(281.2,W),  top: pct(448,H),  color:'black'},
  {id:'lbl-Y1',  tex:'Y_1',     left: pct(313.1,W),  top: pct(448,H),  color:'black'},
  {id:'lbl-dM', tex:'\\Delta M^s > 0', left: pct(356.8,W), top: pct(172,H), color:'#1D9E75', size:'12.5px', center:true}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.size) e.style.fontSize = l.size;
  if (l.center) e.style.transform = 'translateX(-50%)';
  if (l.align === 'right') e.classList.add('right-of-axis');
});
</script>
<script>(function(){var N={"lbl-E0": [0.88, -1.47, 0], "lbl-E1": [2.06, 0.59, 0]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
