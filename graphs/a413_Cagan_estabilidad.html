<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="50" y1="345" x2="300" y2="345" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="50" y1="345" x2="50"  y2="115"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line x1="380" y1="345" x2="630" y2="345" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="380" y1="345" x2="380" y2="115"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <g id="curves"></g>
    <g id="arrows"></g>
    <g id="points"></g>
  </svg>
</div>
<script>





const VBW = 680, VBH = 420, OY = 345, K = 46, gM = 2.8;
const NS = 'http://www.w3.org/2000/svg';
function el(g, tag, att) { const e = document.createElementNS(NS, tag); for (const k in att) e.setAttribute(k, att[k]); document.getElementById(g).appendChild(e); return e; }
function line(g, x1, y1, x2, y2, att) { return el(g, 'line', Object.assign({x1, y1, x2, y2}, att)); }
const dash = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, tk = {stroke: 'black', 'stroke-width': 1};
const cL = '#378ADD', cPt = '#D85A30';
const L = []; function put(tex, x, y, o = {}) { L.push(Object.assign({tex, x, y}, o)); }

function panel(ox, al, lo, hi, P) {
  const X = v => ox + v*K, Y = v => OY - v*K, f = pe => (gM - al*pe)/(1 - al);

  line('guides', X(gM), Y(gM), X(gM), OY, dash); line('guides', X(0), Y(gM), X(gM), Y(gM), dash);
  line('guides', X(gM), OY, X(gM), OY + 4, tk); line('guides', ox - 4, Y(gM), ox, Y(gM), tk);

  line('curves', X(0), Y(0), X(P.bis), Y(P.bis), {stroke: '#222', 'stroke-width': 1.4});
  line('curves', X(lo), Y(f(lo)), X(hi), Y(f(hi)), {stroke: cL, 'stroke-width': 2.2});


  P.adj.forEach(pe => { const y = Y(f(pe)), dir = f(pe) > pe ? 1 : -1, xa = X(pe) + dir*7, xb = X(pe) + dir*P.len;
    const pts = [0, 1, 2].map(i => (xa + (xb - xa)*i/2).toFixed(1) + ',' + y.toFixed(1)).join(' ');
    el('arrows', 'polyline', {points: pts, fill: 'none', stroke: '#5a5a5a', 'stroke-width': 1.2, 'stroke-dasharray': '5 4', 'marker-mid': 'url(#arrow)', 'marker-end': 'url(#arrow)'}); });
  el('points', 'circle', {cx: X(gM), cy: Y(gM), r: 5, fill: '#000'});

  put('0', X(gM) + P.E[0], Y(gM) + P.E[1], {c: '#000', ha: P.E[2], va: 'b'});
  put('\\pi = \\pi^e', X(P.bis) + 4, Y(P.bis), {va: 'm', s: 15});
  put('\\pi(\\pi^e)', X(hi) + P.lab[0], Y(f(hi)) + P.lab[1], {c: cL, va: P.lab[2], ha: P.lab[3] || 'l'});
  put('g_M', X(gM), OY + 7, {ha: 'c', s: 15});
  put('g_M', ox - 7, Y(gM), {ha: 'r', va: 'm', s: 15});
  put('\\pi', ox - 8, 113, {ha: 'r', s: 17});
  put('\\pi^e', ox + 253, OY, {va: 'm', s: 17});
  put(P.title, ox + 125, 73, {ha: 'c', s: 15, c: '#444'});
}
panel(50, 0.4, 0, 4.9, {E: [0, -12, 'c'], lab: [6, 0, 'm'], adj: [1.3, 4.3], len: 57, bis: 4.7,
      title: '\\text{a) } a\\lambda < 1\\text{: equilibrio estable}'});
panel(380, 2, 1.4, 3.7, {E: [-8, -12, 'r'], lab: [-6, 0, 'm', 'r'], adj: [2.0, 3.5], len: 29, bis: 4.8,
      title: '\\text{b) } a\\lambda > 1\\text{: equilibrio inestable}'});

const cont = document.querySelector('.graph-container');
L.forEach((l, i) => {
  const e = document.createElement('div'); e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = (l.x/VBW*100).toFixed(2) + '%'; e.style.top = (l.y/VBH*100).toFixed(2) + '%';
  e.style.color = l.c || 'black'; if (l.s) e.style.fontSize = l.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[l.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[l.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (l.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
});
</script>
</body>
</html>
