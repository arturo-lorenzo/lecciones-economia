<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"
               patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#aaa" stroke-width="1.2"/>
      </pattern>
    </defs>


    <path id="lens" fill="url(#hatch)" stroke="none"/>


    <line x1="136" y1="460" x2="573" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="136" y1="460" x2="136" y2="55"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="wr-line" stroke="#888" stroke-width="1"/>


    <line id="n-line" stroke="black" stroke-width="1"/>


    <line id="ld" stroke="#378ADD" stroke-width="2.2"/>


    <path id="iso0" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linecap="round"/>
    <path id="iso1" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linecap="round"/>


    <path id="ci0" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="ci1" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="d-wm" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-lm" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="d-lcp" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="mal-arrow" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>


    <g id="ticks"></g>


    <circle id="pt1" r="5" fill="#000"/>
    <circle id="pt0" r="5" fill="#000"/>
  </svg>


  <div class="katex-label" id="lbl-w"></div>
  <div class="katex-label" id="lbl-l"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-wm"></div>
  <div class="katex-label" id="lbl-wr"></div>
  <div class="katex-label" id="lbl-lm"></div>
  <div class="katex-label" id="lbl-lcp"></div>
  <div class="katex-label" id="lbl-n"></div>
  <div class="katex-label" id="lbl-ld"></div>
  <div class="katex-label" id="lbl-pi0"></div>
  <div class="katex-label" id="lbl-pi1"></div>
  <div class="katex-label" id="lbl-ci0"></div>
  <div class="katex-label" id="lbl-ci1"></div>
  <div class="katex-label" id="lbl-p1"></div>
  <div class="katex-label" id="lbl-p0"></div>
  <div class="katex-label" id="lbl-g1"></div>
  <div class="katex-label" id="lbl-g0"></div>
  <div class="katex-label" id="lbl-mal"></div>
</div>

<script>





const a = 10, b = 0.7, wbar = 3, N = 16;
const LCP = (a - wbar) / b;
const Lm  = LCP / 2;
const wm  = (a + wbar) / 2;
const pi0 = Lm  * (a - (b/2)*Lm  - wm);
const pi1 = LCP * (a - (b/2)*LCP - wbar);
const c0  = (wm - wbar) * Lm;
const c1  = 30;

const iso = (L, pi) => a - (b/2)*L - pi/L;
const ic  = (L, c)  => L <= N ? wbar + c/L : wbar + c/N;

const disc  = Math.sqrt((a-wbar)*(a-wbar) - 4*(b/2)*(c0+pi0));
const lensA = ((a-wbar) - disc) / b;
const lensB = ((a-wbar) + disc) / b;


const Lmax = 17.5, wmax = 11, VBH = 520, VBW = 680;
const sx = L => 136 + L * (424 / Lmax);
const sy = w => 460 - w * (390 / wmax);
const pctX = x => (x / VBW * 100).toFixed(1) + '%';
const pctY = y => (y / VBH * 100).toFixed(1) + '%';

function drawPath(id, f, L1, L2, n = 220) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const L = L1 + (i/n)*(L2 - L1);
    const w = f(L);
    if (w < -0.2 || w > wmax + 0.2) continue;
    pts.push(sx(L).toFixed(1) + ',' + sy(w).toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}


const ld = document.getElementById('ld');
ld.setAttribute('x1', sx(0));    ld.setAttribute('y1', sy(a));
ld.setAttribute('x2', sx(13.3)); ld.setAttribute('y2', sy(a - b*13.3));

drawPath('iso0', L => iso(L, pi0), 1.55, 15.4);
drawPath('iso1', L => iso(L, pi1), 5.0, 17.0);
drawPath('ci0',  L => ic(L, c0),  c0/(wmax - wbar - 0.1), 17.3);
drawPath('ci1',  L => ic(L, c1),  c1/(wmax - wbar - 0.1), 17.3);


(function() {
  const top = [], bot = [];
  const n = 160;
  for (let i = 0; i <= n; i++) {
    const L = lensA + (i/n)*(lensB - lensA);
    top.push(sx(L).toFixed(1) + ',' + sy(iso(L, pi0)).toFixed(1));
    bot.push(sx(L).toFixed(1) + ',' + sy(ic(L, c0)).toFixed(1));
  }
  bot.reverse();
  document.getElementById('lens')
    .setAttribute('d', 'M' + top.join(' L') + ' L' + bot.join(' L') + ' Z');
})();


function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}
setLine('wr-line', sx(0), sy(wbar), sx(17.3), sy(wbar));
setLine('n-line',  sx(N), sy(0), sx(N), sy(10.4));
setLine('d-wm',  sx(0),   sy(wm), sx(Lm),  sy(wm));
setLine('d-lm',  sx(Lm),  sy(wm), sx(Lm),  sy(0));
setLine('d-lcp', sx(LCP), sy(wbar), sx(LCP), sy(0));
setLine('mal-arrow', sx(8.4), sy(8.1), sx(8.7), sy(5.7));


const ticksG = document.getElementById('ticks');
function addTick(x1, y1, x2, y2) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1);
  t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
addTick(132, sy(wm), 136, sy(wm));
addTick(132, sy(wbar), 136, sy(wbar));
addTick(sx(Lm), 460, sx(Lm), 464);
addTick(sx(LCP), 460, sx(LCP), 464);
addTick(sx(N), 460, sx(N), 464);


document.getElementById('pt1').setAttribute('cx', sx(Lm));
document.getElementById('pt1').setAttribute('cy', sy(wm));
document.getElementById('pt0').setAttribute('cx', sx(LCP));
document.getElementById('pt0').setAttribute('cy', sy(wbar));


const labels = [
  {id: 'lbl-w',   tex: 'w', left: pctX(116),  top: pctY(46),  color: 'black', s: 17},
  {id: 'lbl-l',   tex: 'L', left: pctX(581), top: pctY(452), color: 'black', s: 17},
  {id: 'lbl-o',   tex: 'O', left: pctX(118),  top: pctY(462), color: 'black'},

  {id: 'lbl-wm',  tex: 'w^{*}', left: pctX(128), top: pctY(sy(wm) - 10),   color: 'black', align: 'right'},
  {id: 'lbl-wr',  tex: '\\underline{w}',   left: pctX(128), top: pctY(sy(wbar) - 10), color: 'black', align: 'right'},

  {id: 'lbl-lm',  tex: 'L^{*}',  left: pctX(sx(Lm) - 12),  top: pctY(466), color: 'black'},
  {id: 'lbl-lcp', tex: 'L_C', left: pctX(sx(LCP) - 16), top: pctY(466), color: 'black'},
  {id: 'lbl-n',   tex: 'N^s',    left: pctX(sx(N) - 9),    top: pctY(466), color: 'black'},

  {id: 'lbl-ld',  tex: 'L^d(w)', left: pctX(sx(13.3) + 8), top: pctY(sy(a - b*13.3) - 10), color: '#185FA5', s: 16},
  {id: 'lbl-pi0', tex: '\\pi_0', left: pctX(sx(1.55) - 24), top: pctY(sy(iso(1.55, pi0)) - 4), color: '#534AB7', s: 16},
  {id: 'lbl-pi1', tex: '\\pi_1', left: pctX(sx(17.0) + 6), top: pctY(sy(iso(17.0, pi1)) - 11), color: '#534AB7', s: 16},
  {id: 'lbl-ci0', tex: '\\text{CI}_0',   left: pctX(sx(17.3) + 4), top: pctY(sy(ic(17.3, c0)) - 11), color: '#0F6E56', s: 16},
  {id: 'lbl-ci1', tex: '\\text{CI}_1',   left: pctX(sx(17.3) + 4), top: pctY(sy(ic(17.3, c1)) - 11), color: '#0F6E56', s: 16},

  {id: 'lbl-p1',  tex: '1', left: pctX(sx(Lm) + 8),   top: pctY(sy(wm) - 28),   color: '#000'},
  {id: 'lbl-p0',  tex: '0', left: pctX(sx(LCP) + 8),  top: pctY(sy(wbar) - 29), color: '#000'},
  {id: 'lbl-g1',  tex: '(\\gamma = 1)', left: pctX(sx(Lm) - 26),  top: pctY(486),   color: '#777', s: 14},
  {id: 'lbl-g0',  tex: '(\\gamma = 0)', left: pctX(sx(LCP) - 26), top: pctY(486),  color: '#777', s: 14},

  {id: 'lbl-mal', tex: '\\text{Mejoras paretianas}', left: pctX(sx(6.5)), top: pctY(sy(8.4) - 22), color: '#555'},
];

labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  el.style.fontSize = (l.s || 15) + 'px';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  if (l.color) el.style.color = l.color;
  if (l.align === 'right') el.classList.add('right-of-axis');
});
</script>
</body>
</html>
