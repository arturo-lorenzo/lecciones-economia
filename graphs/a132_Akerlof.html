<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label .katex { font-size: 1em; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="100" y1="480" x2="600" y2="480" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100" y1="480" x2="100" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="supply" stroke="#D85A30" stroke-width="2.2"/>


    <path id="demand" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="eq0" r="5" fill="#000"/>
    <circle id="eq1" r="5" fill="#000"/>


    <line id="dash-0-v" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-0-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-1-v" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dash-1-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <line id="tick-0x" y1="480" y2="484" stroke="black" stroke-width="1"/>
    <line id="tick-0y" x1="96" x2="100" stroke="black" stroke-width="1"/>
    <line id="tick-1x" y1="480" y2="484" stroke="black" stroke-width="1"/>
    <line id="tick-1y" x1="96" x2="100" stroke="black" stroke-width="1"/>
    <line id="tick-e0y" x1="96" x2="100" stroke="black" stroke-width="1"/>
    <line id="dash-e0-h" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
  </svg>

  <div class="katex-label" id="lbl-p"></div>
  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-s"></div>
  <div class="katex-label" id="lbl-d"></div>
  <div class="katex-label" id="lbl-0"></div>
  <div class="katex-label" id="lbl-1"></div>
  <div class="katex-label" id="lbl-x0"></div>
  <div class="katex-label" id="lbl-x1"></div>
  <div class="katex-label" id="lbl-ys"></div>
  <div class="katex-label" id="lbl-eys"></div>
  <div class="katex-label" id="lbl-e0p"></div>
</div>

<script>
const ox = 100, oy = 480, pw = 480, ph = 420;

function toSvg(x, p) {
  return [ox + (x / 10) * pw, oy - (p / 10) * ph];
}




const sSlope = 0.9;
const sInt = 0.5;
function supply(x) { return sSlope * x + sInt; }

const sXmax = 9;
const [sSx1, sSy1] = toSvg(0, sInt);
const [sSx2, sSy2] = toSvg(sXmax, supply(sXmax));
document.getElementById('supply').setAttribute('x1', sSx1);
document.getElementById('supply').setAttribute('y1', sSy1);
document.getElementById('supply').setAttribute('x2', sSx2);
document.getElementById('supply').setAttribute('y2', sSy2);







const xMaxD = 7.5;
const pTurn = 4.5;
const A = 0.22;

const rotDeg = 15;
const rotRad = rotDeg * Math.PI / 180;
const cosD = Math.cos(rotRad), sinD = Math.sin(rotRad);


const [pivSx, pivSy] = toSvg(xMaxD, pTurn);


const dPts = [];
const dEconPts = [];
for (let i = 0; i <= 400; i++) {
  const t = -6.0 + (i / 400) * 12.0;
  const xBase = xMaxD - A * t * t;
  const pBase = pTurn + t;


  let [sx, sy] = toSvg(xBase, pBase);

  const dx = sx - pivSx, dy = sy - pivSy;
  const sxR = pivSx + dx * cosD - dy * sinD;
  const syR = pivSy + dx * sinD + dy * cosD;


  if (sxR >= ox + 2 && sxR <= ox + pw - 2 && syR >= 45 && syR <= oy - 2) {
    dPts.push(sxR.toFixed(1) + ',' + syR.toFixed(1));

    const econX = (sxR - ox) / pw * 10;
    const econP = (oy - syR) / ph * 10;
    dEconPts.push({ x: econX, p: econP, sx: sxR, sy: syR });
  }
}
document.getElementById('demand').setAttribute('d', 'M' + dPts.join(' L'));





const intersections = [];
for (let i = 0; i < dEconPts.length - 1; i++) {
  const d1 = dEconPts[i].p - supply(dEconPts[i].x);
  const d2 = dEconPts[i+1].p - supply(dEconPts[i+1].x);
  if (d1 * d2 < 0) {
    const t = d1 / (d1 - d2);
    const ix = dEconPts[i].x + t * (dEconPts[i+1].x - dEconPts[i].x);
    const ip = dEconPts[i].p + t * (dEconPts[i+1].p - dEconPts[i].p);
    const isx = dEconPts[i].sx + t * (dEconPts[i+1].sx - dEconPts[i].sx);
    const isy = dEconPts[i].sy + t * (dEconPts[i+1].sy - dEconPts[i].sy);
    intersections.push({ x: ix, p: ip, sx: isx, sy: isy });
  }
}


if (intersections.length >= 2) {
  const eq0 = intersections[0];
  const eq1 = intersections[1];

  document.getElementById('eq0').setAttribute('cx', eq0.sx.toFixed(1));
  document.getElementById('eq0').setAttribute('cy', eq0.sy.toFixed(1));
  document.getElementById('eq1').setAttribute('cx', eq1.sx.toFixed(1));
  document.getElementById('eq1').setAttribute('cy', eq1.sy.toFixed(1));


  const [eq0px] = toSvg(eq0.x, 0);
  const [, eq0py] = toSvg(0, eq0.p);
  const [eq1px] = toSvg(eq1.x, 0);
  const [, eq1py] = toSvg(0, eq1.p);

  document.getElementById('dash-0-v').setAttribute('x1', eq0.sx.toFixed(1));
  document.getElementById('dash-0-v').setAttribute('y1', eq0.sy.toFixed(1));
  document.getElementById('dash-0-v').setAttribute('x2', eq0.sx.toFixed(1));
  document.getElementById('dash-0-v').setAttribute('y2', oy);
  document.getElementById('dash-0-h').setAttribute('x1', ox);
  document.getElementById('dash-0-h').setAttribute('y1', eq0.sy.toFixed(1));
  document.getElementById('dash-0-h').setAttribute('x2', eq0.sx.toFixed(1));
  document.getElementById('dash-0-h').setAttribute('y2', eq0.sy.toFixed(1));

  document.getElementById('dash-1-v').setAttribute('x1', eq1.sx.toFixed(1));
  document.getElementById('dash-1-v').setAttribute('y1', eq1.sy.toFixed(1));
  document.getElementById('dash-1-v').setAttribute('x2', eq1.sx.toFixed(1));
  document.getElementById('dash-1-v').setAttribute('y2', oy);
  document.getElementById('dash-1-h').setAttribute('x1', ox);
  document.getElementById('dash-1-h').setAttribute('y1', eq1.sy.toFixed(1));
  document.getElementById('dash-1-h').setAttribute('x2', eq1.sx.toFixed(1));
  document.getElementById('dash-1-h').setAttribute('y2', eq1.sy.toFixed(1));


  document.getElementById('tick-0x').setAttribute('x1', eq0.sx.toFixed(1));
  document.getElementById('tick-0x').setAttribute('x2', eq0.sx.toFixed(1));
  document.getElementById('tick-0y').setAttribute('y1', eq0.sy.toFixed(1));
  document.getElementById('tick-0y').setAttribute('y2', eq0.sy.toFixed(1));
  document.getElementById('tick-1x').setAttribute('x1', eq1.sx.toFixed(1));
  document.getElementById('tick-1x').setAttribute('x2', eq1.sx.toFixed(1));
  document.getElementById('tick-1y').setAttribute('y1', eq1.sy.toFixed(1));
  document.getElementById('tick-1y').setAttribute('y2', eq1.sy.toFixed(1));



  let inflPt = dEconPts[0];
  for (const pt of dEconPts) {
    if (pt.x > inflPt.x) inflPt = pt;
  }
  const inflSy = inflPt.sy;


  document.getElementById('tick-e0y').setAttribute('y1', inflSy.toFixed(1));
  document.getElementById('tick-e0y').setAttribute('y2', inflSy.toFixed(1));
  document.getElementById('dash-e0-h').setAttribute('x1', ox);
  document.getElementById('dash-e0-h').setAttribute('y1', inflSy.toFixed(1));
  document.getElementById('dash-e0-h').setAttribute('x2', inflPt.sx.toFixed(1));
  document.getElementById('dash-e0-h').setAttribute('y2', inflSy.toFixed(1));


  const eqNear = eq0.x < eq1.x ? eq0 : eq1;
  const eqFar  = eq0.x < eq1.x ? eq1 : eq0;


  const VBW = 680, VBH = 560;
  function pctW(v) { return (v / VBW * 100).toFixed(1) + '%'; }
  function pctH(v) { return (v / VBH * 100).toFixed(1) + '%'; }

  const dLblPt = dEconPts[dEconPts.length - 1];

  const allLabels = [
    {id:'lbl-p', tex:'p',                                      left: pctW(ox - 8),           top: pctH(45),               color:'black', align:'right'},
    {id:'lbl-x', tex:'x',                                      left: pctW(602),               top: pctH(oy + 5),           color:'black'},
    {id:'lbl-s', tex:'S(x)',                                   left: pctW(sSx2 + 5),         top: pctH(sSy2 - 18),        color:'#D85A30'},
    {id:'lbl-d', tex:'D(x)',                                   left: pctW(dLblPt.sx - 8),  top: pctH(dLblPt.sy - 6),  color:'#534AB7', align:'right'},
    {id:'lbl-0', tex:'0',                                      left: pctW(eqFar.sx - 1),     top: pctH(eqFar.sy - 38),    color:'#000'},
    {id:'lbl-1', tex:'1',                                      left: pctW(eqNear.sx - 20),    top: pctH(eqNear.sy - 34),   color:'#000'},
    {id:'lbl-x0',tex:'x(\\underline{\\theta})',                left: pctW(eqNear.sx - 8),     top: pctH(oy + 8),           color:'black'},
    {id:'lbl-x1',tex:'x(\\overline{\\theta})',                 left: pctW(eqFar.sx - 8),      top: pctH(oy + 8),           color:'black'},
    {id:'lbl-ys',tex:'p_0',                                    left: pctW(ox - 9),            top: pctH(eqFar.sy - 12),    color:'black', align:'right'},
    {id:'lbl-eys',tex:'p_1',                                left: pctW(ox - 9),            top: pctH(eqNear.sy - 12),   color:'black', align:'right'},
    {id:'lbl-e0p',tex:'\\hat{p}',                              left: pctW(ox - 9),            top: pctH(inflSy - 12),      color:'black', align:'right'}
  ];

  allLabels.forEach(l => {
    const el = document.getElementById(l.id);
    if (!el) return;
    katex.render(l.tex, el, {throwOnError: false});
    el.style.left = l.left;
    el.style.top  = l.top;
    if (l.color) el.style.color = l.color;
    if (l.align === 'right') el.classList.add('right-of-axis');
  });
}
</script>
</body>
</html>
