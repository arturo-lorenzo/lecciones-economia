<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  body { margin: 0; }
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">

<line x1="96.0" y1="340.0" x2="100.0" y2="340.0" stroke="#000" stroke-width="1"/>
<line x1="180.2" y1="80.0" x2="180.2" y2="420.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
<line x1="180.2" y1="420.0" x2="180.2" y2="424.0" stroke="#000" stroke-width="1"/>

</svg>
</div>
<script>
const LABELS = [{"t": "\\text{Preferencia}", "x": 14.706, "y": 6.4, "a": "-50%,-100%", "c": "#000", "s": 17, "bg": false}, {"t": "\\text{Alternativas}", "x": 76.048, "y": 84.0, "a": "0,-50%", "c": "#000", "s": 17, "bg": false}, {"t": "+", "x": 13.235, "y": 24.0, "a": "-100%,-50%", "c": "#000", "s": null, "bg": false}, {"t": "0", "x": 13.235, "y": 46.0, "a": "-100%,-50%", "c": "#000", "s": null, "bg": false}, {"t": "-", "x": 13.235, "y": 68.0, "a": "-100%,-50%", "c": "#000", "s": null, "bg": false}, {"t": "A", "x": 26.502, "y": 85.6, "a": "-50%,0", "c": "#000", "s": 17, "bg": false}, {"t": "B", "x": 43.542, "y": 85.6, "a": "-50%,0", "c": "#000", "s": 17, "bg": false}, {"t": "C", "x": 60.581, "y": 85.6, "a": "-50%,0", "c": "#000", "s": 17, "bg": false}, {"t": "\\text{Votante 1}", "x": 63.728, "y": 68.0, "a": "0,-50%", "c": "#185FA5", "s": null, "bg": false}, {"t": "\\text{Votante 2}", "x": 63.728, "y": 46.0, "a": "0,-50%", "c": "#0F6E56", "s": null, "bg": false}, {"t": "\\text{Votante 3}", "x": 63.728, "y": 24.0, "a": "0,-50%", "c": "#D85A30", "s": null, "bg": false}];
const box = document.querySelector('.graph-container');
LABELS.forEach((L, i) => {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(L.t, e, {throwOnError: false});
  e.style.left = L.x + '%'; e.style.top = L.y + '%';
  e.style.transform = 'translate(' + L.a + ')';
  e.style.color = L.c;
  if (L.s) e.style.fontSize = L.s + 'px';
  if (L.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  box.appendChild(e);
});
</script>
</body>
</html>
