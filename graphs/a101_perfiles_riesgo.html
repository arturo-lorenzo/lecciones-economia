<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 960">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="panels"></g>
  </svg>

</div>

<script>




const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 960;
const g = document.getElementById('panels');
const container = document.querySelector('.graph-container');

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e);
  return e;
}
function dash(x1, y1, x2, y2) {
  el('line', {x1, y1, x2, y2, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '6 4'});
}
function tick(x1, y1, x2, y2) {
  el('line', {x1, y1, x2, y2, stroke: 'black', 'stroke-width': 1});
}

function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = null, bg = false) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%';
  d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color;
  if (size) d.style.fontSize = size;
  if (bg) {
    d.style.background = '#fff';
    const k = d.querySelector('.katex'); if (k) k.style.padding = '0 2px';
  }
  container.appendChild(d);
}

function panel(cfg) {
  const {oy, top, u, uinv, k, x1, x2, title, rhoTex, curveEnd} = cfg;
  const OX = 140, XMAX = 11, SX = 34.5;
  const sx = x => OX + x * SX;
  const sy = v => oy - k * v;


  el('line', {x1: OX, y1: oy, x2: 540, y2: oy, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  el('line', {x1: OX, y1: oy, x2: OX, y2: top, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});


  const E = (x1 + x2) / 2;
  const Eu = (u(x1) + u(x2)) / 2;
  const uE = u(E);
  const xc = uinv(Eu);


  dash(sx(x1), sy(u(x1)), sx(x1), oy);
  dash(sx(x2), sy(u(x2)), sx(x2), oy);
  dash(OX, sy(uE), sx(E), sy(uE));
  dash(OX, sy(Eu), Math.max(sx(E), sx(xc)), sy(Eu));
  dash(sx(E), Math.min(sy(uE), sy(Eu)), sx(E), oy);
  dash(sx(xc), sy(Eu), sx(xc), oy);


  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const x = (i / 300) * curveEnd;
    pts.push(sx(x).toFixed(1) + ',' + sy(u(x)).toFixed(1));
  }
  el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: '#1D9E75', 'stroke-width': 2.2, 'stroke-linecap': 'round'});


  el('line', {x1: sx(x1), y1: sy(u(x1)), x2: sx(x2), y2: sy(u(x2)), stroke: '#534AB7', 'stroke-width': 1.4, 'stroke-dasharray': '7 4'});


  [x1, x2, E, xc].forEach(x => tick(sx(x), oy, sx(x), oy + 4));
  [uE, Eu].forEach(v => tick(OX - 4, sy(v), OX, sy(v)));


  el('circle', {cx: sx(x1), cy: sy(u(x1)), r: 4.5, fill: '#0F6E56'});
  el('circle', {cx: sx(x2), cy: sy(u(x2)), r: 4.5, fill: '#0F6E56'});
  el('circle', {cx: sx(E), cy: sy(uE), r: 4.5, fill: '#0F6E56'});
  el('circle', {cx: sx(xc), cy: sy(Eu), r: 4.5, fill: '#0F6E56'});
  el('circle', {cx: sx(E), cy: sy(Eu), r: 4.5, fill: '#534AB7'});


  const by = oy + 46;
  const a = Math.min(sx(E), sx(xc)), b = Math.max(sx(E), sx(xc));
  tick(sx(xc), by - 5, sx(xc), by + 5);
  tick(sx(E), by - 5, sx(E), by + 5);
  el('line', {x1: a + 1, y1: by, x2: b - 1, y2: by, stroke: 'black', 'stroke-width': 1,
              'marker-start': 'url(#arrow)', 'marker-end': 'url(#arrow)'});


  lab('x', 542, oy + 4, 'black', 0, 0, '16px');
  lab('u(x)', OX - 2, top - 4, 'black', 0.5, 1, '16px');
  lab('O', OX - 6, oy + 4, 'black', 1, 0, '16px');
  lab(title, OX + 40, top + 10, '#444', 0, 0, '14px');
  lab('u(x)', sx(curveEnd) + 6, sy(u(curveEnd)), '#0F6E56', 0, 0.5, '16px');
  lab('x_1', sx(x1), oy + 8, 'black', 0.5, 0, '14px');
  lab('x_2', sx(x2), oy + 8, 'black', 0.5, 0, '14px');
  lab('\\mathbb{E}(\\mathbf{l})', sx(E), oy + 8, 'black', 0.5, 0, '14px');
  lab('x_c', sx(xc), oy + 8, 'black', 0.5, 0, '14px');
  lab('u(\\mathbb{E}(\\mathbf{l}))', OX - 8, sy(uE), 'black', 1, 0.5, '14px');
  lab('\\mathbb{E}[u(\\mathbf{l})]', OX - 8, sy(Eu), 'black', 1, 0.5, '14px');
  lab(rhoTex, b + 8, by, 'black', 0, 0.5, '14px');
}

panel({oy: 420, top: 50, u: x => Math.sqrt(x), uinv: v => v * v, k: 105,
       x1: 1, x2: 10, curveEnd: 11,
       title: '\\text{(a) Aversión al riesgo: } u\'\'(x) < 0', rhoTex: '\\rho > 0'});
panel({oy: 880, top: 510, u: x => x * x, uinv: v => Math.sqrt(v), k: 3.0,
       x1: 2, x2: 10, curveEnd: 11,
       title: '\\text{(b) Propensión al riesgo: } u\'\'(x) > 0', rhoTex: '\\rho < 0'});
</script>
</body>
</html>
