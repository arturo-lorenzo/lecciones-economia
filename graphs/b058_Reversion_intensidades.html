<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="324.0" y1="270.0" x2="324.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="324.0" y1="460.0" x2="324.0" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="220.0" y1="304.6" x2="220.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="220.0" y1="460.0" x2="220.0" y2="464.0" stroke="black" stroke-width="1"/>
    <line x1="428.0" y1="191.0" x2="428.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="428.0" y1="460.0" x2="428.0" y2="464.0" stroke="black" stroke-width="1"/>
    <path d="M144.0,329.9 L508.0,208.8" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M144.0,406.8 L508.0,130.2" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="220.0" cy="349.0" r="5" fill="#D85A30"/>
    <circle cx="220.0" cy="304.6" r="5" fill="#378ADD"/>
    <circle cx="428.0" cy="191.0" r="5" fill="#D85A30"/>
    <circle cx="428.0" cy="235.4" r="5" fill="#378ADD"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>





const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: '\\ln(w/r)', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: '\\ln(K/L)', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: '\\ln(w/r)^B', x: 220.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l3', tex: '\\ln(w/r)^c', x: 324.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l4', tex: '\\ln(w/r)^A', x: 428.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},
  {id: 'l5', tex: '\\ln(K/L)_X', x: 514.0, y: 130.2, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l6', tex: '\\ln(K/L)_Y', x: 514.0, y: 208.8, color: '#378ADD', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l7', tex: '\\text{pendiente } \\sigma_X', x: 186.0, y: 401.4, color: '#D85A30', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l8', tex: '\\text{pendiente } \\sigma_Y', x: 436.0, y: 255.6, color: '#378ADD', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l9', tex: '\\text{X intensivo en trabajo}', x: 220.0, y: 121.8, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l10', tex: '\\text{B exporta X}', x: 220.0, y: 144.6, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l11', tex: '\\text{X intensivo en capital}', x: 428.0, y: 83.8, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
  {id: 'l12', tex: '\\text{A exporta X}', x: 428.0, y: 106.6, color: '#5a5a5a', tr: 'translate(-50%,-50%)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
