<body>

    <line x1="418.6" y1="388.3" x2="449.0" y2="367.8" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <circle cx="326.5" cy="265.0" r="5" fill="#000"/>

    <line x1="102.5" y1="265.0" x2="106.5" y2="265.0" stroke="black" stroke-width="1"/>
    <line x1="102.5" y1="304.0" x2="106.5" y2="304.0" stroke="black" stroke-width="1"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>

  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
  <div class="katex-label" id="lbl11"></div>
  <div class="katex-label" id="lbl12"></div>
  <div class="katex-label" id="lbl13"></div>
  <div class="katex-label" id="lbl14"></div>
  <div class="katex-label" id="lbl15"></div>
  <div class="katex-label" id="lbl16"></div>
  <div class="katex-label" id="lbl17"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "i",
  "x": 98.5,
  "y": 58,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl1",
  "tex": "Y",
  "x": 552.5,
  "y": 460,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "O",
  "x": 98.5,
  "y": 466,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "\\text{BP}\\;(i = i^*)",
  "x": 504.1,
  "y": 265.0,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "\\text{IS}_0",
  "x": 450.3,
  "y": 440.5,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "\\text{IS}_1",
  "x": 511.9,
  "y": 440.5,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "\\text{LM}_0",
  "x": 484.0,
  "y": 96.0,
  "anchor": "lm",
  "color": "#534AB7",
  "size": 16
 },
 {
  "id": "lbl7",
  "tex": "\\text{LM}_1",
  "x": 510.4,
  "y": 135.0,
  "anchor": "lm",
  "color": "#534AB7",
  "size": 16
 },
 {
  "id": "lbl8",
  "tex": "\\Delta M^s > 0",
  "x": 459.5,
  "y": 194.3,
  "anchor": "lt",
  "color": "#534AB7",
  "size": 14
 },
 {
  "id": "lbl9",

 },

  "y": 250.0,
  "anchor": "rm",

 },
 {
  "id": "lbl11",

  "x": 370.9,

  "anchor": "lm",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl12",
  "tex": "1",
  "x": 388.1,
  "y": 249.0,
  "anchor": "cb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl13",
  "tex": "Y_0",
  "x": 324.0,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl14",
  "tex": "Y_{0'}",
  "x": 354.9,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl15",
  "tex": "Y_1",
  "x": 388.1,
  "y": 467.0,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl16",
  "tex": "i^*",
  "x": 98.5,
  "y": 265.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl17",
  "tex": "i_{0'}",
  "x": 98.5,
  "y": 304.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
