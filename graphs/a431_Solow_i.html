<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 960" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="123" y1="440" x2="563" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="123" y1="440" x2="123" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="cd-line" stroke="#D85A30" stroke-width="2.2"/>


    <path id="ca-curve" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <path id="fk-curve" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="pt-ss" r="5" fill="#000"/>


    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="tick-kstar" stroke="black" stroke-width="1"/>


    <line id="dash-istar" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="tick-istar" stroke="black" stroke-width="1"/>


    <line id="dash-ystar" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="tick-ystar" stroke="black" stroke-width="1"/>


    <circle id="pt-fk" r="4" fill="#378ADD"/>


    <line id="arr-cstar" stroke="black" stroke-width="1.2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>


    <polyline id="dyn-l" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline id="dyn-r" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>





    <line x1="123" y1="880" x2="563" y2="880" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="123" y1="880" x2="123" y2="480" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="ca2-curve" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="cd2-line" stroke="#D85A30" stroke-width="2.2"/>


    <circle id="pt-ss2" r="5" fill="#000"/>


    <line id="dash-v2" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="tick-kstar2" stroke="black" stroke-width="1"/>


    <line id="arr-gk" stroke="black" stroke-width="1.2"
          marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  </svg>

</div>

<script>
const OX=123, OY=440, KEND=7.4, Hrange=400;

function toSvgX(k){return OX+k*68*440/560;}
function toSvgY(y){return OY-y/10*Hrange;}


const A=3.0, alpha=0.5;
function fk(k){return A*Math.pow(k,alpha);}


const s=0.4;
function sfk(k){return s*fk(k);}


const dn=0.6;


const kstar=Math.pow(s*A/dn, 1/(1-alpha));


const kfcross=Math.pow(A/dn, 1/(1-alpha));

function genCurve(fn, kMin, kMax, id){
  const pts=[];
  for(let i=0;i<=300;i++){
    const k=kMin+(i/300)*(kMax-kMin);
    const sx=toSvgX(k), sy=toSvgY(fn(k));
    if(sy>=45&&sy<=OY+5) pts.push(sx.toFixed(1)+','+sy.toFixed(1));
  }
  document.getElementById(id).setAttribute('d','M'+pts.join(' L'));
}


genCurve(sfk, 0.001, KEND, 'ca-curve');
genCurve(fk, 0.001, KEND, 'fk-curve');


const ssX=toSvgX(kstar), ssY=toSvgY(sfk(kstar));
document.getElementById('pt-ss').setAttribute('cx',ssX);
document.getElementById('pt-ss').setAttribute('cy',ssY);

const el=id=>document.getElementById(id);
function setL(id,x1,y1,x2,y2){const e=el(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);}


const istarY = toSvgY(sfk(kstar));
setL('dash-istar', OX, istarY, ssX, istarY);
setL('tick-istar', OX-4, istarY, OX, istarY);


const ystarY = toSvgY(fk(kstar));
setL('dash-ystar', OX, ystarY, ssX, ystarY);
setL('tick-ystar', OX-4, ystarY, OX, ystarY);


setL('cd-line', OX, OY, toSvgX(KEND), toSvgY(dn*KEND));
setL('dash-v',ssX,ystarY,ssX,OY);
setL('tick-kstar',ssX,OY,ssX,OY+4);


const cstarX = ssX + 15;
setL('arr-cstar', cstarX, ystarY+24, cstarX, istarY-24);


el('pt-fk').setAttribute('cx', ssX);
el('pt-fk').setAttribute('cy', ystarY);

const VBW=680, VBH=960;
function pct(v,t){return(v/t*100).toFixed(1)+'%';}


const OY2=880, Hrange2=400;

function toSvgY2(g){return OY2-g/1.25*Hrange2;}


const cd2Y = toSvgY2(dn);
setL('cd2-line', OX, cd2Y, toSvgX(KEND), cd2Y);


function ca2(k){return s*A*Math.pow(k, alpha-1);}

const pts2=[];
for(let i=0;i<=300;i++){
  const k=0.5+(i/300)*(KEND-0.5);
  const g=ca2(k);
  const sx=toSvgX(k), sy=toSvgY2(g);
  if(sy>=484&&sy<=OY2+5&&sx<=600) pts2.push(sx.toFixed(1)+','+sy.toFixed(1));
}
document.getElementById('ca2-curve').setAttribute('d','M'+pts2.join(' L'));


const ss2X=toSvgX(kstar);
el('pt-ss2').setAttribute('cx',ss2X);
el('pt-ss2').setAttribute('cy',cd2Y);


setL('dash-v2',ss2X,cd2Y,ss2X,OY2);
setL('tick-kstar2',ss2X,OY2,ss2X,OY2+4);


const kGk = 1.5;
const gkArrX = toSvgX(kGk);
const gkTopY = toSvgY2(ca2(kGk));
const gkBotY = cd2Y;
setL('arr-gk', gkArrX, gkTopY+8, gkArrX, gkBotY-8);


function setDyn(id, xa, xb, y) {
  const n = Math.max(2, Math.round(Math.abs(xb - xa)/45)), pts = [];
  for (let i = 0; i <= n; i++) pts.push((xa + (xb - xa)*i/n).toFixed(1) + ',' + y);
  document.getElementById(id).setAttribute('points', pts.join(' '));
}
setDyn('dyn-l', toSvgX(1.0), toSvgX(kstar)-22, OY-10);
setDyn('dyn-r', toSvgX(7.0), toSvgX(kstar)+22, OY-10);


function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const O = '#D85A30';
put('lbl-y', 'y', 115, 44, {ha: 'r', s: 18});
put('lbl-k', 'k', 571, 440, {va: 'm', s: 18});
put('lbl-CD', '(n + \\delta)k', toSvgX(KEND) + 6, toSvgY(dn*KEND), {va: 'm', c: '#D85A30', s: 16});
put('lbl-CA', 'sf(k)', toSvgX(KEND) + 6, toSvgY(sfk(KEND)) + 4, {va: 't', c: '#1D9E75', s: 16});
put('lbl-fk', 'f(k)', toSvgX(KEND) + 6, toSvgY(fk(KEND)), {va: 'm', c: '#378ADD', s: 16});
put('lbl-kstar', 'k^*', ssX, 448, {ha: 'c', s: 16});
put('lbl-istar', 'i^*', 115, istarY, {ha: 'r', va: 'm', s: 16});
put('lbl-ystar', 'y^*', 115, ystarY, {ha: 'r', va: 'm', s: 16});
put('lbl-cstar', 'c^*', cstarX + 8, (ystarY + istarY)/2, {va: 'm', s: 16});
put('lbl-0', '0', ssX + 8, ssY + 8, {va: 't', c: '#000', s: 16});
put('lbl-gk', 'g_k', 115, 484, {ha: 'r', s: 18});
put('lbl-k2', 'k', 571, 880, {va: 'm', s: 18});
put('lbl-CA2', 'sAk^{\\alpha-1}', toSvgX(KEND) + 6, toSvgY2(ca2(KEND)), {va: 'm', c: '#1D9E75', s: 16});
put('lbl-CD2', 'n + \\delta', toSvgX(KEND) + 6, cd2Y, {va: 'm', c: '#D85A30', s: 16});
put('lbl-kstar2', 'k^*', ss2X, 888, {ha: 'c', s: 16});
put('lbl-02', '0', ss2X + 8, cd2Y - 6, {va: 'b', c: '#000', s: 16});
put('lbl-gkpos', 'g_k > 0', gkArrX - 8, (gkTopY + gkBotY)/2, {ha: 'r', va: 'm', s: 14});
</script>
</body>
</html>
