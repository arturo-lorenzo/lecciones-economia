<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container > svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="100" y1="480" x2="600" y2="480" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100" y1="480" x2="100" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="ray" stroke="#888" stroke-width="1.4" stroke-dasharray="6 4"/>


    <path id="con-a" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <path id="con-b" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="pt-eq" r="5" fill="#000"/>


    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-h" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line id="tick-x" y1="480" y2="484" stroke="black" stroke-width="1"/>
    <line id="tick-y" x1="96" x2="100" stroke="black" stroke-width="1"/>
  </svg>

  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-y"></div>
  <div class="katex-label" id="lbl-cona"></div>
  <div class="katex-label" id="lbl-conb"></div>
  <div class="katex-label" id="lbl-eq"></div>
  <div class="katex-label" id="lbl-rri"></div>
  <div class="katex-label" id="lbl-xs"></div>
  <div class="katex-label" id="lbl-ys"></div>
</div>

<script>
const ox = 100, oy = 480, pw = 480, ph = 420;
function toSvg(x, y) { return [ox + (x / 10) * pw, oy - (y / 10) * ph]; }



































const alpha = 2.5, pA = 0.35;
const xyStar = 6.0;
const bC = (xyStar - pA * xyStar) / Math.pow(xyStar, alpha);
const conAY = x => pA * x + bC * Math.pow(x, alpha);
const conBX = y => pA * y + bC * Math.pow(y, alpha);

const xMaxDrawA = xyStar + 0.8;
const yMaxDrawB = xyStar + 0.8;

function drawParam(id, fx, fy, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const [sx, sy] = toSvg(fx(i / n), fy(i / n));
    pts.push(sx.toFixed(1) + ',' + sy.toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
drawParam('con-a', t => t * xMaxDrawA, t => conAY(t * xMaxDrawA), 300);
drawParam('con-b', t => conBX(t * yMaxDrawB), t => t * yMaxDrawB, 300);


const [eqSx, eqSy] = toSvg(xyStar, xyStar);
document.getElementById('pt-eq').setAttribute('cx', eqSx);
document.getElementById('pt-eq').setAttribute('cy', eqSy);


const bisMax = 9.0;
const [raySx1, raySy1] = toSvg(0, 0);
const [raySx2, raySy2] = toSvg(bisMax, bisMax);
document.getElementById('ray').setAttribute('x1', raySx1);
document.getElementById('ray').setAttribute('y1', raySy1);
document.getElementById('ray').setAttribute('x2', raySx2);
document.getElementById('ray').setAttribute('y2', raySy2);


document.getElementById('dash-v').setAttribute('x1', eqSx); document.getElementById('dash-v').setAttribute('y1', eqSy);
document.getElementById('dash-v').setAttribute('x2', eqSx); document.getElementById('dash-v').setAttribute('y2', oy);
document.getElementById('dash-h').setAttribute('x1', ox); document.getElementById('dash-h').setAttribute('y1', eqSy);
document.getElementById('dash-h').setAttribute('x2', eqSx); document.getElementById('dash-h').setAttribute('y2', eqSy);


document.getElementById('tick-x').setAttribute('x1', eqSx); document.getElementById('tick-x').setAttribute('x2', eqSx);
document.getElementById('tick-y').setAttribute('y1', eqSy); document.getElementById('tick-y').setAttribute('y2', eqSy);


const VBW = 680, VBH = 560;
function pctW(v) { return (v / VBW * 100).toFixed(1) + '%'; }
function pctH(v) { return (v / VBH * 100).toFixed(1) + '%'; }


const aEnd = toSvg(xMaxDrawA, conAY(xMaxDrawA));
const bEnd = toSvg(conBX(yMaxDrawB), yMaxDrawB);

const labels = [
  {id:'lbl-x',    tex:'X', x: 606, y: oy, ax: 0, ay: 0.5, color:'black', size: 17},
  {id:'lbl-y',    tex:'Y', x: ox, y: 34, ax: 0.5, ay: 1, color:'black', size: 17},
  {id:'lbl-cona', tex:'\\text{CON}^A', x: aEnd[0] - 12, y: aEnd[1], ax: 1, ay: 0.5, color:'#0F6E56'},
  {id:'lbl-conb', tex:'\\text{CON}^B', x: bEnd[0] + 6, y: bEnd[1], ax: 0, ay: 0.5, color:'#534AB7'},
  {id:'lbl-rri',  tex:'\\text{RRI}^*', x: raySx2 + 4, y: raySy2 - 2, ax: 0, ay: 1, color:'#888'},
  {id:'lbl-eq',   tex:'0', x: eqSx - 8, y: eqSy - 6, ax: 1, ay: 1, color:'#000'},
  {id:'lbl-xs',   tex:'X^*', x: eqSx, y: oy + 8, ax: 0.5, ay: 0, color:'black'},
  {id:'lbl-ys',   tex:'Y^*', x: ox - 8, y: eqSy, ax: 1, ay: 0.5, color:'black'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pctW(l.x); el.style.top = pctH(l.y);
  if (l.size) el.style.fontSize = l.size + 'px';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
