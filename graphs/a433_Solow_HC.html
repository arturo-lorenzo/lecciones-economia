<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr-sm" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="black"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="120" y1="440" x2="560" y2="440" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="440" x2="120" y2="40" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="kdot-locus" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <path id="hdot-locus" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <circle id="pt-ss" r="5" fill="#000"/>


    <line id="dash-h" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="tick-kstar" stroke="black" stroke-width="1"/>
    <line id="tick-hstar" stroke="black" stroke-width="1"/>



    <polyline id="a1v" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline id="a1h" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>

    <polyline id="a2v" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline id="a2h" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>

    <polyline id="a3v" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline id="a3h" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>

    <polyline id="a4v" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline id="a4h" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="5 4" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>

  </svg>

</div>

<script>
const OX=120, OY=440, VBW=680, VBH=520;
const Xrange=480*440/520, Yrange=380;

function toSvgX(k){return OX+k/10*Xrange;}
function toSvgY(h){return OY-h/10*Yrange;}





const kstar = 6, hstar = 6;
function kdot0(k){ return hstar*Math.pow(k/kstar, 2); }
function hdot0(k){ return hstar*Math.pow(k/kstar, 0.5); }

function genCurve(fn, kMin, kMax, id){
  const pts=[];
  for(let i=0;i<=300;i++){
    const k=kMin+(i/300)*(kMax-kMin);
    const h=fn(k);
    const sx=toSvgX(k), sy=toSvgY(h);
    if(sy>=60&&sy<=OY+0.5&&sx>=OX&&sx<=OX+440) pts.push(sx.toFixed(1)+','+sy.toFixed(1));
  }
  document.getElementById(id).setAttribute('d','M'+pts.join(' L'));
}

genCurve(kdot0, 0, 7.5, 'kdot-locus');
genCurve(hdot0, 0, 9.5, 'hdot-locus');


const ssX=toSvgX(kstar), ssY=toSvgY(hstar);
const el=id=>document.getElementById(id);
el('pt-ss').setAttribute('cx',ssX);
el('pt-ss').setAttribute('cy',ssY);

function setL(id,x1,y1,x2,y2){const e=el(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);}
setL('dash-h',OX,ssY,ssX,ssY);
setL('dash-v',ssX,ssY,ssX,OY);
setL('tick-kstar',ssX,OY,ssX,OY+4);
setL('tick-hstar',OX-4,ssY,OX,ssY);



const aLen = 42;
function setP(id, x1, y1, x2, y2) { el(id).setAttribute('points', `${x1},${y1} ${(x1 + x2)/2},${(y1 + y2)/2} ${x2},${y2}`); }
function L(idv, idh, k, h, dv, dh) { const x = toSvgX(k), y = toSvgY(h); setP(idv, x, y, x, y - dv*aLen); setP(idh, x, y, x + dh*aLen, y); }


const ua = (() => { const v = [ssX - OX, ssY - OY], n = Math.hypot(v[0], v[1]); return [v[0] / n, v[1] / n]; })();
const ud = [ua[0], -ua[1]], D = 130;
function Lc(idv, idh, Q, dv, dh) { const x = Q[0] - dh*aLen/2, y = Q[1] + dv*aLen/2; setP(idv, x, y, x, y - dv*aLen); setP(idh, x, y, x + dh*aLen, y); }
Lc('a1v', 'a1h', [ssX - D*ua[0], ssY - D*ua[1]], +1, +1);
Lc('a2v', 'a2h', [ssX - D*ud[0], ssY - D*ud[1]], -1, +1);
Lc('a3v', 'a3h', [ssX + D*ua[0], ssY + D*ua[1]], -1, -1);
Lc('a4v', 'a4h', [ssX + D*ud[0], ssY + D*ud[1]], +1, -1);


function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
put('lbl-h', '\\tilde{h}', 112, 44, {ha: 'r', s: 18});
put('lbl-k', '\\tilde{k}', 568, 440, {va: 'm', s: 18});
put('lbl-kdot', '\\dot{\\tilde{k}} = 0', toSvgX(7.5) + 6, toSvgY(kdot0(7.5)), {va: 'm', c: '#378ADD'});
put('lbl-hdot', '\\dot{\\tilde{h}} = 0', toSvgX(9.5) + 6, toSvgY(hdot0(9.5)), {va: 'm', c: '#1D9E75'});
put('lbl-kstar', '\\tilde{k}^*', ssX, 448, {ha: 'c', s: 15});
put('lbl-hstar', '\\tilde{h}^*', 112, ssY, {ha: 'r', va: 'm', s: 15});
put('lbl-ss', '0', ssX + 8, ssY + 6, {va: 't', c: '#000'});
</script>
</body>
</html>
