<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">




  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="110" y1="460" x2="550" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="460" x2="110" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="c-e" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>
    <path id="c-d" fill="none" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>


    <line id="ev-line" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>

  </svg>


  <div class="katex-label" id="lbl-x"></div>
  <div class="katex-label" id="lbl-v"></div>
  <div class="katex-label" id="lbl-o"></div>
  <div class="katex-label" id="lbl-ev"></div>
  <div class="katex-label" id="lbl-e"></div>
  <div class="katex-label" id="lbl-d"></div>

</div>

<script>


const LMAX = 2, EV = 100;
const eq = L => EV / (1 + L);
const debt = L => EV * L / (1 + L);
function toSvgX(L) { return 110 + L * 190; }
function toSvgY(V) { return 460 - V * 3.4; }

function genCurve(fn, id) {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const L = (i / 300) * LMAX;
    pts.push(toSvgX(L).toFixed(1) + ',' + toSvgY(fn(L)).toFixed(1));
  }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(eq,   'c-e');
genCurve(debt, 'c-d');
const evl = document.getElementById('ev-line');
evl.setAttribute('x1', toSvgX(0));    evl.setAttribute('y1', toSvgY(EV));
evl.setAttribute('x2', toSvgX(LMAX)); evl.setAttribute('y2', toSvgY(EV));

const pct = (v, t) => (v / t * 100).toFixed(2) + '%';

const xe = toSvgX(LMAX) + 6;
const labels = [
  {id: 'lbl-x',  tex: 'L = D_f/E', x: 556, y: 470, ax: 1, ay: 0, color: 'black', size: 17},
  {id: 'lbl-v',  tex: '\\text{EV}', x: 110, y: 48, ax: 0.5, ay: 1, color: 'black', size: 17},
  {id: 'lbl-o',  tex: 'O', x: 104, y: 466, ax: 1, ay: 0, color: 'black'},
  {id: 'lbl-ev', tex: '\\text{EV}(L)', x: xe, y: toSvgY(EV), ax: 0, ay: 0.5, color: '#0F6E56'},
  {id: 'lbl-e',  tex: 'E(L)', x: xe, y: toSvgY(eq(LMAX)), ax: 0, ay: 0.5, color: '#534AB7'},
  {id: 'lbl-d',  tex: 'D_f(L)', x: xe, y: toSvgY(debt(LMAX)), ax: 0, ay: 0.5, color: '#185FA5'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = pct(l.x, 680);
  el.style.top = pct(l.y, 500);
  el.style.fontSize = (l.size || 16) + 'px';
  el.style.whiteSpace = 'nowrap';
  el.style.transform = `translate(${-100*l.ax}%, ${-100*l.ay}%)`;
  if (l.color) el.style.color = l.color;
});
</script>
</body>
</html>
