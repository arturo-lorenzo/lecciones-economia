<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
  .katex-label.right-of-axis { transform: translateX(-100%); }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="120" y1="460" x2="560" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="460" x2="120" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="cp" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <path id="mv01" fill="none" stroke="#888" stroke-width="1.3" marker-end="url(#arrow)"/>


    <line id="du0"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dpi0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="du1"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dpi1" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>

    <g id="ticks"></g>

    <circle id="pt0" r="5" fill="#000"/>
    <circle id="pt1" r="5" fill="#000"/>
  </svg>


<script>







const f = u => 9/u - 1;
const u0 = 5, u1 = 2;
const pi0 = f(u0), pi1 = f(u1);


function X(u)  { return 120 + u * 44; }
function Y(pi) { return 460 - pi * 50; }
const VBW = 680, VBH = 500;


(function() {
  const pts = [];
  for (let i = 0; i <= 300; i++) {
    const u = 1.15 + (i/300) * (9 - 1.15);
    const pi = f(u);
    if (pi > 7.9) continue;
    pts.push(X(u).toFixed(1) + ',' + Y(pi).toFixed(1));
  }
  document.getElementById('cp').setAttribute('d', 'M' + pts.join(' L'));
})();


(function() {
  const pts = [];
  for (let i = 0; i <= 100; i++) {
    const u = 4.4 - (i/100) * (4.4 - 2.55);
    const pi = f(u) + 0.22;
    pts.push(X(u).toFixed(1) + ',' + Y(pi).toFixed(1));
  }
  document.getElementById('mv01').setAttribute('d', 'M' + pts.join(' L'));
})();

function seg(id,x1,y1,x2,y2){const e=document.getElementById(id);
  e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);}
function pt(id,x,y){const e=document.getElementById(id);e.setAttribute('cx',x);e.setAttribute('cy',y);}

seg('du0',  X(u0), Y(pi0), X(u0), Y(0));
seg('dpi0', X(0),  Y(pi0), X(u0), Y(pi0));
seg('du1',  X(u1), Y(pi1), X(u1), Y(0));
seg('dpi1', X(0),  Y(pi1), X(u1), Y(pi1));

pt('pt0', X(u0), Y(pi0));
pt('pt1', X(u1), Y(pi1));

const ticksG = document.getElementById('ticks');
function tick(x1,y1,x2,y2){const t=document.createElementNS('http://www.w3.org/2000/svg','line');
  t.setAttribute('x1',x1);t.setAttribute('y1',y1);t.setAttribute('x2',x2);t.setAttribute('y2',y2);
  t.setAttribute('stroke','black');t.setAttribute('stroke-width','1');ticksG.appendChild(t);}
tick(X(u0),460,X(u0),464); tick(X(u1),460,X(u1),464);
tick(116,Y(pi0),120,Y(pi0)); tick(116,Y(pi1),120,Y(pi1));


function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const O = '#D85A30';
put('lbl-u', 'u', 568, 460, {va: 'm', s: 18});
put('lbl-pi', '\\pi', 112, 58, {ha: 'r', s: 18});
put('lbl-o', 'O', 112, 466, {ha: 'r'});
put('lbl-cp', '\\text{CP}', X(1.15) + 8, Y(f(1.15)), {va: 'm', c: '#0F6E56'});
put('lbl-0', '0', X(u0) + 8, Y(pi0) - 5, {va: 'b', c: '#000'});
put('lbl-1', '1', X(u1) + 8, Y(pi1) - 5, {va: 'b', c: '#000'});
put('lbl-u0', 'u_0', X(u0), 468, {ha: 'c', s: 15});
put('lbl-u1', 'u_1', X(u1), 468, {ha: 'c', s: 15});
put('lbl-pi0', '\\pi_0', 112, Y(pi0), {ha: 'r', va: 'm', s: 15});
put('lbl-pi1', '\\pi_1', 112, Y(pi1), {ha: 'r', va: 'm', s: 15});
</script>
</div>
</body>
</html>
