<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    font-size: 15px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 840" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g-guides"></g>
    <g id="g-curves"></g>
    <g id="g-axes"></g>
    <g id="g-points"></g>
  </svg>

</div>

<script>

const NS = 'http://www.w3.org/2000/svg';
const W = 680, H = 840;
const OX = 90, OY = 480;
const LW = 260, al = 0.45, gam = 3;
const A = 300 / Math.pow(LW, al);
const f = L => A * Math.pow(L, al);
const fp = L => A * al * Math.pow(L, al - 1);
const b = fp(LW) / (gam * Math.pow(LW, gam - 1));
const ic = (u, L) => u + b * Math.pow(L, gam);
const YW = f(LW), uW = YW - b * Math.pow(LW, gam);
const L1 = 140, Y1 = f(L1), u1 = Y1 - b * Math.pow(L1, gam);
const L2 = 62, Y2 = f(L2);

const g = id => document.getElementById(id);
function el(parent, tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  g(parent).appendChild(e); return e;
}
const line = (p, x1, y1, x2, y2, st) => el(p, 'line', Object.assign({x1, y1, x2, y2}, st));
const X = L => OX + L, Yp = Y => OY - Y;
const GUIDE = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'};
const AUX = {stroke: '#888', 'stroke-width': 1.4, 'stroke-dasharray': '7 4'};
const TICK = {stroke: 'black', 'stroke-width': 1};
function curve(p, fn, t0, t1, n, st) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; pts.push(X(t).toFixed(1) + ',' + Yp(fn(t)).toFixed(1)); }
  return el(p, 'path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', 'stroke-width': 2.2, 'stroke-linecap': 'round'}, st));
}
const dot = (L, Y) => el('g-points', 'circle', {cx: X(L), cy: Yp(Y), r: 5, fill: 'black'});


line('g-axes', OX, OY, OX + 480, OY, {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
line('g-axes', OX, OY, OX, OY - 440, {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});


const tang = (L0, d0, d1) => line('g-guides', X(L0 - d0), Yp(f(L0) - fp(L0) * d0), X(L0 + d1), Yp(f(L0) + fp(L0) * d1), AUX);
tang(L2, 55, 38);


line('g-curves', X(0), Yp(Y1), X(400), Yp(Y1), {stroke: '#D85A30', 'stroke-width': 2.2});


curve('g-curves', f, 0, 440, 260, {stroke: '#378ADD'});


const Lend = Math.pow((405 - uW) / b, 1 / gam);
curve('g-curves', L => ic(uW, L), 0, Lend, 200, {stroke: 'black', 'stroke-width': 2.2});
curve('g-curves', L => ic(u1, L), 0, Lend, 200, {stroke: 'black', 'stroke-width': 2.2});


for (const [L, Y] of [[LW, YW], [L1, Y1], [L2, Y2]]) {
  line('g-guides', X(L), Yp(Y), X(L), OY, GUIDE);
  line('g-axes', X(L), OY, X(L), OY + 4, TICK);
}
for (const Y of [YW, Y2]) {
  line('g-guides', OX, Yp(Y), X(Y === YW ? LW : L2), Yp(Y), GUIDE);
  line('g-axes', OX - 4, Yp(Y), OX, Yp(Y), TICK);
}
line('g-axes', OX - 4, Yp(Y1), OX, Yp(Y1), TICK);


dot(LW, YW); dot(L1, Y1); dot(L2, Y2);


const OY2 = 770, SW = 160;
const Yw = w => OY2 - w * SW;
const rms = L => 3 * b * L * L;
const wW = fp(LW), wNW = fp(L2), LsNW = Math.sqrt(wNW / (3 * b));
line('g-axes', OX, OY2, OX + 480, OY2, {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
line('g-axes', OX, OY2, OX, OY2 - 245, {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
function curve2(fn, t0, t1, n, st) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n; pts.push(X(t).toFixed(1) + ',' + Yw(fn(t)).toFixed(1)); }
  return el('g-curves', 'path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', 'stroke-width': 2.2, 'stroke-linecap': 'round'}, st));
}
curve2(fp, 48, 440, 200, {stroke: '#378ADD'});
curve2(rms, 0, 405, 200, {stroke: 'black'});

line('g-curves', X(L1), OY2, X(L1), Yw(fp(L1)), {stroke: '#D85A30', 'stroke-width': 2.2});

line('g-guides', OX, Yw(wW), X(LW), Yw(wW), GUIDE);
line('g-guides', OX, Yw(wNW), X(LsNW), Yw(wNW), GUIDE);
line('g-axes', OX - 4, Yw(wW), OX, Yw(wW), TICK);
line('g-axes', OX - 4, Yw(wNW), OX, Yw(wNW), TICK);
for (const [L, w] of [[LW, wW], [L1, wW], [L2, wNW], [LsNW, wNW]]) {
  line('g-guides', X(L), Yw(w), X(L), OY2, GUIDE);
  line('g-axes', X(L), OY2, X(L), OY2 + 4, TICK);
}
for (const [L, Ytop] of [[LW, YW], [L1, Y1], [L2, Y2]]) line('g-guides', X(L), OY + 28, X(L), Yw(L === LW ? wW : L === L1 ? wW : wNW), {stroke: '#bbb', 'stroke-width': 0.8, 'stroke-dasharray': '2 3'});

const arr2 = (xa, xb, y, c) => line('g-guides', xa, y, xb, y, {stroke: c, 'stroke-width': 1.2, 'marker-start': 'url(#arrow)', 'marker-end': 'url(#arrow)'});
line('g-axes', X(L1), OY2 + 32, X(L1), OY2 + 38, TICK); line('g-axes', X(L1), OY2 + 38, X(LW), OY2 + 38, TICK); line('g-axes', X(LW), OY2 + 32, X(LW), OY2 + 38, TICK);
arr2(X(L2) + 6, X(LsNW) - 6, Yw(wNW) - 14, '#555');
[[LW, wW], [L1, wW], [L2, wNW]].forEach(([L, w]) => el('g-points', 'circle', {cx: X(L), cy: Yw(w), r: 5, fill: 'black'}));
el('g-points', 'circle', {cx: X(LsNW), cy: Yw(wNW), r: 3.5, fill: 'black'});


const labels = [
  ['Y,\\,C', OX - 8, OY - 440, 'black', 'r', 'm'],
  ['L', OX + 484, OY, 'black', 'l', 'm'],
  ['f(L)', X(440) + 6, Yp(f(440)), '#378ADD', 'l', 'm'],
  ['u_{\\text{W}}', X(Lend) + 6, Yp(ic(uW, Lend)), 'black', 'l', 'm'],
  ['u_1', X(Lend) + 7, Yp(ic(u1, Lend)) - 1, 'black', 'l', 'b'],
  ['(w/P)_{\\text{NW}}', X(L2 + 38) - 12, Yp(Y2 + fp(L2) * 38) - 4, '#666', 'r', 'm', '13px'],
  ['\\text{demanda efectiva}', X(400) + 6, Yp(Y1), '#D85A30', 'l', 'm', '13px'],
  ['\\text{W}', X(LW) - 4, Yp(YW) - 8, 'black', 'r', 'b'],
  ['1', X(L1) + 6, Yp(Y1) + 4, 'black', 'l', 't'],
  ['2', X(L2) + 8, Yp(Y2) + 4, 'black', 'l', 't'],
  ['Y_{\\text{W}}', OX - 8, Yp(YW), 'black', 'r', 'm'],
  ['Y_1', OX - 8, Yp(Y1), 'black', 'r', 'm'],
  ['Y_2', OX - 8, Yp(Y2), 'black', 'r', 'm'],
  ['L_2', X(L2), OY + 6, 'black', 'c', 't'],
  ['L_1', X(L1), OY + 6, 'black', 'c', 't'],
  ['L_{\\text{W}}', X(LW), OY + 6, 'black', 'c', 't'],
  ['w/P', OX - 8, OY2 - 245, 'black', 'r', 'm'],
  ['L', OX + 484, OY2, 'black', 'l', 'm'],
  ['L^d', X(440) + 6, Yw(fp(440)), '#378ADD', 'l', 'm'],
  ['L^s', X(405) + 6, Yw(rms(405)), 'black', 'l', 'm'],
  ['(w/P)_{\\text{W}}', OX - 8, Yw(wW), 'black', 'r', 'm', '14px'],
  ['(w/P)_{\\text{NW}}', OX - 8, Yw(wNW), 'black', 'r', 'm', '14px'],
  ['\\text{demanda efectiva}', X(L1) - 6, OY2 - 70, '#D85A30', 'r', 'm', '12px'],
  ['\\text{paro keynesiano}', (X(L1) + X(LW)) / 2, OY2 + 41, 'black', 'c', 't', '12px'],
  ['\\text{paro clásico}', (X(L2) + X(LsNW)) / 2 + 40, Yw(wNW) - 20, '#555', 'c', 'b', '12px'],
  ['\\text{W}', X(LW) - 7, Yw(wW) - 6, 'black', 'r', 'b'],
  ['1', X(L1) - 7, Yw(wW) - 4, 'black', 'r', 'b'],
  ['2', X(L2) - 7, Yw(wNW) - 4, 'black', 'r', 'b'],
  ['L_2', X(L2), OY2 + 6, 'black', 'c', 't'],
  ['L_1', X(L1), OY2 + 6, 'black', 'c', 't'],
  ['L_{\\text{W}}', X(LW), OY2 + 6, 'black', 'c', 't'],
  ['L^s_{\\text{NW}}', X(LsNW), OY2 + 6, 'black', 'c', 't'],
];
const cont = document.querySelector('.graph-container');
labels.forEach(([tex, x, y, color, ha, va, size], i) => {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / W * 100) + '%';
  e.style.top = (y / H * 100) + '%';
  e.style.color = color;
  if (size) e.style.fontSize = size;
  const tx = ha === 'r' ? '-100%' : ha === 'c' ? '-50%' : '0';
  const ty = va === 'm' ? '-50%' : va === 'b' ? '-100%' : '0';
  e.style.transform = `translate(${tx}, ${ty})`;
  cont.appendChild(e);
});
</script>
</body>
</html>
