<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g id="g"></g>
  </svg>
</div>
<script>



const SVGNS = 'http://www.w3.org/2000/svg';
const W = 680, H = 500;
const g = document.getElementById('g');
const container = document.querySelector('.graph-container');
const OX = 118, OY = 450, S = 34;
const sx = a => OX + a * S, sy = b => OY - b * S;
const U0 = 16;
const ic = a => U0 / a;
const rms = a => ic(a) / a;
function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  g.appendChild(e); return e;
}
function line(x1, y1, x2, y2, stroke, w, extra = {}) {
  return el('line', Object.assign({x1, y1, x2, y2, stroke, 'stroke-width': w}, extra));
}
function lab(tex, x, y, color, ax = 0.5, ay = 0.5, size = '16px') {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100) + '%'; d.style.top = (y / H * 100) + '%';
  d.style.transform = `translate(${-ax * 100}%, ${-ay * 100}%)`;
  d.style.color = color; d.style.fontSize = size;
  container.appendChild(d);
}
function curve(f, a0, a1, color) {
  const pts = [];
  for (let i = 0; i <= 300; i++) { const a = a0 + (a1 - a0) * i / 300; pts.push(sx(a).toFixed(1) + ',' + sy(f(a)).toFixed(1)); }
  el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linecap': 'round'});
}

function tangent(a, a0, a1) {
  const b = ic(a), m = rms(a);
  line(sx(a0), sy(b - m * (a0 - a)), sx(a1), sy(b - m * (a1 - a)), '#888', 1.4, {'stroke-dasharray': '6 4'});
}

const STEP = '#534AB7';
function step(a, d) {
  const b0 = ic(a), b1 = ic(a + d);
  line(sx(a), sy(b0), sx(a), sy(b1), STEP, 1.4);
  line(sx(a), sy(b1), sx(a + d), sy(b1), STEP, 1.4);
  return [b0, b1];
}


line(OX, OY, 561, OY, 'black', 1.2, {'marker-end': 'url(#arrow)'});
line(OX, OY, OX, 40, 'black', 1.2, {'marker-end': 'url(#arrow)'});

const aA = 2, aB = 6, D = 1.5;
tangent(aA, 1.3, 2.8);
tangent(aB, 3.6, 9.4);
const [bA0, bA1] = step(aA, D);
const [bB0, bB1] = step(aB, D);


curve(ic, 16 / 11.6, 12.0, '#1D9E75');


[aA, aB].forEach(a => el('circle', {cx: sx(a), cy: sy(ic(a)), r: 4.5, fill: '#D85A30'}));


lab('x_1', 565, OY, 'black', 0, 0.5, '17px');
lab('x_2', OX, 34, 'black', 0.5, 1, '17px');
lab('O', OX - 6, OY + 4, 'black', 1, 0);
lab('u_0', sx(12.0) + 6, sy(ic(12.0)), '#0F6E56', 0, 0.5);


lab('A', sx(aA) - 9, sy(bA0) - 2, 'black', 1, 0.5);
lab('B', sx(aB) - 2, sy(bB0) - 9, 'black', 0.5, 1);
lab('\\text{RMS}_{21}^A', sx(aA) + 12, sy(bA0) - 8, '#5a5a5a', 0, 1, '15px');
lab('\\text{RMS}_{21}^B', sx(aB) + 22, sy(bB0) - 12, '#5a5a5a', 0, 1, '15px');


lab('\\Delta x_2', sx(aA) - 6, (sy(bA0) + sy(bA1)) / 2 + 6, STEP, 1, 0.5, '15px');
lab('\\Delta x_1', sx(aA + D / 2), sy(bA1) + 5, STEP, 0.5, 0, '15px');
lab('\\Delta x_2', sx(aB) - 6, (sy(bB0) + sy(bB1)) / 2 + 2, STEP, 1, 0.5, '15px');
lab('\\Delta x_1', sx(aB + D / 2), sy(bB1) + 5, STEP, 0.5, 0, '15px');


lab('\\text{RMS}_{21} = -\\dfrac{dx_2}{dx_1}\\bigg|_{du=0} = \\dfrac{\\partial u / \\partial x_1}{\\partial u / \\partial x_2}', 561, 90, 'black', 1, 0.5, '16px');
lab('\\text{RMS}_{21}^A > \\text{RMS}_{21}^B', 561, 150, 'black', 1, 0.5, '16px');
</script>
</body>
</html>
