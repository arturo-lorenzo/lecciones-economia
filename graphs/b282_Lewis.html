<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <polygon id="surplus" fill="#534AB7" fill-opacity="0.12" stroke="none"/>
    <line x1="109" y1="470" x2="579" y2="470" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="109" y1="470" x2="109" y2="36" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="guides"></g>
    <line id="d0" stroke="#534AB7" stroke-width="2.2"/>
    <line id="d1" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="8 4"/>
    <line id="d2" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="3 4"/>
    <path id="ls" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <line id="a01" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="a12" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
    <g id="dots"></g>
  </svg>
</div>
<script>
const VBW = 680, VBH = 540, NS = 'http://www.w3.org/2000/svg';
const OX = 109, XE = OX + 470, SXL = 46;
const X = L => OX + L * SXL;
const Y = w => 470 - w * 70;
const wb = 1.6, LT = 6.5, q = 0.35;
const S = L => L <= LT ? wb : wb + q * (L - LT) * (L - LT);
const m = 0.9;
const a = [wb + m * 2.0, wb + m * 4.3, 0];

const L2 = 8.0; a[2] = S(L2) + m * L2;
const D = (i, L) => a[i] - m * L;
const Lof = (i, w) => (a[i] - w) / m;
const Ls = [2.0, 4.3, L2];
function setL(id, x1, y1, x2, y2) { const e = document.getElementById(id); e.setAttribute('x1', x1.toFixed(1)); e.setAttribute('y1', y1.toFixed(1)); e.setAttribute('x2', x2.toFixed(1)); e.setAttribute('y2', y2.toFixed(1)); }
function mk(tag, at, par) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); document.getElementById(par).appendChild(e); return e; }

setL('d0', X(0), Y(D(0, 0)), X(Lof(0, 0.5)), Y(0.5));
setL('d1', X(0), Y(D(1, 0)), X(Lof(1, 0.5)), Y(0.5));
setL('d2', X(Lof(2, 5.7)), Y(5.7), X(Lof(2, 0.9)), Y(0.9));

{ const p = []; for (let i = 0; i <= 300; i++) { const L = 0 + 9.7 * i / 300; p.push(X(L).toFixed(1) + ',' + Y(S(L)).toFixed(1)); } document.getElementById('ls').setAttribute('d', 'M' + p.join(' L')); }

document.getElementById('surplus').setAttribute('points', `${X(0)},${Y(a[0])} ${X(0)},${Y(wb)} ${X(Ls[0])},${Y(wb)}`);

const w2 = S(L2);
Ls.forEach((L, i) => {
  const w = i < 2 ? wb : w2;
  mk('line', {x1: X(L), y1: Y(w), x2: X(L), y2: 470, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, 'guides');
  mk('line', {x1: X(L), y1: 470, x2: X(L), y2: 474, stroke: 'black', 'stroke-width': 1}, 'guides');
});
mk('line', {x1: X(LT), y1: Y(wb), x2: X(LT), y2: 470, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '2 3'}, 'guides');
mk('line', {x1: X(LT), y1: 470, x2: X(LT), y2: 474, stroke: 'black', 'stroke-width': 1}, 'guides');
mk('line', {x1: X(0), y1: Y(w2), x2: X(L2), y2: Y(w2), stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'}, 'guides');
mk('line', {x1: OX - 4, y1: Y(w2), x2: OX, y2: Y(w2), stroke: 'black', 'stroke-width': 1}, 'guides');
mk('line', {x1: OX - 4, y1: Y(wb), x2: OX, y2: Y(wb), stroke: 'black', 'stroke-width': 1}, 'guides');
Ls.forEach((L, i) => mk('circle', {cx: X(L), cy: Y(i < 2 ? wb : w2), r: 5, fill: '#000'}, 'dots'));

const dx = SXL, dy = m * 70, nrm = Math.hypot(dx, dy);
const nx = dy / nrm, ny = -dx / nrm;
function perpArrow(id, i, Lstart) {
  const x0 = X(Lstart), y0 = Y(D(i, Lstart));
  const gap = (a[i + 1] - a[i]) * 70 * (dx / nrm);
  setL(id, x0 + nx * 7, y0 + ny * 7, x0 + nx * (gap - 7), y0 + ny * (gap - 7));
  return [x0 + nx * gap / 2, y0 + ny * gap / 2];
}
const m01 = perpArrow('a01', 0, 0.55);
const m12 = perpArrow('a12', 1, 2.3);

const cont = document.querySelector('.graph-container');
function put(tex, x, y, o = {}) {
  const e = document.createElement('div'); e.className = 'katex-label';
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / VBW * 100).toFixed(2) + '%'; e.style.top = (y / VBH * 100).toFixed(2) + '%';
  e.style.color = o.c || 'black'; if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const P = '#534AB7', G = '#1D9E75', O = '#D85A30';
put('w', OX - 10, 40, {ha: 'r', s: 18});
put('L', XE + 8, 470, {va: 'm', s: 18});
put('w_S', OX - 10, Y(wb), {ha: 'r', va: 'm'});
put('w_1', OX - 10, Y(w2), {ha: 'r', va: 'm'});
put('L_0', X(Ls[0]), 480, {ha: 'c'});
put("L_{0'}", X(Ls[1]), 480, {ha: 'c'});
put('L_T', X(LT), 480, {ha: 'c'});
put('L_1', X(L2), 480, {ha: 'c'});
put('0', X(Ls[0]) + 6, Y(wb) - 5, {va: 'b', c: '#000'});
put("0'", X(Ls[1]) + 6, Y(wb) - 5, {va: 'b', c: '#000'});
put('1', X(L2) + 14, Y(w2) - 3, {va: 'm', c: '#000'});
put('S(L)', X(9.7) + 6, Y(S(9.7)), {va: 'm', c: G});
put('D_0(L)', X(Lof(0, 0.5)) + 4, Y(0.5) + 4, {ha: 'c', va: 't', c: P});
put("D_{0'}(L)", X(Lof(1, 0.5)) + 4, Y(0.5) + 4, {ha: 'c', va: 't', c: P});
put('D_1(L)', X(Lof(2, 0.9)) + 6, Y(0.9), {va: 'm', c: P});
put('\\Delta K > 0', m01[0] + 24 * dx / nrm, m01[1] + 24 * dy / nrm, {ha: 'c', va: 'm', c: P, s: 14});
put('\\Delta K > 0', m12[0] + 6, m12[1] + 6, {va: 't', c: P, s: 14});
put('\\text{excedente}', X(0) + 6, Y(wb) - 6, {va: 'b', s: 14, c: '#444'});
put('\\begin{array}{c}\\text{punto de}\\\\ \\text{inflexión}\\end{array}', X(LT) - 4, Y(wb) + 10, {ha: 'r', va: 't', s: 14, c: '#444'});
put('w_S\\text{: salario del sector moderno, ligeramente superior al de subsistencia}', 340, 518, {ha: 'c', va: 'm', s: 14, c: '#444'});
</script>
</body>
</html>
