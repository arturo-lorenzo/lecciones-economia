<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 990" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
</div>

<script>





const W = 680, H = 990;
const F = 15;
const cv   = x => 4*x - 1.2*x*x + 0.15*x*x*x;
const ct   = x => F + cv(x);
const cmg  = x => 4 - 2.4*x + 0.45*x*x;
const cvme = x => 4 - 1.2*x + 0.15*x*x;
const cfme = x => F / x;
const ctme = x => cfme(x) + cvme(x);
const XI = 8/3, XV = 4;
let XT = 5, best = 1e9;
for (let x = 4.5; x < 7; x += 0.0005) { const d = Math.abs(cmg(x) - ctme(x)); if (d < best) { best = d; XT = x; } }


const OX = 116, XR = 546, QMAX = 7.7;
const sx = q => OX + q * 48.1;
const TOP = {oy: 430, ytop: 35, k: 8};
const BOT = {oy: 900, ytop: 505, k: 42};
const syT = c => TOP.oy - c * TOP.k;
const syB = c => BOT.oy - c * BOT.k;

const svg = document.getElementById('g');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
function curve(f, sy, q0, q1, color, width, extra) {
  const pts = [];
  for (let i = 0; i <= 400; i++) {
    const q = q0 + (q1 - q0) * i / 400, X = sx(q), Y = sy(f(q));
    pts.push(X.toFixed(1) + ',' + Y.toFixed(1));
  }
  return el('path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round'}, extra || {}));
}

function inv(f, y, a, b) { for (let i = 0; i < 80; i++) { const m = (a + b) / 2; if ((f(a) - y) * (f(m) - y) <= 0) b = m; else a = m; } return (a + b) / 2; }


[TOP, BOT].forEach(P => {
  el('line', {x1: OX, y1: P.oy, x2: XR, y2: P.oy, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
  el('line', {x1: OX, y1: P.oy, x2: OX, y2: P.ytop, stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'});
});


[XI, XV, XT].forEach(q => el('line', {x1: sx(q), y1: syT(q === XI ? ct(q) : q === XV ? cv(q) : ct(q)), x2: sx(q), y2: BOT.oy, stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '6 4'}));


el('line', {x1: OX, y1: syT(F), x2: sx(QMAX), y2: syT(F), stroke: '#888', 'stroke-width': 2.2});

const rayEnd = 6.9;
el('line', {x1: OX, y1: TOP.oy, x2: sx(rayEnd), y2: syT(cvme(XV) * rayEnd), stroke: '#444', 'stroke-width': 1.4, 'stroke-dasharray': '6 4'});
el('line', {x1: OX, y1: TOP.oy, x2: sx(rayEnd), y2: syT(ctme(XT) * rayEnd), stroke: '#444', 'stroke-width': 1.4, 'stroke-dasharray': '6 4'});
curve(cv, syT, 0, QMAX, '#534AB7', 2.2);
curve(ct, syT, 0, QMAX, '#1D9E75', 2.2);
el('circle', {cx: sx(XV), cy: syT(cv(XV)), r: 4.5, fill: '#D85A30'});
el('circle', {cx: sx(XT), cy: syT(ct(XT)), r: 4.5, fill: '#D85A30'});


const qCfme0 = F / ((BOT.oy - BOT.ytop - 15) / BOT.k);
curve(cfme, syB, qCfme0, QMAX, '#888', 2.2, {'stroke-dasharray': '6 3'});
const qCtme0 = inv(ctme, (BOT.oy - BOT.ytop - 15) / BOT.k, 0.5, XT);
curve(ctme, syB, qCtme0, QMAX, '#1D9E75', 2.2);
curve(cvme, syB, 0, QMAX, '#534AB7', 2.2);
const qCmg1 = inv(cmg, (BOT.oy - BOT.ytop - 15) / BOT.k, XI, QMAX);
curve(cmg, syB, 0, qCmg1, '#D85A30', 2.2);
el('circle', {cx: sx(XV), cy: syB(cvme(XV)), r: 4.5, fill: '#D85A30'});
el('circle', {cx: sx(XT), cy: syB(ctme(XT)), r: 4.5, fill: '#D85A30'});


const by = BOT.oy + 14;
function bracket(q0, q1) {
  const a = sx(q0) + 3, b = sx(q1) - 3;
  el('path', {d: `M${a},${by - 6} L${a},${by} L${b},${by} L${b},${by - 6}`, fill: 'none', stroke: 'black', 'stroke-width': 1.1});
}
bracket(0, XT); bracket(XT, QMAX);


const box = document.querySelector('.graph-container');
function lbl(tex, x, y, color, anchor, size, bg) {
  const d = document.createElement('div');
  d.className = 'katex-label';
  katex.render(tex, d, {throwOnError: false});
  d.style.left = (x / W * 100).toFixed(2) + '%';
  d.style.top = (y / H * 100).toFixed(2) + '%';
  d.style.color = color || 'black';
  if (size) d.style.fontSize = size;
  const tx = {l: '0', r: '-100%', c: '-50%'}[anchor[0]], ty = {t: '0', m: '-50%', b: '-100%'}[anchor[1]];
  d.style.transform = `translate(${tx},${ty})`;
  if (bg) { d.style.background = '#fff'; }
  box.appendChild(d);
  return d;
}

lbl('C', OX - 10, TOP.ytop, 'black', 'rm');
lbl('x', XR + 4, TOP.oy, 'black', 'lm');
lbl('C', OX - 10, BOT.ytop, 'black', 'rm');
lbl('x', XR + 4, BOT.oy, 'black', 'lm');

lbl('\\text{CT}_{\\text{CP}}(x)', sx(QMAX) + 6, syT(ct(QMAX)), '#0F6E56', 'lm');
lbl('\\text{CV}_{\\text{CP}}(x)', sx(QMAX) + 6, syT(cv(QMAX)), '#534AB7', 'lm');
lbl('\\text{CF}_{\\text{CP}}', sx(QMAX) + 6, syT(F), '#888', 'lm');
lbl('\\text{rayo vector a CT}', sx(rayEnd) + 6, syT(ctme(XT) * rayEnd), '#444', 'lm', '13px');
lbl('\\text{rayo vector a CV}', sx(rayEnd) + 6, syT(cvme(XV) * rayEnd), '#444', 'lm', '13px');

lbl('\\text{Cmg}_{\\text{CP}}(x)', sx(qCmg1) + 8, syB(cmg(qCmg1)) + 6, '#D85A30', 'lm');
lbl('\\text{Cme}_{\\text{CP}}(x)', sx(QMAX) + 6, syB(ctme(QMAX)), '#0F6E56', 'lm');
lbl('\\text{CVme}_{\\text{CP}}(x)', sx(QMAX) + 6, syB(cvme(QMAX)), '#534AB7', 'lm');
lbl('\\text{CFme}_{\\text{CP}}(x)', sx(QMAX) + 6, syB(cfme(QMAX)), '#888', 'lm');
lbl('\\begin{gathered}\\text{Cme}_{\\text{CP}}\\text{ decreciente}\\\\ \\varepsilon_{Cx} = \\text{Cmg}/\\text{Cme} < 1\\end{gathered}', (sx(0) + sx(XT)) / 2, by + 6, 'black', 'ct', '13px');
lbl('\\begin{gathered}\\text{Cme}_{\\text{CP}}\\text{ creciente}\\\\ \\varepsilon_{Cx} > 1\\end{gathered}', (sx(XT) + sx(QMAX)) / 2, by + 6, 'black', 'ct', '13px');
</script>
</body>
</html>
