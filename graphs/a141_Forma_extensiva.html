<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="graph-container">



  <svg viewBox="0 0 680 420">



    <line x1="170" y1="90" x2="90"  y2="210" stroke="black" stroke-width="1.5"/>
    <line x1="170" y1="90" x2="250" y2="210" stroke="black" stroke-width="1.5"/>

    <line x1="90"  y1="210" x2="50"  y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="90"  y1="210" x2="130" y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="250" y1="210" x2="210" y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="250" y1="210" x2="290" y2="330" stroke="black" stroke-width="1.5"/>

    <circle cx="170" cy="90"  r="5"   fill="#1D9E75"/>
    <circle cx="90"  cy="210" r="5"   fill="#534AB7"/>
    <circle cx="250" cy="210" r="5"   fill="#534AB7"/>
    <circle cx="50"  cy="330" r="3"   fill="black"/>
    <circle cx="130" cy="330" r="3"   fill="black"/>
    <circle cx="210" cy="330" r="3"   fill="black"/>
    <circle cx="290" cy="330" r="3"   fill="black"/>


    <line x1="510" y1="90" x2="430" y2="210" stroke="black" stroke-width="1.5"/>
    <line x1="510" y1="90" x2="590" y2="210" stroke="black" stroke-width="1.5"/>
    <line x1="430" y1="210" x2="390" y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="430" y1="210" x2="470" y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="590" y1="210" x2="550" y2="330" stroke="black" stroke-width="1.5"/>
    <line x1="590" y1="210" x2="630" y2="330" stroke="black" stroke-width="1.5"/>

    <line x1="430" y1="210" x2="590" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="7 5"/>

    <circle cx="510" cy="90"  r="5" fill="#1D9E75"/>
    <circle cx="430" cy="210" r="5" fill="#534AB7"/>
    <circle cx="590" cy="210" r="5" fill="#534AB7"/>
    <circle cx="390" cy="330" r="3" fill="black"/>
    <circle cx="470" cy="330" r="3" fill="black"/>
    <circle cx="550" cy="330" r="3" fill="black"/>
    <circle cx="630" cy="330" r="3" fill="black"/>

  </svg>


  <div class="katex-label" id="t-perf"></div>
  <div class="katex-label" id="t-imp"></div>
  <div class="katex-label" id="j1-l"></div>
  <div class="katex-label" id="j2-l1"></div>
  <div class="katex-label" id="j2-l2"></div>
  <div class="katex-label" id="j1-r"></div>
  <div class="katex-label" id="j2-r"></div>
  <div class="katex-label" id="ci"></div>
  <div class="katex-label" id="al"></div>
  <div class="katex-label" id="bl"></div>
  <div class="katex-label" id="a1l"></div>
  <div class="katex-label" id="b1l"></div>
  <div class="katex-label" id="a2l"></div>
  <div class="katex-label" id="b2l"></div>
  <div class="katex-label" id="ar"></div>
  <div class="katex-label" id="br"></div>
  <div class="katex-label" id="a1r"></div>
  <div class="katex-label" id="b1r"></div>
  <div class="katex-label" id="a2r"></div>
  <div class="katex-label" id="b2r"></div>
  <div class="katex-label" id="p1l"></div>
  <div class="katex-label" id="p2l"></div>
  <div class="katex-label" id="p3l"></div>
  <div class="katex-label" id="p4l"></div>
  <div class="katex-label" id="p1r"></div>
  <div class="katex-label" id="p2r"></div>
  <div class="katex-label" id="p3r"></div>
  <div class="katex-label" id="p4r"></div>
  <div class="katex-label" id="conv"></div>

</div>

<script>
const labels = [

  {id: 't-perf', tex: '\\text{Información perfecta}',    left: '13%',   top: '5%',  color: '#444'},
  {id: 't-imp',  tex: '\\text{Información imperfecta}',  left: '62%',   top: '5%',  color: '#444'},


  {id: 'j1-l',  tex: 'J_1', left: '19%',   top: '17%', color: '#0F6E56'},
  {id: 'j2-l1', tex: 'J_2', left: '6%',    top: '46%', color: '#534AB7'},
  {id: 'j2-l2', tex: 'J_2', left: '38.5%', top: '46%', color: '#534AB7'},


  {id: 'j1-r', tex: 'J_1', left: '69%', top: '17%', color: '#0F6E56'},
  {id: 'j2-r', tex: 'J_2', left: '57%', top: '46%', color: '#534AB7'},
  {id: 'ci',   tex: '\\begin{array}{c}\\text{Conjunto de}\\\\[-2pt]\\text{información}\\end{array}', left: '75%', top: '51.5%', color: '#888', center: true},


  {id: 'al',  tex: 'A', left: '15.5%', top: '32%', color: 'black'},
  {id: 'bl',  tex: 'B', left: '32.6%', top: '32%', color: 'black'},
  {id: 'a1l', tex: 'a', left: '7.5%',  top: '61%', color: 'black'},
  {id: 'b1l', tex: 'b', left: '17.5%', top: '61%', color: 'black'},
  {id: 'a2l', tex: 'a', left: '31%',   top: '61%', color: 'black'},
  {id: 'b2l', tex: 'b', left: '41%',   top: '61%', color: 'black'},


  {id: 'ar',  tex: 'A', left: '65.5%', top: '32%', color: 'black'},
  {id: 'br',  tex: 'B', left: '82.6%', top: '32%', color: 'black'},
  {id: 'a1r', tex: 'a', left: '57.5%', top: '61%', color: 'black'},
  {id: 'b1r', tex: 'b', left: '67.5%', top: '61%', color: 'black'},
  {id: 'a2r', tex: 'a', left: '81%',   top: '61%', color: 'black'},
  {id: 'b2r', tex: 'b', left: '91%',   top: '61%', color: 'black'},


  {id: 'p1l', tex: '(3,3)', left: '4.5%',  top: '83%', color: '#444'},
  {id: 'p2l', tex: '(0,4)', left: '16.3%', top: '83%', color: '#444'},
  {id: 'p3l', tex: '(4,0)', left: '28%',   top: '83%', color: '#444'},
  {id: 'p4l', tex: '(1,1)', left: '39.8%', top: '83%', color: '#444'},


  {id: 'p1r', tex: '(3,3)', left: '54.5%', top: '83%', color: '#444'},
  {id: 'p2r', tex: '(0,4)', left: '66.3%', top: '83%', color: '#444'},
  {id: 'p3r', tex: '(4,0)', left: '78%',   top: '83%', color: '#444'},
  {id: 'p4r', tex: '(1,1)', left: '89.8%', top: '83%', color: '#444'},


  {id: 'conv', tex: '(u_1,\\, u_2)', left: '45.5%', top: '92%', color: '#888'}
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = l.left;
  el.style.top = l.top;
  if (l.color) el.style.color = l.color;
  if (l.center) { el.style.transform = 'translateX(-50%)'; el.style.fontSize = '88%'; }
});
</script>
</body>
</html>
