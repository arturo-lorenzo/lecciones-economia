<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  body { margin: 0; background: #fff; }
  .graph-container { position: relative; width: 100%; max-width: none; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
<svg id="g" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg">

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
</svg>
</div>
<script>
const W = 680, H = 410;
const svg = document.getElementById('g'), NS = 'http://www.w3.org/2000/svg';
const box = document.querySelector('.graph-container');
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
const f1 = v => v.toFixed(1);
const labels = [];
const lab = (tex, x, y, color, ax, ay, size, bg) => labels.push({tex, x, y, color, ax, ay, size, bg});
const line = (x1, y1, x2, y2, at) => el('line', Object.assign({x1: f1(x1), y1: f1(y1), x2: f1(x2), y2: f1(y2)}, at));
const AXIS = {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'};
const RED = '#D85A30', GREEN = '#1D9E75', GREEN_D = '#0F6E56', GREY = '#5a5a5a';


const OY = 298, KP = 30, KZ = 30;
const YTOP = OY - 290 * KP / 35;
const gy = p => OY - KP * p;
const pTop = 7.6, pMin = 1.25;

function panel(OX, Z, pFrom, pTo) {
  line(OX - 130, OY, OX + 140, OY, AXIS);
  line(OX, OY, OX, YTOP, AXIS);
  lab('p_i', OX - 6, YTOP, '#000', 1, 0);
  lab('Z_i', OX + 146, OY, '#000', 0, 0.5);
  lab('0', OX, OY + 8, '#000', 0.5, 0);
  const pts = [];
  for (let k = 0; k <= 120; k++) { const p = pFrom + (pTo - pFrom) * k / 120; pts.push(f1(OX + KZ * Z(p)) + ',' + f1(gy(p))); }
  el('path', {d: 'M' + pts.join(' L'), fill: 'none', stroke: GREEN, 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
  lab('Z_i(p)', OX + KZ * Z(pTo) - 8, gy(pTo), GREEN_D, 1, 0.5);
}


const AX = 190;
const Za = p => 6 / p - 1.5;
const pStar = 4;
if (Math.abs(Za(pStar)) > 1e-9) console.error('p* no anula Z_i');
panel(AX, Za, pMin, pTop);
el('circle', {cx: f1(AX), cy: f1(gy(pStar)), r: 5, fill: '#000'});
lab('p_i^*', AX - 8, gy(pStar), '#000', 1, 0.5);
lab('Z_i > 0', AX + 58, gy(2.3), GREY, 0, 0.5, '14px');
lab('Z_i < 0', AX - 52, gy(5.7), GREY, 1, 0.5, '14px');


const BX = 510;
const Zb = p => 2 / (p + 0.8) - 3.7;
if (Zb(0) >= 0) console.error('el bien libre no tiene exceso de oferta a precio nulo');
panel(BX, Zb, 0, pTop);
el('circle', {cx: f1(BX + KZ * Zb(0)), cy: f1(OY), r: 5, fill: '#000'});
lab('Z_i(0)', BX + KZ * Zb(0), OY + 8, '#000', 0.5, 0);
lab('p_i^* = 0', BX + 8, OY - 8, '#000', 0, 1, '14px');
lab('Z_i < 0', BX - 74, gy(3.6), GREY, 0, 0.5, '14px');


lab('\\text{(a) Bien escaso}', AX, OY + 46, '#444', 0.5, 0, '15px');
lab('\\text{(b) Bien libre}', BX, OY + 46, '#444', 0.5, 0, '15px');

labels.forEach((l, i) => {
  const d = document.createElement('div');
  d.className = 'katex-label'; d.id = 'lbl-' + i;
  katex.render(l.tex, d, {throwOnError: false});
  d.style.left = (l.x / W * 100).toFixed(3) + '%';
  d.style.top = (l.y / H * 100).toFixed(3) + '%';
  d.style.transform = `translate(${-(l.ax || 0) * 100}%, ${-(l.ay || 0) * 100}%)`;
  d.style.color = l.color || '#000';
  if (l.size) d.style.fontSize = l.size;
  if (l.bg) { d.style.background = '#fff'; const k = d.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  box.appendChild(d);
});
</script>
</body>
</html>
