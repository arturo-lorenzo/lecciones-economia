<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>

<div class="graph-container">
  <svg viewBox="0 0 680 840" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <line x1="160.0" y1="217.5" x2="550.0" y2="217.5" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="160.0" y1="395.0" x2="160.0" y2="40.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="160.0" y1="790.0" x2="550.0" y2="790.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="160.0" y1="790.0" x2="160.0" y2="435.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="351.3" y1="52.2" x2="351.3" y2="790.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="160.0" y1="634.1" x2="351.3" y2="634.1" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="190.8" y1="70.6" x2="509.5" y2="362.2" stroke="#378ADD" stroke-width="2.2"/>
    <line x1="157.1" y1="634.1" x2="160.0" y2="634.1" stroke="black" stroke-width="1"/>
    <line x1="351.3" y1="790.0" x2="351.3" y2="793.5" stroke="black" stroke-width="1"/>
    <line x1="178.4" y1="735.9" x2="509.5" y2="541.1" stroke="#1D9E75" stroke-width="2.2"/>
    <line x1="178.4" y1="491.7" x2="509.5" y2="764.5" stroke="#378ADD" stroke-width="2.2"/>
    <circle cx="351.3" cy="217.5" r="5" fill="#000"/>
    <circle cx="351.3" cy="634.1" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
  <div class="katex-label" id="lbl7"></div>
  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
  <div class="katex-label" id="lbl11"></div>
<script>
const VBW = 680, VBH = 840;

const labels = [
 {
  "id": "lbl0",
  "tex": "\\text{IS}",
  "x": 515.5,
  "y": 362.2,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl1",
  "tex": "r - \\bar{r}",
  "x": 152.0,
  "y": 36.0,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "\\tilde{y}",
  "x": 556.0,
  "y": 217.5,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl3",
  "tex": "\\pi",
  "x": 152.0,
  "y": 431.0,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl4",
  "tex": "\\tilde{y}",
  "x": 556.0,
  "y": 790.0,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl5",
  "tex": "0",
  "x": 153.0,
  "y": 217.5,
  "anchor": "rm",
  "color": "black",
  "size": 14
 },
 {
  "id": "lbl6",
  "tex": "\\pi^T",
  "x": 154.1,
  "y": 634.1,
  "anchor": "rm",
  "color": "black",
  "size": 14
 },
 {
  "id": "lbl7",
  "tex": "0",
  "x": 351.3,
  "y": 797.5,
  "anchor": "ct",
  "color": "black",
  "size": 14
 },
 {
  "id": "lbl8",
  "tex": "\\text{CP}",
  "x": 515.5,
  "y": 541.1,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 },
 {
  "id": "lbl9",
  "tex": "\\text{MR}",
  "x": 515.5,
  "y": 764.5,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl10",
  "tex": "0",
  "x": 343.3,
  "y": 224.5,
  "anchor": "rt",
  "color": "#000",
  "size": 16,
  "bg": true
 },
 {
  "id": "lbl11",
  "tex": "0",
  "x": 357,
  "y": 658,
  "anchor": "lt",
  "color": "#000",
  "size": 16,
  "bg": true
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
