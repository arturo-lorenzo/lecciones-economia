<!DOCTYPE html>
<html lang="es">
<head>

</style>
</head>
<body>

<pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="0.6"/></pattern>
</defs>
<path d="M100.0,470.0 L100.0,110.0 L368.9,326.0 Z" fill="#1D9E75" fill-opacity="0.12" stroke="none"/>

<line x1="368.9" y1="326.0" x2="368.9" y2="470.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>

</svg>
</div>
<script>
const LABELS = [{"t": "\\text{€}", "x": 13.529, "y": 6.364, "a": "-100%,-50%", "c": "#000", "s": 17, "bg": false}, {"t": "x", "x": 85.614, "y": 85.455, "a": "0,-50%", "c": "#000", "s": 17, "bg": false}, {"t": "0", "x": 13.824, "y": 86.545, "a": "-100%,0", "c": "#000", "s": null, "bg": false}, {"t": "x^*", "x": 54.246, "y": 86.545, "a": "-50%,0", "c": "#000", "s": null, "bg": false}, {"t": "x_{\\max}", "x": 80.605, "y": 86.545, "a": "-50%,0", "c": "#000", "s": null, "bg": false}, {"t": "\\text{Bmg}(x)", "x": 15.76, "y": 18.182, "a": "0,-100%", "c": "#185FA5", "s": null, "bg": false}, {"t": "\\text{Dmg}(x)", "x": 81.396, "y": 41.818, "a": "0,-50%", "c": "#D85A30", "s": null, "bg": false}, {"t": "\\text{derecho de la víctima}", "x": 15.233, "y": 94.545, "a": "0,0", "c": "#0F6E56", "s": 15, "bg": false}, {"t": "\\text{derecho del contaminador}", "x": 80.605, "y": 94.545, "a": "-100%,0", "c": "#185FA5", "s": 15, "bg": false}, {"t": "\\begin{array}{c}\\text{ganancia de}\\\\ \\text{la negociación}\\end{array}", "x": 27.886, "y": 55.455, "a": "-50%,-50%", "c": "#444", "s": 15, "bg": false}, {"t": "\\begin{array}{c}\\text{ganancia de}\\\\ \\text{la negociación}\\end{array}", "x": 71.4, "y": 61.0, "a": "-50%,-50%", "c": "#444", "s": 15, "bg": true}];
const box = document.querySelector('.graph-container');
LABELS.forEach((L, i) => {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(L.t, e, {throwOnError: false});
  e.style.left = L.x + '%'; e.style.top = L.y + '%';
  e.style.transform = 'translate(' + L.a + ')';
  e.style.color = L.c;
  if (L.s) e.style.fontSize = L.s + 'px';
  if (L.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  box.appendChild(e);
});
</script>
</body>
</html>
