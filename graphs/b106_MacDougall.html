<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 530">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <path id="gain" fill="rgba(29,158,117,0.15)" stroke="none"/>


    <line x1="115" y1="460" x2="566" y2="460" stroke="black" stroke-width="1.2"/>
    <line x1="115" y1="460" x2="115" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="566" y1="460" x2="566" y2="50"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="dL0"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dL1"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dWA0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dWB0" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dW1"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <path id="vpmlA" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <path id="vpmlB" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round"/>


    <line id="mig" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>


    <circle id="ptA0" r="5" fill="#000"/>
    <circle id="ptB0" r="5" fill="#000"/>
    <circle id="pt1"  r="5" fill="#000"/>
  </svg>

</div>

<script>
const W = 680, H = 530;
function pct(v, t) { return (v / t * 100).toFixed(2) + '%'; }





const L0 = 45, L1 = 70;
const wA = x => 2000 / (x + 30), wB = x => 1200 / (130 - x);
const WA0 = wA(L0), WB0 = wB(L0), W1 = wA(L1);
const sx = x => 115 + x * 4.51, sy = w => 460 - w * 5.6;
function genCurve(fn, id) {
  const pts = [];
  for (let i = 0; i <= 240; i++) { const x = 100 * i / 240; pts.push(sx(x).toFixed(1) + ',' + sy(fn(x)).toFixed(1)); }
  document.getElementById(id).setAttribute('d', 'M' + pts.join(' L'));
}
genCurve(wA, 'vpmlA'); genCurve(wB, 'vpmlB');
(function () {
  const up = [], dn = [];
  for (let i = 0; i <= 80; i++) { const x = L0 + (i / 80) * (L1 - L0);
    up.push(sx(x).toFixed(1) + ',' + sy(wA(x)).toFixed(1)); dn.push(sx(x).toFixed(1) + ',' + sy(wB(x)).toFixed(1)); }
  document.getElementById('gain').setAttribute('d', 'M' + up.join(' L') + ' L' + dn.reverse().join(' L') + ' Z');
})();
function setLine(id, x1, y1, x2, y2) { const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1); el.setAttribute('x2', x2); el.setAttribute('y2', y2); }
setLine('dL0',  sx(L0), sy(WA0), sx(L0), 460);
setLine('dL1',  sx(L1), sy(W1),  sx(L1), 460);
setLine('dWA0', sx(0),  sy(WA0), sx(L0), sy(WA0));
setLine('dWB0', sx(L0), sy(WB0), sx(100), sy(WB0));
setLine('dW1',  sx(0),  sy(W1),  sx(100), sy(W1));
setLine('mig',  sx(L0) + 2, 505, sx(L1) - 2, 505);
[['ptA0', L0, WA0], ['ptB0', L0, WB0], ['pt1', L1, W1]].forEach(([id, x, w]) => {
  const c = document.getElementById(id); c.setAttribute('cx', sx(x)); c.setAttribute('cy', sy(w)); });
const labels = [
  {id: 'lbl-wa', tex: 'w^A', x: 107,  y: 40, a: 'rt', s: '17px'},
  {id: 'lbl-wb', tex: 'w^B', x: 574, y: 40, a: 'lt', s: '17px'},
  {id: 'lbl-oa', tex: 'O^A', x: 115, y: 468, a: 'ct', s: '17px'},
  {id: 'lbl-ob', tex: 'O^B', x: 566, y: 468, a: 'ct', s: '17px'},
  {id: 'lbl-vpmla', tex: '\\text{VPmg}^A_L(L^A)', x: 125, y: sy(wA(0)) - 6, a: 'lm', c: '#0F6E56'},
  {id: 'lbl-vpmlb', tex: '\\text{VPmg}^B_L(L^B)', x: 558, y: sy(wB(100)) - 8, a: 'rb', c: '#534AB7'},
  {id: 'lbl-wa0', tex: 'w_0^A', x: 108,  y: sy(WA0), a: 'rm', s: '15px'},
  {id: 'lbl-w1l', tex: 'w_1',   x: 108,  y: sy(W1),  a: 'rm', s: '15px'},
  {id: 'lbl-wb0', tex: 'w_0^B', x: 573, y: sy(WB0), a: 'lm', s: '15px'},
  {id: 'lbl-w1r', tex: 'w_1',   x: 573, y: sy(W1),  a: 'lm', s: '15px'},
  {id: 'lbl-l0', tex: 'L_0', x: sx(L0), y: 468, a: 'ct', s: '15px'},
  {id: 'lbl-l1', tex: 'L_1', x: sx(L1), y: 468, a: 'ct', s: '15px'},
  {id: 'lbl-1',  tex: '1',   x: sx(L1), y: sy(W1) - 10, a: 'cb', c: '#000', s: '15px'},
  {id: 'lbl-mig', tex: '\\text{migración } B \\to A', x: sx(L1) + 8, y: 505, a: 'lm', c: '#0F6E56', s: '14px'}
];
const cont = document.querySelector('.graph-container');
labels.forEach(l => {
  let e = document.getElementById(l.id);
  if (!e) { e = document.createElement('div'); e.className = 'katex-label'; e.id = l.id; cont.appendChild(e); }
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = pct(l.x, W); e.style.top = pct(l.y, H);
  e.style.color = l.c || 'black'; e.style.fontSize = l.s || '16px';
  const a = l.a || 'lt';
  e.style.transform = `translate(${{l: 0, c: -50, r: -100}[a[0]]}%, ${{t: 0, m: -50, b: -100}[a[1]]}%)`;
  if (l.bg) { e.style.background = '#fff'; e.firstChild.style.padding = '0 2px'; }
});
</script>
</body>
</html>
