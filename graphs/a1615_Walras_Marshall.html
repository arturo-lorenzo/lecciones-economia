<script>






const W = 680, H = 420;
const labels = [
  {id: 'l0', tex: 'D(X)', x: 253.9, y: 318.5, color: '#534AB7', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l1', tex: 'S(X)', x: 299.6, y: 274.8, color: '#1D9E75', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l2', tex: '0', x: 183.0, y: 203.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'X', x: 322.0, y: 330.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'p', x: 60.0, y: 64.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l5', tex: 'p^*', x: 54.0, y: 215.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l6', tex: 'p_1', x: 54.0, y: 249.5, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},

  {id: 'l9', tex: '\\text{(a) Oferta menos inclinada que la demanda}', x: 188.0, y: 368.0, color: 'black', tr: 'translate(-50%,0)', small: true, bg: false},

  {id: 'l11', tex: '\\text{Walras inestable}', x: 194.0, y: 400.0, color: '#D85A30', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l12', tex: 'D(X)', x: 639.6, y: 274.8, color: '#534AB7', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l13', tex: 'S(X)', x: 593.9, y: 318.5, color: '#1D9E75', tr: 'translate(0,-50%)', small: true, bg: false},

  {id: 'l17', tex: 'p^*', x: 394.0, y: 215.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l18', tex: 'p_1', x: 394.0, y: 270.2, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l19', tex: 'X^*', x: 515.0, y: 336.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l20', tex: 'X_1', x: 473.6, y: 336.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},

  {id: 'l22', tex: '\\text{Marshall inestable}', x: 522.0, y: 400.0, color: '#378ADD', tr: 'translate(-100%,-50%)', small: true, bg: false},
  {id: 'l23', tex: '\\text{Walras estable}', x: 534.0, y: 400.0, color: '#D85A30', tr: 'translate(0,-50%)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
