<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="carrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="7" markerHeight="7" orient="auto">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#5a5a5a"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line id="ax-x" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line id="ax-y" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="bisector" stroke="#888" stroke-width="1.4" stroke-dasharray="6 3"/>

    <line id="edd" stroke="#378ADD" stroke-width="2.2"/>
    <line id="dash-h" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line id="dash-v" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <g id="cobweb"></g>
    <g id="ticks"></g>
    <circle id="pt-ss" r="5" fill="#000"/>
    <circle id="pt-d" r="4" fill="black"/>
    <g id="b0dots"></g>
  </svg>
</div>
<script>

const W=680,H=620,OX=160,OY=420,S=300;
const d1=-0.25, m=1.5;
const bee=d1/(1-m);
const AX=[80, 620, 580, 40];
const EDD=[-0.1, 0.96], BIS=[-0.15, 1.3];
const STARTS=[[0.35, 3], [0.65, 3]];
function sx(b){return OX+b*S;}
function sy(b){return OY-b*S;}
function f(b){return d1+m*b;}
const NS='http://www.w3.org/2000/svg';
const el=id=>document.getElementById(id);
function setL(e,x1,y1,x2,y2){if(typeof e==='string')e=el(e);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);return e;}
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||document.querySelector('svg')).appendChild(e);return e;}

setL('ax-x',AX[0],OY,AX[1],OY);
setL('ax-y',OX,AX[2],OX,AX[3]);
if(AX[0]<OX-5) el('ax-x').setAttribute('marker-start','url(#arrow)');
if(AX[2]>OY+5) el('ax-y').setAttribute('marker-start','url(#arrow)');
setL('bisector',sx(BIS[0]),sy(BIS[0]),sx(BIS[1]),sy(BIS[1]));
setL('edd',sx(EDD[0]),sy(f(EDD[0])),sx(EDD[1]),sy(f(EDD[1])));
el('pt-ss').setAttribute('cx',sx(bee));el('pt-ss').setAttribute('cy',sy(bee));
setL('dash-h',OX,sy(bee),sx(bee),sy(bee));
setL('dash-v',sx(bee),sy(bee),sx(bee),OY);
el('pt-d').setAttribute('cx',OX);el('pt-d').setAttribute('cy',sy(d1));


const cob=el('cobweb');
function seg(x1,y1,x2,y2){
  mk('line',{x1,y1,x2,y2,stroke:'#5a5a5a','stroke-width':1.1,'stroke-dasharray':'5 4'},cob);
  const L=Math.hypot(x2-x1,y2-y1); if(L<16) return;
  const xm=(x1+x2)/2+(x2-x1)/L*4, ym=(y1+y2)/2+(y2-y1)/L*4;
  mk('line',{x1:xm-(x2-x1)/L*2,y1:ym-(y2-y1)/L*2,x2:xm,y2:ym,stroke:'#5a5a5a','stroke-width':1.2,'marker-end':'url(#carrow)'},cob);
}
const tk=el('ticks');
function tickX(x){mk('line',{x1:x,y1:OY,x2:x,y2:OY+4,stroke:'black','stroke-width':1},tk);}
function tickY(y){mk('line',{x1:OX-4,y1:y,x2:OX,y2:y,stroke:'black','stroke-width':1},tk);}
STARTS.forEach(([b0,n])=>{
  let b=b0, y0=OY;
  for(let i=0;i<n;i++){const bn=f(b);seg(sx(b),(i===0?OY:sy(b)),sx(b),sy(bn));seg(sx(b),sy(bn),sx(bn),sy(bn));b=bn;}
  mk('circle',{cx:sx(b0),cy:OY,r:4,fill:'black'},el('b0dots'));
  tickX(sx(b0));
});
tickX(sx(bee));tickY(sy(bee));

function pct(v,t){return(v/t*100).toFixed(2)+'%';}

const LBL=[["lbl-title", "d1<0 \\;;\\; r>g_Y", 340, 18, "black", 17, "c", false], ["lbl-by", "b_t", 150, 44, "black", 18, "r", false], ["lbl-bx", "b_{t-1}", 626, 422, "black", 18, "l", false], ["lbl-edd", "b_t = f(b_{t-1})", 430, 62, "#378ADD", 16, "r", false], ["lbl-bis", "b_t = b_{t-1}", 558.0, 32.0, "#666", 16, "l", false], ["lbl-bee-x", "b^*", 310.0, 440, "black", 16, "c", false], ["lbl-bee-y", "b^*", 152, 270.0, "black", 16, "r", false], ["lbl-d1", "d1", 152, 486, "black", 16, "r", false], ["lbl-0", "O", 152, 403, "black", 16, "r", false], ["lbl-b0-0", "b_0^0", 265.0, 440, "black", 16, "c", false], ["lbl-b0-1", "b_0^1", 355.0, 440, "black", 16, "c", false]];
const c=document.querySelector('.graph-container');
LBL.forEach(([id,tex,x,y,color,size,anc,bg])=>{
  const e=document.createElement('div');e.className='katex-label';e.id=id;c.appendChild(e);
  katex.render(tex,e,{throwOnError:false});
  e.style.left=pct(x,W);e.style.top=pct(y,H);e.style.color=color;e.style.fontSize=size+'px';
  e.style.transform=(anc==='r'?'translate(-100%,-50%)':anc==='c'?'translate(-50%,-50%)':'translate(0,-50%)');
  if(bg){e.style.background='#fff';const k=e.querySelector('.katex');if(k)k.style.padding='0 2px';}
});
</script>
</body>
</html>
