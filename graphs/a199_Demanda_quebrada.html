<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 15px; }
  .katex-label.bg { background: #fff; padding: 0 2px; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <line x1="124" y1="460" x2="556" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124" y1="460" x2="124" y2="60" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="124.0" y1="194.0" x2="352.0" y2="194.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="352.0" y1="194.0" x2="352.0" y2="262.4" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <line x1="352.0" y1="376.4" x2="352.0" y2="460.0" stroke="#999" stroke-width="0.8" stroke-dasharray="4 3"/>
    <path d="M124.0,399.2 L523.0,299.5" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124.0,346.0 L523.0,246.2" fill="none" stroke="#D85A30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/>
    <path d="M124.0,125.6 L352.0,262.4" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
    <path d="M352.0,376.4 L401.4,455.4" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 4"/>
    <line x1="352.0" y1="262.4" x2="352.0" y2="376.4" stroke="#534AB7" stroke-width="1.4" stroke-dasharray="1.5 3"/>
    <path d="M124.0,125.6 L352.0,194.0 L542.0,346.0" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="162.0" y1="384.7" x2="162.0" y2="341.5" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="352.0" cy="194.0" r="5" fill="#000"/>
    <circle cx="352.0" cy="342.2" r="3.5" fill="#D85A30"/>
    <circle cx="352.0" cy="289.0" r="3.5" fill="#D85A30"/>
  </svg>
  <div class="katex-label" id="l0"></div>
  <div class="katex-label" id="l1"></div>
  <div class="katex-label" id="l2"></div>
  <div class="katex-label" id="l3"></div>
  <div class="katex-label" id="l4"></div>
  <div class="katex-label" id="l5"></div>
  <div class="katex-label" id="l6"></div>
  <div class="katex-label" id="l7"></div>
  <div class="katex-label" id="l8"></div>
  <div class="katex-label" id="l9"></div>
  <div class="katex-label" id="l10"></div>
  <div class="katex-label" id="l11"></div>
  <div class="katex-label" id="l12"></div>
</div>
<script>





const W = 680, H = 500;
const labels = [
  {id: 'l0', tex: 'X', x: 566.0, y: 460.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l1', tex: 'p', x: 124.0, y: 48.0, color: 'black', tr: 'translate(-50%,-100%)', small: false, bg: false},
  {id: 'l2', tex: 'O', x: 112.0, y: 472.0, color: 'black', tr: 'translate(-50%,-50%)', small: false, bg: false},
  {id: 'l3', tex: 'p_0', x: 112.0, y: 194.0, color: 'black', tr: 'translate(-100%,-50%)', small: false, bg: false},
  {id: 'l4', tex: 'X_0', x: 352.0, y: 466.0, color: 'black', tr: 'translate(-50%,0)', small: false, bg: false},
  {id: 'l5', tex: '0', x: 360.0, y: 182.0, color: 'black', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l6', tex: 'D(X)', x: 548.0, y: 346.0, color: '#534AB7', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l7', tex: '\\text{Img}(X)', x: 407.4, y: 447.4, color: '#534AB7', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l8', tex: '\\text{Cmg}_0(X)', x: 529.0, y: 299.5, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l9', tex: '\\text{Cmg}_1(X)', x: 529.0, y: 246.2, color: '#D85A30', tr: 'translate(0,-50%)', small: false, bg: false},
  {id: 'l10', tex: '\\text{sube el coste}', x: 170.0, y: 351.7, color: '#5a5a5a', tr: 'translate(0,-50%)', small: true, bg: false},
  {id: 'l11', tex: '\\text{las rivales no siguen}', x: 238.0, y: 131.0, color: '#5a5a5a', tr: 'translate(-50%,-100%)', small: true, bg: false},
  {id: 'l12', tex: '\\text{las rivales siguen}', x: 386.2, y: 207.3, color: '#5a5a5a', tr: 'translate(0,-50%)', small: true, bg: false},
];
labels.forEach(l => {
  const el = document.getElementById(l.id);
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / W * 100).toFixed(2) + '%';
  el.style.top = (l.y / H * 100).toFixed(2) + '%';
  el.style.transform = l.tr;
  el.style.color = l.color;
  if (l.small) el.style.fontSize = '13px';
  if (l.bg) el.classList.add('bg');
});
</script>
</body>
</html>
