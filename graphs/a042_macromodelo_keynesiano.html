<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    font-size: 15px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 628" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <g transform="scale(0.871795)">
    <g id="g-guides"></g>
    <g id="g-curves"></g>
    <g id="g-axes"></g>
    <g id="g-points"></g>
    </g>
  </svg>

</div>

<script>

const NS = 'http://www.w3.org/2000/svg';
const W = 780, H = 720;
const XL = 100, XR = 480;
const YT = 300, YB = 670;
const AX = 275;

const alpha = 0.5, Lbar = 220, L1 = 150, Lstar = 95;
const A = 200 / Math.pow(Lbar, alpha);
const f = L => A * Math.pow(L, alpha);
const wm = 90, k = (130 - wm) / (Lbar - L1);
const ws = L => L <= L1 ? wm : wm + k * (L - L1);


const Pmodel = L => ws(L) * Math.pow(L, 1 - alpha) / (alpha * A);
const Pscale = 80 / Pmodel(Lstar);
const Pof = L => Pscale * Pmodel(L);
const Pstar = Pof(Lstar), Ystar = f(Lstar), Ybar = f(Lbar), Y1 = f(L1);
const P1 = Pof(L1), Pbar = Pof(Lbar);

const cLd = wm / Math.pow(Lstar, alpha - 1);
const Ld = L => cLd * Math.pow(L, alpha - 1);

const bDA = 40, KDA = Pstar * (Ystar + bDA);
const DA = Y => KDA / (Y + bDA);

const g = id => document.getElementById(id);
function el(parent, tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  g(parent).appendChild(e); return e;
}
const line = (p, x1, y1, x2, y2, st) => el(p, 'line', Object.assign({x1, y1, x2, y2}, st));
const AXIS = {stroke: 'black', 'stroke-width': 1.2, 'marker-end': 'url(#arrow)'};
const GUIDE = {stroke: '#888', 'stroke-width': 0.8, 'stroke-dasharray': '5 3'};
const GGUIDE = {stroke: '#1D9E75', 'stroke-width': 0.8, 'stroke-dasharray': '5 3', opacity: 0.6};
const TICK = {stroke: 'black', 'stroke-width': 1};
function curve(p, fn, t0, t1, n, st) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const [x, y] = fn(t0 + (t1 - t0) * i / n); pts.push(x.toFixed(1) + ',' + y.toFixed(1)); }
  return el(p, 'path', Object.assign({d: 'M' + pts.join(' L'), fill: 'none', 'stroke-width': 2.52, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, st));
}
const dot = (x, y) => el('g-points', 'circle', {cx: x, cy: y, r: 5, fill: 'black'});


for (const [ox, oy] of [[XL, YT], [XR, YT], [XL, YB], [XR, YB]]) {
  line('g-axes', ox, oy, ox + AX, oy, AXIS);
  line('g-axes', ox, oy, ox, oy - AX + 20, AXIS);
}


curve('g-curves', L => [XL + L, YT - Ld(L)], 22, 262, 120, {stroke: '#378ADD'});
el('g-curves', 'path', {d: `M${XL + 2},${YT - wm} L${XL + L1},${YT - wm} L${XL + Lbar},${YT - ws(Lbar)} L${XL + Lbar},${YT - 240}`,
  fill: 'none', stroke: '#D85A30', 'stroke-width': 2.52, 'stroke-linejoin': 'round'});
line('g-guides', XL + Lstar, YT - wm, XL + Lstar, YT, GUIDE);
line('g-guides', XL + L1, YT - wm, XL + L1, YT, GUIDE);
line('g-guides', XL + Lbar, YT - ws(Lbar), XL + Lbar, YT, GUIDE);
line('g-axes', XL - 4, YT - wm, XL, YT - wm, TICK);
for (const L of [Lstar, L1, Lbar]) line('g-axes', XL + L, YT, XL + L, YT + 4, TICK);
dot(XL + Lstar, YT - wm);

const yb = YT + 46;
for (const [a, b] of [[Lstar, L1], [L1, Lbar]]) {
  line('g-axes', XL + a, yb - 7, XL + a, yb, TICK);
  line('g-axes', XL + a, yb, XL + b, yb, TICK);
  line('g-axes', XL + b, yb - 7, XL + b, yb, TICK);
}


const oa1 = L => [XR + f(L), YT - Pof(L)];
curve('g-curves', oa1, 12, Lbar, 160, {stroke: '#1D9E75'});
line('g-curves', XR + Ybar, YT - Pbar, XR + Ybar, YT - 240, {stroke: '#1D9E75', 'stroke-width': 2.52, 'stroke-linecap': 'round'});
curve('g-curves', Y => [XR + Y, YT - DA(Y)], 35, 245, 120, {stroke: '#378ADD'});
line('g-guides', XR, YT - Pstar, XR + Ystar, YT - Pstar, GUIDE);
line('g-guides', XR + Ystar, YT - Pstar, XR + Ystar, YT, GUIDE);
line('g-guides', XR + Ybar, YT - Pbar, XR + Ybar, YT, GUIDE);
line('g-axes', XR - 4, YT - Pstar, XR, YT - Pstar, TICK);
line('g-axes', XR + Ystar, YT, XR + Ystar, YT + 4, TICK);
line('g-axes', XR + Ybar, YT, XR + Ybar, YT + 4, TICK);

line('g-guides', XR + Y1, YT - P1, XR + Y1, YT, GUIDE);
line('g-axes', XR + Y1, YT, XR + Y1, YT + 4, TICK);
dot(XR + Ystar, YT - Pstar);


curve('g-curves', L => [XL + L, YB - f(L)], 0, 262, 200, {stroke: '#378ADD'});
line('g-guides', XL + Lstar, YB, XL + Lstar, YB - Ystar, GUIDE);
line('g-guides', XL, YB - Ystar, XL + Lstar, YB - Ystar, GUIDE);
line('g-guides', XL + Lbar, YB, XL + Lbar, YB - Ybar, GUIDE);
line('g-guides', XL, YB - Ybar, XL + Lbar, YB - Ybar, GUIDE);
for (const L of [Lstar, L1, Lbar]) line('g-axes', XL + L, YB, XL + L, YB + 4, TICK);
line('g-guides', XL + L1, YB, XL + L1, YB - Y1, GUIDE);
for (const Y of [Ystar, Ybar]) line('g-axes', XL - 4, YB - Y, XL, YB - Y, TICK);


line('g-curves', XR, YB, XR + 250, YB - 250, {stroke: '#888', 'stroke-width': 1});
el('g-curves', 'path', {d: `M${XR + 36},${YB} A36,36 0 0,0 ${XR + 36 * Math.SQRT1_2},${YB - 36 * Math.SQRT1_2}`, fill: 'none', stroke: '#888', 'stroke-width': 0.8});
line('g-guides', XL + Lstar, YB - Ystar, XR + Ystar, YB - Ystar, GGUIDE);
line('g-guides', XR + Ystar, YB - Ystar, XR + Ystar, YB, GGUIDE);
line('g-axes', XR + Ystar, YB, XR + Ystar, YB + 4, TICK);
line('g-axes', XR - 4, YB - Ystar, XR, YB - Ystar, TICK);


const GA = {stroke: '#1D9E75', 'stroke-width': 1.2, 'marker-end': 'url(#garrow)'};
const GL = 65;
const XM = (XL + AX + 12 + XR - 14) / 2;
line('g-points', XL + Lstar, YT + 75 + GL, XL + Lstar, YT + 75, GA);
line('g-points', XM + GL / 2, YB - Ystar, XM - GL / 2, YB - Ystar, GA);
line('g-points', XR + Ystar, YB - AX + 27 - GL, XR + Ystar, YB - AX + 27, GA);


const labels = [

  ['w', XL - 8, YT - AX + 20, 'black', 'r', 'm'],
  ['L', XL + AX + 4, YT, 'black', 'l', 'm'],
  ['L^s', XL + Lbar + 8, YT - 238, '#D85A30', 'l', 'm'],
  ['L^d', XL + 262 + 6, YT - Ld(262), '#378ADD', 'l', 'm'],
  ['w_m', XL - 8, YT - wm, 'black', 'r', 'm'],
  ['L^*', XL + Lstar, YT + 6, 'black', 'c', 't'],
  ['\\bar{L}', XL + Lbar, YT + 6, 'black', 'c', 't'],
  ['U_I', XL + (Lstar + L1) / 2, yb + 4, 'black', 'c', 't', '13px'],
  ['U_V', XL + (L1 + Lbar) / 2, yb + 4, 'black', 'c', 't', '13px'],

  ['P', XR - 8, YT - AX + 20, 'black', 'r', 'm'],
  ['Y', XR + AX + 4, YT, 'black', 'l', 'm'],
  ['\\text{OA}', XR + Ybar + 8, YT - 238, '#1D9E75', 'l', 'm'],
  ['\\text{DA}', XR + 245 + 6, YT - DA(245), '#378ADD', 'l', 'm'],
  ['P^*', XR - 8, YT - Pstar, 'black', 'r', 'm'],
  ['Y^*', XR + Ystar, YT + 6, 'black', 'c', 't'],
  ['\\bar{Y}', XR + Ybar, YT + 6, 'black', 'c', 't'],

  ['Y', XL - 8, YB - AX + 20, 'black', 'r', 'm'],
  ['L', XL + AX + 4, YB, 'black', 'l', 'm'],
  ['f(L)', XL + 262 - 14, YB - f(262) - 14, '#378ADD', 'c', 'b'],
  ['Y^*', XL - 8, YB - Ystar, 'black', 'r', 'm'],
  ['\\bar{Y}', XL - 8, YB - Ybar, 'black', 'r', 'm'],
  ['L^*', XL + Lstar, YB + 6, 'black', 'c', 't'],
  ['\\bar{L}', XL + Lbar, YB + 6, 'black', 'c', 't'],

  ['Y', XR - 8, YB - AX + 20, 'black', 'r', 'm'],
  ['Y', XR + AX + 4, YB, 'black', 'l', 'm'],
  ['Y^*', XR + Ystar, YB + 6, 'black', 'c', 't'],
  ['45^\\circ', XR + 48, YB - 20, '#888', 'l', 'm', '13px'],
];
const cont = document.querySelector('.graph-container');
labels.forEach(([tex, x, y, color, ha, va, size], i) => {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = 'lbl-' + i;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x / W * 100) + '%';
  e.style.top = (y / H * 100) + '%';
  e.style.color = color;
  if (size) e.style.fontSize = size;
  const tx = ha === 'r' ? '-100%' : ha === 'c' ? '-50%' : '0';
  const ty = va === 'm' ? '-50%' : va === 'b' ? '-100%' : '0';
  e.style.transform = `translate(${tx}, ${ty})`;
  cont.appendChild(e);
});
</script>
</body>
</html>
