<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label {
    position: absolute;
    pointer-events: none;
    font-size: 15px;
  }
  .katex-label.right-of-axis {
    transform: translateX(-100%);
  }
</style>
</head>
<body>
<div class="graph-container">


  <svg viewBox="0 0 780 660" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>





    <line x1="110" y1="280" x2="365" y2="280" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="280" x2="110" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="128.5" y1="84.4" x2="336.2" y2="249.4" stroke="#378ADD" stroke-width="2.52"/>

    <line x1="146.9" y1="243.5" x2="326.9" y2="73.5" stroke="#D85A30" stroke-width="2.52"/>


    <circle cx="230" cy="165" r="5" fill="black"/>


    <line x1="230" y1="165" x2="230" y2="280" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="230" y1="165" x2="110" y2="165" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="230" y1="280" x2="230" y2="284" stroke="black" stroke-width="1"/>
    <line x1="106" y1="165" x2="110" y2="165" stroke="black" stroke-width="1"/>






    <line x1="455" y1="280" x2="710" y2="280" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="455" y1="280" x2="455" y2="40"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="585" y1="65" x2="585" y2="270" stroke="#D85A30" stroke-width="2.52"/>

    <line x1="479" y1="94.7" x2="665" y2="244.4" stroke="#378ADD" stroke-width="2.52"/>


    <circle cx="585" cy="180" r="5" fill="black"/>





    <line x1="110" y1="610" x2="365" y2="610" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="110" y1="610" x2="110" y2="370" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <path id="prod-fn" fill="none" stroke="#378ADD" stroke-width="2.52" stroke-linecap="round"/>


    <line x1="230" y1="610" x2="230" y2="480" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="230" y1="480" x2="110" y2="480" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>


    <line x1="230" y1="610" x2="230" y2="614" stroke="black" stroke-width="1"/>
    <line x1="106" y1="480" x2="110" y2="480" stroke="black" stroke-width="1"/>





    <line x1="455" y1="610" x2="710" y2="610" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="455" y1="610" x2="455" y2="370" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line x1="455" y1="610" x2="680" y2="385" stroke="#888" stroke-width="1"/>


    <path d="M490,610 A35,35 0 0,0 479.7,585.3" fill="none" stroke="#888" stroke-width="0.8"/>


    <line x1="110" y1="480" x2="585" y2="480" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.5"/>
    <line x1="585" y1="480" x2="585" y2="610" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.5"/>






    <line x1="230" y1="317" x2="230" y2="357" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>


    <line x1="390" y1="480" x2="430" y2="480" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>


    <line x1="585" y1="357" x2="585" y2="317" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#garrow)"/>

  </svg>



  <div class="katex-label" id="lbl-wp"></div>
  <div class="katex-label" id="lbl-l1"></div>
  <div class="katex-label" id="lbl-ls"></div>
  <div class="katex-label" id="lbl-ld"></div>
  <div class="katex-label" id="lbl-lstar"></div>
  <div class="katex-label" id="lbl-wpstar"></div>


  <div class="katex-label" id="lbl-p2"></div>
  <div class="katex-label" id="lbl-y2"></div>
  <div class="katex-label" id="lbl-ys2"></div>
  <div class="katex-label" id="lbl-yd2"></div>
  <div class="katex-label" id="lbl-ystar2"></div>


  <div class="katex-label" id="lbl-y3"></div>
  <div class="katex-label" id="lbl-l3"></div>
  <div class="katex-label" id="lbl-fl"></div>
  <div class="katex-label" id="lbl-ystar3"></div>
  <div class="katex-label" id="lbl-lstar3"></div>


  <div class="katex-label" id="lbl-y4a"></div>
  <div class="katex-label" id="lbl-y4b"></div>
  <div class="katex-label" id="lbl-45"></div>

</div>

<script>

const OL_pf = 110, OB_pf = 610, L_star_pf = 120, Y_bar_pf = 130, alpha_pf = 0.4, Lend_pf = 250;
const pts = [];
for (let i = 1; i <= 250; i++) {
  const L = (i / 250) * Lend_pf;
  const Y = Y_bar_pf * Math.pow(L / L_star_pf, alpha_pf);
  pts.push((OL_pf + L).toFixed(1) + ',' + (OB_pf - Y).toFixed(1));
}
document.getElementById('prod-fn').setAttribute('d', 'M' + OL_pf + ',' + OB_pf + ' L' + pts.join(' L'));


const W = 780, H = 660;
function pct(v, t) { return (v / t * 100).toFixed(1) + '%'; }

const labels = [

  {id:'lbl-wp',    tex:'w/P',          left: pct(103,W),  top: pct(35,H),   color:'black', align:'right'},
  {id:'lbl-l1',    tex:'L',            left: pct(367,W),  top: pct(280,H),  color:'black'},
  {id:'lbl-ls',    tex:'L^s',          left: pct(332,W),  top: pct(66,H),   color:'#D85A30'},
  {id:'lbl-ld',    tex:'L^d',          left: pct(143,W),  top: pct(67,H),   color:'#378ADD'},
  {id:'lbl-lstar', tex:'L^*',          left: pct(222,W),  top: pct(286,H),  color:'black'},
  {id:'lbl-wpstar',tex:'(w/P)^*',      left: pct(103,W),  top: pct(150,H),  color:'black', align:'right', size:'13px'},


  {id:'lbl-p2',    tex:'P',            left: pct(448,W),  top: pct(35,H),   color:'black', align:'right'},
  {id:'lbl-y2',    tex:'Y',            left: pct(712,W),  top: pct(280,H),  color:'black'},
  {id:'lbl-ys2',   tex:'\\text{OA}',   left: pct(593,W),  top: pct(48,H),   color:'#D85A30'},
  {id:'lbl-yd2',   tex:'\\text{DA}',   left: pct(670,W),  top: pct(229,H),  color:'#378ADD'},
  {id:'lbl-ystar2',tex:'\\bar{Y}',     left: pct(579,W),  top: pct(286,H),  color:'black'},


  {id:'lbl-y3',    tex:'Y',            left: pct(103,W),  top: pct(365,H),  color:'black', align:'right'},
  {id:'lbl-l3',    tex:'L',            left: pct(367,W),  top: pct(610,H),  color:'black'},
  {id:'lbl-fl',    tex:'f(L)',         left: pct(330,W),  top: pct(405,H),  color:'#378ADD'},
  {id:'lbl-ystar3',tex:'\\bar{Y}',     left: pct(103,W),  top: pct(466,H),  color:'black', align:'right'},
  {id:'lbl-lstar3',tex:'L^*',          left: pct(222,W),  top: pct(616,H),  color:'black'},


  {id:'lbl-y4a',   tex:'Y',            left: pct(448,W),  top: pct(365,H),  color:'black', align:'right'},
  {id:'lbl-y4b',   tex:'Y',            left: pct(712,W),  top: pct(610,H),  color:'black'},
  {id:'lbl-45',    tex:'45°',          left: pct(483,W),  top: pct(590,H),  color:'#888', size:'13px'}
];

labels.forEach(l => {
  const e = document.getElementById(l.id);
  if (!e) return;
  katex.render(l.tex, e, {throwOnError: false});
  e.style.left = l.left;
  e.style.top = l.top;
  if (l.color) e.style.color = l.color;
  if (l.align === 'right') e.classList.add('right-of-axis');
  if (l.size) e.style.fontSize = l.size;
});
</script>
<script>(function(){var N={"lbl-45": [1.47, -1.47, 0]};for(var id in N){var e=document.getElementById(id);if(!e)continue;e.style.marginLeft=N[id][0]+"%";e.style.marginTop=N[id][1]+"%";if(N[id][2]){var k=e.querySelector(".katex")||e;k.style.background="#fff";k.style.padding="0 2px";k.style.borderRadius="2px";}}})();</script>
</body>
</html>
