<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <path d="M420.0,170.0 L540.0,50.0 L540.0,110.0 Z" fill="#1D9E75" fill-opacity="0.13" stroke="none"/>
    <path d="M120.0,320.0 L420.0,170.0 L120.0,470.0 Z" fill="#D85A30" fill-opacity="0.12" stroke="none"/>
    <line x1="120.0" y1="470.0" x2="625.0" y2="470.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120.0" y1="470.0" x2="120.0" y2="30.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="420.0" y1="170.0" x2="420.0" y2="470.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="120.0" y1="170.0" x2="420.0" y2="170.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="510.0" y1="125.0" x2="510.0" y2="470.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="420.0" y1="470.0" x2="420.0" y2="474.0" stroke="black" stroke-width="1"/>
    <line x1="510.0" y1="470.0" x2="510.0" y2="474.0" stroke="black" stroke-width="1"/>
    <line x1="116.0" y1="170.0" x2="120.0" y2="170.0" stroke="black" stroke-width="1"/>
    <line x1="116.0" y1="320.0" x2="120.0" y2="320.0" stroke="black" stroke-width="1"/>
    <line x1="120.0" y1="470.0" x2="540.0" y2="50.0" stroke="#888" stroke-width="1.4" stroke-dasharray="7 4"/>
    <line x1="120.0" y1="320.0" x2="560.0" y2="100.0" stroke="#378ADD" stroke-width="2.2"/>
    <path d="M190.0,285.0 L230.0,285.0 L230.0,265.0" fill="none" stroke="#185FA5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="510.0" y1="83.0" x2="510.0" y2="122.0" stroke="#0F6E56" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <circle cx="420.0" cy="170.0" r="5" fill="#000"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
  <div class="katex-label" id="lbl7"></div>
  <div class="katex-label" id="lbl8"></div>
  <div class="katex-label" id="lbl9"></div>
  <div class="katex-label" id="lbl10"></div>
  <div class="katex-label" id="lbl11"></div>
  <div class="katex-label" id="lbl12"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "C",
  "x": 112,
  "y": 32,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl1",
  "tex": "Y - T_0",
  "x": 625,
  "y": 478,
  "anchor": "ct",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "O",
  "x": 114,
  "y": 476,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "C_0",
  "x": 112,
  "y": 320,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "C_0/(1-c)",
  "x": 112,
  "y": 170.0,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "(Y - T_0)_0",
  "x": 420.0,
  "y": 478,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "(Y - T_0)_1",
  "x": 510,
  "y": 478,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl7",
  "tex": "45^{\\circ}",
  "x": 546,
  "y": 50,
  "anchor": "lm",
  "color": "#666",
  "size": 15
 },
 {
  "id": "lbl8",
  "tex": "C(Y - T_0)",
  "x": 566,
  "y": 100.0,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl9",
  "tex": "c",
  "x": 237,
  "y": 275.0,
  "anchor": "lm",
  "color": "#185FA5",
  "size": 15
 },
 {
  "id": "lbl10",
  "tex": "0",
  "x": 412.0,
  "y": 162.0,
  "anchor": "rb",
  "color": "#000",
  "size": 16
 },
 {
  "id": "lbl11",
  "tex": "\\text{ahorro, } S > 0",
  "x": 518,
  "y": 131.0,
  "anchor": "lt",
  "color": "#0F6E56",
  "size": 15
 },
 {
  "id": "lbl12",
  "tex": "\\begin{array}{l}\\text{desahorro,}\\\\ S < 0\\end{array}",
  "x": 126,
  "y": 334,
  "anchor": "lt",
  "color": "#B5451B",
  "size": 15
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
