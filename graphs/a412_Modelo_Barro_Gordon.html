<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">
  <svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <line x1="120" y1="460" x2="560" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="460" x2="120" y2="60"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <line id="dpiA" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dpiB" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="dpiE" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="duB"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line id="duT"  stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>
    <g id="ticks"></g>

    <path id="contB" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="6 4"/>
    <path id="contE" fill="none" stroke="#534AB7" stroke-width="2.2" stroke-dasharray="6 4"/>

    <line id="cplp" stroke="#222" stroke-width="2.2"/>

    <line id="pc0" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <line id="pcC" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 5" stroke-linecap="round"/>
    <line id="pcE" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="3 4" stroke-linecap="round"/>

    <line id="mvAB" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <line id="mvBC" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <line id="mvCE" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <circle id="ptA" r="5" fill="#000"/>
    <circle id="ptB" r="5" fill="#000"/>
    <circle id="ptC" r="5" fill="#000"/>
    <circle id="ptE" r="5" fill="#000"/>

    <circle id="ptT" r="4.5" fill="#fff" stroke="#534AB7" stroke-width="1.6"/>
  </svg>
</div>
<script>







const ubar = 6, uT = 3, pistar = 1;
const uB = 4.5, piB = 2.5, piE = 4;
const VBW = 680, VBH = 500;
const X = u => 120 + u*(440/9.6);
const Y = p => 460 - p*(400/7.4);
const $ = id => document.getElementById(id);
function seg(id, x1, y1, x2, y2) { const e = $(id); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); }
function pt(id, x, y) { $(id).setAttribute('cx', x); $(id).setAttribute('cy', y); }

seg('cplp', X(ubar), Y(0), X(ubar), Y(7.1));

const pcs = {pc0: [7, 2.2, 6.6], pcC: [8.5, 3.0, 7.3], pcE: [10, 3.6, 9.1]};
for (const id in pcs) { const [c, ua, ub] = pcs[id]; seg(id, X(ua), Y(c - ua), X(ub), Y(c - ub)); }

function contour(id, r, degA, degB) {
  const p = [];
  for (let k = 0; k <= 120; k++) {
    const t = (degA + (k/120)*(degB - degA))*Math.PI/180;
    p.push(X(uT + r*Math.cos(t)).toFixed(1) + ',' + Y(pistar + r*Math.sin(t)).toFixed(1));
  }
  $(id).setAttribute('d', 'M' + p.join(' L'));
}
contour('contB', Math.sqrt(4.5), -24, 150);
contour('contE', Math.sqrt(18), -6, 84);

seg('mvAB', X(5.65) + 6.9, Y(1.35) - 5.8, X(4.8) + 6.9, Y(2.2) - 5.8);
seg('mvBC', X(uB) + 10, Y(piB) - 10, X(ubar) - 9, Y(piB) - 10);
seg('mvCE', X(ubar) + 10, Y(piB + 0.25), X(ubar) + 10, Y(piE - 0.25));

seg('dpiA', X(0), Y(pistar), X(ubar), Y(pistar));
seg('dpiB', X(0), Y(piB), X(uB), Y(piB));
seg('dpiE', X(0), Y(piE), X(ubar), Y(piE));
seg('duB',  X(uB), Y(piB), X(uB), Y(0));
seg('duT',  X(uT), Y(pistar), X(uT), Y(0));
pt('ptA', X(ubar), Y(pistar)); pt('ptB', X(uB), Y(piB)); pt('ptC', X(ubar), Y(piB)); pt('ptE', X(ubar), Y(piE)); pt('ptT', X(uT), Y(pistar));

const tg = $('ticks');
function tick(x1, y1, x2, y2) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'line'); t.setAttribute('x1', x1); t.setAttribute('y1', y1); t.setAttribute('x2', x2); t.setAttribute('y2', y2); t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1'); tg.appendChild(t); }
tick(116, Y(pistar), 120, Y(pistar)); tick(116, Y(piB), 120, Y(piB)); tick(116, Y(piE), 120, Y(piE));
tick(X(ubar), 460, X(ubar), 464); tick(X(uB), 460, X(uB), 464); tick(X(uT), 460, X(uT), 464);

function put(id, tex, x, y, o = {}) {
  const cont = document.querySelector('.graph-container');
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const O = '#D85A30', Bl = '#378ADD', P = '#534AB7';
put('lbl-u', 'u', 568, 460, {va: 'm', s: 18});
put('lbl-pi', '\\pi', 112, 58, {ha: 'r', s: 18});
put('lbl-o', 'O', 112, 466, {ha: 'r'});
put('lbl-cplp', '\\text{CP}_{\\text{LP}}', X(ubar), Y(7.1) - 5, {ha: 'c', va: 'b', c: '#222'});
put('lbl-pc0', '\\text{CP}_{\\text{CP},0}', X(2.2) - 6, Y(7 - 2.2), {ha: 'r', va: 'm', c: Bl, s: 15});
put('lbl-pcC', "\\text{CP}_{\\text{CP},0''}", X(3.0) - 6, Y(8.5 - 3.0), {ha: 'r', va: 'm', c: Bl, s: 15});
put('lbl-pcE', '\\text{CP}_{\\text{CP},1}', X(3.6) - 6, Y(10 - 3.6), {ha: 'r', va: 'm', c: Bl, s: 15});
put('lbl-cisB', "\\text{CIS}_{0'}", X(uT + Math.sqrt(4.5)*Math.cos(150*Math.PI/180)) - 6, Y(pistar + Math.sqrt(4.5)*Math.sin(150*Math.PI/180)), {ha: 'r', va: 'm', c: P, s: 15});
put('lbl-cisE', '\\text{CIS}_1', X(uT + Math.sqrt(18)*Math.cos(-6*Math.PI/180)) + 7, Y(pistar + Math.sqrt(18)*Math.sin(-6*Math.PI/180)) - 2, {ha: 'l', va: 'm', c: P, s: 15});
put('lbl-A', '0', X(ubar) + 8, Y(pistar) - 6, {va: 'b', c: '#000'});
put('lbl-B', "0'", X(uB) - 6, Y(piB) + 6, {ha: 'r', va: 't', c: '#000'});
put('lbl-C', "0''", X(ubar) + 20, Y(piB) - 6, {va: 't', c: '#000'});
put('lbl-E', '1', X(ubar) + 8, Y(piE) - 6, {va: 'b', c: '#000'});
put('lbl-piA', '\\pi^T', 112, Y(pistar), {ha: 'r', va: 'm', s: 15});
put('lbl-piB', "\\pi_{0'}", 112, Y(piB), {ha: 'r', va: 'm', s: 15});
put('lbl-piE', '\\pi_1', 112, Y(piE), {ha: 'r', va: 'm', s: 15});
put('lbl-ubar', '\\bar{u}', X(ubar), 468, {ha: 'c', s: 15});
put('lbl-uB', "u_{0'}", X(uB), 468, {ha: 'c', s: 15});
put('lbl-uT', 'u^T', X(uT), 468, {ha: 'c', s: 15});
</script>
</body>
</html>
