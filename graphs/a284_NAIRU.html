<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container {
    position: relative;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }
  .graph-container svg {
    width: 100%;
    height: auto;
  }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; font-size: 16px; line-height: 1; }
  .katex-label .katex { font-size: 1em; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>


    <line x1="130" y1="460" x2="570" y2="460" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="130" y1="460" x2="130" y2="55"  stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>


    <line id="pa-line" stroke="black" stroke-width="1"/>


    <path id="srn" fill="none" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>


    <line id="srp" stroke="#534AB7" stroke-width="2.2"/>


    <line id="d-lstar" stroke="#888" stroke-width="0.8" stroke-dasharray="6 4"/>


    <g id="u-arrow"></g>


    <g id="ticks"></g>


    <circle id="pt0" r="5" fill="#000"/>
  </svg>

</div>

<script>










const PA = 10;
const beta = 3, z = 5 * Math.exp(0.9);
const srn = L => z * Math.exp(-beta * (1 - L / PA));
const wSRP = 5;
const Lstar = 7;
const wTopSRN = 9.6, LtopSRN = PA*(1 + Math.log(wTopSRN/z)/beta);


const Lmax = 12, wmax = 10, VBH = 560, VBW = 680;
const sx = L => 130 + L * (427.06 / Lmax);
const sy = w => 460 - w * (390 / wmax);
const pctX = x => (x / VBW * 100).toFixed(1) + '%';
const pctY = y => (y / VBH * 100).toFixed(1) + '%';

function setLine(id, x1, y1, x2, y2) {
  const el = document.getElementById(id);
  el.setAttribute('x1', x1); el.setAttribute('y1', y1);
  el.setAttribute('x2', x2); el.setAttribute('y2', y2);
}


(function() {
  const pts = [];
  const n = 200;
  for (let i = 0; i <= n; i++) {
    const L = 1.2 + (i/n)*(9.9 - 1.2);
    const w = srn(L);
    if (w > wTopSRN) break;
    pts.push(sx(L).toFixed(1) + ',' + sy(w).toFixed(1));
  }
  document.getElementById('srn').setAttribute('d', 'M' + pts.join(' L'));
})();

setLine('srp', sx(0), sy(wSRP), sx(11.2), sy(wSRP));
setLine('pa-line', sx(PA), sy(0), sx(PA), sy(10.2));
setLine('d-lstar', sx(Lstar), sy(wSRP), sx(Lstar), sy(0));


const uG = document.getElementById('u-arrow');
const uLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
const uY = 508;
uLine.setAttribute('x1', sx(Lstar) + 6); uLine.setAttribute('y1', uY);
uLine.setAttribute('x2', sx(PA) - 6);    uLine.setAttribute('y2', uY);
uLine.setAttribute('stroke', '#555'); uLine.setAttribute('stroke-width', '1.2');
uLine.setAttribute('marker-start', 'url(#arrow)');
uLine.setAttribute('marker-end', 'url(#arrow)');
uG.appendChild(uLine);


const ticksG = document.getElementById('ticks');
function addTick(x1, y1, x2, y2) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  t.setAttribute('x1', x1); t.setAttribute('y1', y1);
  t.setAttribute('x2', x2); t.setAttribute('y2', y2);
  t.setAttribute('stroke', 'black'); t.setAttribute('stroke-width', '1');
  ticksG.appendChild(t);
}
addTick(126, sy(wSRP), 130, sy(wSRP));
addTick(sx(Lstar), 460, sx(Lstar), 464);
addTick(sx(PA), 460, sx(PA), 464);


document.getElementById('pt0').setAttribute('cx', sx(Lstar));
document.getElementById('pt0').setAttribute('cy', sy(wSRP));


const cont = document.querySelector('.graph-container');
function put(id, tex, x, y, o = {}) {
  const e = document.createElement('div');
  e.className = 'katex-label'; e.id = id;
  katex.render(tex, e, {throwOnError: false});
  e.style.left = (x/VBW*100).toFixed(2) + '%';
  e.style.top = (y/VBH*100).toFixed(2) + '%';
  e.style.color = o.c || 'black';
  if (o.s) e.style.fontSize = o.s + 'px';
  const tx = {l: '0', c: '-50%', r: '-100%'}[o.ha || 'l'], ty = {t: '0', m: '-50%', b: '-100%'}[o.va || 't'];
  e.style.transform = `translate(${tx},${ty})`;
  if (o.bg) { e.style.background = '#fff'; const k = e.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
  cont.appendChild(e);
}
const G = '#1D9E75', P = '#534AB7', B = '#378ADD', O = '#D85A30', T = '#555';
put('lbl-w', 'w/P', 122, 36, {ha: 'r', s: 17});
put('lbl-l', 'L', 584, 468, {s: 17});
put('lbl-o', 'O', 122, 468, {ha: 'r'});
put('lbl-srp-y', '\\dfrac{A_L}{1+\\mu}', 122, sy(wSRP), {ha: 'r', va: 'm'});
put('lbl-lstar', 'L^{*}', sx(Lstar), 468, {ha: 'c'});
put('lbl-pa', '\\text{PA}', sx(PA), 468, {ha: 'c'});
put('lbl-srn', '\\text{SRN}', sx(LtopSRN) - 6, sy(wTopSRN), {ha: 'r', va: 'm', c: G});
put('lbl-srp', '\\text{SRP}', sx(11.2) + 6, sy(wSRP), {va: 'm', c: P});
put('lbl-p0', '0', sx(Lstar) - 8, sy(wSRP) - 5, {ha: 'r', va: 'b', c: '#000'});
put('lbl-u', '\\bar{u}\\;(\\text{NAIRU})', (sx(Lstar) + sx(PA))/2, uY + 9, {ha: 'c', c: T, s: 15});
</script>
</body>
</html>
