<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  .graph-container { position: relative; width: 100%; max-width: 680px; margin: 0 auto; }
  .graph-container svg { width: 100%; height: auto; display: block; }
  .katex-label { position: absolute; pointer-events: none; white-space: nowrap; line-height: 1; }
</style>
</head>
<body>
<div class="graph-container">

  <svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
    <line x1="100.0" y1="440.0" x2="600.0" y2="440.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="100.0" y1="440.0" x2="100.0" y2="60.0" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="350.0" y1="440.0" x2="350.0" y2="240.0" stroke="#888" stroke-width="0.8" stroke-dasharray="5 3"/>
    <line x1="350.0" y1="440.0" x2="350.0" y2="444.0" stroke="black" stroke-width="1"/>
    <line x1="96.0" y1="240.0" x2="100.0" y2="240.0" stroke="black" stroke-width="1"/>
    <line x1="100.0" y1="240.0" x2="350.0" y2="240.0" stroke="#378ADD" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="350.0" y1="240.0" x2="510.0" y2="240.0" stroke="#378ADD" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>
    <line x1="110.0" y1="360.0" x2="350.0" y2="240.0" stroke="#1D9E75" stroke-width="2.2" stroke-dasharray="8 4" stroke-linecap="round"/>
    <line x1="350.0" y1="240.0" x2="510.0" y2="160.0" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="350.0" cy="240.0" r="5" fill="#D85A30"/>
  </svg>
  <div class="katex-label" id="lbl0"></div>
  <div class="katex-label" id="lbl1"></div>
  <div class="katex-label" id="lbl2"></div>
  <div class="katex-label" id="lbl3"></div>
  <div class="katex-label" id="lbl4"></div>
  <div class="katex-label" id="lbl5"></div>
  <div class="katex-label" id="lbl6"></div>
<script>
const VBW = 680, VBH = 520;

const labels = [
 {
  "id": "lbl0",
  "tex": "E",
  "x": 92,
  "y": 58,
  "anchor": "rt",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl1",
  "tex": "t",
  "x": 606,
  "y": 440,
  "anchor": "lm",
  "color": "black",
  "size": 17
 },
 {
  "id": "lbl2",
  "tex": "O",
  "x": 92,
  "y": 446,
  "anchor": "rt",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl3",
  "tex": "\\bar{E}",
  "x": 92,
  "y": 240,
  "anchor": "rm",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl4",
  "tex": "T",
  "x": 350,
  "y": 447,
  "anchor": "ct",
  "color": "black",
  "size": 16
 },
 {
  "id": "lbl5",
  "tex": "\\bar{E}\\;(\\text{oficial})",
  "x": 516.0,
  "y": 240,
  "anchor": "lm",
  "color": "#378ADD",
  "size": 16
 },
 {
  "id": "lbl6",
  "tex": "\\tilde{E}\\;(\\text{sombra})",
  "x": 516.0,
  "y": 160.0,
  "anchor": "lm",
  "color": "#1D9E75",
  "size": 16
 }
];
const TX = {l:'0', c:'-50%', r:'-100%'}, TY = {t:'0', m:'-50%', b:'-100%'};
labels.forEach(l => {
  const el = document.getElementById(l.id);
  if (!el) return;
  katex.render(l.tex, el, {throwOnError: false});
  el.style.left = (l.x / VBW * 100).toFixed(2) + '%';
  el.style.top  = (l.y / VBH * 100).toFixed(2) + '%';
  el.style.color = l.color || 'black';
  el.style.fontSize = (l.size || 16) + 'px';
  const a = l.anchor || 'lt';
  el.style.transform = 'translate(' + TX[a[0]] + ',' + TY[a[1]] + ')';
  if (l.bg) { el.style.background = '#fff'; const k = el.querySelector('.katex'); if (k) k.style.padding = '0 2px'; }
});
</script>
</div>
</body>
</html>
